/* ---------- Preflight (Tailwind v4 subset) ---------- */

/* ---------- Console shell (School console: blue 72px rail + 48px top bar, same as School_admin_side_and_top_bar.html) ---------- */
.msym{font-family:'Material Symbols Outlined';font-weight:400;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;-webkit-font-feature-settings:'liga';font-feature-settings:'liga';-webkit-font-smoothing:antialiased;user-select:none}

.o-excluded ul{margin-top:8px;display:flex;max-height:96px;flex-direction:column;gap:4px;overflow-y:auto;color:var(--color-ink-3)}
.o-excluded li{display:flex;justify-content:space-between;gap:12px}.o-excluded li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.o-excluded li span:last-child{flex-shrink:0;font-size:12px}
.o-template{display:flex;flex-shrink:0;flex-direction:column;gap:8px}
.o-preview{position:relative;flex-shrink:0}.o-preview.is-fill{min-height:0;flex:1}
.o-preview pre{overflow:auto;white-space:pre-wrap;border-radius:8px;border:1px solid var(--color-line-soft);background:var(--color-background-grey);padding:16px 48px 16px 16px;font-family:inherit;font-size:14px;line-height:24px;color:var(--color-ink)}
.o-preview pre.h-300{height:300px}.o-preview pre.h-full{height:100%}
@media (max-width:639px){.o-preview pre.h-full{height:180px}}
.o-copy{position:absolute;right:8px;top:8px;display:flex;height:32px;width:32px;align-items:center;justify-content:center;border-radius:6px;border:1px solid var(--color-line);background:var(--color-paper);color:var(--color-ink-3)}
.o-copy:hover{color:var(--color-ink)}.o-copy svg{width:15px;height:15px}.o-copy .copied{color:var(--color-ok)}
.o-review{display:flex;height:36px;flex-shrink:0;align-items:center;gap:7px;font-size:13px;line-height:20px;color:var(--color-ink-3)}
.o-review svg{width:14px;height:14px;color:var(--color-blue)}.o-review b{font-weight:550;color:var(--color-ink)}

/* ---------- Toast ---------- */
@media (min-width:768px){.toasts{bottom:16px;padding-left:calc(72px + 1rem)}}
.error-page{display:flex;height:100%;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--color-ink-3)}
/* ---------- Buttons (ui/Button.tsx, size sm = 36px) ---------- */
.btn{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r);font-weight:500;transition:color .15s,background-color .15s,border-color .15s;height:36px;padding:0 12px;font-size:14px;line-height:20px;border:1px solid transparent;white-space:nowrap}
.btn:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.btn:disabled{opacity:.5;pointer-events:none;cursor:not-allowed}
.btn-in{display:flex;align-items:center;gap:8px}
.btn-in svg{width:16px;height:16px}
.btn-primary{background:var(--color-blue);color:var(--color-paper)}.btn-primary:hover{background:color-mix(in srgb,var(--color-blue) 90%,transparent)}
.btn-outline{background:var(--color-paper);color:var(--tw-gray-700);border-color:var(--tw-gray-300)}.btn-outline:hover{background:var(--tw-gray-50)}
.btn-secondary{background:var(--color-paper);color:var(--color-blue);border-color:var(--color-blue)}.btn-secondary:hover{background:color-mix(in srgb,var(--color-blue) 10%,transparent)}
.btn-danger-outline{background:var(--color-paper);color:var(--color-red);border-color:var(--color-red)}.btn-danger-outline:hover{background:color-mix(in srgb,var(--color-red) 10%,transparent)}
.btn-ghost{background:transparent;color:var(--tw-gray-700)}.btn-ghost:hover{background:var(--tw-gray-100)}
.btn-icon{padding:0;color:var(--color-ink-3)}.btn-icon:hover{background:var(--color-background-grey);color:var(--color-ink)}
.spin{width:16px;height:16px;border-radius:9999px;border-bottom:2px solid currentColor;animation:spin 1s linear infinite}
.tb-btn.is-relative{position:relative}
.foot-btn{width:100%;padding:0 6px}
.foot-btn.save-eligible{box-shadow:var(--focus-ring)}

/* ---------- Status pills (shared with the applicant detail) ---------- */
.pill-wrap{display:flex;min-width:0;max-width:100%;flex-direction:column;align-items:flex-start;gap:4px}
button.pill{cursor:pointer;transition:box-shadow .15s}
button.pill:hover{box-shadow:inset 0 0 0 1px currentColor}
button.pill:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.pill .msym{font-size:16px}
.pill-btn{padding:3px 4px 3px 11px}
.pill-btn .chev{font-size:18px}

/* ---------- Assigned-to pill (no avatar) ---------- */
.asg-pill{display:inline-flex;height:24px;max-width:100%;align-items:center;gap:6px;border-radius:var(--r-pill);border:1px solid var(--color-less-grey);background:var(--color-mist);padding:0 8px 0 10px;font-size:12px;line-height:16px;font-weight:500;color:var(--color-ink-2);cursor:pointer;transition:filter .15s;text-align:left}
.asg-pill:hover{filter:brightness(.95)}
.asg-pill:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.asg-pill span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.asg-pill svg{width:12px;height:12px;opacity:.7}
.asg-pill.is-unassigned{border-color:var(--color-warn-line);background:var(--color-warn-bg);color:var(--color-warn);padding-left:8px}
.asg-pill.is-unassigned svg:first-child{opacity:1}
.card-asg{display:flex;min-height:40px;align-items:center;gap:8px;border-radius:7px;border:1px solid var(--color-line-soft);background:var(--color-mist);padding:7px 8px;font-size:13px;line-height:20px;color:var(--color-ink-3)}
.kcard-asg{display:flex}

/* ---------- Kanban colour edges from the status tokens ---------- */
.edge-applied{border-top-color:var(--st-applied-line)}
.edge-under_review{border-top-color:var(--st-review-line)}
.edge-shortlisted{border-top-color:var(--st-short-line)}
.edge-interview_scheduled{border-top-color:var(--st-int-line)}
.edge-interview_completed{border-top-color:var(--st-done-line)}
.edge-hired{border-top-color:var(--st-hired-line)}
.edge-rejected{border-top-color:var(--st-rejected-line)}
.edge-withdrawn{border-top-color:var(--st-withdrawn-line)}
.acc-applied{background:var(--st-applied-bg);color:var(--st-applied-fg)}
.acc-under_review{background:var(--st-review-bg);color:var(--st-review-fg)}
.acc-shortlisted{background:var(--st-short-bg);color:var(--st-short-fg)}
.acc-interview_scheduled{background:var(--st-int-bg);color:var(--st-int-fg)}
.acc-interview_completed{background:var(--st-done-bg);color:var(--st-done-fg)}
.acc-hired{background:var(--st-hired-bg);color:var(--st-hired-fg)}
.acc-rejected{background:var(--st-rejected-bg);color:var(--st-rejected-fg)}
.acc-withdrawn{background:var(--st-withdrawn-bg);color:var(--st-withdrawn-fg)}
.tone-navy{color:var(--color-blue);border-color:var(--color-nudge-line);background:var(--color-nudge-bg)}
.tone-green{color:var(--color-ok);border-color:var(--color-ok-line);background:var(--color-ok-bg)}

/* ---------- Form controls (ui/select.tsx custom, ui/input.tsx search) ---------- */
.control{display:flex;height:40px;width:100%;cursor:pointer;align-items:center;justify-content:space-between;gap:8px;border-radius:var(--r-xs);border:1px solid var(--color-less-grey);background:var(--color-paper);padding:0 12px;text-align:left;font-size:13px;font-weight:500;line-height:20px;color:var(--color-title-grey)}
.control .control-value{display:flex;align-items:center;gap:8px;min-width:0;color:var(--color-title-grey)}
.control.is-any .control-value{color:var(--color-mid-grey)}
.control>svg{width:16px;height:16px;color:var(--color-mid-grey)}
.searchbox{display:flex;height:46px;min-height:46px;flex-shrink:0;align-items:center;gap:8px;border-radius:var(--r-sm);border:1.5px solid var(--color-less-grey);background:var(--color-paper);padding:0 12px}
.searchbox>svg{color:var(--color-light-grey);width:20px;height:20px}
.searchbox input{height:100%;width:100%;min-width:0;border:0;background:transparent;padding:0;font-size:13px;line-height:20px;font-weight:500;color:var(--color-title-grey);outline:none}
.pinbox{border-color:var(--color-less-grey)}
.m-control{height:40px;width:100%;justify-content:space-between;gap:8px;border-radius:var(--r-xs);border:1px solid var(--color-less-grey);padding:0 12px;text-align:left;font-size:13px;line-height:20px;font-weight:500;color:var(--color-title-grey);display:flex;align-items:center;cursor:pointer;background:var(--color-paper)}
.m-control:focus{border-color:var(--color-blue);outline:none}
.m-control .control-value{display:flex;align-items:center;gap:8px;min-width:0;color:var(--color-title-grey)}
.m-control .control-value.is-ph,.m-control .control-value.is-ph span{color:var(--color-mid-grey)}
.m-control>svg{width:16px;height:16px;color:var(--color-mid-grey)}
.m-label{font-size:14px;font-weight:500;line-height:14px;color:var(--color-mid-grey)}
.m-input{display:flex;height:40px;width:100%;min-width:0;border-radius:var(--r);border:1px solid var(--color-less-grey);background:var(--color-paper);padding:0 12px;font-size:14px;line-height:20px;outline:none}
.m-input:focus{border-color:var(--color-blue)}
.m-input[aria-invalid="true"]{border-color:var(--color-red)}
.m-textarea{display:flex;width:100%;min-width:0;height:104px;resize:vertical;border-radius:var(--r);border:1px solid var(--color-less-grey);background:var(--color-paper);padding:8px 12px;font-size:14px;line-height:20px;outline:none}
.m-textarea:focus{border-color:var(--color-blue)}

/* ---------- Select-style menu (ui/select.tsx content + item) ---------- */
.menu{position:fixed;z-index:60;border-radius:var(--r);border:1px solid var(--color-less-grey);background:var(--color-paper);box-shadow:var(--sh-md);overflow-x:hidden;overflow-y:auto;outline:none}
.menu.select-menu{padding:4px;max-height:336px}
.menu-item{position:relative;display:flex;width:100%;min-height:32px;cursor:pointer;align-items:center;gap:8px;border-radius:var(--r-sm);padding:6px 32px 6px 8px;margin-bottom:4px;text-align:left;font-size:14px;line-height:20px;font-weight:500;color:var(--color-title-grey);user-select:none}
.menu-item:hover,.menu-item.is-highlighted{background:color-mix(in srgb,var(--color-blue) 10%,transparent);color:var(--color-title-grey)}
.menu-item[aria-selected="true"]{background:var(--color-blue);color:var(--color-paper)}
.menu-item .check{position:absolute;right:8px;display:flex;width:16px;height:16px;align-items:center;justify-content:center;color:var(--color-paper)}
.menu-item .check svg{width:16px;height:16px}
.menu-item .cb{pointer-events:none}
.menu.multi-menu{padding:4px;max-height:336px}
.menu.multi-menu .menu-item{padding-right:8px}
.menu.suggest-menu{padding:4px;max-height:310px}
.suggest-item:hover,.suggest-item:focus-visible{background:color-mix(in srgb,var(--color-blue) 10%,transparent)}
.menu.pop-menu{z-index:61;padding:4px}
.menu.actions-menu{z-index:61;width:210px;padding:4px}
.pop-item,.act-item{display:flex;height:36px;width:100%;align-items:center;justify-content:flex-start;gap:10px;border-radius:var(--r-sm);padding:0 10px;font-size:14px;line-height:20px;font-weight:500;color:var(--color-title-grey)}
.pop-item:hover,.act-item:hover{background:color-mix(in srgb,var(--color-blue) 10%,transparent)}
.act-item svg{width:16px;height:16px;color:var(--color-blue)}
.city-search-box{border-color:var(--color-less-grey)}
.opt-name{display:block;font-size:14px;line-height:20px;font-weight:500;color:var(--color-title-grey)}
.opt-role{display:block;font-size:12px;line-height:16px;font-weight:400;color:var(--color-ink-3)}
.opt-text{display:flex;min-width:0;flex-direction:column;align-items:flex-start}
.menu-item[aria-selected="true"] .opt-name{color:var(--color-paper)}
.menu-item[aria-selected="true"] .opt-role{color:var(--color-on-blue-80)}
.menu-item.is-two{min-height:48px}
.asg-menu{position:fixed;z-index:75;width:256px;max-width:calc(100vw - 24px);border-radius:var(--r);border:1px solid var(--color-less-grey);background:var(--color-paper);padding:4px;box-shadow:var(--sh-md)}
.asg-menu-head{padding:6px 8px 4px;font-size:12px;line-height:16px;font-weight:500;color:var(--color-ink-muted)}

/* ---------- Dialog primitive (ui/dialog.tsx, scrim black/40, p-6, radius 10) ---------- */
.dlg-overlay{position:fixed;inset:0;z-index:50;background:var(--scrim-40)}
.dlg{position:fixed;left:50%;top:50%;z-index:51;display:flex;flex-direction:column;gap:16px;width:calc(100vw - 32px);max-height:calc(100dvh - 32px);transform:translate(-50%,-50%);border-radius:var(--r-lg);background:var(--color-paper);padding:24px;font-size:14px;line-height:20px;color:var(--color-title-grey);box-shadow:var(--sh-lg);animation:dlg-in .2s ease-out}
@keyframes dlg-in{from{opacity:0;transform:translate(-50%,-50%) scale(.95)}to{opacity:1;transform:translate(-50%,-50%)}}
.dlg-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.dlg-head>div{min-width:0;display:flex;flex-direction:column;gap:6px}
.dlg-title{font-size:18px;font-weight:600;line-height:18px;letter-spacing:-.01em;color:var(--color-title-grey)}
.dlg-sub{font-size:14px;line-height:20px;color:var(--color-ink-muted)}
.dlg-close{height:32px;width:32px;flex-shrink:0;border-radius:var(--r-pill);border:1px solid var(--color-less-grey);padding:0;color:var(--color-title-grey);display:inline-flex;align-items:center;justify-content:center}
.dlg-close:hover{background:var(--color-background-grey)}.dlg-close svg{width:16px;height:16px}
.dlg-body{min-height:0;flex:1;overflow-y:auto}
.dlg-foot{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.dlg-error{margin-right:auto;font-size:12px;line-height:16px;color:var(--color-red)}
.pick-list{display:flex;max-height:320px;flex-direction:column;gap:4px;overflow-y:auto}
.pick-item{position:relative;display:flex;width:100%;min-height:48px;cursor:pointer;align-items:center;border-radius:var(--r);padding:6px 36px 6px 8px;text-align:left}
.pick-item:hover{background:color-mix(in srgb,var(--color-blue) 10%,transparent)}
.pick-item[aria-selected="true"]{background:var(--color-blue)}
.pick-item[aria-selected="true"] .opt-name{color:var(--color-paper)}
.pick-item[aria-selected="true"] .opt-role{color:var(--color-on-blue-80)}
.pick-item .check{position:absolute;right:10px;color:var(--color-paper)}
.pick-item .check svg{width:16px;height:16px}
.add-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.add-hint{font-size:12px;line-height:16px;color:var(--color-ink-3)}
.form-error{font-size:12px;line-height:16px;color:var(--color-red)}

/* ---------- Confirm dialog (common/CustomDialog.tsx) ---------- */
.cd-overlay{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--scrim-50);backdrop-filter:blur(3px)}
.cd-card{display:flex;width:100%;max-width:362px;flex-direction:column;gap:16px;border-radius:var(--r-lg);background:var(--color-paper);padding:16px;animation:cd-in .2s ease-out}
@keyframes cd-in{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
.cd-head{display:flex;flex-direction:column;align-items:center}
.cd-icon{display:grid;height:30px;width:30px;margin-bottom:6px;place-items:center;color:var(--color-green)}
.cd-icon svg{width:20px;height:20px}
.cd-title{margin-bottom:16px;text-align:center;font-size:20px;line-height:1.5;font-weight:600;color:var(--color-green)}
.cd-body{text-align:center;font-size:13px;line-height:1.25;font-weight:500;color:var(--color-dark-grey)}
.cd-foot{display:flex;justify-content:center;gap:8px}
.cd-btn{height:30px;width:max-content;border-radius:var(--r);padding:0 16px;font-size:13px;line-height:20px;font-weight:500;transition:background-color .15s}
.cd-cancel{background:var(--tw-gray-200);color:var(--tw-gray-700)}.cd-cancel:hover{background:var(--tw-gray-300)}
.cd-ok{background:var(--color-green);color:var(--color-paper)}.cd-ok:hover{opacity:.9}
.cd-btn:focus-visible{outline:none;box-shadow:var(--focus-ring)}

/* ---------- Pagination (common/Pagination.tsx, compact) ---------- */
.panel-foot{display:flex;min-height:48px;align-items:center;justify-content:flex-end;gap:12px;padding:8px 16px;font-size:13px;line-height:20px;color:var(--color-ink-3)}
.panel-foot.kanban-foot{flex-direction:column;align-items:flex-start;justify-content:center;gap:8px}.panel-foot .hint{font-size:11px;line-height:16px}
@media (min-width:768px){.panel-foot.kanban-foot{flex-direction:row;align-items:center;justify-content:space-between}}
.pager{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-left:auto}
.pager-info{display:flex;height:32px;align-items:center;border-radius:var(--r-sm);border:1px solid var(--color-less-grey);background:var(--color-paper);padding:0 10px;font-size:12px;line-height:16px;color:var(--color-title-grey);white-space:nowrap}
@media (min-width:640px){.pager-info{font-size:13px}}
.pager-pages{display:flex;align-items:center;gap:6px}
.pager-arrow{display:flex;height:32px;width:32px;align-items:center;justify-content:center;border-radius:var(--r-sm);border:1px solid var(--color-light-grey);background:var(--color-paper);color:var(--color-mid-grey)}
.pager-arrow svg{width:12px;height:12px}
.pager-arrow:disabled{opacity:.5;cursor:not-allowed}
.pager-num{display:flex;height:32px;width:32px;align-items:center;justify-content:center;border-radius:var(--r);border:1px solid var(--color-light-grey);background:var(--color-paper);font-size:13px;line-height:20px;font-weight:500;color:var(--color-mid-grey)}
.pager-num[aria-current="page"]{border-color:var(--color-blue);background:var(--color-blue);color:var(--color-paper)}

/* ---------- Toast (common/Toast.tsx) ---------- */
.toasts{position:fixed;left:50%;bottom:80px;z-index:9999;display:flex;transform:translateX(-50%);flex-direction:column;align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
@media (min-width:768px){.toasts{bottom:16px}}
.toast{margin-top:8px;display:flex;min-width:min(320px,calc(100vw - 32px));max-width:500px;align-items:center;gap:12px;border-radius:var(--r-lg);border:2px solid var(--tw-blue-300);background:var(--color-paper);padding:12px 16px;box-shadow:var(--sh-lg);pointer-events:none;transition:opacity .3s ease-out,transform .3s ease-out;animation:toast-in .3s ease-out}
@keyframes toast-in{from{opacity:0;transform:translateY(20px) scale(.95)}to{opacity:1;transform:none}}
.toast .t-icon{display:grid;height:24px;width:24px;flex-shrink:0;place-items:center;border-radius:var(--r-pill);background:var(--tw-green-500);color:var(--color-paper)}
.toast .t-icon svg{width:14px;height:14px}
.toast.is-error .t-icon{background:var(--color-red)}
.toast p{font-size:14px;line-height:1.625;font-weight:500;color:var(--tw-gray-800)}
.toast.is-leaving{opacity:0;transform:translateY(20px) scale(.95)}

/* ---------- Send message dialog, aligned to the same primitives ---------- */
.mp-layer{background:var(--scrim-40);color:var(--color-title-grey)}
.mp-card{border-radius:var(--r-lg);box-shadow:var(--sh-lg)}
.mp-head h2{font-size:18px;font-weight:600;color:var(--color-title-grey)}
.mp-head p{color:var(--color-ink-muted)}
.mp-x{border:1px solid var(--color-less-grey);border-radius:var(--r-pill);width:32px;min-height:32px;color:var(--color-title-grey)}
.mp-x:hover{background:var(--color-background-grey)}
.mp-btn{min-height:36px;padding:0 12px;border-radius:var(--r);font-weight:500}
.mp-pri:hover:not(:disabled){background:color-mix(in srgb,var(--color-blue) 90%,transparent)}
.mp-sec{border-color:var(--tw-gray-300);color:var(--tw-gray-700)}
.mp-sec:hover:not(:disabled){background:var(--tw-gray-50)}
.mp-act{border-radius:var(--r)}
.mp-opt{border-color:var(--color-less-grey);border-radius:var(--r)}
.mp-opt:has(input:checked){box-shadow:inset 0 0 0 1px var(--color-blue)}
.mp-pv-wrap{background:var(--color-mist);border-color:var(--color-line)}
.mp-ro{background:var(--color-mist);border-color:var(--color-line);color:var(--color-ink)}
.mp-email{border-color:var(--color-line);border-radius:var(--r)}
.mp-email-head{background:var(--color-mist);border-color:var(--color-line)}
.mp-email-subj{color:var(--color-ink)}
.mp-seg,.mp-via{border-color:var(--color-less-grey);border-radius:var(--r)}
.mp-seg button+button,.mp-via button+button{border-left-color:var(--color-less-grey)}
.mp-seg button:hover,.mp-via button:hover{background:var(--color-ghost-white)}
.mp-list{border-color:var(--color-line);border-radius:var(--r)}
.mp-row{border-top-color:var(--color-line)}
.mp-foot{border-top-color:var(--color-line)}
.mp-none{border-color:var(--color-less-grey);border-radius:var(--r)}

/* ---------- Page ---------- */
.claims{background:var(--color-background-grey);color:var(--color-title-grey)}
.chip{border-color:var(--color-nudge-line);background:var(--color-nudge-bg)}
/* ---------- Demo role switch (top bar) ---------- */
.role-switch{position:relative;margin-right:4px;flex-shrink:0}
.role-btn{display:inline-flex;height:32px;align-items:center;gap:6px;border-radius:var(--r-pill);border:1.5px dashed var(--shell-white-60);padding:0 8px;font-size:12px;line-height:16px;font-weight:600;color:var(--color-paper);white-space:nowrap;transition:background-color .15s}

function exportSchools() { let rows, capped = false; if (S.selected.size > 0) rows = selectedSchools(); else { const all = new Map(); let page = 1, totalPages = 1; do { const res = api.list({...currentParams(), withCounts: false, page, limit: 100}); for (const s of res.data) all.set(s.id, s); totalPages = res.pagination.totalPages; page += 1; } while (page <= totalPages && page <= 20); rows = [...all.values()]; capped = totalPages > 20; }
  if (!rows.length) return showToast(T.EXPORT_EMPTY, 'error'); const csv = [CSV_COLUMNS.map(c => csvCell(c[0])).join(','), ...rows.map(s => CSV_COLUMNS.map(c => csvCell(c[1](s))).join(','))].join('\r\n');

const growWeight = (c) => c.pin === 'right' ? 0 : c.width * (c.flexible ? 2 : 1);
function fitWidths(columns, available, fixed) { const base = columns.reduce((s, c) => s + c.width, 0) + fixed; const spare = Math.max(0, Math.floor(available - base)); const weights = columns.map(growWeight); const tw = weights.reduce((s, w) => s + w, 0);
  if (!spare || !tw) return columns.map(c => c.width); const widths = columns.map((c, i) => c.width + Math.floor((spare * weights[i]) / tw)); const used = widths.reduce((s, w) => s + w, 0) + fixed; const target = Math.max(0, columns.findIndex(c => c.flexible)); widths[target] += base + spare - used; return widths; }

/* ---------- confirm dialog (CustomDialog) ---------- */
const confirmRoot = $('#confirm-root');
let confirmState = null;

function askConfirm({title, body, okLabel, onConfirm, onCancel}) {
  confirmState = {onConfirm, onCancel, returnFocus: document.activeElement};
  confirmRoot.innerHTML = `<div class="cd-overlay" data-cd-overlay><div class="cd-card" role="alertdialog" aria-modal="true" aria-labelledby="cd-title" aria-describedby="cd-body"><div class="cd-head"><div class="cd-icon">${ICON_WARN}</div><h2 class="cd-title" id="cd-title">${esc(title)}</h2><p class="cd-body" id="cd-body">${esc(body)}</p></div><div class="cd-foot"><button type="button" class="cd-btn cd-cancel" id="cd-cancel">Cancel</button><button type="button" class="cd-btn cd-ok" id="cd-ok">${esc(okLabel)}</button></div></div></div>`;

function closeConfirm() { if (!confirmState) return null; const st = confirmState; confirmState = null; confirmRoot.innerHTML = ''; return st; }
confirmRoot.addEventListener('click', (e) => {

});

  if (e.key !== 'Escape' || !confirmState) return;
  e.preventDefault(); e.stopImmediatePropagation();
  const st = closeConfirm(); if (st && st.onCancel) st.onCancel();
}, true);

function assignCopy(rows, targetId) {
  const target = targetId ? STAFF_BY_ID[targetId].fullName : null;
  const n = rows.length;
  if (n === 1) {
    const r = rows[0]; const old = r.assignee ? r.assignee.fullName : null;
    if (!target) return {body: `${r.name}'s application will be unassigned from ${old}.`, ok: 'Yes, Unassign'};
    if (!old) return {body: `${r.name}'s application will be assigned to ${target}.`, ok: 'Yes, Assign'};
    return {body: `${r.name}'s application will move from ${old} to ${target}.`, ok: 'Yes, Assign'};
  }
  if (!target) return {body: `${n} applications will be unassigned.`, ok: 'Yes, Unassign'};
  return {body: `${n} applications will be assigned to ${target}.`, ok: 'Yes, Assign'};
}

  const target = targetId ? {id: targetId, fullName: STAFF_BY_ID[targetId].fullName} : null;
  ids.forEach((id) => {
    const r = rowById(id); if (!r) return;
    r.assignee = target ? {...target} : null;

  repartition();
}

  const copy = assignCopy(rows, targetId);

}

/* ---------- row assign menu (stays inside the table panel) ---------- */

  const box = $('#app .panel-scroll') || $('#app .panel') || document.body;
  const cr = box.getBoundingClientRect(); const ar = anchor.getBoundingClientRect(); const pad = 8;
  asgMenu.style.width = '';

.select-item:hover, .select-item:focus-visible { background: color-mix(in srgb, var(--color-blue) 10%, transparent); box-shadow: none; }
.select-item[aria-selected="true"] { background: var(--color-blue); color: var(--color-paper); }
.seg { display: flex; height: 44px; border-radius: var(--r); border: 1px solid var(--color-field-line); overflow: hidden; }
.seg button { flex: 1; font-size: 14px; line-height: 20px; font-weight: 600; color: var(--color-ink-2); }
.seg button:hover:not([aria-checked="true"]) { background: var(--color-ghost-white); }
.seg button[aria-checked="true"] { background: var(--color-blue); color: var(--color-paper); }
.seg button:focus-visible { box-shadow: inset var(--focus-ring); }
.seg.is-invalid { border-color: var(--color-red); box-shadow: var(--err-ring); }
.radio-list { display: flex; flex-direction: column; gap: 8px; }
.radio-row {
  min-height: 48px; padding: 10px 12px; border-radius: var(--r); border: 1px solid var(--color-line); display: flex; align-items: flex-start; gap: 12px; text-align: left; width: 100%;
  transition: background-color var(--t-1) var(--ease), border-color var(--t-1) var(--ease);
}
.radio-row:hover { background: var(--color-ghost-white); }
.radio-row[aria-checked="true"] { background: var(--color-p-50); border-color: var(--color-p-100); }
.radio-dot { width: 18px; height: 18px; margin-top: 2px; border-radius: 50%; border: 1.5px solid var(--color-field-line); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; background: var(--color-paper); }
.radio-row[aria-checked="true"] .radio-dot { border-color: var(--color-blue); }
.radio-row[aria-checked="true"] .radio-dot::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--color-blue); }
.radio-body { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0; flex: 1; }
.radio-title { font-size: 14px; line-height: 20px; font-weight: 600; color: var(--color-ink); }
.radio-sub { font-size: 13px; line-height: 18px; color: var(--color-ink-3); }
.radio-tag { margin-left: auto; font-size: 12px; line-height: 16px; color: var(--color-ink-3); align-self: center; }
.radio-list.is-invalid .radio-row { border-color: var(--color-red); }
.menu {
  position: absolute; z-index: 20; min-width: 200px; border-radius: var(--r); border: 1px solid var(--color-less-grey);
  background: var(--color-paper); padding: 4px; box-shadow: var(--sh-md); display: flex; flex-direction: column; gap: 2px;
}
.menu-item { min-height: 40px; padding: 0 10px; gap: 10px; border-radius: var(--r-sm); display: flex; align-items: center; font-size: 14px; line-height: 20px; font-weight: 500; color: var(--color-ink-2); text-align: left; width: 100%; }
.menu-item .ms { color: var(--color-mid-grey); }
.menu-item:hover, .menu-item:focus-visible { background: color-mix(in srgb, var(--color-blue) 10%, transparent); box-shadow: none; }
.menu-item.is-danger { color: var(--color-red); }
.menu-item.is-danger .ms { color: var(--color-red); }
.menu-item.is-danger:hover, .menu-item.is-danger:focus-visible { background: color-mix(in srgb, var(--color-red) 10%, transparent); }
.menu-item .note { display: block; font-size: 12px; line-height: 16px; color: var(--color-ink-3); font-weight: 400; }
.menu-item .grow { flex: 1; display: flex; flex-direction: column; }
.avatar { border-radius: var(--r-pill); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: 600; background: var(--color-blue); color: var(--color-paper); }
.avatar-48 { width: 48px; height: 48px; font-size: 16px; line-height: 20px; }
.avatar-36 { width: 36px; height: 36px; font-size: 13px; line-height: 16px; }
.avatar-28 { width: 28px; height: 28px; font-size: 11px; line-height: 16px; }
.avatar-20 { width: 20px; height: 20px; font-size: 9px; line-height: 12px; }
.avatar.flat { background: var(--color-p-50); color: var(--color-blue); }
.avatar.is-none { background: var(--color-background-grey); color: var(--color-mid-grey); }

/* ---------- Status pill (brief §4.5) ---------- */
/* Status capsules: outline only - no fill, text and border in the status colour (user review of v5) */
.pill { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; border-radius: var(--r-pill); border: 1px solid; padding: 3px 9px; font-size: 12px; line-height: 16px; font-weight: 600; white-space: nowrap; }
.pill-sm { padding: 1px 7px; font-size: 11px; line-height: 16px; gap: 4px; }
.st-applied { background: var(--st-applied-bg); border-color: var(--st-applied-line); color: var(--st-applied-fg); }
.st-review { background: var(--st-review-bg); border-color: var(--st-review-line); color: var(--st-review-fg); }
.st-short { background: var(--st-short-bg); border-color: var(--st-short-line); color: var(--st-short-fg); }
.st-int { background: var(--st-int-bg); border-color: var(--st-int-line); color: var(--st-int-fg); }
.st-done { background: var(--st-done-bg); border-color: var(--st-done-line); color: var(--st-done-fg); }
.st-hired { background: var(--st-hired-bg); border-color: var(--st-hired-line); color: var(--st-hired-fg); }
.st-rejected { background: var(--st-rejected-bg); border-color: var(--st-rejected-line); color: var(--st-rejected-fg); }
.st-withdrawn { background: var(--st-withdrawn-bg); border-color: var(--st-withdrawn-line); color: var(--st-withdrawn-fg); }
.pill .ms { font-size: 16px; }
.pill-sm .ms { font-size: 14px; }
.pill-btn { height: 32px; padding: 0 7px 0 11px; transition: box-shadow var(--t-1) var(--ease); }
.pill-btn.pill-sm { height: 28px; padding: 0 3px 0 7px; }
.pill-btn:hover { box-shadow: inset 0 0 0 1px currentColor; }
.pill-btn:focus-visible { box-shadow: var(--focus-ring); }
.pill-btn .chev { font-size: 18px; }

/* ---------- Page layout (brief §0, §3) ---------- */
.page { max-width: 1280px; margin: 0 auto; padding: 20px 16px 32px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.cols { display: flex; flex-direction: column; gap: 16px; }
.col-left, .col-right { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--color-paper); border: 1px solid var(--color-line); border-radius: var(--r-lg); box-shadow: var(--sh-1); padding: 16px; min-width: 0; }
.card-head { display: flex; align-items: center; gap: 10px; padding-bottom: 14px; border-bottom: 1px solid var(--color-line-soft); }
.card-tile { width: 32px; height: 32px; border-radius: var(--r); background: var(--color-p-50); color: var(--color-blue); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.card-title { font-size: 16px; line-height: 24px; font-weight: 600; color: var(--color-ink); }
.card-count { font-size: 13px; line-height: 18px; font-weight: 500; color: var(--color-ink-3); }
.card-head .right { margin-left: auto; font-size: 12px; line-height: 16px; font-weight: 500; color: var(--color-ink-3); text-align: right; white-space: nowrap; }
.card-head .card-title { min-width: 0; }
.card-body { padding-top: 16px; }

/* Action row §4.3 */
.action-row { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
.action-row .back { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; line-height: 20px; font-weight: 600; color: var(--color-blue); height: 36px; }
.action-row .back:hover { text-decoration: underline; }
.action-row .right { margin-left: auto; display: flex; gap: 8px; }
.action-row .lbl-btn { display: none; }
.action-row .ico-only { display: inline-flex; width: 40px; height: 40px; }
.action-row .ico-only.is-primary { background: var(--color-p-50); border-color: var(--color-p-100); color: var(--color-blue); }
.no-cv { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; line-height: 18px; color: var(--color-ink-3); }
.no-cv .ms { color: var(--color-mid-grey); }

/* Job closed banner §4.25 */
.banner-top { display: flex; gap: 12px; align-items: flex-start; border-radius: var(--r-lg); background: var(--color-warn-bg); border: 1px solid var(--color-warn-line); padding: 12px 16px; margin-bottom: 16px; }
.banner-top .ms { color: var(--color-warn); }
.banner-title { font-size: 14px; line-height: 20px; font-weight: 600; color: var(--color-ink); }
.banner-text { font-size: 13px; line-height: 18px; color: var(--color-ink-2); }

/* Header card §4.4 */
.hdr-a { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.identity { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 12px; row-gap: 2px; align-items: start; min-width: 0; }
.identity .avatar-48 { width: 40px; height: 40px; font-size: 14px; line-height: 18px; grid-row: 1; align-self: center; }
.hdr-name { grid-column: 2; font-size: 20px; line-height: 28px; font-weight: 600; color: var(--color-ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
/* Below 640 the details start under the avatar, at the card's own padding (user review of v5) */
.id-rest { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 8px; min-width: 0; margin-top: 10px; }
.contact-line { display: flex; flex-wrap: wrap; column-gap: 14px; row-gap: 2px; font-size: 14px; line-height: 20px; font-weight: 500; color: var(--color-ink-2); }
.contact-line span { display: inline-flex; align-items: center; gap: 6px; min-width: 0; overflow-wrap: anywhere; }
.contact-line .ms { color: var(--color-mid-grey); }
/* Job title: plain, clear title line - no box, no icon; wraps, never truncated (user review of v6) */
.job-line { margin-top: 4px; min-width: 0; }
.job-title { display: block; font-size: 16px; line-height: 24px; font-weight: 600; color: var(--color-ink); overflow-wrap: break-word; }
/* Application ID and Applied: quiet text line under the job */
.meta-line { display: flex; flex-wrap: wrap; align-items: center; column-gap: 10px; row-gap: 2px; font-size: 13px; line-height: 18px; }
.meta-line .k { color: var(--color-ink-3); font-weight: 400; }
.meta-line .v { color: var(--color-ink-2); font-weight: 600; }
.meta-line .dot { width: 3px; height: 3px; border-radius: var(--r-pill); background: var(--color-light-grey); }
@media (max-width: 639px) { .meta-line { column-gap: 16px; } .meta-line .dot { display: none; } }
.status-block { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.mini-label { font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--color-ink-3); }
.status-block .mini-label + * { margin-bottom: 6px; }
.assignee { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px 0 10px; border-radius: var(--r-pill); border: 1px solid var(--color-less-grey); background: var(--color-mist); font-size: 12px; line-height: 16px; font-weight: 500; color: var(--color-ink-2); max-width: 100%; }
button.assignee { transition: filter var(--t-1) var(--ease); }
button.assignee:hover { filter: brightness(0.95); }
.assignee .ms { color: inherit; opacity: .7; }
.assignee.is-none { border-color: var(--color-warn-line); background: var(--color-warn-bg); color: var(--color-warn); padding-left: 8px; }
.assignee.is-none .ms { opacity: 1; }
.asg-root .asg-panel { position: fixed; z-index: 75; width: 256px; max-width: calc(100vw - 24px); border-radius: var(--r); border: 1px solid var(--color-less-grey); background: var(--color-paper); padding: 4px; box-shadow: var(--sh-md); }
.asg-head { padding: 6px 8px 4px; font-size: 12px; line-height: 16px; font-weight: 500; color: var(--color-ink-muted); }
.asg-opt { position: relative; display: flex; width: 100%; min-height: 48px; align-items: center; border-radius: var(--r-sm); padding: 6px 36px 6px 8px; margin-top: 4px; text-align: left; }
.asg-opt:hover { background: color-mix(in srgb, var(--color-blue) 10%, transparent); box-shadow: none; }
.asg-opt[aria-selected="true"] { background: var(--color-blue); }
.asg-text { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; }
.asg-name { display: block; font-size: 14px; line-height: 20px; font-weight: 500; color: var(--color-title-grey); }
.asg-role { display: block; font-size: 12px; line-height: 16px; font-weight: 400; color: var(--color-ink-3); }
.asg-opt[aria-selected="true"] .asg-name { color: var(--color-paper); }
.asg-opt[aria-selected="true"] .asg-role { color: var(--color-on-blue-80); }
.asg-opt .ms { position: absolute; right: 10px; color: var(--color-paper); }
.hdr-b { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--color-line-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
/* Highlight chips: outline only like the status pills - no fill, border and text in the chip colour (user review of v6) */
.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 9px; border-radius: var(--r-pill); border: 1px solid currentColor; background: transparent; font-size: 12px; line-height: 16px; font-weight: 600; white-space: nowrap; }
.chip .ms { font-size: 16px; }
.chip-int { color: var(--st-int-fg); }
.chip-warn { color: var(--color-warn); }
.chip-bad { color: var(--color-red); }
.contact-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.contact-btns .lbl { display: none; }
.contact-btns .btn-outline.c-icon { width: 40px; height: 40px; padding: 0; border-radius: var(--r-pill); }

/* Progress card §4.6 */
.rail { display: none; }
.rail-v { display: flex; flex-direction: column; margin-top: 16px; }
.rv-node { display: flex; align-items: center; gap: 10px; }
.rv-col { width: 32px; display: flex; flex-direction: column; align-items: center; }
.rv-conn { width: 2px; height: 16px; background: var(--color-less-grey); margin-left: 15px; }
.rv-conn.is-done { background: var(--color-blue); }
.rv-label { font-size: 13px; line-height: 18px; color: var(--color-ink-3); }
.rv-label.is-current { color: var(--color-ink); font-weight: 600; }
.dot { border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--color-paper); border: 1.5px solid var(--color-less-grey); flex-shrink: 0; }
.dot-28 { width: 28px; height: 28px; }
.dot-24 { width: 24px; height: 24px; }
.dot.is-done { background: var(--color-blue); border-color: var(--color-blue); color: var(--color-paper); }
.dot.is-current { border: 2px solid var(--color-blue); box-shadow: 0 0 0 4px var(--color-p-50); }
.dot.is-current::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--color-blue); }
.dot.is-ended { background: var(--color-light-grey); border-color: var(--color-light-grey); color: var(--color-paper); }
.rail.is-ended, .rail-v.is-ended { opacity: .5; }
.focus-panel { margin-top: 16px; border-radius: var(--r); border: 1px solid var(--color-line); background: var(--color-mist); padding: 16px; }
.fp-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
.fp-cell { border-left: 3px solid var(--color-line); padding: 2px 0 2px 12px; min-width: 0; }
.fp-cell.is-task { border-left-color: var(--color-blue); }
.fp-cell-v { margin-top: 6px; }
.fp-task { margin-top: 6px; font-size: 14px; line-height: 20px; font-weight: 600; color: var(--color-ink); overflow-wrap: anywhere; }
.fp-cell .fp-since { display: block; margin-top: 4px; }
.empty-state { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; padding: 12px 8px; }
.empty-tile { width: 40px; height: 40px; border-radius: var(--r-pill); background: var(--color-background-grey); color: var(--color-mid-grey); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 4px; }
.empty-title { font-size: 14px; line-height: 20px; font-weight: 600; color: var(--color-ink); }
.empty-text { font-size: 13px; line-height: 18px; color: var(--color-ink-3); max-width: 280px; }
.panel.is-none { background: var(--color-mist); }
.panel.is-int { background: var(--panel-int-bg); border-color: var(--panel-int-line); }
.panel.is-done { background: var(--color-paper); }
.fp-line1 { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 4px; }
.fp-since { font-size: 13px; line-height: 18px; color: var(--color-ink-3); }
.fp-meaning { margin-top: 8px; font-size: 14px; line-height: 20px; font-weight: 500; color: var(--color-ink-2); }
.fp-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--color-line); }
.fp-go { display: flex; flex-direction: column; gap: 8px; }
.fp-actions .btn { width: 100%; }
.nudge { display: flex; gap: 10px; align-items: flex-start; margin-top: 14px; border-radius: var(--r); background: var(--color-nudge-bg); border: 1px solid var(--color-nudge-line); padding: 10px 12px; font-size: 13px; line-height: 18px; color: var(--color-ink-2); }
.nudge .ms { color: var(--color-blue); }
.nudge .acts { display: flex; gap: 14px; margin-top: 6px; }
.nudge .btn-text { font-size: 13px; line-height: 18px; }
.ended-banner { display: flex; gap: 10px; align-items: flex-start; margin-top: 8px; border-radius: var(--r); padding: 12px 14px; border: 1px solid var(--color-line); background: var(--color-background-grey); color: var(--color-ink-2); }
.ended-banner .eb-title { font-size: 14px; line-height: 20px; font-weight: 600; }
.ended-banner .eb-text { font-size: 13px; line-height: 18px; margin-top: 2px; }
.ended-banner .eb-act { margin-top: 10px; }
.ended-banner.is-ok { background: var(--color-ok-bg); border-color: var(--color-ok-line); color: var(--color-ok); }
.ended-banner.is-bad { background: var(--color-red-bg); border-color: var(--color-red-line); color: var(--color-red); }
.panels { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; margin-top: 16px; }
.panel { border-radius: var(--r); border: 1px solid var(--color-line); padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 32px; }
.panel-head .panel-label { min-width: 0; }
.panel-tools { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
.panel-tools .btn-sm { margin-right: 2px; }
.panel-main { font-size: 15px; line-height: 22px; font-weight: 600; color: var(--color-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.panel-sub { min-height: 40px; font-size: 13px; line-height: 20px; color: var(--color-ink-2); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.panel.is-none .panel-main { color: var(--color-ink-2); }
.panel.is-none .panel-sub { color: var(--color-ink-3); }
.ok-mark { display: inline-flex; vertical-align: -4px; margin-right: 6px; color: var(--color-ok); }
.icon-btn.ghost.tool { color: var(--color-ink-3); }
.icon-btn.ghost.is-danger { color: var(--color-red); }
.icon-btn.ghost.is-ok { color: var(--color-ok); }
.icon-btn.ghost.is-ok:hover:not(:disabled) { background: var(--color-ok-bg); color: var(--color-ok); }
.icon-btn.ghost.is-danger:hover:not(:disabled) { background: var(--color-red-bg); color: var(--color-red); }
.panel-label { display: flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--color-ink-3); }
.panel-label .ms { font-size: 18px; color: var(--color-mid-grey); }
.panel-empty { font-size: 14px; line-height: 20px; color: var(--color-ink-3); }
.panel-big { font-size: 15px; line-height: 22px; font-weight: 600; color: var(--color-ink); }
.panel-text { font-size: 14px; line-height: 20px; color: var(--color-ink-2); overflow-wrap: anywhere; white-space: pre-line; }
.panel-text.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.panel-acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 4px; }
.panel.is-warn { background: var(--panel-warn-bg); border-color: var(--panel-warn-line); }
.panel.is-bad { background: var(--color-red-bg); border-color: var(--color-red-line); }
.panel.is-bad .panel-big, .panel.is-bad .panel-main { color: var(--color-red); }
.panel .ok-text { display: inline-flex; align-items: center; gap: 6px; color: var(--color-ok); font-size: 14px; line-height: 20px; font-weight: 600; }
.tag-row { display: flex; flex-wrap: wrap; gap: 6px; }
.tag-int { border-radius: var(--r-pill); border: 1px solid currentColor; background: transparent; color: var(--st-int-fg); font-size: 12px; line-height: 16px; font-weight: 600; padding: 1px 7px; }
.round-label { font-size: 12px; line-height: 16px; font-weight: 600; color: var(--color-ink-3); }

/* Context card placement: in the left column below 1024, right column from 1024 (brief §0) */
.ctx-desktop { display: none; }
@media (min-width: 1024px) { .ctx-mobile { display: none; } .ctx-desktop { display: block; } }

/* Profile §4.7 */
.snapshot { display: flex; gap: 8px; align-items: flex-start; border-radius: var(--r); background: var(--color-callout-bg); padding: 8px 12px; font-size: 13px; line-height: 18px; font-weight: 500; color: var(--color-ink-2); }
.snapshot .ms { color: var(--color-blue); }
.snapshot + .snapshot { margin-top: 8px; }

    case 'email-cancel': { const e = state.chat.email; if (e.subject.trim()) openDialog('S20', { onDiscard: 'email' }); else { state.chat.sheet = null; state.chat.draft = e.body; state.chat.email = { tpl: '', subject: '', body: '' }; replaceStep('S3'); renderChat(); focusComposer(); } break; }
    case 'email-send': {
      const e = state.chat.email; if (!e.subject.trim() || !e.body.trim()) return;
      const t = TEMPLATES.find((x) => x.id === e.tpl);
      const m = { ch: 'email', kind: 'email', subject: e.subject.trim(), text: e.body.trim(), tpl: t ? t.name : undefined };
      state.chat.sheet = null; state.chat.email = { tpl: '', subject: '', body: '' }; replaceStep('S3');
      if (pushMessage(a, m)) toast('ok', 'Email sent');
      break;
    }
    case 'toast-close': document.getElementById('toast-root').innerHTML = ''; break;
    case 'proto-toggle': state.proto = !state.proto; renderProto(); break;

  }
});
function refocus(sel) { requestAnimationFrame(() => { const layers = document.querySelectorAll('#dialog-root .dlg'); const scope = layers.length ? layers[layers.length - 1] : document; const el = scope.querySelector(sel) || document.querySelector(sel); if (el) el.focus(); }); }
function copyLink() {
  if (state.copying) return;
  state.copying = true; renderPage();
  setTimeout(() => { state.copying = false; renderPage(); refocus('.js-copy:not([hidden])'); finishCopy(); }, 1200);
}
function finishCopy() {
  const url = location.href;
  const fail = () => toast('info', "Couldn't copy the link. Press Ctrl+C to copy it.", '', `<input class="field js-copy-field" readonly value="${esc(url)}" aria-label="Link to this applicant">`);
  if (state.sim.has('clip') || !navigator.clipboard) { fail(); requestAnimationFrame(() => { const f = document.querySelector('.js-copy-field'); if (f) { f.focus(); f.select(); } }); return; }
  const timeout = new Promise((res, rej) => setTimeout(() => rej(new Error('timeout')), 1500));
  Promise.race([navigator.clipboard.writeText(url), timeout]).then(() => toast('ok', 'Link copied'), () => { fail(); requestAnimationFrame(() => { const f = document.querySelector('.js-copy-field'); if (f) { f.focus(); f.select(); } }); });
}
function saveNote() {
  const a = app(); const t = state.noteDraft.trim(); if (!t) return;
  a.notes.unshift({ author: viewerStaff(), at: toISO(now()), text: t, edited: false });
  state.noteDraft = ''; renderPage(); toast('ok', 'Note saved'); refocus('#note-new');
}
function sendFromComposer() {
  const c = state.chat; const a = app();
  if (c.channel === 'email') { if (!c.draft.trim()) return; c.email = { tpl: '', subject: '', body: c.draft.trim() }; c.sheet = 'email'; pushStep('S5'); renderChat(); refocus('#em-subj'); return; }
  if (c.channel === 'wa' && !a.waOpen) { c.sheet = 'tpl'; renderChat(); return; }
  if (c.channel === 'sms' && c.attach) { toast('err', "Files can't be sent by SMS. Switch to App chat or WhatsApp."); return; }
  const text = c.draft.trim(); if (!text && !c.attach) return;
  let ok = true;
  if (c.attach) { ok = pushMessage(a, { ch: c.channel, kind: 'file', subject: c.attach.name, text: `PDF · ${c.attach.size}` }); c.attach = null; }
  if (text) ok = pushMessage(a, { ch: c.channel, text }) && ok;
  c.draft = ''; renderChat(); focusComposer();
  if (ok) toast('ok', 'Message sent');
}

/* ---------- typing (no full re-render, keeps the caret) ---------- */
document.addEventListener('input', (ev) => {
  const el = ev.target; const kind = el.dataset.input; const proto = el.dataset.proto;
  if (proto) return;
  if (!kind) return;
  const a = app();
  if (kind === 'note-new') { state.noteDraft = el.value; const b = document.querySelector('.js-note-send'); if (b) b.disabled = !el.value.trim(); const cnt = document.querySelector('.js-note-count'); if (cnt) { cnt.textContent = `${el.value.length}/${NOTE_MAX}`; cnt.classList.toggle('is-max', el.value.length >= NOTE_MAX); } }
  if (kind === 'note-edit') { state.editText = el.value; const n = a.notes[state.editNote]; const b = document.querySelector('.js-note-save'); if (b) b.disabled = !el.value.trim() || el.value.trim() === n.text; const cnt = document.querySelector('.js-edit-count'); if (cnt) cnt.textContent = `${el.value.length}/${NOTE_MAX}`; }
  if (kind === 'msg') {
    state.chat.draft = el.value; const b = document.querySelector('.js-send'); if (b) b.disabled = !(el.value.trim() || state.chat.attach);
    { const area = document.querySelector('.composer-area'); const old = area.querySelector('.c-hint'); const tmp = document.createElement('div'); tmp.innerHTML = chHint(state.chat, a); const nu = tmp.firstElementChild; if (old && nu) old.replaceWith(nu); else if (old && !nu) old.remove(); else if (!old && nu) area.insertBefore(nu, area.querySelector('.composer')); }
  }
  if (kind === 'tpl-text') { state.chat.tplText = el.value; const t = TEMPLATES.find((x) => x.id === state.chat.tpl); const miss = missingVars(el.value + (state.chat.channel === 'email' ? t.subject : ''), a); const b = document.querySelector('.js-tpl-send'); if (b) b.disabled = miss.length > 0; const bub = document.querySelector('.tpl-detail .bubble'); if (bub) bub.innerHTML = (state.chat.channel === 'email' ? `<b>${previewHTML(t.subject, a)}</b>` : '') + previewHTML(el.value, a); }
  if (kind === 'em-subj' || kind === 'em-body') { const e = state.chat.email; if (kind === 'em-subj') e.subject = el.value; else e.body = el.value; const b = document.querySelector('.js-email-send'); if (b) b.disabled = !(e.subject.trim() && e.body.trim()); const cnt = el.closest('.field-row').querySelector('.counter'); if (cnt) cnt.textContent = `${el.value.length}/${el.maxLength}`; }
  if (kind === 'dlg') {
    const d = topDialog(); d[el.dataset.field] = el.value; if (d.errs && d.errs[el.dataset.field]) { delete d.errs[el.dataset.field]; el.removeAttribute('aria-invalid'); const er = el.parentElement.querySelector('.field-error'); if (er) er.remove(); }
    const cnt = el.closest('.field-row').querySelector('.js-count'); if (cnt) cnt.textContent = `${el.value.length}/${el.maxLength}`;
    if (d.id === 'S12') { const b = document.querySelector('#dialog-root .js-confirm'); if (b) b.disabled = !(d.reason && (d.reason !== 'Other' || d.other.trim())); }
  }
});
document.addEventListener('change', (ev) => {
  const el = ev.target;
  if (el.id === 'pdf-input' && el.files && el.files[0]) {
    const f = el.files[0]; const c = state.chat;
    if (f.type !== 'application/pdf' || f.size > 5 * 1024 * 1024) { c.uploadErr = 'You can share PDFs up to 5 MB here.'; renderChat(); setTimeout(() => { if (state.chat) { state.chat.uploadErr = ''; renderChat(); } }, 4000); return; }
    c.attach = { name: f.name, size: f.size > 1048576 ? (f.size / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(f.size / 1024)) + ' KB' }; renderChat(); focusComposer(); return;
  }
  const p = el.dataset.proto; if (!p) return;
  if (p === 'viewer') { state.viewer = el.value; loadApplicant(state.appId); renderProto(); }
  if (p === 'applicant') { loadApplicant(el.value); renderProto(); }
  if (p === 'sim') { if (el.checked) state.sim.add(el.value); else state.sim.delete(el.value); replaceStep(currentStep()); if (el.value === 'loadFail') startLoad(); }
});
document.addEventListener('keydown', (ev) => {
  const el = ev.target;
  if (el.dataset && el.dataset.input === 'note-new' && ev.key === 'Enter') { ev.preventDefault(); saveNote(); return; }
  if (el.dataset && el.dataset.input === 'note-edit' && ev.key === 'Enter') { ev.preventDefault(); const b = document.querySelector('.js-note-save'); if (b && !b.disabled) b.click(); return; }
  if (el.id === 'msg-input' && ev.key === 'Enter') { ev.preventDefault(); sendFromComposer(); return; }
  if (ev.key === 'Escape') {
    const d = topDialog();
    if (d) { if (d.calDD) { const k = d.calDD; d.calDD = null; renderDialogs(); refocus(`.cal-pop [data-action="cal-dd"][data-dd="${k}"]`); ev.preventDefault(); return; } if (d.sub) { const s = d.sub; d.sub = null; renderDialogs(); refocus(`[data-sub="${s}"]`); } else if (d.id === 'S20') closeTopDialog(true); else closeTopDialog(false); ev.preventDefault(); return; }
    if (state.chat) {
      if (state.chat.menu) { state.chat.menu = null; renderChat(); focusComposer(); }
      else if (state.chat.selOpen) { state.chat.selOpen = false; renderChat(); }
      else if (state.chat.sheet === 'tpl') { state.chat.sheet = null; state.chat.tpl = null; replaceStep('S3'); renderChat(); focusComposer(); }
      else if (state.chat.sheet === 'email') document.querySelector('[data-action="email-cancel"]').click();
      else closeChat();
      ev.preventDefault(); return;
    }
    if (state.asgOpen) { closeAsgPanel(); const t = document.getElementById('asg-trigger'); if (t) t.focus(); ev.preventDefault(); return; }
    window.ssCloseDetail(); ev.preventDefault();
  }
  if (ev.key === 'Tab') {
    const layers = document.querySelectorAll('#dialog-root .dlg-layer'); let scope = layers[layers.length - 1];
    if (!scope && state.chat) scope = document.querySelector('.chat');
    if (!scope) return;
    const f = [...scope.querySelectorAll('button:not(:disabled), input:not(:disabled):not([type="file"]), textarea:not(:disabled), [tabindex]:not([tabindex="-1"])')].filter((x) => x.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
    else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
    else if (!scope.contains(document.activeElement)) { ev.preventDefault(); first.focus(); }
  }
  if ((ev.key === 'ArrowDown' || ev.key === 'ArrowUp' || ev.key === 'ArrowLeft' || ev.key === 'ArrowRight') && el.closest && el.closest('[role="radiogroup"], [role="listbox"], [role="menu"], .cal-grid')) {
    const group = el.closest('[role="radiogroup"], [role="listbox"], [role="menu"], .cal-grid');
    if (group.classList.contains('cal-grid')) {
      const all = [...group.querySelectorAll('.cal-day')].map((b) => (b.classList.contains('outside') ? null : b)); const i = all.indexOf(el); const st = (ev.key === 'ArrowDown' ? 7 : ev.key === 'ArrowUp' ? -7 : ev.key === 'ArrowRight' ? 1 : -1);
      const nx = all[i + st]; ev.preventDefault(); if (nx && !nx.disabled) nx.focus(); return;
    }
    const items = [...group.querySelectorAll('button:not(:disabled)')].filter((x) => !x.classList.contains('is-out'));
    const i = items.indexOf(el); if (i < 0) return;
    let step = (ev.key === 'ArrowDown' || ev.key === 'ArrowRight') ? 1 : -1;
    if (group.classList.contains('cal-grid') && (ev.key === 'ArrowDown' || ev.key === 'ArrowUp')) step *= 7;
    const nx = items[Math.max(0, Math.min(items.length - 1, i + step))]; if (nx) { ev.preventDefault(); nx.focus(); }
  }
});


/* ---------- assignee dropdown (HR Manager and School Admin only) ---------- */
function closeAsgPanel() {
  const root = document.getElementById('asg-root');
  if (!state.asgOpen && (!root || !root.innerHTML)) return;
  state.asgOpen = false;
  if (root) root.innerHTML = '';
  const t = document.getElementById('asg-trigger');
  if (t) t.setAttribute('aria-expanded', 'false');
}
function toggleAsgPanel() {
  if (state.asgOpen) { closeAsgPanel(); return; }
  const a = app(); const t = document.getElementById('asg-trigger'); const root = document.getElementById('asg-root');
  if (!t || !root || !canAssign()) return;
  state.asgOpen = true; state.asgOpenedAt = Date.now(); t.setAttribute('aria-expanded', 'true');
  const cur = a.assignee || 'none';
  const opt = (id, name, role) => `<button type="button" role="option" class="asg-opt" aria-selected="${cur === id}" data-action="asg-pick" data-val="${id}"><span class="asg-text"><span class="asg-name">${esc(name)}</span><span class="asg-role">${esc(role)}</span></span>${cur === id ? ms('check', 16) : ''}</button>`;
  root.innerHTML = `<div class="asg-panel" role="listbox" aria-label="Assign application to"><p class="asg-head">Assign application to</p>${STAFF_ORDER.map((id) => opt(id, staffName(id), FIXTURES.staff[id].role)).join('')}${opt('none', 'Unassigned', 'No one assigned')}</div>`;
  const panel = root.querySelector('.asg-panel');
  const r = t.getBoundingClientRect(); const w = panel.offsetWidth; const h = panel.offsetHeight; const vw = window.innerWidth; const vh = window.innerHeight;
  let left = r.right - w; left = Math.max(12, Math.min(left, vw - 12 - w));
  let top = r.bottom + 6; if (top + h > vh - 12 && r.top - 6 - h > 12) top = r.top - 6 - h;
  panel.style.left = Math.round(left) + 'px'; panel.style.top = Math.round(top) + 'px';
  const sel = panel.querySelector('[aria-selected="true"]') || panel.querySelector('.asg-opt'); if (sel) sel.focus();
}
document.addEventListener('keydown', (ev) => {
  if (!state.asgOpen) return;
  if (ev.key !== 'ArrowDown' && ev.key !== 'ArrowUp') return;
  const items = [...document.querySelectorAll('#asg-root .asg-opt')]; const i = items.indexOf(document.activeElement);
  const nx = items[Math.max(0, Math.min(items.length - 1, i + (ev.key === 'ArrowDown' ? 1 : -1)))];
  if (nx) { ev.preventDefault(); nx.focus(); }
});

/* ---------- floating panels close on page scroll and resize (scrolling inside a panel does not) ---------- */
(function () {
  function closeFloating(e) {
    if (e && state.asgOpen && Date.now() - (state.asgOpenedAt || 0) < 250) return;
    const t = e && e.target;
    if (t && t.nodeType === 1 && t.closest && t.closest('.asg-panel, .select-panel, .menu, .cal-dd-list, .cal-pop')) return;
    if (t && t.nodeType === 1 && !(t.id === 'scroller' || t.classList.contains('dlg-body'))) return;
    if (state.asgOpen) closeAsgPanel();
    if (state.chat) {
      let changed = false;
      if (state.chat.menu) { state.chat.menu = null; changed = true; }
      if (state.chat.selOpen) { state.chat.selOpen = false; changed = true; }
      if (changed) renderChat();
    }
    const d = topDialog();
    if (d && (d.calDD || d.sub)) { d.calDD = null; d.sub = null; renderDialogs(); }
  }
  window.addEventListener('scroll', closeFloating, true);
  window.addEventListener('resize', () => closeFloating(null));
})();

/* ---------- embedded in the applications list ---------- */
window.ssCloseDetail = function () {
  try { if (window.parent && window.parent !== window && typeof window.parent.closeApplicantDetail === 'function') { window.parent.closeApplicantDetail(); return; } } catch (e) {}
  try { window.parent.postMessage({ type: 'ssDetailClose' }, '*'); } catch (e) {}
};
(function () {
  let last = '';
  function post() {
    if (state.load !== 'ready') return;
    const a = app(); if (!a) return;
    let snap; try { snap = JSON.stringify(a); } catch (e) { return; }
    if (snap === last) return;
    last = snap;
    try { window.parent.postMessage({ type: 'ssApplicantChanged', applicant: JSON.parse(snap) }, '*'); } catch (e) {}
  }
  const rp = renderPage; renderPage = function () { rp.apply(this, arguments); post(); };
  const rc = renderChat; renderChat = function () { rc.apply(this, arguments); post(); };
})();

/* ---------- init ---------- */
(function init() {
  replaceStep('S1');
  startLoad();
})();
