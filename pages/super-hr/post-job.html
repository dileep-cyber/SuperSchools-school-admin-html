<style>
/* Tokens: school-admin side, copied from globals.css (same set as post-a-job-flow-v2.html). No raw colours below. */
:root {
  --color-blue: #284CA5; --color-dark-grey: #3D3D3D; --color-mid-grey: #7A7A7A; --color-light-grey: #A8A8A8; --color-less-grey: #DADADA;
  --color-background-grey: #F5F5F5; --color-red: #D54545; --color-ghost-white: #F9F9F9;
  --color-p-50: #EEF2FB; --color-p-100: #D6DEF2; --color-p-200: #9EB3EB; --color-p-400: #476AC5; --color-p-500: var(--color-blue); --color-p-600: #1F3A80; --color-p-700: #162C61;
  --color-ink: #2B2B2B; --color-ink-2: var(--color-dark-grey); --color-ink-3: #707070; --color-ink-5: #8A8A8A;
  --color-paper: #FFFFFF; --color-mist: #FAFAFA; --color-mist-2: var(--color-background-grey); --color-line: #EBEBEB; --color-line-soft: #F2F2F2; --color-field-line: #C7C7C7;
  --color-ok: #1A6E50; --color-ok-bg: #E8F4ED; --color-ok-line: #BFE0CC; --color-warn: #96600A; --color-warn-bg: #FFF3DB; --color-warn-line: #FFE1A6;
  --color-nudge-bg: #F0F4FE; --color-nudge-line: #D7E0F8; --color-callout-bg: #F3F6FD; --color-rv-danger: #C0392B; --color-rv-danger-tint: #FDF1F0; --color-rv-navy: #0F2350; --color-scrim: rgba(15,35,80,.4);
  --r-xs: 4px; --r-sm: 6px; --r: 8px; --r-lg: 10px; --r-pill: 999px;
  --sh-1: 0 1px 2px rgba(0,0,0,.03); --sh-2: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.03); --sh-3: 0 4px 12px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.05); --sh-dock: 0 -8px 20px -10px rgba(20,24,40,.18);
  --focus-ring: 0 0 0 2px #8ca7fd; --err-ring: 0 0 0 2px rgba(213,69,69,.25); --ease: cubic-bezier(.22,.61,.36,1); --t-1: .16s; --t-2: .28s;
  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
  /* Tailwind defaults that school-admin src/components/ui/calendar.tsx uses (gray-100/400/500/900, blue-500 ring, shadow-sm) */
  --color-gray-100: #F3F4F6; --color-gray-400: #9CA3AF; --color-gray-500: #6B7280; --color-gray-900: #111827; --color-ring-blue: #3B82F6; --sh-sm: 0 1px 3px 0 rgba(0,0,0,.1), 0 1px 2px -1px rgba(0,0,0,.1);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--font); color: var(--color-ink); background: var(--color-paper); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: none; box-shadow: var(--focus-ring); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
/* Icons: inline SVG sprite so the prototype has no font dependency */
.ic { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; font-size: 20px; line-height: 1; letter-spacing: normal; text-transform: none; white-space: nowrap; direction: ltr; flex: none; display: inline-block; vertical-align: middle; overflow: hidden; width: 1em; font-feature-settings: 'liga'; -webkit-font-feature-settings: 'liga'; -webkit-font-smoothing: antialiased; font-variation-settings: 'FILL' 0, 'wght' 400; }
.ic.s { font-size: 17px; } .ic.l { font-size: 34px; }

.fld, .chip, .tile, .qc, .fold, .rvc, button { scroll-margin-top: 72px; scroll-margin-bottom: 140px; }
.app { position: relative; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; background: var(--color-paper); }
.app__top { position: sticky; top: 0; z-index: 5; flex: none; height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 20px; border-bottom: 1px solid var(--color-line); background: var(--color-paper); }
.logo { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--color-blue); font-size: 16px; white-space: nowrap; min-width: 0; overflow: hidden; }
.logo span { font-weight: 500; color: var(--color-ink-3); font-size: 14px; }
.app__top .acts { display: flex; gap: 8px; align-items: center; }
.app__main { flex: 1; min-height: 0; }
.toast { position: fixed; z-index: 30; left: 50%; top: 72px; transform: translateX(-50%); max-width: calc(100vw - 32px); display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: var(--r-pill); background: var(--color-rv-navy); color: var(--color-paper); font-size: 13px; font-weight: 500; box-shadow: var(--sh-3); max-width: calc(100vw - 32px); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 20px; border-radius: var(--r); font-weight: 600; font-size: 15px; white-space: nowrap; transition: background var(--t-1), box-shadow var(--t-1), color var(--t-1); }
.btn-p { background: var(--color-blue); color: var(--color-paper); }
.btn-p:hover:not(:disabled) { background: var(--color-p-600); }
.btn-p:disabled { background: var(--color-p-200); }
.btn-l { background: var(--color-paper); color: var(--color-ink); box-shadow: inset 0 0 0 1px var(--color-field-line); }
.btn-l:hover:not(:disabled) { box-shadow: inset 0 0 0 1px var(--color-ink-5); }
.btn-sm { height: 36px; padding: 0 14px; font-size: 14px; }
.link { color: var(--color-blue); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 4px; min-height: 32px; }
.link:hover { text-decoration: underline; text-underline-offset: 3px; }
.ulink { font-weight: 600; text-decoration: underline; text-underline-offset: 3px; color: var(--color-ink); font-size: 15px; min-height: 44px; padding: 0 4px; }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Fields */
.fld + .fld, .fld + .grid2, .grid2 + .fld { margin-top: 22px; }
.grid2 > .fld + .fld { margin-top: 0; }
.fld__l { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; font-size: 14px; font-weight: 600; color: var(--color-ink); }
.req { color: var(--color-red); }
.opt { font-weight: 400; color: var(--color-ink-3); font-size: 13px; }
.hint { margin: -2px 0 8px; font-size: 13px; color: var(--color-ink-3); }
.hint.after { margin: 6px 0 0; }
.lock { display: inline-flex; align-items: center; gap: 3px; padding: 1px 7px; border-radius: var(--r-pill); background: var(--color-mist-2); font-size: 12px; font-weight: 500; color: var(--color-ink-3); }
.err { display: flex; align-items: flex-start; gap: 6px; margin: 8px 0 0; font-size: 13px; font-weight: 500; color: var(--color-rv-danger); }
.inp { width: 100%; height: 44px; padding: 0 12px; border: 1px solid var(--color-field-line); border-radius: var(--r); background: var(--color-paper); font-size: 16px; transition: border-color var(--t-1), box-shadow var(--t-1); }
.inp:hover:not(:disabled) { border-color: var(--color-ink-5); }
.inp:focus { outline: none; border-color: var(--color-blue); box-shadow: var(--focus-ring); }
.inp:disabled { background: var(--color-mist-2); color: var(--color-ink-5); }
.inp.bad { border-color: var(--color-red); box-shadow: var(--err-ring); }
select.inp { appearance: none; padding-right: 38px; background-image: linear-gradient(45deg, transparent 50%, var(--color-ink-3) 50%), linear-gradient(135deg, var(--color-ink-3) 50%, transparent 50%); background-position: calc(100% - 19px) 50%, calc(100% - 14px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
textarea.inp { height: auto; min-height: 140px; padding: 10px 12px; line-height: 1.55; resize: vertical; font-size: 15px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.sub-l { display: block; font-size: 13px; color: var(--color-ink-3); margin-bottom: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 5px; min-height: 40px; padding: 0 14px; border-radius: var(--r-pill); background: var(--color-paper); box-shadow: inset 0 0 0 1px var(--color-field-line); font-size: 14px; color: var(--color-ink-2); white-space: nowrap; transition: box-shadow var(--t-1), background var(--t-1), color var(--t-1); }
.chip:hover:not(:disabled) { box-shadow: inset 0 0 0 1px var(--color-ink-5); }
.chip.on { background: var(--color-p-50); box-shadow: inset 0 0 0 1px var(--color-blue); color: var(--color-p-600); font-weight: 600; }
.chip:disabled { opacity: .55; }
.grp-l { margin: 14px 0 6px; font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--color-ink-3); }
.grp-l:first-child { margin-top: 0; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { display: flex; align-items: center; gap: 14px; min-height: 64px; padding: 12px 14px; border-radius: var(--r-lg); background: var(--color-paper); box-shadow: inset 0 0 0 1px var(--color-field-line); text-align: left; transition: box-shadow var(--t-1), background var(--t-1); }
.tile:hover:not(:disabled) { box-shadow: inset 0 0 0 1px var(--color-ink-5); }
.tile.on { background: var(--color-p-50); box-shadow: inset 0 0 0 2px var(--color-blue); }
.tile__ic { flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--color-p-50); color: var(--color-blue); display: flex; align-items: center; justify-content: center; }
.tile.on .tile__ic { background: var(--color-blue); color: var(--color-paper); }
.tile__tx { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile__t { font-weight: 600; font-size: 15px; color: var(--color-ink); }
.tile__s { font-size: 13px; color: var(--color-ink-3); }
.tile:disabled { opacity: .6; }
.rolerow { display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin-bottom: 22px; border-radius: var(--r-lg); background: var(--color-paper); box-shadow: inset 0 0 0 1px var(--color-line); }
.rolerow b { font-weight: 600; }
.rolerow .link { margin-left: auto; }
.money { position: relative; }
.money .cur { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--color-ink-3); font-size: 16px; }
.money .per { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--color-ink-5); font-size: 14px; pointer-events: none; }
.money .inp { padding-left: 30px; padding-right: 92px; }
.check { display: inline-flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 14px; color: var(--color-ink-2); cursor: pointer; min-height: 32px; }
.check input { width: 20px; height: 20px; accent-color: var(--color-blue); margin: 0; }
.stepper { display: inline-flex; align-items: center; height: 44px; border-radius: var(--r); box-shadow: inset 0 0 0 1px var(--color-field-line); overflow: hidden; }
.stepper button { width: 44px; height: 100%; display: flex; align-items: center; justify-content: center; color: var(--color-ink-2); }
.stepper button:hover:not(:disabled) { background: var(--color-mist); }
.stepper button:disabled { color: var(--color-less-grey); }
.stepper__in { width: 48px; height: 100%; border: 0; border-left: 1px solid var(--color-line); border-right: 1px solid var(--color-line); text-align: center; font-weight: 600; font-size: 15px; background: transparent; }
.stepper__in:focus-visible { outline: 2px solid var(--color-blue); outline-offset: -2px; }
.stepper output { width: 48px; text-align: center; font-weight: 600; font-size: 15px; border-left: 1px solid var(--color-line); border-right: 1px solid var(--color-line); line-height: 44px; }
.times { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.times .inp { max-width: 170px; }
.times > span:not(.sub-l) { color: var(--color-ink-5); }
.suggest { display: inline-flex; align-items: center; gap: 3px; padding: 1px 8px; border-radius: var(--r-pill); background: var(--color-nudge-bg); color: var(--color-p-600); font-size: 12px; font-weight: 600; }
.count { margin: 6px 0 0; font-size: 12px; color: var(--color-ink-3); text-align: right; font-variant-numeric: tabular-nums; }
.count.bad { color: var(--color-rv-danger); }
.spec-search { margin-bottom: 12px; }
.rv-preview { width: 100%; margin-top: 12px; justify-content: center; }
.pv { width: min(760px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); padding: 0; border: 1px solid var(--color-line); border-radius: var(--r-lg); background: var(--color-paper); color: var(--color-ink); }
.pv::backdrop { background: var(--color-scrim); }
.pv__head { position: sticky; top: 0; z-index: 1; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 16px 20px; border-bottom: 1px solid var(--color-line); background: var(--color-paper); }
.pv__cap { margin: 0 0 4px; font-size: 13px; color: var(--color-ink-3); }
.pv__head h2 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.pv__close { flex: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 999px; color: var(--color-ink-2); cursor: pointer; }
.pv__close:hover { background: var(--color-background-grey); }
.pv__close:focus-visible { outline: 2px solid var(--color-blue); outline-offset: 2px; }
.pv__body { padding: 20px; overflow-wrap: anywhere; }
.pv__body .rv-sec { margin-top: 20px; }
.pv__body .rv-sec h3 { margin: 0 0 12px; font-size: 16px; font-weight: 600; }
.spec-search .hint.after:empty { display: none; }
[hidden] { display: none !important; }
.resp { list-style: none; margin: 0; padding: 0; border: 1px solid var(--color-line); border-radius: var(--r-lg); overflow: hidden; }
.resp li + li { border-top: 1px solid var(--color-line-soft); }
.resp label { display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px; cursor: pointer; font-size: 14px; color: var(--color-ink-2); }
.resp input { margin: 2px 0 0; width: 20px; height: 20px; accent-color: var(--color-blue); flex: none; }
.resp__add { display: flex; gap: 8px; margin-top: 8px; }
.resp__row { display: flex; align-items: flex-start; }
.resp__row > label { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.resp__editbtn { flex: none; padding: 0 14px 0 4px; font-size: 13px; }
.resp__edit { padding: 12px 14px; background: var(--color-p-50); }
.resp__edit .inp { min-height: 84px; }
.resp__addbox { margin-top: 8px; border-radius: var(--r-lg); }
#app .fld > .rolerow[style] { padding: 4px 14px; min-height: 44px; }
#app .fld > .rolerow[style] .link { min-height: 36px; }
.resp__edit-acts { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
.more { margin-top: 22px; border-top: 1px solid var(--color-line); padding-top: 12px; }
.more__btn { display: flex; align-items: center; justify-content: space-between; width: 100%; font-weight: 600; font-size: 14px; color: var(--color-ink); min-height: 40px; padding: 2px 0; text-align: left; }
.more__btn small { font-weight: 400; color: var(--color-ink-5); font-size: 13px; margin-left: 6px; }
.more__body { padding-top: 12px; }
.more__h { display: block; min-height: 40px; line-height: 36px; margin: 0; padding: 2px 0; font-weight: 600; font-size: 14px; color: var(--color-ink); }
.more__h small { font-weight: 400; color: var(--color-ink-5); font-size: 13px; margin-left: 6px; }
.note.info.ai { box-shadow: inset 0 0 0 1px var(--color-nudge-line); color: var(--color-ink-2); }
.note.ai b { color: var(--color-ink); }
.note.ai .ic { color: var(--color-blue); }
.campus { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--r-lg); background: var(--color-paper); box-shadow: inset 0 0 0 1px var(--color-line); font-size: 14px; }
.campus .ic { color: var(--color-blue); }
.campus__tx { flex: 1; min-width: 0; }
.campus__tx b { display: block; font-weight: 600; color: var(--color-ink); }
.campus__tx span { color: var(--color-ink-3); font-size: 13px; }
.miss:focus { outline: none; }
.miss { border-radius: var(--r-lg); background: var(--color-rv-danger-tint); padding: 12px 16px; margin-bottom: 18px; }
.miss b { display: flex; align-items: center; gap: 6px; color: var(--color-rv-danger); font-size: 14px; }
.miss ul { margin: 6px 0 0; padding-left: 22px; color: var(--color-rv-danger); display: grid; gap: 4px; }
.miss li { display: list-item; }
.miss .btn-p { color: var(--color-paper); text-decoration: none; }
.miss .btn-l { color: var(--color-ink); text-decoration: none; }
.miss button { text-decoration: underline; text-underline-offset: 2px; color: var(--color-rv-danger); font-size: 14px; text-align: left; min-height: 28px; }
.miss .btn { text-decoration: none; margin-top: 8px; }
.note { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-lg); background: var(--color-warn-bg); color: var(--color-warn); font-size: 13px; margin-bottom: 18px; }
.note.info { background: var(--color-callout-bg); color: var(--color-p-600); }
.note.ok { background: var(--color-ok-bg); color: var(--color-ok); }
.note b { font-weight: 600; }
.note .link { margin-left: auto; flex: none; min-height: 0; }
/* Teacher card */
.jc { border: 1px solid var(--color-line); border-radius: 12px; background: var(--color-paper); box-shadow: var(--sh-2); padding: 16px; }
.jc__top { display: flex; gap: 12px; align-items: flex-start; }
.jc__ic { flex: none; width: 44px; height: 44px; border-radius: 10px; background: var(--color-p-50); color: var(--color-blue); display: flex; align-items: center; justify-content: center; }
.jc__t { margin: 0; font-size: 16px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.jc__t.ph { color: var(--color-light-grey); }
.jc__s { margin: 2px 0 0; display: flex; align-items: center; gap: 4px; font-size: 13px; color: var(--color-ink-3); }
.jc__s .ic { color: var(--color-blue); }
.jc__tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.jc__tags span { padding: 2px 8px; border-radius: var(--r-sm); background: var(--color-p-50); color: var(--color-p-600); font-size: 12px; font-weight: 500; }
.jc__facts { margin: 12px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 13px; color: var(--color-ink-2); }
.jc__facts li { display: flex; align-items: center; gap: 8px; }
.jc__facts .ic { color: var(--color-ink-5); }
.jc__foot { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--color-line); font-size: 12px; color: var(--color-ink-3); }
.jc__foot b { color: var(--color-ink); }
/* Review cards */
.rv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.rvc { min-width: 0; padding: 16px 18px; border: 1px solid var(--color-line); border-radius: var(--r-lg); background: var(--color-paper); box-shadow: var(--sh-1); }
.rvc.wide { grid-column: 1 / -1; }
.rvc.bad { box-shadow: inset 3px 0 0 var(--color-red); }
.rvc__h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
.rvc__t { margin: 0; display: flex; align-items: center; flex-wrap: wrap; gap: 10px; font-size: 16px; font-weight: 700; }
.rvc__n { width: 26px; height: 26px; border-radius: 50%; background: var(--color-p-50); color: var(--color-p-600); font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
.rvc__flag { padding: 1px 8px; border-radius: var(--r-pill); background: var(--color-rv-danger-tint); color: var(--color-rv-danger); font-size: 12px; font-weight: 600; }
.rvc__e { font-weight: 600; color: var(--color-p-600); font-size: 14px; min-height: 40px; padding: 0 6px; }
.rvc__e:hover { text-decoration: underline; }
.rvr { display: grid; grid-template-columns: 124px minmax(0, 1fr); gap: 12px; padding: 4px 0; align-items: baseline; }
.rvr dt { font-size: 13px; color: var(--color-ink-3); }
.rvr dd { margin: 0; font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
.rvr dd.bad { color: var(--color-rv-danger); font-weight: 500; }

dl { margin: 0; }
/* Success */
.done { max-width: 480px; margin: 0 auto; padding: 56px 24px; text-align: center; }
.done__ic { width: 64px; height: 64px; margin: 0 auto; border-radius: 50%; background: var(--color-ok-bg); color: var(--color-ok); display: flex; align-items: center; justify-content: center; }

.done .acts { display: flex; justify-content: center; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
.done .acts2 { display: flex; justify-content: center; gap: 18px; margin-top: 16px; flex-wrap: wrap; }
/* Sticky bottom bar (every flow) */
.bar { position: sticky; bottom: 0; z-index: 6; flex: none; background: var(--color-paper); box-shadow: var(--sh-dock); padding-bottom: var(--safe-b); }
.bar__msg { padding: 10px 24px 0; }

.bar__row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 72px; padding: 0 24px; }
.bar__row .grow { flex: 1; min-width: 0; font-size: 13px; color: var(--color-ink-3); }
.prog { display: grid; gap: 4px; }
.prog span { height: 4px; background: var(--color-line); position: relative; overflow: hidden; }
.prog i { position: absolute; inset: 0 auto 0 0; background: var(--color-blue); transition: width var(--t-2) var(--ease); }
.col { max-width: 640px; margin: 0 auto; padding: 32px 24px 40px; }
.col.wide { max-width: 1040px; }
.eyebrow { margin: 0 0 6px; font-size: 13px; font-weight: 600; color: var(--color-blue); }
.h1 { margin: 0; font-size: 28px; line-height: 1.2; letter-spacing: -0.02em; font-weight: 700; }
.h1:focus { box-shadow: none; }
.help { margin: 8px 0 24px; font-size: 16px; color: var(--color-ink-2); line-height: 1.5; }
.for { display: flex; align-items: center; gap: 8px; margin: 0 0 18px; font-size: 14px; color: var(--color-ink-3); flex-wrap: wrap; }
.for b { color: var(--color-ink); font-weight: 600; }
.lead > .fld:first-child > .fld__l > span:first-child, .lead > .fld:first-child > .fld__l > .req { display: none; }
.lead > .fld:first-child > .fld__l:empty { display: none; }
.rvw__grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 32px; align-items: start; margin-top: 20px; }
.rvw__aside { position: sticky; top: 72px; }
.rvw__cap { margin: 0 0 10px; font-size: 13px; font-weight: 600; color: var(--color-ink-3); }
.col .rv { grid-template-columns: minmax(0, 1fr); }
.qnum { display: flex; align-items: center; gap: 10px; margin: 26px 0 10px; font-size: 15px; font-weight: 600; color: var(--color-ink); }
.qnum span { width: 24px; height: 24px; border-radius: 50%; background: var(--color-p-50); color: var(--color-p-600); font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
.qcs { display: grid; gap: 12px; }
.qc { padding: 14px 18px; border: 1px solid var(--color-line); border-radius: var(--r-lg); background: var(--color-paper); box-shadow: var(--sh-1); }
.qc.bad { border-color: var(--color-rv-danger-tint); box-shadow: inset 3px 0 0 var(--color-red); }
.qc.open { box-shadow: var(--sh-3); }
.qc.need { background: var(--color-mist); border-color: var(--color-less-grey); }
.qc__h { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 4px; }

.qc__b { padding: 8px 0 6px; }
.reveal { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--color-line); }
/* One page folds */
.pg { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 40px; max-width: 1120px; margin: 0 auto; padding: 28px 28px 40px; align-items: start; }
.pg__t { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
.pg__s { margin: 6px 0 20px; color: var(--color-ink-3); font-size: 15px; }
.fold { border-top: 1px solid var(--color-line); }
.fold:last-child { border-bottom: 1px solid var(--color-line); }
.fold__h { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; gap: 14px; align-items: center; width: 100%; padding: 16px 0; text-align: left; min-height: 64px; }
.fold__n { width: 28px; height: 28px; border-radius: 50%; background: var(--color-mist-2); color: var(--color-ink-3); font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.fold.ok .fold__n { background: var(--color-ok-bg); color: var(--color-ok); }
.fold.open .fold__n { background: var(--color-blue); color: var(--color-paper); }
.fold.bad .fold__n { background: var(--color-rv-danger-tint); color: var(--color-rv-danger); }
.fold__t { font-size: 17px; font-weight: 700; color: var(--color-ink); }
.fold__tx { min-width: 0; }
.fold__sum { display: block; margin-top: 2px; font-size: 14px; color: var(--color-ink-3); overflow-wrap: anywhere; }
.fold.bad .fold__sum { color: var(--color-rv-danger); }
.fold__e { font-size: 14px; font-weight: 600; color: var(--color-p-600); }
.fold__b { padding: 2px 0 24px 46px; }
.fold__acts { display: flex; align-items: center; gap: 12px; margin-top: 24px; }
.side { position: sticky; top: 72px; display: grid; gap: 14px; }
.side .rvw__cap { margin: 0; }
.side__n { margin: 0; font-size: 13px; color: var(--color-ink-3); }
.side .btn { width: 100%; }
/* Builder (V4) */
.bl { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 0; min-height: calc(100vh - 56px); }
.bl__form { padding: 24px 32px 40px; max-width: 760px; width: 100%; justify-self: center; }
.bl__aside { border-left: 1px solid var(--color-line); background: var(--color-mist); padding: 24px 24px 40px; }
.bl__stick { position: sticky; top: 72px; display: grid; gap: 14px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--color-line); margin-bottom: 24px; overflow-x: auto; scrollbar-width: none; }
.tab { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 48px; padding: 0 12px; font-weight: 600; font-size: 14px; color: var(--color-ink-3); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tab.on { color: var(--color-p-600); border-bottom-color: var(--color-blue); }

.left { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.left li button { text-align: left; font-size: 14px; color: var(--color-rv-danger); text-decoration: underline; text-underline-offset: 2px; min-height: 28px; }
.left .ok { color: var(--color-ok); font-weight: 600; }
.strip { display: none; }
.sheet { position: fixed; inset: 0; z-index: 40; background: var(--color-scrim); display: flex; align-items: flex-end; }
.sheet__p { background: var(--color-paper); width: 100%; border-radius: 16px 16px 0 0; padding: 16px 16px calc(16px + var(--safe-b)); max-height: 85vh; overflow: auto; }
.sheet__h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-weight: 700; }
/* Start-from (V5) */
.pick { display: grid; gap: 10px; }
.pick__it { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: var(--r-lg); box-shadow: inset 0 0 0 1px var(--color-field-line); text-align: left; min-height: 72px; width: 100%; }
.pick__it:hover { box-shadow: inset 0 0 0 1px var(--color-ink-5); }
.pick__ic { flex: none; width: 40px; height: 40px; border-radius: 10px; background: var(--color-p-50); color: var(--color-blue); display: flex; align-items: center; justify-content: center; }
.pick__tx { min-width: 0; flex: 1; }
.pick__t { display: block; font-weight: 600; font-size: 15px; }
.pick__s { display: block; font-size: 13px; color: var(--color-ink-3); margin-top: 2px; }
.pick__it.blank { box-shadow: inset 0 0 0 1px var(--color-line); background: var(--color-mist); }
.diff { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: var(--r-pill); background: var(--color-warn-bg); color: var(--color-warn); font-size: 12px; font-weight: 600; }

@media (max-width: 1023px) {

}

/* ---------- Guided v2: visible focus ---------- */
#app button:focus-visible, #app .inp:focus-visible, #app [data-h1]:focus-visible { outline: 2px solid var(--color-blue); outline-offset: 2px; }
#app [data-h1]:focus { outline: none; box-shadow: none; }

/* ===== v10: five-step creation layout (preschool-five-step-creation v26: .scol, .s-h1, .s-helper, .row, .sbar, .here-row, .rv-*) ===== */
.col { max-width: 600px; padding: 40px 24px 64px; }
.col.wide { max-width: 1040px; }
.eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; margin: 0 0 4px; }
.h1 { font-size: clamp(26px, 3vw, 32px); line-height: 1.15; font-weight: 600; letter-spacing: -0.03em; }
.help { margin: 10px 0 8px; font-size: 16px; max-width: 56ch; }
/* each question is a row with a hairline under it, not a box */
.col .fld { padding: 20px 0; margin: 0; border-bottom: 1px solid var(--color-line-soft); }
.col .fld + .fld, .col .fld + .grid2, .col .grid2 + .fld { margin-top: 0; }
.col .grid2 > .fld { border-bottom: none; }
.col .grid2 { border-bottom: 1px solid var(--color-line-soft); }
.col .more .fld:last-child, .col .rv-main .fld { border-bottom: none; }
.fld__l { font-size: 16px; margin-bottom: 6px; }
.hint { font-size: 13.5px; font-weight: 500; }
.ctx { margin: 16px 0 4px; }
.rolerow { margin: 0; }
.more { margin: 20px 0 0; }
/* the bar: segments along the top edge, Back as an underlined link, a 48px Next */
.bar .prog { gap: 6px; }
.bar .prog span { height: 6px; }
.bar__row { min-height: 76px; padding: 12px clamp(16px, 4vw, 48px); }
.bar__row .grow { text-align: center; }
.bar__lbl { font-size: 13.5px; font-weight: 500; color: var(--color-ink-3); }
.bar__lbl strong { color: var(--color-ink); }
.bar .btn-p { height: 48px; padding: 0 26px; font-size: 16px; font-weight: 700; }
.ulink { font-size: 16px; }
.ulink:disabled { opacity: .45; cursor: not-allowed; }
/* five-step here-rows for the location */
.here { border: 1px solid var(--color-line); border-radius: var(--r-lg); overflow: hidden; background: var(--color-paper); }
.here-row { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 68px; padding: 12px 16px; text-align: left; color: var(--color-ink); background: var(--color-paper); }
.here-row + .here-row { border-top: 1px solid var(--color-line-soft); }
.here-row:hover:not(:disabled) { background: var(--color-mist); }
.here-row:disabled, .here-row[aria-disabled=true] { cursor: progress; }
#app .here-row:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--color-blue); }
.here-row__ic { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; background: var(--color-p-50); color: var(--color-blue); }
.here-row__txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.here-row__t { font-size: 16px; font-weight: 600; line-height: 1.3; }
.here-row__d { font-size: 13.5px; color: var(--color-ink-3); line-height: 1.35; display: flex; align-items: center; gap: 6px; }
.here-row__go { flex: none; display: inline-flex; color: var(--color-ink-3); }
.here-row:hover .here-row__go { color: var(--color-blue); }
/* review: the preview card on the left, plain sections with hairlines on the right */
.rv-layout { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 56px; align-items: start; margin-top: 24px; }
.rv-aside { position: sticky; top: 72px; }
.rv-sec { padding: 0 0 24px; margin: 0 0 24px; border-bottom: 1px solid var(--color-line); }
.rv-sec:last-child { border-bottom: none; margin-bottom: 0; }
.rv-top { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 6px; }
.rv-top h2 { margin: 0; display: flex; align-items: center; flex-wrap: wrap; gap: 10px; font-size: 22px; font-weight: 600; letter-spacing: -0.02em; }
.rv-sec.bad h2 { color: var(--color-rv-danger); }
.rv-edit { flex: none; min-height: 44px; padding: 0 4px; font-weight: 600; font-size: 14px; color: var(--color-ink); text-decoration: underline; text-underline-offset: 3px; }
.rv-edit:hover { color: var(--color-blue); }
.rv-sec .rvr { grid-template-columns: 170px minmax(0, 1fr); gap: 16px; padding: 6px 0; }
.rv-sec .rvr dt { font-size: 14px; }
.rv-sec .rvr dd { font-weight: 500; }
@media (max-width: 860px) { .rv-layout { grid-template-columns: minmax(0, 1fr); gap: 32px; } .rv-aside { position: static; order: 1; max-width: 420px; } }
@media (max-width: 767px) { .col { padding: 24px 16px 40px; } .help { font-size: 15px; } .bar__lbl { display: none; } .bar .btn-p { padding: 0 20px; } .app__top { position: static; } }
@media (max-width: 520px) { .rv-sec .rvr { grid-template-columns: minmax(0, 1fr); gap: 2px; padding: 8px 0; } }

/* ===== v11: the rest of the five-step page (preschool-five-step-creation v26: .snav, .setup__main, .field with affix, .row spacing) ===== */
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.app__main { background: var(--color-mist); }
.app__top { height: 64px; padding: 0 clamp(16px, 4vw, 60px); background: var(--color-paper); }

.btn-exit { display: inline-flex; align-items: center; height: 40px; padding: 0 16px; border-radius: 999px; background: var(--color-paper); box-shadow: inset 0 0 0 1px var(--color-field-line); font-size: 14px; font-weight: 600; color: var(--color-ink); white-space: nowrap; }
.btn-exit:hover { box-shadow: inset 0 0 0 1px var(--color-ink-3); }
#app .btn-exit:focus-visible { outline: 2px solid var(--color-blue); outline-offset: 2px; }
.col .fld { padding: 24px 0; }
.ctx, .here, .jc { background: var(--color-paper); }
.inp { height: 48px; border-radius: 9px; }
textarea.inp { height: auto; }
/* money: grey affix boxes on both sides, as the five-step +91 and icon fields */
.money { display: flex; align-items: stretch; border: 1px solid var(--color-field-line); border-radius: 9px; background: var(--color-paper); overflow: hidden; }
.money:focus-within { border-color: var(--color-blue); box-shadow: 0 0 0 1px var(--color-blue); }
.money:has(.inp.bad) { border-color: var(--color-red); }
.money .cur, .money .per { position: static; transform: none; display: flex; align-items: center; padding: 0 14px; background: var(--color-mist-2); color: var(--color-ink-2); }
.money .cur { border-right: 1px solid var(--color-field-line); font-size: 16px; }
.money .per { border-left: 1px solid var(--color-field-line); font-size: 14px; }

/* how much of the current step is answered: the five-step bar fills as you go */

  id: 'v1',
