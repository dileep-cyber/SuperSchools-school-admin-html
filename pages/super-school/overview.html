/* v18 - Super CRM line chart. Data format as in MUI X Charts "Lines" (https://mui.com/x/react-charts/lines/#data-format):
   a series.data array of numbers and an xAxis.data array of dates of the same length. y = admissions per day,
   x = date with month and year, 7 days at a time. Daily counts are generated from the Admissions total, so the line
   always adds up to the figure on the card. */
function pctText(p) {
  if (p > 0 && p < 1) return '<1%';
  return Math.round(p) + '%';
}

function hashSeed(text) {
  let h = 2166136261;
  for (let i = 0; i < text.length; i += 1) { h ^= text.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

function seeded(seed) {
  let a = seed;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function apportion(values, target) {
  const sum = values.reduce((a, b) => a + b, 0);
  if (!sum || target <= 0) return values.map(() => 0);
  const ideal = values.map((v) => target * v / sum);
  const out = ideal.map(Math.floor);
  const left = target - out.reduce((a, b) => a + b, 0);
  ideal.map((x, i) => ({ i, f: x - Math.floor(x) })).sort((a, b) => b.f - a.f || a.i - b.i).slice(0, left).forEach((o) => { out[o.i] += 1; });
  return out;
}

function dailySeries(total, key) {
  const series = new Array(SPAN_DAYS).fill(0);
  if (!total || total < 0) return series;
  const recentFrom = SPAN_DAYS - HISTORY_DAYS;
  const needDays = Math.min(total, 2);
  let weights = [];
  let recent = [];
  for (let salt = 0; salt < 60; salt += 1) {
    const rnd = seeded(hashSeed(key + ':' + total + ':' + salt));
    weights = series.map((_, i) => {
      const weekday = (SPAN_START + i + 4) % 7;
      return Math.pow(0.15 + rnd(), 2) * (weekday === 0 || weekday === 6 ? 0.35 : 1);
    });
    recent = apportion(weights.slice(recentFrom), total);
    if (recent.slice(-7).filter((n) => n > 0).length >= needDays) break;
  }
  recent.forEach((n, i) => { series[recentFrom + i] = n; });
  if (!state.initial && recentFrom > 0) {
    const earlier = Math.round(total / HISTORY_DAYS * recentFrom);
    apportion(weights.slice(0, recentFrom), earlier).forEach((n, i) => { series[i] = n; });
  }
  return series;
}

function isFullRange() { return state.range.from === HISTORY_START && state.range.to === TODAY; }

function sumInRange(series) {
  const from = Math.max(dayNum(state.range.from) - SPAN_START, 0);
  const to = Math.min(dayNum(state.range.to) - SPAN_START, SPAN_DAYS - 1);
  let n = 0;
  for (let i = from; i <= to; i += 1) n += series[i];
  return n;
}

function countInRange(total, key) { return sumInRange(dailySeries(total, key)); }

function applyRange(d, type) {
  if (isFullRange()) return d;
  const key = (name) => type + ':' + name;
  d.crm.enquiries = countInRange(d.crm.enquiries, key('enquiries'));
  if (d.crm.visits !== null) d.crm.visits = countInRange(d.crm.visits, key('visits'));
  d.crm.applications = countInRange(d.crm.applications, key('applications'));
  d.crm.admissions = sumInRange(d.crm.daily);
  const counts = apportion(d.hr.statuses.map((s) => s.value), countInRange(d.hr.applications, key('applicants')));
  d.hr.statuses.forEach((s, i) => { s.value = counts[i]; });
  const status = (name) => d.hr.statuses.find((s) => s.name === name).value;
  d.hr.applications = counts.reduce((a, b) => a + b, 0);
  d.hr.shortlisted = status('Shortlisted');
  d.hr.interviews = status('Interview scheduled');
  d.hr.hired = status('Hired');
  const perJob = apportion(d.hr.jobs.map((j) => j.applicants), d.hr.applications);
  d.hr.jobs.forEach((j, i) => { j.applicants = perJob[i]; });
  d.reviews.count = countInRange(d.reviews.count, key('reviews'));
  if (!d.reviews.count) d.reviews.rating = null;
  return d;
}

function niceMax(max) {
  if (max <= 4) return 4;
  for (let mag = 1; ; mag *= 10) {
    for (const step of [1, 2, 5]) {
      if (step * mag * 4 >= max) return step * mag * 4;
    }
  }
}

function weekPages() {
  const from = dayNum(state.range.from);
  const to = dayNum(state.range.to);
  const pages = [];
  let end = to;
  while (end - 6 > from) { pages.push({ start: end - 6, end }); end -= 7; }
  pages.push({ start: from, end: Math.min(from + 6, to) });
  return pages;
}

/* v19 - 2. fixed y axis, evenly spaced ticks; a count is placed between the two ticks around it */
const Y_TICKS = [0, 5, 10, 20, 40, 60, 100];

function yPos(count) {
  const last = Y_TICKS.length - 1;
  const v = Math.max(0, Math.min(count, Y_TICKS[last]));
  let k = 0;
  while (k < last - 1 && v > Y_TICKS[k + 1]) k += 1;
  const part = (v - Y_TICKS[k]) / (Y_TICKS[k + 1] - Y_TICKS[k]);
  return (k + part) / last * 100;
}

function admissionsChartHtml(crm) {
  const pages = weekPages();
  if (state.week >= pages.length) state.week = 0;
  const page = pages[state.week];
  const days = [];
  for (let n = page.start; n <= page.end; n += 1) {
    const i = n - SPAN_START;
    days.push({ ymd: numDay(n), count: i >= 0 && i < SPAN_DAYS ? crm.daily[i] : 0 });
  }
  const rows = Y_TICKS.slice().reverse().map((v) => '<div class="lc-row"><span class="lc-yt">' + fmt(v) + '</span><span class="lc-gl"></span></div>').join('');
  const n = days.length;
  const pts = days.map((x, i) => [(i + 0.5) / n * 100, 100 - yPos(x.count)]);
  const at = (q) => q[0].toFixed(2) + ' ' + q[1].toFixed(2);
  const line = 'M' + pts.map(at).join(' L');
  const area = n > 1 ? '<path class="lc-area" d="' + line + ' L' + pts[n - 1][0].toFixed(2) + ' 100 L' + pts[0][0].toFixed(2) + ' 100 Z" />' : '';
  const dots = pts.map((q, i) => {
    const dot = 'M' + at(q) + ' L' + (q[0] + 0.001).toFixed(3) + ' ' + q[1].toFixed(2);
    return '<g><title>' + esc(COPY.dayCount(fmtFull(days[i].ymd), days[i].count)) + '</title><path class="lc-ring" d="' + dot + '" /><path class="lc-dot" d="' + dot + '" /></g>';
  }).join('');
  const xl = days.map((x) => { const p = dateParts(x.ymd); return '<span class="lc-xl"><b><span>' + p.d + '</span><span>' + MONTHS[p.m] + '</span></b><span>' + p.y + '</span></span>'; }).join('');
  const list = days.map((x) => '<li>' + esc(COPY.dayCount(fmtFull(x.ymd), x.count)) + '</li>').join('');
  const startText = fmtFull(numDay(page.start));
  const endText = fmtFull(numDay(page.end));
  const label = startText + ' &ndash; ' + endText;
  const nav = '<div class="lc-nav"><button type="button" class="lc-btn" data-lc="prev" aria-label="' + esc(COPY.weekPrev) + '"' + (state.week >= pages.length - 1 ? ' disabled' : '') + '>' + icon('chevron-left') + '</button>' +
    '<p class="lc-range">' + label + '</p>' +
    '<button type="button" class="lc-btn" data-lc="next" aria-label="' + esc(COPY.weekNext) + '"' + (state.week === 0 ? ' disabled' : '') + '>' + icon('chevron-right') + '</button></div>';
  return '<div class="lc" role="group" aria-label="' + esc(COPY.chartAria(startText + ' to ' + endText)) + '">' + nav +
    '<div class="lc-plot"><div class="lc-grid" aria-hidden="true">' + rows + '</div><svg class="lc-svg" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">' + area + '<path class="lc-line" d="' + line + '" />' + dots + '</svg></div>' +
    '<div class="lc-x" aria-hidden="true">' + xl + '</div><ul class="sr-only">' + list + '</ul></div>';
}

function stepWeek(dir) {
  const next = state.week + (dir === 'prev' ? 1 : -1);
  if (next < 0 || next >= weekPages().length) return;
  const box = document.getElementById('adm-chart');
  if (!box) return;

/* v26 - 1. Admissions = admissions-v5 V6a-2 (user pick 2026-10-26). All seven steps on the path to admission are
   always in the funnel, each name inside its slice; a step no enquiry has reached yet is a dashed outline. An enquiry
   that stopped (visit cancelled / declined / missed, closed) counts as reaching the step it stopped after - the v17
   rule. Beside the funnel one card: while nobody is admitted, one common message to connect with the interested
   parents; once someone is admitted, the conversion ring with how many were admitted from how many enquiries. */
function admRatePct(r) {
  if (r > 0 && r < 0.1) return '<0.1%';
  const v = Math.round(r * 10) / 10;
  return (Number.isInteger(v) ? String(v) : v.toFixed(1)) + '%';
}

const FUNNEL_PATH = ['new', 'contacted', 'visit-requested', 'visit-scheduled', 'visit-completed', 'application', 'admitted'];
const FUNNEL_DROPS = { 'visit-cancelled': 'visit-scheduled', 'visit-declined': 'visit-requested', 'visit-missed': 'visit-scheduled', closed: 'contacted' };

function funnelReach(d) {
  const by = {};
  (d.stages || []).forEach((s) => { by[s.key] = s; });
  const val = (k) => (by[k] && by[k].value ? by[k].value : 0);
  return FUNNEL_PATH.map((k, i) => {
    let n = FUNNEL_PATH.slice(i).reduce((sum, kk) => sum + val(kk), 0);
    Object.keys(FUNNEL_DROPS).forEach((dk) => { if (FUNNEL_PATH.indexOf(FUNNEL_DROPS[dk]) >= i) n += val(dk); });
    return { key: k, name: by[k] ? by[k].name : COPY.funnelNames[i], n };
  });
}

function admSideHtml(known, e, a) {

/* v18 - Applications conversion staircase. One column per status, tallest first, each with its own colour and the
   share that moved on from the step before. A step counts every applicant who reached it or went further. */
/* v31 - 1. Applications = applications-v3 V1 (user pick 2026-10-27): five chevrons in reading order, each reached step
   with how many applicants got at least that far, a step nobody reached as an outline; under them one message panel -
   interested teachers until someone reaches Interview scheduled, then interviews lined up until someone is hired,
   then the hiring rate. */
function applicationsPipelineHtml(statuses) {
  const known = Array.isArray(statuses) && statuses.every((s) => s.value !== null && s.value !== undefined);
  const counts = known ? statuses.map((s) => s.value) : null;
  const reach = known ? counts.map((_, i) => counts.slice(i).reduce((a, b) => a + b, 0)) : null;
  const total = known ? reach[0] : 0;
  const names = statuses.map((s) => s.name);
  const steps = names.map((n, i) => ({ i, name: n, short: COPY.appsShort[i] || n, reach: known ? reach[i] : null, on: known && reach[i] > 0 }));
  const aria = known ? COPY.appsAria(steps.filter((s) => s.on).map((s) => s.name + ' ' + s.reach), steps.filter((s) => !s.on).map((s) => s.name)) : COPY.appsNa;

    '<li class="v1-chev' + (!known ? ' is-unknown' : s.on ? ' f-' + (s.i + 1) : ' is-off') + '"><span class="v1-name"><span class="nm-full">' + esc(s.name) + '</span><span class="nm-short">' + esc(s.short) + '</span></span></li>').join('') + '</ol>';

  else panel = '<div class="v1-panel"><span class="a3-ic">' + icon('list-checks') + '</span><div class="v1-txt"><p class="a3-t">' + (counts[0] > 0 ? COPY.appsWaiting(counts[0]) : COPY.appsInterested(total)) + '</p><p class="a3-s">' + esc(COPY.appsWaitingWhy) + '</p></div>' + act(COPY.appsReview, 'Super HR - applications') + '</div>';
  return '<div class="v1" data-new="ApplicationsPipeline" data-built-from="variation applications-v3 V1 (picked 2026-10-27)">' + pipe + panel + '</div>';

function calendarHtml() {
  const cal = state.cal;
  const todayP = dateParts(TODAY);
  const minP = dateParts(MIN_DATE);
  const firstNum = dayNum(cal.y + '-' + pad2(cal.m + 1) + '-01');
  const lead = (firstNum + 4) % 7;
  const monthDays = new Date(Date.UTC(cal.y, cal.m + 1, 0)).getUTCDate();
  const cellCount = Math.ceil((lead + monthDays) / 7) * 7;
  const gridStart = firstNum - lead;
  const sel = state.pick ? { from: state.pick, to: state.pick } : state.range;
  const visible = (ymd) => { const n = dayNum(ymd); return n >= gridStart && n < gridStart + cellCount; };
  const anchor = [state.calFocus, state.pick, state.range.from, TODAY].find((y) => y && visible(y) && y >= MIN_DATE && y <= TODAY) || numDay(firstNum);
  let cells = '';
  for (let i = 0; i < cellCount; i += 1) {
    const ymd = numDay(gridStart + i);
    const p = dateParts(ymd);
    const start = ymd === sel.from, end = ymd === sel.to, mid = ymd > sel.from && ymd < sel.to;
    const off = ymd > TODAY || ymd < MIN_DATE;
    cells += '<div class="cal-cell' + (start ? ' is-start' : '') + (end ? ' is-end' : '') + (mid ? ' is-mid' : '') + '">' +
      '<button type="button" class="cal-day' + (start || end ? ' is-sel' : '') + (ymd === TODAY ? ' is-today' : '') + (p.m !== cal.m ? ' is-out' : '') + '" data-rp="day" data-day="' + ymd + '" tabindex="' + (ymd === anchor ? 0 : -1) + '" aria-label="' + esc(fmtLong(ymd)) + '" aria-pressed="' + (start || end) + '"' + (ymd === TODAY ? ' aria-current="date"' : '') + (off ? ' disabled' : '') + '>' + p.d + '</button></div>';
  }
  const monthOpts = MONTHS.map((name, i) => '<option value="' + i + '"' + (i === cal.m ? ' selected' : '') + (cal.y === todayP.y && i > todayP.m ? ' disabled' : '') + '>' + name + '</option>').join('');
  let yearOpts = '';
  for (let y = minP.y; y <= todayP.y; y += 1) yearOpts += '<option value="' + y + '"' + (y === cal.y ? ' selected' : '') + '>' + y + '</option>';
  const atMin = cal.y === minP.y && cal.m === 0;
  const atMax = cal.y === todayP.y && cal.m === todayP.m;
  return '<div class="cal" data-new="Calendar" data-built-from="components/ui/calendar.tsx (school-admin), range mode, dropdown caption">' +
    '<div class="cal-cap"><button type="button" class="cal-nav" data-rp="prev" aria-label="' + esc(COPY.calPrev) + '"' + (atMin ? ' disabled' : '') + '>' + icon('chevron-left') + '</button>' +
    '<div class="cal-dd"><span class="cal-sel"><select class="cal-select" data-rp-select="month" aria-label="' + esc(COPY.calMonth) + '">' + monthOpts + '</select>' + icon('chevron-down') + '</span>' +
    '<span class="cal-sel"><select class="cal-select" data-rp-select="year" aria-label="' + esc(COPY.calYear) + '">' + yearOpts + '</select>' + icon('chevron-down') + '</span></div>' +
    '<button type="button" class="cal-nav" data-rp="next" aria-label="' + esc(COPY.calNext) + '"' + (atMax ? ' disabled' : '') + '>' + icon('chevron-right') + '</button></div>' +
    '<div class="cal-grid">' + WEEKDAYS.map((w) => '<span class="cal-wd" aria-hidden="true">' + w + '</span>').join('') + cells + '</div>' +
    '<p class="cal-hint">' + esc(state.pick ? COPY.rangeHint2 : COPY.rangeHint1) + '</p></div>';
}

function paintRange(focusSels) {
  const box = document.getElementById('range');
  if (!box) return;
  box.innerHTML = rangeInnerHtml();
  [].concat(focusSels || []).some((sel) => {
    const el = box.querySelector(sel);
    if (el) el.focus();
    return Boolean(el);
  });
}

function openRange() {
  if (guardSession()) return;
  const p = dateParts(state.range.to);
  state.rangeOpen = true;
  state.pick = null;
  state.calFocus = null;
  state.cal = { y: p.y, m: p.m };
  paintRange('.cal-day[tabindex="0"]');
}

function closeRange(refocus) {
  state.rangeOpen = false;
  state.pick = null;
  paintRange(refocus ? '#range-trigger' : null);
}

function shiftMonth(delta) {
  const idx = state.cal.y * 12 + state.cal.m + delta;
  const todayP = dateParts(TODAY);
  if (idx < dateParts(MIN_DATE).y * 12 || idx > todayP.y * 12 + todayP.m) return;
  state.cal = { y: Math.floor(idx / 12), m: idx % 12 };
  state.calFocus = null;
  paintRange(['[data-rp="' + (delta < 0 ? 'prev' : 'next') + '"]:not(:disabled)', '.cal-select']);
}

function pickDay(ymd) {
  if (ymd > TODAY || ymd < MIN_DATE) return;
  state.calFocus = ymd;
  if (!state.pick) {
    state.pick = ymd;
    paintRange('[data-day="' + ymd + '"]');
    return;
  }
  const lo = state.pick < ymd ? state.pick : ymd;
  const hi = state.pick < ymd ? ymd : state.pick;
  state.range = { from: lo, to: hi };
  state.week = 0;
  state.pick = null;
  state.rangeOpen = false;
  buildData();
  renderDashboard();
  const trigger = document.getElementById('range-trigger');
  if (trigger) trigger.focus();
}

document.addEventListener('click', (e) => {
  const lc = e.target.closest('[data-lc]');
  if (lc) { if (!guardSession()) stepWeek(lc.dataset.lc); return; }
  if (e.target.closest('#range-trigger')) { if (state.rangeOpen) closeRange(false); else openRange(); return; }
  const rp = e.target.closest('[data-rp]');
  if (rp) {
    if (rp.dataset.rp === 'day') pickDay(rp.dataset.day);
    else shiftMonth(rp.dataset.rp === 'prev' ? -1 : 1);
    return;
  }
  if (state.rangeOpen && !e.target.closest('#range')) closeRange(false);
});

document.addEventListener('change', (e) => {
  const select = e.target.closest('[data-rp-select]');
  if (!select || !state.rangeOpen) return;
  const todayP = dateParts(TODAY);
  const kind = select.dataset.rpSelect;
  const y = kind === 'year' ? Number(select.value) : state.cal.y;
  let m = kind === 'month' ? Number(select.value) : state.cal.m;
  if (y === todayP.y && m > todayP.m) m = todayP.m;
  state.cal = { y, m };
  state.calFocus = null;
  paintRange('[data-rp-select="' + kind + '"]');
});

document.addEventListener('keydown', (e) => {
  if (!state.rangeOpen) return;
  if (e.key === 'Escape') { e.preventDefault(); closeRange(true); return; }
  const day = e.target instanceof Element ? e.target.closest('[data-day]') : null;
  const delta = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -7, ArrowDown: 7 }[e.key];
  if (!day || delta === undefined) return;
  e.preventDefault();
  const ymd = numDay(dayNum(day.dataset.day) + delta);
  if (ymd > TODAY || ymd < MIN_DATE) return;
  const p = dateParts(ymd);
  state.cal = { y: p.y, m: p.m };
  state.calFocus = ymd;
  paintRange('[data-day="' + ymd + '"]');
});

document.addEventListener('focusin', (e) => {
  if (state.rangeOpen && e.target instanceof Element && !e.target.closest('#range')) closeRange(false);
});

function jobsStatusDonutHtml(jobs) {
  const statuses = [
    { key: 'open', name: 'Open' },
    { key: 'closed', name: 'Closed' },
    { key: 'draft', name: 'Draft' },
    { key: 'archived', name: 'Archived' }
  ].map((s) => ({ key: s.key, name: s.name, value: jobs.filter((j) => j.status.toLowerCase() === s.key).length }));
  const total = statuses.reduce((sum, s) => sum + s.value, 0);
  const radius = 52, circumference = 2 * Math.PI * radius;
  let offset = 0;
  const segments = statuses.filter((s) => s.value > 0).map((s) => {
    const length = circumference * s.value / total;
    const drawn = Math.max(length - 2, 0.5);
    const circle = '<circle class="job-donut-segment job-donut-segment--' + s.key + '" cx="70" cy="70" r="' + radius + '" stroke-dasharray="' + drawn.toFixed(2) + ' ' + (circumference - drawn).toFixed(2) + '" stroke-dashoffset="' + (-offset).toFixed(2) + '" transform="rotate(-90 70 70)" />';
    offset += length;
    return circle;
  }).join('');
  const legend = '<ul class="legend">' + statuses.map((s) => '<li><span class="legend-sw job-legend--' + s.key + '" aria-hidden="true"></span><span class="legend-name">' + s.name + '</span><b>' + fmt(s.value) + '</b></li>').join('') + '</ul>';
  const chart = '<div class="donut-wrap jobs-donut-wrap"><div class="donut job-donut" role="img" aria-label="' + esc(statuses.map((s) => s.name + ' ' + s.value).join(', ') + '. ' + total + ' jobs total') + '"><svg viewBox="0 0 140 140" aria-hidden="true"><circle class="job-donut-track" cx="70" cy="70" r="' + radius + '" />' + segments + '</svg><span class="job-donut-mid" aria-hidden="true"><b class="job-donut-total">' + fmt(total) + '</b><span class="job-donut-cap">' + (total === 1 ? 'job' : 'jobs') + '</span></span></div>' + legend + '</div>';
  return chart;
}

function moduleBody(m, d) {
  if (m.body === 'crm') {
    return admissionsFunnelHtml(d);
  }
  if (m.body === 'jobs') {
    const promo = true;
    return '<p class="sub-title">' + esc(COPY.jobsListTitle) + '</p><div class="jobs-area' + (promo ? ' has-promo' : '') + '">' + jobListHtml(d.jobs) + (promo ? jobsPromoHtml(d.jobs) : '') + '</div>';
  }
  if (m.body === 'apps') {
    return applicationsPipelineHtml(d.statuses);
  }
  if (m.body === 'staff') {
    const total = d.total || 0;
    const signed = Math.min(d.signedUp || 0, total);
    const invited = Math.min(d.invited || 0, Math.max(0, total - signed));
    const notInvited = Math.max(0, total - signed - invited);
    const statuses = [
      { value: signed, cls: 'signed', label: 'signed up' },
      { value: invited, cls: 'invited', label: 'invited, waiting' },
      { value: notInvited, cls: 'not-invited', label: 'not invited yet' }
    ];
    let offset = 0;
    const arcs = statuses.filter((x) => x.value > 0).map((x) => {
      const length = x.value / (total || 1) * 100;
      const arc = '<path class="staff-gauge-segment staff-gauge-segment--' + x.cls + '" d="M 22 130 A 108 108 0 0 1 238 130" pathLength="100" stroke-width="24" stroke-dasharray="' + Math.max(0, length - 0.8).toFixed(2) + ' 100" stroke-dashoffset="' + (-offset).toFixed(2) + '" />';
      offset += length;
      return arc;
    }).join('');
    const gauge = '<div class="staff-gauge"><div class="staff-gauge-graphic" role="img" aria-label="' + esc(total + ' staff: ' + signed + ' signed up, ' + invited + ' invited, ' + notInvited + ' not invited') + '"><svg viewBox="0 0 260 142" aria-hidden="true"><path class="staff-gauge-track" d="M 22 130 A 108 108 0 0 1 238 130" stroke-width="24" />' + arcs + '</svg><div class="staff-gauge-mid" aria-hidden="true"><b>' + (total ? Math.round(signed / total * 100) : 0) + '%</b><span>signed up</span></div></div><p class="staff-gauge-line"><b>' + fmt(signed) + '</b> of <b>' + fmt(total) + '</b> ' + (total === 1 ? 'staff member' : 'staff') + ' signed up<br><span class="staff-gauge-dot staff-gauge-dot--invited"></span><b>' + fmt(invited) + '</b> invited, waiting <span class="staff-gauge-dot staff-gauge-dot--not-invited"></span><b>' + fmt(notInvited) + '</b> not invited yet</p></div>';
    const pending = invited + notInvited;
    const k = total <= 1 ? 'start' : pending > 0 ? 'pending' : 'done';
    const msg = COPY.staffCard[k];
    const side = '<div class="f5-side is-act staff-side" data-new="StaffPromptCard" data-built-from="v26 Admissions side card"><span class="f5-ic">' + icon(k === 'pending' ? 'send' : 'user-plus') + '</span>' +
      '<div class="f5-txt"><p class="f5-t">' + (k === 'pending' ? msg.title(pending) : esc(msg.title)) + '</p><p class="f5-s">' + esc(msg.sub) + '</p></div>' +
      '<button type="button" class="btn btn-claim f5-btn" data-component="Button" data-variant="claim" data-source="components/ui/Button.tsx" data-goes-to="' + esc(msg.dest) + '">' + esc(msg.btn) + icon('arrow-right') + '</button></div>';
    return '<div class="staff-split">' + gauge + side + '</div>';
  }
  if (m.body === 'reviews') {
    const hasRating = d.rating !== null && d.rating !== undefined;
    const seal = hasRating
      ? '<span class="vc-num w1-n">' + d.rating + '</span>' + starsHtml(d.rating) + '<span class="w1-of">' + esc(COPY.outOf5Sub) + '</span>'
      : '<p class="kpi-value is-missing">' + esc(COPY.missing) + '</p>';
    return '<div class="w1" data-new="ReviewOverview" data-built-from="6-variations/rating-v2.html V1 Seal, picked by the user for v22">' +
      '<div class="w1-seal" role="group" aria-label="' + esc(COPY.ratingLabel) + '">' + seal + '</div>' +
      '<div class="w1-side"><p class="kpi-label">' + esc(COPY.reviewersLabel) + '</p><span class="vc-num w1-cn">' + fmt(d.count) + '</span><p class="vc-sub">' + esc(COPY.reviewersSub(d.count)) + '</p></div></div>';
  }
  return '<p class="sub-title">' + esc(COPY.platformsTitle) + '</p><div data-new="PlatformColumns" data-built-from="variation posts-v1 V9">' + columnsHtml(d.platforms, (r) => platformIcon(r.key) + '<span>' + esc(r.name) + '</span>') + '</div>' +
    '';
}

function socialLinked(d) {

}

function socialColsHtml(d, linked) {
  const order = ['superschools', 'facebook', 'instagram', 'google'];
  const rows = order.map((k) => d.platforms.find((p) => p.key === k));
  const max = Math.max(0, ...rows.filter((r) => linked.includes(r.key)).map((r) => r.value));

    ? '<div class="colw is-on"><span class="col-val">' + fmt(r.value) + '</span><div class="col-bar col-bar--' + esc(r.key) + '" data-h="' + (max ? r.value / max * 100 : 0) + '"></div><span class="sr-only">' + esc(COPY.socialColAria(r.name, r.value)) + '</span></div>'
    : '<div class="colw is-off"><span class="soc-ghost"><button type="button" class="soc-ghost-btn" data-goes-to="Super Social - link ' + esc(r.name) + '" aria-label="' + esc(COPY.socialLinkAria(r.name)) + '">' + icon('plus') + esc(COPY.socialLink) + '</button></span></div>').join('') + '</div>' +
    '<div class="col-labels" aria-hidden="true">' + rows.map((r) => '<span class="col-label' + (linked.includes(r.key) ? ' is-on' : ' is-off') + '">' + platformIcon(r.key) + '<span>' + esc(r.name).replace('SuperSchools', 'Super<wbr>Schools') + '</span>' + (linked.includes(r.key) ? '' : '<span class="soc-off">' + esc(COPY.notLinked) + '</span>') + '</span>').join('') + '</div>';
}

function asLoading(html) {
  return html.replace('<article class="card ', '<article aria-hidden="true" class="is-loading card ').replace(/ data-state="[a-z]+"/, ' data-state="loading"');
}

function moduleCardHtml(type, m, forced) {
  const attrs = ' data-new="ModuleSummaryCard" data-built-from="ClaimFormCard#surface, ClaimNotice#icon-tile, KPI cell, EmptyState, Button" data-step="S5" data-module="' + m.key + '"';
  if (forced === 'loading') return asLoading(moduleCardHtml(type, m, null));
  const head = '<div class="mcard-head"><span class="icon-tile" data-reused-from="components/features/Claim/flow/ClaimNotice.tsx#icon-tile">' + icon(m.icon) + '</span>' +
    '<div class="mcard-names"><p class="mcard-eyebrow">' + esc(m.eyebrow) + '</p><h3 class="mcard-name">' + esc(m.name) + '</h3></div>' +
    '</div>';
  const foot = m.actions.length ? '<div class="mcard-foot"><div class="mcard-foot-inner is-button">' + m.actions.map(actionBtn).join('') + '</div></div>' : '';
  if (forced === 'error' || state.cardErrors.has(m.key)) {
    return '<article class="card mcard ' + (m.cls || '') + '"' + attrs + ' data-state="error">' + head + cardErrorHtml(m.key) + foot + '</article>';
  }
  if (m.key === 'community') return communityCardHtml(m, attrs, head);
  if (m.key === 'gallery') return socialCardHtml(type, m, attrs, head);
  const d = state.data[type][m.data || m.key];
  const kpiVals = m.kpis.map((k) => d[k[0]]).filter((v) => v !== null && v !== undefined);
  const isEmpty = forced === 'empty' || (kpiVals.length > 0 && kpiVals.every((v) => v === 0));
  if (isEmpty) {
    return '<article class="card mcard ' + (m.cls || '') + '"' + attrs + ' data-state="empty">' + head + emptyHtml(m.icon, m.empty[0], m.empty[1]) + foot + '</article>';
  }
  return '<article class="card mcard ' + (m.cls || '') + '"' + attrs + ' data-state="default">' + head + '<div class="mcard-body">' + moduleBody(m, d) + '</div>' + foot + '</article>';
}

function modulesHtml(type, loading) {
  const forced = loading ? 'loading' : (state.force && state.force.step === 'S5' ? state.force.state : null);
  return '<section data-step="S5" data-state="' + (forced || 'default') + '" aria-label="Module summaries"><div class="mgrid">' +
    MODULES.map((m) => moduleCardHtml(type, m, forced)).join('') + '</div></section>';
}

/* ---------- S1 whole page ---------- */
/* v23 - 1. the jobs list is always tall enough for its first 5 jobs (measured, so a name that wraps still fits);
   only a 6th job makes it scroll */
const JOBS_VISIBLE = 4;
function fitJobList(el) {
  const rows = el.querySelectorAll('.jrow');
  if (!rows.length) return;
  const n = Math.min(JOBS_VISIBLE, rows.length);
  const last = rows[n - 1];
  const fullRow = rows.length > 1 ? rows[1].getBoundingClientRect().height + (rows[1] === rows[rows.length - 1] ? 1 : 0) : rows[0].getBoundingClientRect().height + 9;
  const lastBorder = last === rows[rows.length - 1] ? 1 : 0;
  const h = last.getBoundingClientRect().bottom - el.getBoundingClientRect().top + el.scrollTop + lastBorder + (JOBS_VISIBLE - n) * fullRow;
  el.style.setProperty('--jlist-fit', Math.ceil(h) + 'px');
  if (el.parentElement && el.parentElement.classList.contains('jobs-area')) el.parentElement.style.setProperty('--jobs-fit', Math.ceil(h) + 'px');
}
window.addEventListener('resize', () => document.querySelectorAll('.jlist').forEach(fitJobList));

function paintDynamic(root) {
  root.querySelectorAll('.progress-ind[data-value]').forEach((el) => {
    el.style.transform = 'translateX(-' + (100 - Number(el.dataset.value)) + '%)';
  });
  root.querySelectorAll('[data-w]').forEach((el) => { el.style.width = el.dataset.w + '%'; });
  root.querySelectorAll('.jlist').forEach(fitJobList);
  root.querySelectorAll('[data-clip]').forEach((el) => { el.style.clipPath = 'inset(0 ' + (100 - Number(el.dataset.clip)) + '% 0 0)'; });
  root.querySelectorAll('[data-h]').forEach((el) => { el.style.height = el.dataset.h + '%'; });
  root.querySelectorAll('[data-left]').forEach((el) => { el.style.left = el.dataset.left + '%'; });
}


function renderDashboard(opts) {
  const page = document.getElementById('page');
  const type = currentType();
  state.type = type;
  const fullLoading = opts && opts.fullLoading;
  const partLoading = opts && opts.partLoading;
  const forcedAll = state.force && state.force.state === 'loading' && !state.force.step;
  if (state.force && state.force.step === 'S11') state.pageError = true;
  if (state.pageError && !fullLoading) { renderPageError(); return; }
  const loading = fullLoading || forcedAll;
  page.setAttribute('aria-busy', loading || partLoading ? 'true' : 'false');
  page.innerHTML =
    (loading ? '<p class="sr-only" role="status">' + esc(COPY.loadingSr) + '</p>' : '') +
    headerHtml() +
    progressHtml(type, loading || partLoading) +
    modulesHtml(type, loading || partLoading);
  paintDynamic(page);
  renderDemo();
}

function demoStage() {
  const card = document.querySelector('[data-module="gallery"]');
  if (card && card.dataset.socialStage) return card.dataset.socialStage;
  const g = state.data[state.type] && state.data[state.type].gallery;
  return state.social || (g && g.posts > 0 ? 'all' : 'superschools');
}

function renderDemo() {
  const box = document.getElementById('demo');
  if (!box) return; /* prototype-only state panel removed in the console build */
  const c = COPY.demo, cur = demoStage();

    '<fieldset class="demo-body"><legend class="demo-legend">' + esc(c.pageLegend) + '</legend>' +
    c.pages.map((s) => '<label class="demo-opt"><input type="radio" name="demo-page" value="' + s[0] + '"' + ((s[0] === 'initial') === state.initial ? ' checked' : '') + '>' + esc(s[1]) + '</label>').join('') + '</fieldset>' +
    '<fieldset class="demo-body"><legend class="demo-legend">' + esc(c.legend) + '</legend>' +
    c.stages.map((s) => '<label class="demo-opt"><input type="radio" name="demo-social" value="' + s[0] + '"' + (s[0] === cur ? ' checked' : '') + '>' + esc(s[1]) + '</label>').join('') +
    '<p class="demo-note">' + esc(c.note) + '</p></fieldset></details>';

document.addEventListener('change', (e) => {
  if (e.target.name !== 'demo-page') return;
  state.initial = e.target.value === 'initial';
  state.social = state.initial ? 'superschools' : null;
  const u = new URL(location.href);
  if (state.initial) { u.searchParams.set('demo', 'initial'); u.searchParams.set('social', 'superschools'); }
  else { u.searchParams.delete('demo'); u.searchParams.delete('social'); }
  history.replaceState(history.state, '', u.href);
  loadData();
  if (document.querySelector('[data-module="gallery"]')) renderDashboard();
});

document.addEventListener('change', (e) => {
  if (e.target.name !== 'demo-social') return;
  state.social = e.target.value;
  const u = new URL(location.href);
  u.searchParams.set('social', state.social);
  history.replaceState(history.state, '', u.href);
  if (document.querySelector('[data-module="gallery"]')) renderDashboard();
});

function renderPageError() {
  const page = document.getElementById('page');
  page.setAttribute('aria-busy', 'false');
  page.innerHTML = '<section data-step="S11" data-state="error" role="alert">' +
    '<div class="fcard fcard--error" data-component="ClaimFormCard" data-source="components/features/Claim/flow/ClaimFormCard.tsx">' +
    '<div class="fcard-icon">' + icon('circle-alert') + '</div>' +
    '<div class="fcard-head"><h1 class="fcard-title" id="page-heading" tabindex="-1">' + esc(COPY.pageErrorTitle) + '</h1><p class="fcard-sub">' + esc(COPY.pageErrorBody) + '</p></div>' +
    '<div class="fcard-actions"><button type="button" class="btn btn-claim btn-size-try" data-component="Button" data-variant="claim" data-source="components/ui/Button.tsx" data-action="retry-page">' + esc(COPY.tryAgain) + '</button></div>' +
    '</div></section>';
}

/* ---------- Destinations S6-S10, N1 ---------- */
function placeholderHtml(step, gallery) {
  const type = currentType();
  const rows = [{ key: COPY.placeholderKeys.school, value: state.school.name }, { key: COPY.placeholderKeys.type, value: COPY.typeLabels[type] }];
  if (gallery) rows.push({ key: COPY.placeholderKeys.opensAt, value: COPY.galleryAt });
  return '<section data-step="' + step + '" data-state="default">' +
    '<div class="fcard" data-component="ClaimFormCard" data-source="components/features/Claim/flow/ClaimFormCard.tsx">' +
    '<span class="eyebrow" data-component="SectionEyebrow" data-source="components/common/SectionEyebrow.tsx">' + esc(COPY.placeholder) + '</span>' +
    '<div class="fcard-head"><h1 class="fcard-title" id="page-heading" tabindex="-1">' + esc(COPY.destTitles[step]) + '</h1><p class="fcard-sub">' + esc(COPY.placeholderBody) + '</p></div>' +
    refTableHtml(rows, true) +
    '<div class="fcard-actions"><button type="button" class="btn btn-ghost btn-size-try" data-component="Button" data-variant="claim-ghost" data-source="components/ui/Button.tsx" data-action="back">' + esc(COPY.back) + '</button></div>' +
    '</div></section>';
}

function signInHtml(ended) {
  return '<section data-step="S10" data-state="default">' +
    '<div class="fcard" data-component="ClaimFormCard" data-source="components/features/Claim/flow/ClaimFormCard.tsx">' +
    '<span class="eyebrow" data-component="SectionEyebrow" data-source="components/common/SectionEyebrow.tsx">' + esc(COPY.placeholder) + '</span>' +
    '<div class="fcard-head"><h1 class="fcard-title" id="page-heading" tabindex="-1">' + esc(COPY.signInTitle) + '</h1><p class="fcard-sub">' + esc(ended ? COPY.signInBodyN3 : COPY.signInBodyN2) + '</p></div>' +
    '<div class="fcard-actions"><button type="button" class="btn btn-claim btn-size-try" data-component="Button" data-variant="claim" data-source="components/ui/Button.tsx" data-action="sign-in">' + esc(COPY.signIn) + '</button></div>' +
    '</div></section>';
}

function n1Html() {
  return '<section data-path="N1" data-state="default">' +
    '<div class="fcard" data-component="ClaimFormCard" data-source="components/features/Claim/flow/ClaimFormCard.tsx">' +
    '<span class="eyebrow" data-component="SectionEyebrow" data-source="components/common/SectionEyebrow.tsx">' + esc(COPY.placeholder) + '</span>' +
    '<div class="fcard-head"><h1 class="fcard-title" id="page-heading" tabindex="-1">' + esc(COPY.n1Title) + '</h1><p class="fcard-sub">' + esc(COPY.n1Body) + '</p></div>' +
    '</div></section>';
}

/* ---------- Router ---------- */
function stepFromHash() {
  const h = location.hash.replace('#', '');
  const base = h.split('-')[0];
  return { step: STEP_HASHES.includes(base) ? base : 'S1', gallery: h === 'S8-gallery', ended: h === 'S10-ended' };
}

function focusHeading() {
  const hd = document.getElementById('page-heading');
  if (hd) hd.focus({ preventScroll: true });
  document.getElementById('content').scrollTop = 0;
}

function route(opts) {
  const page = document.getElementById('page');
  const { step, gallery, ended } = stepFromHash();
  if (state.role === 'other') { page.innerHTML = n1Html(); focusHeading(); return; }
  if (state.signedOut && step !== 'S10') { location.replace('#S10'); return; }
  if (step === 'S10') { page.innerHTML = signInHtml(ended); focusHeading(); return; }
  if (step === 'S1') {
    const back = opts && opts.fromPop && state.leftForDetails;
    if (back) {
      const t = state.leftForDetails;
      state.detailsBoost[t] = (state.detailsBoost[t] || 0) + 5;
      state.leftForDetails = null;
    }
    renderDashboard(opts && opts.initial ? { fullLoading: true } : null);
    if (opts && opts.initial) {
      later(600, () => { renderDashboard(); });
    } else if (opts && opts.fromPop) {
      focusHeading();
    }
    return;
  }
  page.innerHTML = placeholderHtml(step, gallery);
  focusHeading();
}

function later(ms, fn) { const id = setTimeout(fn, ms); state.timers.push(id); return id; }

function go(hash, extra) {
  const type = currentType();
  history.replaceState(Object.assign({}, history.state, { type }), '', location.href);
  history.pushState(Object.assign({ type, from: 'S1' }, extra || {}), '', '#' + hash);
  route();
}

function schoolCity(s) {
  const last = s.address.split(',').pop().trim();
  return last.replace(/\s*\d{6}$/, '');
}

/* The school switcher lives in the console shell's top header (components/HeaderControls). */
function renderSwitcher() {
  if (!window.SSHeader) return;
  const s = state.school;
  /* the prototype's "Demo states" (whole page: this school's data / initial first-visit state, and which social accounts are linked) live in the header too */
  const dm = COPY.demo;
  window.SSHeader.set([{
    id: 'school', label: COPY.swHead, icon: 'school', value: s.id,
    options: FIXTURES.schools.map((x) => ({ value: x.id, label: x.name, sub: schoolCity(x) + ' · ' + Object.keys(x.types).map((k) => FIXTURES.typeLabels[k]).join(', ') }))
  }, {
    id: 'demo', label: dm.title, title: 'States', icon: 'tune', prefix: 'Demo',
    groups: [
      { key: 'page', title: dm.pageLegend, value: state.initial ? 'initial' : 'normal', options: dm.pages.map((o) => ({ value: o[0], label: o[1] })) },
      { key: 'social', title: dm.legend, value: demoStage(), options: dm.stages.map((o) => ({ value: o[0], label: o[1] })) }
    ]
  }]);
}
if (window.SSHeader) {
  window.SSHeader.on('school', (id) => switchSchool(id));
  window.SSHeader.on('demo', (v, g) => {
    const u = new URL(location.href);
    if (g === 'page') {
      state.initial = v === 'initial';
      state.social = state.initial ? 'superschools' : null;
      if (state.initial) { u.searchParams.set('demo', 'initial'); u.searchParams.set('social', 'superschools'); }
      else { u.searchParams.delete('demo'); u.searchParams.delete('social'); }
      history.replaceState(history.state, '', u.href);
      loadData();
    } else if (g === 'social') {
      state.social = v;
      u.searchParams.set('social', v);
      history.replaceState(history.state, '', u.href);
    }
    if (document.querySelector('[data-module="gallery"]')) renderDashboard();
    renderSwitcher();
  });
}

/* Buttons on the dashboard open their module in the console (the shell swaps the content frame). */
function goesToTarget(g) {
  g = String(g || '');
  if (g === 'S6') return ['onboarding', 'setup'];                       /* claim badge -> the 5-step school setup */
  if (g === 'S8' || g === 'S8-gallery') return ['school', 'school'];   /* school details -> My School */
  if (/^S9/.test(g)) return ['school', 'mystaff'];                      /* staff cards -> My Staff */
  if (/^Super CRM/.test(g)) return ['admissions', 'enquiries'];
  if (/^Super HR - post/.test(g)) return ['jobs', 'post'];
  if (/^Super HR - (applications|interviews)/.test(g)) return ['jobs', 'applications'];
  if (/^(Super HR - jobs|Edit job)/.test(g)) return ['jobs', 'jobs'];
  if (/^Reviews/.test(g)) return ['school', 'reviews'];
  if (/^Super Social/.test(g)) return ['social', 'social'];
  if (/^Super Community/.test(g)) return ['community', 'community'];
  return null;
}
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-goes-to]');
  if (!b) return;
  const to = goesToTarget(b.getAttribute('data-goes-to'));
  if (!to) return;
  e.preventDefault(); e.stopPropagation();
  try { window.parent.postMessage({ type: 'ss-navigate', module: to[0], section: to[1] }, '*'); } catch (err) {}
  if (window.parent === window) showToast('Opens ' + to[0] + ' / ' + to[1]);
}, true);

function swOpen(open, focusTrigger) {
  const trig = document.getElementById('sw-trigger'), menu = document.getElementById('sw-menu');
  if (!trig) return;
  menu.hidden = !open;
  trig.setAttribute('aria-expanded', String(open));
  if (open) (menu.querySelector('[aria-selected="true"]') || menu.querySelector('.sw-opt')).focus();
  else if (focusTrigger) trig.focus();
}

document.addEventListener('click', (e) => {
  const trig = e.target.closest('#sw-trigger');
  if (trig) { swOpen(trig.getAttribute('aria-expanded') !== 'true'); return; }
  const opt = e.target.closest('.sw-opt');
  if (opt) {
    swOpen(false, true);
    if (guardSession()) return;
    if (location.hash && location.hash !== '#S1') go('S1');
    switchSchool(opt.dataset.school);
    document.getElementById('sw-trigger').focus();
    return;
  }
  if (!e.target.closest('#sw-menu')) swOpen(false);
  const ttrig = e.target.closest('#tsel-trigger');
  if (ttrig) { tselOpen(ttrig.getAttribute('aria-expanded') !== 'true'); return; }
  const topt = e.target.closest('.tsel-opt');
  if (topt) {
    tselOpen(false);
    if (guardSession()) return;
    switchType(topt.dataset.type);
    const back = document.getElementById('tsel-trigger');
    if (back) back.focus();
    return;
  }
  if (!e.target.closest('#tsel-menu')) tselOpen(false);
});

function tselOpen(open) {
  const trig = document.getElementById('tsel-trigger'), menu = document.getElementById('tsel-menu');
  if (!trig || !menu) return;
  menu.hidden = !open;
  trig.setAttribute('aria-expanded', String(open));
  if (open) (menu.querySelector('[aria-selected="true"]') || menu.querySelector('.tsel-opt')).focus();
}

document.addEventListener('keydown', (e) => {
  const menu = document.getElementById('tsel-menu');
  if (!menu || menu.hidden || !menu.contains(document.activeElement)) return;
  const items = [...menu.querySelectorAll('.tsel-opt')];
  const i = items.indexOf(document.activeElement);
  if (e.key === 'ArrowDown') { e.preventDefault(); (items[i + 1] || items[0]).focus(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); (items[i - 1] || items[items.length - 1]).focus(); }
  else if (e.key === 'Home') { e.preventDefault(); items[0].focus(); }
  else if (e.key === 'End') { e.preventDefault(); items[items.length - 1].focus(); }
  else if (e.key === 'Escape') { e.preventDefault(); tselOpen(false); document.getElementById('tsel-trigger').focus(); }
  else if (e.key === 'Tab') tselOpen(false);
});

function switchSchool(id) {
  const school = FIXTURES.schools.find((s) => s.id === id);
  if (!school || school === state.school) return;
  state.school = school;
  try { localStorage.setItem('ssSchool', school.id); } catch (e) {}
  state.types = FIXTURES.orderOfTypes.filter((t) => school.types[t]);
  state.defaultType = state.types[0];
  state.type = state.types[0];
  state.week = 0;
  state.data = {};
  loadData();
  const url = new URL(location.href);
  url.searchParams.set('school', id);
  url.searchParams.delete('type');
  history.replaceState(Object.assign({}, history.state, { type: state.type }), '', url.href);
  renderSwitcher();
  renderDashboard({ partLoading: true });
  later(400, () => {
    renderDashboard();
  });
}

document.addEventListener('keydown', (e) => {
  const menu = document.getElementById('sw-menu');
  if (!menu || menu.hidden || !menu.contains(document.activeElement)) return;
  const items = [...menu.querySelectorAll('button')];
  const i = items.indexOf(document.activeElement);
  if (e.key === 'ArrowDown') { e.preventDefault(); (items[i + 1] || items[0]).focus(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); (items[i - 1] || items[items.length - 1]).focus(); }
  else if (e.key === 'Home') { e.preventDefault(); items[0].focus(); }
  else if (e.key === 'End') { e.preventDefault(); items[items.length - 1].focus(); }
  else if (e.key === 'Escape') { e.preventDefault(); swOpen(false, true); }
  else if (e.key === 'Tab') swOpen(false);
});

function switchType(t) {
  if (t === state.type) return;
  state.type = t;
  history.replaceState(Object.assign({}, history.state, { type: t }), '', location.href);
  renderSwitcher();
  renderDashboard({ partLoading: true });
  later(400, () => {
    renderDashboard();
  });
}

function guardSession() {
  if (!state.sessionEnded) return false;
  state.sessionEnded = false;
  history.pushState({ type: currentType(), from: 'S1' }, '', '#S10-ended');
  route();
  return true;
}

document.addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn) return;
  const action = btn.dataset.action;
  if (!action) return;
  if (action === 'go-dashboard') { if (location.hash && location.hash !== '#S1' && state.role !== 'other') go('S1'); return; }
  if (action === 'sign-in') { state.signedOut = false; history.replaceState({ type: currentType() }, '', '#S1'); route({ initial: true }); return; }
  if (action === 'back') {
    if (history.state && history.state.from === 'S1') history.back();
    else { history.replaceState({ type: currentType() }, '', '#S1'); route({ fromPop: true }); }
    return;
  }
  if (action === 'retry-page') { state.pageError = false; if (state.force && state.force.step === 'S11') state.force = null; route({ initial: true }); return; }
  if (guardSession()) return;
  if (action === 'retry') {
    const id = btn.dataset.card;
    state.cardErrors.delete(id);
    if (state.force) state.force = null;
    renderDashboard({ partLoading: true });
    later(400, () => renderDashboard());
    return;
  }
  if (action === 'toast') { showToast(COPY.toast(btn.dataset.toast)); return; }
  if (action === 'open') {
    const dest = btn.dataset.dest;
    if (dest === 'S8') state.leftForDetails = currentType();
    go(dest === 'S8' && btn.dataset.gallery ? 'S8-gallery' : dest);
    return;
  }
});

window.addEventListener('popstate', () => route({ fromPop: true }));

readQuery();
renderShell();
history.replaceState({ type: state.defaultType }, '', location.href);
route({ initial: !location.hash || location.hash === '#S1' });
renderSwitcher();
window.addEventListener('popstate', renderSwitcher);
</script>
<script src="../../components/RouteLoader.js"></script>
</body>
