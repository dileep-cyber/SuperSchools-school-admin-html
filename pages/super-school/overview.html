.stars-top svg { color: var(--color-p-500); fill: var(--color-p-500); }
.stars-num { font-size: 28px; line-height: 1.1; font-weight: 700; color: var(--color-ink); }
.rating-sub { margin-top: 4px; font-size: 13px; line-height: 1.5; color: var(--color-ink-3); }
.cats { display: flex; flex-direction: column; gap: 12px; }
.cat-row { display: grid; grid-template-columns: 104px minmax(0, 1fr) 32px; align-items: center; gap: 12px; }
@media (max-width: 560px) { .cat-row { grid-template-columns: 92px minmax(0, 1fr) 30px; gap: 10px; } }
.cat-name { font-size: 13px; font-weight: 600; color: var(--color-ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cat-track { display: block; height: 10px; border-radius: var(--r-pill); background: var(--color-p-100); overflow: hidden; }
.cat-fill { display: block; height: 100%; width: 0; border-radius: var(--r-pill); background: var(--color-p-500); }

.mcard-foot-inner.is-button { margin-left: 0; }

/* EmptyState - common/EmptyState.tsx, retokened */
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 20px 0; text-align: center; }
.empty-icon { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; color: var(--color-ink-3); }
.empty-icon svg { width: 28px; height: 28px; }
.empty-title { font-size: 16px; font-weight: 500; color: var(--color-ink-2); }
.empty-sub { font-size: 14px; color: var(--color-ink-3); }

/* Card error (N5) */
.cerr { margin-top: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.cerr > svg { width: 20px; height: 20px; color: var(--color-red); }
.cerr-text { font-size: 13.5px; line-height: 1.55; color: var(--color-ink-2); }

/* Skeleton - .claim-photo-skeleton */
.skel { border-radius: var(--r-lg); background: linear-gradient(100deg, var(--skel-a) 30%, var(--skel-b) 50%, var(--skel-a) 70%); background-size: 200% 100%; animation: skel 1.3s ease-in-out infinite; }
@keyframes skel { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .skel { animation: none; } }
.skel-type { height: 260px; }
.skel-inline { height: 120px; margin-top: 16px; }

/* ClaimFormCard - placeholders and page error */
.fcard { margin: 0 auto; width: 100%; max-width: var(--card-w); border-radius: var(--r-lg); border: 1px solid var(--color-line); background: var(--color-paper); padding: 36px 30px; box-shadow: var(--sh-1); }
@media (max-width: 560px) { .fcard { padding: 26px 20px; } }
.fcard-title { font-size: var(--fs-card-t); line-height: 1.25; font-weight: 700; letter-spacing: -0.01em; color: var(--color-ink); }
.fcard-title:focus { outline: none; }
.fcard-sub { margin-top: 8px; font-size: 14px; line-height: 1.5; font-weight: 500; color: var(--color-ink-3); }
.fcard-head { margin-bottom: 22px; }
.fcard-actions { margin-top: 24px; display: flex; justify-content: center; }
.fcard--error { margin-top: 48px; text-align: center; }
.fcard--error .fcard-icon { color: var(--color-red); display: flex; justify-content: center; margin-bottom: 12px; }
.fcard--error .fcard-icon svg { width: 28px; height: 28px; }

/* SectionEyebrow - common/SectionEyebrow.tsx */
.eyebrow { display: inline-flex; align-items: center; gap: 9px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--color-p-600); margin-bottom: 12px; }
.eyebrow::before { content: ''; display: block; height: 2px; width: 18px; flex-shrink: 0; border-radius: 2px; background: var(--color-p-500); }

/* v8 - Super Social card, three stages (social-v1 Stage 1 V2 + Stage 2 V1, changed as asked; Stage 3 = v7 columns + actions) */
.mcard-head-act { margin-left: auto; flex-shrink: 0; }
@container (max-width: 379px) { .mcard-head--act { flex-wrap: wrap; row-gap: 4px; } .mcard-head-act { flex-basis: calc(100% - 52px); margin-left: 52px; } }

/* v8 - Super Community card (community-v1 V1, Join as a filled button); spans both columns, advantages in two columns when wide */
@media (min-width: 1024px) { .mcard--community { grid-column: 1 / -1; } }
.cm-title { margin-top: 16px; font-size: 16.5px; line-height: 1.35; font-weight: 700; letter-spacing: -0.01em; color: var(--color-ink); }
.cm-desc { margin-top: 4px; font-size: 13.5px; line-height: 1.55; color: var(--color-ink-3); }
.cm-list { margin-top: 16px; display: grid; grid-template-columns: 1fr; gap: 14px; }
@container (min-width: 720px) { .cm-list { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 40px; } }
.cm-row { display: flex; align-items: flex-start; gap: 12px; }
.cm-ic { display: flex; width: 32px; height: 32px; flex-shrink: 0; align-items: center; justify-content: center; border-radius: var(--r-sm); background: var(--color-p-50); color: var(--color-p-500); }
.cm-ic svg { width: 18px; height: 18px; }
.cm-adv-t { font-size: 14px; line-height: 1.4; font-weight: 600; color: var(--color-ink); }
.cm-adv-d { margin-top: 2px; font-size: 13px; line-height: 1.5; color: var(--color-ink-3); }
@container (max-width: 519px) { .cm-join { width: 100%; } }

/* v8 - prototype control, not part of the product: picks the Super Social stage */
@media (max-width: 767px) { .demo { bottom: 76px; } }
#page { padding-bottom: 64px; } /* room so the closed demo panel never covers the last card */

/* v11 - 5. profile cards: the button takes its own row when the card is too narrow for title, progress and button together */
.pcard--milestones { container-type: inline-size; }
@container (min-width: 580px) { .ms-head { flex-direction: row; align-items: flex-start; justify-content: space-between; } }
@container (max-width: 579px) {
  .ms-head { flex-direction: column; align-items: stretch; }
  .ms-action, .ms-action .btn { width: 100%; }
}

/* v11 - 3. Admissions: chart and stages centred as one group; 4. side by side from a 380px card */
.mcard--crm .donut-wrap { justify-content: center; padding-right: 0; }
@container (min-width: 380px) and (max-width: 519px) {
  .mcard--crm .donut-wrap { flex-wrap: nowrap; gap: 28px; }
  .mcard--crm .legend { min-width: 0; row-gap: 10px; }
}

/* v11 - 4. Jobs beside a taller Admissions card: the list takes the space left and scrolls only past it */
@media (min-width: 1024px) {
  .mcard--jobs .mcard-body { flex: 1 1 auto; display: flex; flex-direction: column; }
  .mcard--jobs .jlist { flex: 1 1 auto; max-height: none; min-height: 220px; contain: size; }
}

/* v12 - 1. Social media posts chart: a linked platform is a column; a platform not linked is a small dashed column with Link */
.soc-ghost { display: flex; align-items: center; justify-content: center; width: 100%; max-width: 72px; height: 64px; border: 1.5px dashed var(--color-p-200); border-bottom: 0; border-radius: var(--r-xs) var(--r-xs) 0 0; }
.soc-ghost-btn { display: inline-flex; align-items: center; gap: 2px; min-height: 44px; padding: 0 8px; border: 0; border-radius: var(--r-sm); background: var(--color-p-50); color: var(--color-p-600); font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; }
.soc-ghost-btn svg { width: 13px; height: 13px; }
.soc-ghost-btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.col-label.is-off svg { color: var(--color-ink-3); }
.soc-off { font-size: 11.5px; color: var(--color-ink-3); }

/* v12 - 2. jobs list scrollbar in its own gutter, clear of the bars */
.jlist { margin-right: 0; padding-right: 12px; scrollbar-gutter: stable; scrollbar-width: thin; scrollbar-color: var(--color-p-300) var(--color-p-50); }

/* v12 - 4. job status chips: outline only, each status its own colour */
.jchip { background: transparent; box-shadow: none; border: 1px solid currentColor; }
.jchip--open { color: var(--color-ok); }
.jchip--closed { color: var(--color-enq-visit-declined); } /* v26 QA-02: --color-red is 4.41:1 and for error icons only; the enquiry declined red is 4.83:1 */
.jchip--draft { color: var(--color-warn); }
.jchip--archived { color: var(--color-ink-3); }
/* v19 - 9. Jobs list: title + Edit per job, no track / status / count */
.jbars--edit { gap: 0; }
.jrow { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--color-line); font-size: 14px; line-height: 1.4; font-weight: 500; color: var(--color-ink); }
.jrow:first-child { padding-top: 2px; }
.jrow:last-child { border-bottom: 0; }
.jedit { flex-shrink: 0; min-height: 36px; padding: 0 12px; font-size: 13px; line-height: 1; font-weight: 600; gap: 6px; }
.jedit .ic { width: 14px; height: 14px; }

/* v12 - 5. School details: title, bar, status, then the button - the button sits beside the title only on a wide card */
.pcard--milestones { display: grid; grid-template-columns: minmax(0, 1fr); align-content: center; gap: 14px; }
.pcard--milestones .ms-head { display: block; }
.pcard--milestones .ms-foot { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.pcard--milestones .pcard-status { margin-top: -6px; }
@container (min-width: 580px) {
  .pcard--milestones { grid-template-columns: minmax(0, 1fr) auto; column-gap: 16px; }
  .pcard--milestones .ms-head { grid-column: 1; grid-row: 1; }
  .pcard--milestones .ms-action { grid-column: 2; grid-row: 1; align-self: start; }
  .pcard--milestones .mbar, .pcard--milestones .ms-foot { grid-column: 1 / 3; }
}
@container (max-width: 579px) { .pcard--milestones .ms-action, .pcard--milestones .ms-action .btn { width: 100%; } }

/* v13 - 3. Staff by role: three titled groups - each a box with its own heading and total, rows under it */
.roles { gap: 12px; }
.roles-split { gap: 12px; }
@container (max-width: 419px) { .roles-split { row-gap: 12px; } }
.role-group { min-width: 0; border: 1px solid var(--color-line); border-radius: var(--r-lg); overflow: hidden; }
.role-group-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0; padding: 8px 12px; background: var(--color-p-50); border-bottom: 1px solid var(--color-p-100); font-size: 13px; line-height: 1.35; font-weight: 700; color: var(--color-ink); }
.role-group-n { flex-shrink: 0; min-width: 24px; padding: 1px 8px; border-radius: var(--r-pill); background: var(--color-p-100); color: var(--color-p-700); font-size: 12.5px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }
.role-group .role-row { padding: 8px 12px; }
.role-group .role-name { color: var(--color-ink); }
.role-group .role-row.is-zero .role-name, .role-group .role-row.is-zero .role-n { color: var(--color-ink-3); font-weight: 500; }
.role-group--top ul { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.role-group--top .role-row { border-bottom: 0; }
.role-group--top .role-row + .role-row { border-left: 1px solid var(--color-line-soft); }
@container (max-width: 419px) {
  .role-group--top ul { grid-template-columns: 1fr; }
  .role-group--top .role-row + .role-row { border-left: 0; border-top: 1px solid var(--color-line-soft); }
}

/* v13 - 4. Google platform mark: a lettered G - no Google logo exists in any of the three repos or in lucide-react; dev to supply the brand asset */
.plat-g { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: var(--r-pill); border: 1.5px solid currentColor; color: var(--color-p-500); font-size: 11px; line-height: 1; font-weight: 800; }
.col-label.is-off .plat-g { color: var(--color-ink-3); }

/* v14 - school select in the top bar, ported from My Staff v9 (S3 school switcher, design.md 4.4 there) */
.sw { position: relative; flex-shrink: 0; }
.sw-trigger { height: 36px; max-width: 300px; display: inline-flex; align-items: center; gap: 8px; padding: 0 10px 0 8px; border: 1px solid var(--color-line); border-radius: var(--r-pill); background: var(--color-paper); color: var(--color-ink); font: inherit; cursor: pointer; transition: border-color var(--t-1) var(--ease), background-color var(--t-1) var(--ease); }
.sw-trigger:hover { border-color: var(--color-p-100); background: var(--color-ghost-white); }
.sw-trigger:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.sw-trigger[aria-expanded="true"] { border-color: var(--color-blue); }
.sw-trigger .ic { width: 16px; height: 16px; flex-shrink: 0; }
.sw-trigger .sw-school { color: var(--color-blue); }
.sw-trigger .sw-chev { color: var(--color-mid-grey); }
.sw-text { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.sw-name { font-size: 14px; line-height: 20px; font-weight: 600; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sw-type { flex-shrink: 0; font-size: 12px; line-height: 16px; font-weight: 600; color: var(--color-ink-3); white-space: nowrap; }
.sw-menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 60; width: 280px; max-width: calc(100vw - 16px); padding: 8px; background: var(--color-paper); border: 1px solid var(--color-line); border-radius: var(--r-lg); box-shadow: var(--sh-3); color: var(--color-ink); }
.sw-menu[hidden] { display: none; }
.sw-head { padding: 8px 10px 4px; font-size: 11px; line-height: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--color-ink-3); }
.sw-opt { position: relative; width: 100%; min-height: 52px; display: flex; flex-direction: column; justify-content: center; padding: 8px 36px 8px 10px; border: 0; border-radius: var(--r-sm); background: transparent; font: inherit; text-align: left; cursor: pointer; }
.sw-opt:hover, .sw-opt:focus-visible { outline: none; background: var(--color-ghost-white); }
.sw-opt b { font-size: 14px; line-height: 20px; font-weight: 600; color: var(--color-ink); }
.sw-opt small { font-size: 12px; line-height: 16px; color: var(--color-ink-3); }
.sw-opt[aria-selected="true"] { background: var(--color-p-50); }

.sw-opt .ic { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--color-blue); display: none; }
.sw-opt[aria-selected="true"] .ic { display: block; }
.sw-foot { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 40px; margin-top: 4px; padding: 0 10px; border: 0; border-top: 1px solid var(--color-line-soft); border-radius: 0 0 var(--r-sm) var(--r-sm); background: transparent; font: inherit; font-size: 14px; line-height: 20px; font-weight: 600; color: var(--color-blue); cursor: pointer; }
.sw-foot:hover, .sw-foot:focus-visible { outline: none; background: var(--color-ghost-white); }
.sw-foot .ic { width: 16px; height: 16px; }
@media (max-width: 1023px) { .sw-name { max-width: 140px; } }
@media (max-width: 639px) {
  .sw-name { max-width: 120px; }
  .sw-trigger { gap: 4px; padding: 0 8px; }
  .sw-menu { position: fixed; left: 8px; right: 8px; top: 54px; width: auto; max-width: none; }
}

/* v19 - 3. school type picker in the "Your school profile" row. Mirrors the my-staff v18 select trigger
   (ui/select.tsx custom :47-71): 40px, less-grey border, 14px / 500, grey chevron. One type = a fixed label. */
.tsel { position: relative; flex: 0 0 auto; }
.tsel-trigger { min-width: 168px; height: 40px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 10px 0 12px; border: 1px solid var(--color-less-grey); border-radius: var(--r-sm); background: var(--color-paper); font: inherit; font-size: 14px; line-height: 20px; font-weight: 500; color: var(--color-ink); text-align: left; cursor: pointer; transition: border-color var(--t-1) var(--ease), box-shadow var(--t-1) var(--ease); }
.tsel-trigger:hover { border-color: var(--color-p-300); }
.tsel-trigger[aria-expanded="true"], .tsel-trigger:focus-visible { outline: none; border-color: var(--color-blue); box-shadow: var(--focus-ring); }
.tsel-trigger .ic { width: 16px; height: 16px; flex-shrink: 0; color: var(--color-mid-grey); transition: transform var(--t-1) var(--ease); }
.tsel-trigger[aria-expanded="true"] .ic { transform: rotate(180deg); }
.tsel-fixed { cursor: default; }
.tsel-fixed:hover { border-color: var(--color-less-grey); }
.tsel-menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; min-width: 100%; padding: 8px; background: var(--color-paper); border: 1px solid var(--color-line); border-radius: var(--r-xs); box-shadow: var(--sh-3); }
.tsel-menu[hidden] { display: none; }
.tsel-opt { position: relative; width: 100%; min-height: 36px; display: flex; align-items: center; padding: 0 32px 0 10px; border: 0; border-radius: var(--r-xs); background: transparent; font: inherit; font-size: 14px; line-height: 20px; color: var(--color-ink); text-align: left; white-space: nowrap; cursor: pointer; }
.tsel-opt:hover, .tsel-opt:focus-visible { outline: none; background: var(--color-ghost-white); }
.tsel-opt[aria-selected="true"] { background: var(--color-p-50); color: var(--color-blue); font-weight: 600; }
.tsel-opt .ic { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--color-blue); display: none; }
.tsel-opt[aria-selected="true"] .ic { display: block; }
@media (max-width: 559px) {
  .sec-head .tsel { flex: 1 1 100%; }
  .tsel-trigger { width: 100%; }
}

/* v15 - 3. no number row under the card title: the chart's own heading sits where the numbers were */
.mcard-body > .sub-title:first-child { margin-top: 18px; }

/* My Staff - V3 sign-up gauge, ported from 6-variations/staff-v1.html */
.staff-gauge { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 250px; }
.staff-gauge-graphic { position: relative; width: 260px; max-width: 100%; }
.staff-gauge-graphic svg { display: block; width: 100%; height: auto; }
.staff-gauge-track, .staff-gauge-segment { fill: none; stroke-linecap: butt; }
.staff-gauge-track { stroke: var(--color-p-50); }
.staff-gauge-segment--signed { stroke: var(--color-staff-signed); }
.staff-gauge-segment--invited { stroke: var(--color-staff-invited); }
.staff-gauge-segment--not-invited { stroke: var(--color-staff-not-invited); }
.staff-gauge-mid { position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; }
.staff-gauge-mid b { font-size: 38px; line-height: 1; font-weight: 800; font-variant-numeric: tabular-nums; }
.staff-gauge-mid span { margin-top: 4px; font-size: 13px; font-weight: 600; color: var(--color-ink-3); }
.staff-gauge-line { margin-top: 16px; max-width: 420px; text-align: center; font-size: 14px; line-height: 1.7; color: var(--color-ink-2); }
.staff-gauge-line b { color: var(--color-ink); font-variant-numeric: tabular-nums; }
.staff-gauge-dot { display: inline-block; width: 8px; height: 8px; margin: 0 4px 0 10px; border-radius: 50%; vertical-align: 0; }
.staff-gauge-dot--signed { background: var(--color-staff-signed); }
.staff-gauge-dot--invited { background: var(--color-staff-invited); }
.staff-gauge-dot--not-invited { background: var(--color-staff-not-invited); }
@container (max-width: 419px) { .staff-gauge { min-height: 220px; } .staff-gauge-line { font-size: 13px; } }

/* v17 - 1. Jobs: a larger donut fills the space that sat empty under it; the legend reads bigger */
.mcard--jobs .jobs-donut-wrap { flex: 1 1 auto; gap: 32px; }
.mcard--jobs .donut { width: 160px; height: 160px; }
.mcard--jobs .job-donut-total { font-size: 30px; }
.mcard--jobs .job-donut-cap { font-size: 13px; }
.mcard--jobs .legend { row-gap: 12px; }
.mcard--jobs .legend li { font-size: 14px; }
.mcard--jobs .legend-sw { width: 12px; height: 12px; }
@container (min-width: 380px) { .mcard--jobs .donut { width: 184px; height: 184px; } }
/* the card beside a taller one centres its chart in the extra height instead of leaving it all at the bottom */
.mcard--apps .stair-wrap { flex: 1 1 auto; }
.mcard[data-module="staff"] .mcard-body { flex: 1 1 auto; display: flex; flex-direction: column; }
.mcard[data-module="staff"] .staff-gauge { flex: 1 1 auto; }

/* v18 - 2. Admissions line chart: count of admissions (y) per date (x), one week at a time */
.lc-nav { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px; }
.lc-nav .lc-range { padding: 0 12px; }
.lc-range { margin: 0; font-size: 13px; line-height: 1.3; font-weight: 600; color: var(--color-ink); text-align: center; font-variant-numeric: tabular-nums; }
.lc-btn { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; padding: 0; background: var(--color-paper); border: 1px solid var(--color-less-grey); border-radius: var(--r-sm); color: var(--color-dark-grey); cursor: pointer; transition: background-color 150ms var(--ease), border-color 150ms var(--ease); }
.lc-btn svg { width: 16px; height: 16px; }
.lc-btn:hover:not(:disabled) { background: var(--color-p-50); border-color: var(--color-p-300); }
.lc-btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.lc-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.lc-plot { position: relative; height: 196px; }
.lc-grid { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; }
.lc-row { display: flex; align-items: center; gap: 8px; height: 16px; }
.lc-yt { flex: 0 0 24px; text-align: right; font-size: 12px; line-height: 1; color: var(--color-ink-3); font-variant-numeric: tabular-nums; }
.lc-gl { flex: 1 1 auto; height: 1px; background: var(--color-line); }
.lc-row:last-child .lc-gl { background: var(--color-less-grey); }
.lc-svg { position: absolute; left: 32px; top: 8px; width: calc(100% - 32px); height: calc(100% - 16px); overflow: visible; }
.lc-area { fill: var(--color-p-50); stroke: none; }
.lc-line { fill: none; stroke: var(--color-blue); stroke-width: 2.5px; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.lc-ring, .lc-dot { fill: none; stroke-linecap: round; vector-effect: non-scaling-stroke; }
.lc-ring { stroke: var(--color-paper); stroke-width: 12px; }
.lc-dot { stroke: var(--color-blue); stroke-width: 8px; }
.lc-x { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); margin: 8px 0 0 32px; }
.lc-xl { display: flex; flex-direction: column; align-items: center; font-size: 12px; line-height: 1.35; color: var(--color-ink-3); text-align: center; }
.lc-xl b { display: inline-flex; gap: 4px; font-weight: 600; color: var(--color-ink-2); }

/* v18 - 5. Date range picker in the profile section head. Mirrors components/ui/date-range-picker.tsx and calendar.tsx
   in the school-admin repo: 40px trigger, grey calendar icon, popover with month / year dropdowns, 36px days. */
.range { position: relative; flex: 0 0 auto; }
.range-trigger { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 240px; height: 40px; padding: 0 12px; background: var(--color-paper); border: 1px solid var(--color-less-grey); border-radius: var(--r-sm); font: inherit; font-size: 13px; line-height: 1.25; color: var(--color-ink-2); text-align: left; cursor: pointer; transition: border-color 150ms var(--ease); }
.range-trigger:hover { border-color: var(--color-p-300); }
.range-trigger:focus-visible { outline: none; border-color: var(--color-blue); box-shadow: var(--focus-ring); }
.range-text { font-variant-numeric: tabular-nums; }
.range-ic { width: 20px; height: 20px; flex-shrink: 0; color: var(--color-light-grey); }
.range-trigger[aria-expanded="true"] .range-ic { color: var(--color-blue); }
.range-pop { position: absolute; top: calc(100% + 6px); right: 0; z-index: 20; background: var(--color-paper); border: 1px solid var(--color-less-grey); border-radius: var(--r-lg); box-shadow: var(--sh-3); overflow: hidden; }
.cal { width: fit-content; padding: 12px; background: var(--color-paper); }
.cal-cap { display: flex; align-items: center; justify-content: space-between; gap: 4px; height: 36px; }
.cal-nav { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; padding: 0; background: transparent; border: 0; border-radius: var(--r-sm); color: var(--color-dark-grey); cursor: pointer; }
.cal-nav svg { width: 16px; height: 16px; }
.cal-nav:hover:not(:disabled) { background: var(--color-background-grey); }
.cal-nav:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.cal-nav:disabled { opacity: 0.4; cursor: default; }
.cal-dd { display: flex; align-items: center; gap: 6px; }
.cal-sel { position: relative; display: inline-flex; align-items: center; height: 32px; border: 1px solid var(--color-less-grey); border-radius: var(--r-sm); background: var(--color-paper); }
.cal-sel:focus-within { border-color: var(--color-blue); box-shadow: var(--focus-ring); }
.cal-sel .ic { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; color: var(--color-mid-grey); pointer-events: none; }
.cal-select { appearance: none; height: 30px; padding: 0 24px 0 8px; background: transparent; border: 0; font: inherit; font-size: 14px; line-height: 1; color: var(--color-title-grey); cursor: pointer; }
.cal-select:focus { outline: none; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 36px); row-gap: 8px; margin-top: 8px; }
.cal-wd { display: flex; align-items: center; justify-content: center; height: 20px; font-size: 12.8px; line-height: 1; color: var(--color-title-grey); }
.cal-cell { display: flex; align-items: center; justify-content: center; height: 36px; }
.cal-cell.is-mid, .cal-cell.is-start, .cal-cell.is-end { background: var(--color-nudge-bg); }
.cal-cell.is-start { border-radius: var(--r-pill) 0 0 var(--r-pill); }
.cal-cell.is-end { border-radius: 0 var(--r-pill) var(--r-pill) 0; }
.cal-cell.is-start.is-end { background: transparent; border-radius: 0; }
.cal-day { width: 36px; height: 36px; padding: 0; background: transparent; border: 2px solid transparent; border-radius: var(--r-pill); font: inherit; font-size: 14px; line-height: 1; color: var(--color-title-grey); font-variant-numeric: tabular-nums; cursor: pointer; }
.cal-day:hover:not(:disabled) { background: var(--color-background-grey); }
.cal-day:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.cal-day.is-out { opacity: 0.5; }
.cal-day.is-today { border-color: var(--color-blue); }
.cal-day.is-sel { background: var(--color-blue); border-color: var(--color-blue); color: var(--color-paper); }
.cal-day.is-sel:hover:not(:disabled) { background: var(--color-p-600); }
.cal-day:disabled { opacity: 0.3; cursor: not-allowed; }
.cal-hint { margin: 10px 0 0; font-size: 12px; line-height: 1.4; color: var(--color-ink-3); }
@media (max-width: 559px) {
  .sec-head .range { flex: 1 1 100%; }
  .range-trigger { width: 100%; }
  .range-pop { left: 0; right: auto; max-width: 100%; }
}

/* v17 - 2 + 5. Reviews: overall rating in gold stars and how many people reviewed - no categories */
.mcard--reviews .mcard-body { flex: 1 1 auto; display: flex; flex-direction: column; }
/* v19 - 8. rating-v1 V1 without the blue plate: one big star on the left; rating, the other four stars and the count on the right */
/* v20 - 3. bigger, fills the card; the four small stars run exactly the width of "4.4 out of 5"; "People reviewed" label removed */
.rv { flex: 1 1 auto; margin-top: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; text-align: center; }
.rv-main { display: flex; align-items: center; gap: 20px; }
.rv-big { display: inline-flex; line-height: 0; flex-shrink: 0; }
.rv-big svg { width: 128px; height: 128px; color: var(--color-star); fill: var(--color-star); }
.rv-big.is-off svg { color: var(--color-star-off); fill: var(--color-star-off); }
.rv-side { display: inline-grid; justify-items: start; gap: 12px; text-align: left; }
.rv-num { display: inline-flex; align-items: baseline; gap: 8px; font-size: 72px; line-height: 0.9; font-weight: 800; letter-spacing: -0.02em; color: var(--color-ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
.rv-of { font-size: 18px; line-height: 1.3; font-weight: 600; letter-spacing: 0; color: var(--color-ink-3); }
.rv-small { display: block; width: 0; min-width: 100%; }
.rv-small .stars-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; width: 100%; }
.mcard--reviews .rv-small .stars-row svg { display: block; width: 100%; height: auto; aspect-ratio: 1; }
.rv-small .stars-top { width: 100%; }
.rv-side .kpi-value.is-missing { margin-top: 0; font-size: 18px; }
.rv-line { margin: 0; padding: 10px 20px; border-radius: var(--r-pill); background: var(--color-background-grey); font-size: 15px; line-height: 1.4; color: var(--color-ink-2); }
.rv-line b { margin-right: 2px; font-size: 22px; font-weight: 800; color: var(--color-ink); font-variant-numeric: tabular-nums; }
.stars-base svg { color: var(--color-star-off); fill: var(--color-star-off); }
.stars-top svg { color: var(--color-star); fill: var(--color-star); }
@container (max-width: 479px) {
  .rv-main { gap: 14px; }
  .rv-big svg { width: 92px; height: 92px; }
  .rv-num { font-size: 52px; gap: 6px; }
  .rv-of { font-size: 15px; }
  .rv-side { gap: 10px; }
  .rv-small .stars-row { gap: 4px; }
  .rv-line { padding: 8px 14px; font-size: 14px; }
  .rv-line b { font-size: 19px; }
}
/* v22 - 4. Reviews is the rating-v2 V1 Seal: the rating set in a cream disc with a gold hairline ring, five stars whose
   empty part is white, OUT OF 5 under them, and the people count beside the seal. Copied from 6-variations/rating-v2.html. */
.w1 { flex: 1 1 auto; margin-top: 8px; display: flex; align-items: center; justify-content: center; gap: 40px; }
.w1 .vc-num { font-weight: 800; color: var(--color-ink); font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -0.02em; }
.w1 .vc-sub { margin: 0; font-size: 13.5px; line-height: 1.45; color: var(--color-ink-3); }
.w1-seal { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; flex-shrink: 0; width: 196px; height: 196px; border-radius: 50%; background: var(--color-star-off); box-shadow: inset 0 0 0 7px var(--color-paper), inset 0 0 0 8.5px var(--color-star); text-align: center; }
.w1-n { font-size: 60px; }
.w1-seal .stars-row { gap: 3px; }
.w1-seal .stars-row svg { width: 21px; height: 21px; }
.w1-seal .stars-base svg { color: var(--color-paper); fill: var(--color-paper); }
.w1-of { font-size: 12.5px; line-height: 1.2; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-ink-2); }
.w1-seal .kpi-value.is-missing { margin-top: 0; font-size: 15px; }
.w1-side { display: flex; flex-direction: column; gap: 8px; min-width: 0; max-width: 220px; }
.w1-cn { font-size: 56px; }
@container (max-width: 439px) {
  .w1 { flex-direction: column; gap: 20px; text-align: center; }
  .w1-seal { width: 168px; height: 168px; }
  .w1-n { font-size: 50px; }
  .w1-side { align-items: center; max-width: none; }
  .w1-cn { font-size: 44px; }
}

/* v17 - 6. Social media: a linked platform is wider, highlighted and labelled Linked; one not linked is smaller and quiet */
.soc-cols .colw.is-on, .col-labels .col-label.is-on { flex: 1.6 1 0; }
.soc-cols .colw.is-off, .col-labels .col-label.is-off { flex: 1 1 0; }
.soc-cols .colw.is-on .col-bar { max-width: 72px; }
/* v21 - 4. each platform's bar in its own colour instead of the theme blue for all */
.col-bar--superschools { background: var(--color-social-superschools); }
.col-bar--instagram { background: var(--color-social-instagram); }
.col-bar--facebook { background: var(--color-social-facebook); }
.col-bar--google { background: var(--color-social-google); }
.soc-cols .colw.is-on .col-val { font-size: 15px; }
.col-label.is-on { gap: 5px; font-size: 13.5px; font-weight: 700; color: var(--color-ink); }
.col-label.is-on .plat-ic { width: 24px; height: 24px; }
.col-label.is-on .ss-mark { width: 31px; height: 23px; }
.col-label.is-on .plat-g { width: 24px; height: 24px; font-size: 13px; }
.col-label.is-off { gap: 3px; font-size: 11.5px; font-weight: 500; }
.col-label.is-off .plat-ic { width: 15px; height: 15px; }

.col-label.is-off .plat-g { width: 15px; height: 15px; font-size: 9px; }
/* v22 - 3. Facebook, Instagram and Google show their own full-colour logos instead of theme-blue line icons */
.plat-logo { flex: none; }
.lg-fb { fill: var(--color-brand-facebook); }
.lg-g-b { fill: var(--color-brand-google-blue); }

.lg-ig-1 { stop-color: var(--color-brand-ig-1); }
.lg-ig-2 { stop-color: var(--color-brand-ig-2); }
.lg-ig-3 { stop-color: var(--color-brand-ig-3); }
.lg-ig-4 { stop-color: var(--color-brand-ig-4); }
.lg-ig-5 { stop-color: var(--color-brand-ig-5); }
.lg-ig-6 { stop-color: var(--color-brand-ig-6); }
.lg-ig-7 { stop-color: var(--color-brand-ig-7); }

.soc-cols .soc-ghost { max-width: 60px; height: 52px; }
.soc-cols .soc-ghost-btn { font-size: 12px; padding: 0 6px; }
@container (max-width: 419px) {
  .soc-cols .colw.is-on, .col-labels .col-label.is-on { flex-grow: 1.3; }

}

/* v23 - 1. jobs list: tall enough for 5 jobs at every width; scrolls only from the 6th */
.jlist { max-height: var(--jlist-fit, 236px); }
@media (min-width: 1024px) {
  .mcard--jobs .jlist { max-height: none; min-height: var(--jlist-fit, 220px); }
}

/* v24 - 1. Claim badge setup card (user screenshot 2026-10-26) */
.pcard--setup { gap: 0; justify-content: flex-start; }
.setup-pill { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: var(--r-pill); font-size: 12.5px; line-height: 1; font-weight: 700; }
.setup-pill .ic { width: 14px; height: 14px; }
.setup-pill--progress { background: var(--color-warn-bg); color: var(--color-p-700); box-shadow: inset 0 0 0 1px var(--color-p-300); }
.setup-pill--none { background: var(--color-line-soft); color: var(--color-ink-2); box-shadow: inset 0 0 0 1px var(--color-line); }
.setup-pill--done { background: var(--color-ok-bg); color: var(--color-ok); box-shadow: inset 0 0 0 1px var(--color-ok-line); }
.setup-text { margin-top: 16px; }
.setup-title { font-size: 20px; line-height: 1.3; font-weight: 700; letter-spacing: -0.01em; color: var(--color-ink); }
.setup-desc { margin-top: 8px; font-size: 14px; line-height: 1.55; color: var(--color-ink-3); }
.setup-progress { margin-top: 18px; }
.setup-steps { font-size: 13px; line-height: 1.3; font-weight: 600; color: var(--color-ink); }
.setup-segs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; margin-top: 10px; }
.setup-seg { height: 6px; border-radius: 1px; background: var(--color-line); }
.setup-seg.is-done { background: var(--color-p-500); }
.setup-completion { margin-top: 10px; font-size: 12.5px; line-height: 1.3; color: var(--color-ink-3); }
.setup-action { margin-top: auto; padding-top: 20px; }
.setup-action .btn .ic { width: 16px; height: 16px; }
@container (max-width: 379px) { .setup-action .btn { width: 100%; } }
.pcard--setup { container-type: inline-size; }

/* v24 - 3. a card keeps its size whatever the data; only what is inside changes */
.pcard--milestones .ms-foot { min-height: 26px; justify-content: center; }
.pcard--milestones .ms-foot .pcard-status { margin-top: 0; }
.mcard--crm > .empty { flex: 1 1 auto; min-height: calc(var(--crm-body-h, 300px) + 16px); }
.soc-cols + .col-labels { min-height: 70px; align-items: flex-start; }
.jlist { min-height: var(--jlist-fit, 236px); }
/* loading keeps the card itself - frame and title stay, a shimmer covers what is still loading - so nothing moves
   when the data arrives or the school type changes */
.card.is-loading { position: relative; }
.card.is-loading > * { visibility: hidden; }
.mcard.is-loading > .mcard-head { visibility: visible; }
.card.is-loading::after { content: ""; position: absolute; left: 20px; right: 20px; top: 20px; bottom: 20px; border-radius: var(--r-lg); background: linear-gradient(100deg, var(--skel-a) 30%, var(--skel-b) 50%, var(--skel-a) 70%); background-size: 200% 100%; animation: skel 1.3s ease-in-out infinite; }
.mcard.is-loading::after { top: 78px; }
@media (prefers-reduced-motion: reduce) { .card.is-loading::after { animation: none; } }
.jrow .jbar-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; overflow-wrap: normal; }

/* v25 - 2. Social media: the demo states change data only. Every platform has the same column width, logo size and
   name style whether it is linked or not; only the bar itself differs (bar + count, or the dashed Link box), and
   "Not linked" sits in the row's reserved room under the name */
.soc-cols .colw.is-on, .soc-cols .colw.is-off, .col-labels .col-label.is-on, .col-labels .col-label.is-off { flex: 1 1 0; }
.col-labels .col-label.is-on, .col-labels .col-label.is-off { gap: 4px; font-size: 12.5px; font-weight: 600; color: var(--color-ink-2); }
.col-labels .col-label .plat-ic, .col-labels .col-label .plat-logo { width: 22px; height: 22px; }
.col-labels .col-label .ss-mark { width: 29px; height: 22px; color: var(--color-p-500); }
.soc-cols .soc-ghost { max-width: 72px; }
@container (max-width: 419px) { .col-labels .col-label.is-on, .col-labels .col-label.is-off { font-size: 11.5px; } }
[data-module="gallery"] .mcard-body > .soc-cols, [data-module="gallery"] .mcard-body > .col-labels { min-width: 0; }

/* v26 - 1. Admissions funnel (admissions-v5 V6a-2): seven fixed slices narrowing top to bottom, each name inside its
   slice; reached steps deepen down the funnel, Admission confirmed green; a step not reached yet is a dashed outline */
.mcard--crm .mcard-body { flex: 1 1 auto; display: flex; flex-direction: column; }
.mcard--crm { --crm-body-h: 300px; }
.f5 { flex: 1 1 auto; min-height: var(--crm-body-h); margin-top: 16px; display: grid; grid-template-columns: minmax(0, 1fr) 212px; column-gap: 20px; align-items: stretch; }
.f5-steps { display: grid; grid-template-rows: repeat(7, minmax(0, 1fr)); row-gap: 3px; margin: 0; padding: 0; list-style: none; min-height: 0; }
.f5-step { position: relative; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 0 8px; }
.f5-step::before { content: ""; position: absolute; inset: 0; background: var(--f5-fill, var(--color-p-100)); clip-path: polygon(var(--l0) 0, calc(100% - var(--l0)) 0, calc(100% - var(--l1)) 100%, var(--l1) 100%); }
.f5-step:nth-child(1) { --l0: 0%;  --l1: 4%; }
.f5-step:nth-child(2) { --l0: 4%;  --l1: 8%; }
.f5-step:nth-child(3) { --l0: 8%;  --l1: 12%; }
.f5-step:nth-child(4) { --l0: 12%; --l1: 16%; }
.f5-step:nth-child(5) { --l0: 16%; --l1: 20%; }
.f5-step:nth-child(6) { --l0: 20%; --l1: 24%; }
.f5-step:nth-child(7) { --l0: 24%; --l1: 26%; }
.f5-name { position: relative; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; line-height: 1.2; font-weight: 600; color: var(--color-ink); }
.f5-step:nth-child(1), .f5-step:nth-child(2) { --f5-fill: var(--color-p-100); }
.f5-step:nth-child(3), .f5-step:nth-child(4) { --f5-fill: var(--color-p-200); }
.f5-step:nth-child(5), .f5-step:nth-child(6) { --f5-fill: var(--color-p-400); }
.f5-step:nth-child(5) .f5-name, .f5-step:nth-child(6) .f5-name { color: var(--color-paper); }
.f5-step.is-last { --f5-fill: var(--color-ok); }
.f5-step.is-last .f5-name { color: var(--color-paper); font-weight: 700; }
.f5-step.is-unknown { --f5-fill: var(--color-mist-2); }
.f5-step.is-unknown .f5-name { color: var(--color-ink-2); font-weight: 500; }
.f5-off-b .f5-step.is-off::before { background: var(--color-line); }
.f5-off-b .f5-step.is-off::after { content: ""; position: absolute; inset: 1.5px; background: var(--color-paper); clip-path: polygon(var(--l0) 0, calc(100% - var(--l0)) 0, calc(100% - var(--l1)) 100%, var(--l1) 100%); }
.f5-off-b .f5-step.is-off .f5-name { z-index: 1; color: var(--color-ink-3); font-weight: 500; }
.f5-side { display: flex; flex-direction: column; justify-content: center; gap: 10px; min-width: 0; padding: 16px; border-radius: var(--r-lg); background: var(--color-mist); box-shadow: inset 0 0 0 1px var(--color-line); }
.f5-side.is-act { background: var(--color-p-50); box-shadow: inset 0 0 0 1px var(--color-p-100); }
.f5-side.is-win { background: var(--color-ok-bg); box-shadow: inset 0 0 0 1px var(--color-ok-line); }
.f5-ic { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: var(--r-pill); background: var(--color-paper); color: var(--color-p-500); box-shadow: inset 0 0 0 1px var(--color-p-100); }
.f5-ic .ic { width: 17px; height: 17px; }
.f5-t { font-size: 15px; line-height: 1.35; font-weight: 700; color: var(--color-ink); }
.f5-t b { color: var(--color-p-600); font-variant-numeric: tabular-nums; }
.f5-s { font-size: 13px; line-height: 1.45; color: var(--color-ink-2); }
.f5-s b { font-weight: 700; color: var(--color-ink); font-variant-numeric: tabular-nums; }
.f5-btn { align-self: flex-start; min-height: 40px; padding: 0 14px; font-size: 13.5px; gap: 6px; white-space: nowrap; }
.f5-btn .ic { width: 15px; height: 15px; }
.f5-k { font-size: 12.5px; line-height: 1.3; font-weight: 600; color: var(--color-ink-3); }
.f5-big { font-size: 44px; line-height: 1.1; font-weight: 800; letter-spacing: -0.02em; color: var(--color-ok); font-variant-numeric: tabular-nums; }
.f5-big.is-dash { color: var(--color-ink-3); }
.f5-ring { position: relative; width: 112px; height: 112px; align-self: center; }
.f5-ring svg { display: block; width: 100%; height: 100%; transform: rotate(-90deg); }
.f5-ring-t { fill: none; stroke: var(--color-ok-line); stroke-width: 10; }
.f5-ring-f { fill: none; stroke: var(--color-ok); stroke-width: 10; stroke-linecap: round; }
.f5-ring-v { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }

@container (max-width: 519px) {

  .f5-name { font-size: 12px; }
  .f5-step:nth-child(1) { --l0: 0%;  --l1: 3%; }
  .f5-step:nth-child(2) { --l0: 3%;  --l1: 6%; }
  .f5-step:nth-child(3) { --l0: 6%;  --l1: 9%; }
  .f5-step:nth-child(4) { --l0: 9%;  --l1: 12%; }
  .f5-step:nth-child(5) { --l0: 12%; --l1: 15%; }
  .f5-step:nth-child(6) { --l0: 15%; --l1: 18%; }
  .f5-step:nth-child(7) { --l0: 18%; --l1: 20%; }
  .f5-side { flex-direction: row; flex-wrap: wrap; align-items: center; padding: 12px; gap: 8px 12px; min-height: 124px; align-content: center; }
  .f5-side > .f5-txt { flex: 1 1 160px; min-width: 0; }
  .f5-side .f5-btn { flex: 1 1 100%; justify-content: center; }
  .f5-big { font-size: 34px; }
  .f5-ring { width: 84px; height: 84px; }
  .f5-ring-v b { font-size: 19px; }
  .f5-c2, .f5-c2 .f5-s { text-align: left; }
}

/* v26 - 2. School details (details-v3 V1): the Claim card's layout, the % ring in a right column beside the pill, title
   and sections line so it can be large without making the card taller */
.pcard--dring { container-type: inline-size; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto auto 1fr; grid-template-areas: "pill ring" "text ring" "left ring" "act act"; column-gap: 24px; gap: 0 24px; }
.pcard--dring .setup-pill { grid-area: pill; justify-self: start; }
.pcard--dring .setup-text { grid-area: text; margin-top: 16px; }
.pcard--dring .dr-left { grid-area: left; margin-top: 14px; min-width: 0; }
.pcard--dring .dr-ring { grid-area: ring; align-self: center; }
.pcard--dring .setup-action { grid-area: act; align-self: end; margin-top: 0; padding-top: 20px; }
.pcard--dring .setup-action .btn .ic { width: 16px; height: 16px; }
.dr-sec { font-size: 14px; line-height: 1.35; font-weight: 600; color: var(--color-ink); }
.dr-sec b { font-weight: 800; font-variant-numeric: tabular-nums; }
.dr-rem { margin-top: 4px; font-size: 12.5px; line-height: 1.3; color: var(--color-ink-3); }
.pcard--dring.is-done .dr-rem { color: var(--color-ok); font-weight: 600; }
.dr-ring { position: relative; display: block; width: 120px; height: 120px; }
.dr-ring svg { display: block; width: 100%; height: 100%; }
.dr-track { fill: none; stroke: var(--color-p-100); }
.dr-fill { fill: none; stroke: var(--color-p-500); stroke-linecap: round; }
.pcard--dring.is-done .dr-fill { stroke: var(--color-ok); }
.dr-pct { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 26px; line-height: 1; font-weight: 800; letter-spacing: -0.01em; color: var(--color-ink); font-variant-numeric: tabular-nums; }
.pcard--dring.is-done .dr-pct { color: var(--color-ok); }
@container (max-width: 419px) { .dr-ring { width: 96px; height: 96px; } .dr-pct { font-size: 22px; } .pcard--dring { column-gap: 16px; } }
@container (max-width: 339px) { .dr-ring { width: 76px; height: 76px; } .dr-pct { font-size: 18px; } .pcard--dring .setup-action .btn { width: 100%; } }

/* v27 - 1. School details: the ring is centred on the text block (title, line, sections, % pending) - the pill above
   and the button below sit outside that block - and it is larger, filling the block's height */
.pcard--dring { grid-template-areas: "pill pill" "text ring" "left ring" "act act"; }
.pcard--dring .dr-ring { align-self: center; width: 136px; height: 136px; margin-top: 16px; }
.pcard--dring .dr-pct { font-size: 28px; }
.dr-pend { margin-top: 4px; font-size: 12.5px; line-height: 1.3; font-weight: 600; color: var(--color-warn); }
.pcard--dring.is-done .dr-pend { color: var(--color-ok); }
@container (max-width: 419px) { .pcard--dring .dr-ring { width: 104px; height: 104px; } .pcard--dring .dr-pct { font-size: 23px; } }
@container (max-width: 339px) { .pcard--dring .dr-ring { width: 84px; height: 84px; } .pcard--dring .dr-pct { font-size: 19px; } }

/* v27 - 2. Admissions: a slightly smaller funnel; each step a soft tint of its status colour with ink text, Admission
   confirmed solid green; the conversion ring larger with the same text, so more room between ring and text; the side
   card only as tall as its content */
.mcard--crm { --crm-body-h: 268px; }
.f5 { min-height: 268px; }
.f5-steps { justify-self: center; width: 92%; }
.f5-step:nth-child(1) { --f5-fill: var(--color-fnl-new); }
.f5-step:nth-child(2) { --f5-fill: var(--color-fnl-contacted); }
.f5-step:nth-child(3) { --f5-fill: var(--color-fnl-requested); }
.f5-step:nth-child(4) { --f5-fill: var(--color-fnl-scheduled); }
.f5-step:nth-child(5) { --f5-fill: var(--color-fnl-completed); }
.f5-step:nth-child(6) { --f5-fill: var(--color-fnl-application); }
.f5-step:nth-child(5) .f5-name, .f5-step:nth-child(6) .f5-name { color: var(--color-ink); }
.f5-step.is-last { --f5-fill: var(--color-ok); }
.f5-side { align-self: center; }
.f5-ring { width: 128px; height: 128px; }
.f5-ring-t, .f5-ring-f { stroke-width: 8; }
@container (max-width: 519px) {
  .f5 { min-height: 440px; }
  .mcard--crm > .empty { min-height: 456px; }
  .f5-steps { width: 100%; }
  .f5-side { align-self: stretch; }
  .f5-ring { width: 96px; height: 96px; }
}

/* v28 - 1. One restrained palette (premium SaaS dashboards - Linear, Stripe, Vercel - keep surfaces neutral, one accent
   colour, charts in tones of that accent, and colour for meaning only). Chart colours are re-pointed to the brand blue
   scale; green stays only for success. These redefine the dev-to-add chart tokens; values are this side's own p-* scale. */
:root {
  --color-fnl-new: #E3E9F8;
  --color-fnl-contacted: #D3DDF5;
  --color-fnl-requested: #C3D1F1;
  --color-fnl-scheduled: #B2C3EC;
  --color-fnl-completed: #A1B5E8;
  --color-fnl-application: #90A7E3;
  --color-app-applied: var(--color-p-100);
  --color-app-review: var(--color-p-200);
  --color-app-shortlisted: var(--color-p-300);
  --color-app-interview: var(--color-p-400);
  --color-app-hired: var(--color-ok);
  --color-staff-signed: var(--color-p-500);
  --color-staff-invited: var(--color-p-200);
  --color-staff-not-invited: var(--color-less-grey);
  --color-social-superschools: var(--color-p-400);
  --color-social-facebook: var(--color-p-400);
  --color-social-instagram: var(--color-p-400);
  --color-social-google: var(--color-p-400);
}
/* job status: neutral label with a small status dot */
.jchip, .jchip--open, .jchip--closed, .jchip--draft, .jchip--archived { gap: 6px; color: var(--color-ink-2); background: var(--color-paper); border: 1px solid var(--color-line); font-weight: 600; }
.jchip::before { content: ""; width: 6px; height: 6px; flex-shrink: 0; border-radius: var(--r-pill); background: var(--jdot, var(--color-ink-3)); }
.jchip--open { --jdot: var(--color-ok); }
.jchip--closed { --jdot: var(--color-red); }
.jchip--draft { --jdot: var(--color-warn); }
.jchip--archived { --jdot: var(--color-less-grey); }
/* Admissions side card: neutral surface; the ring and the button carry the colour */
.f5-side, .f5-side.is-act, .f5-side.is-win { background: var(--color-mist); box-shadow: inset 0 0 0 1px var(--color-line); }
/* softer icon tiles in the community list */
.cm-ic { background: var(--color-mist); color: var(--color-p-500); box-shadow: inset 0 0 0 1px var(--color-line); }

/* v28 - 2. Claim and School details: done and pending each in its own colour */
.lp-done { font-weight: 600; color: var(--color-p-600); }
.lp-pend { font-weight: 600; color: var(--color-warn); }

/* v28 - 3. My Staff gauge uses the room it has; Applications scrolls sideways on a narrow card */
.staff-gauge-graphic { width: 360px; }
.staff-gauge-mid b { font-size: 48px; }
.staff-gauge-mid span { font-size: 14px; }
@container (max-width: 419px) { .staff-gauge-graphic { width: 280px; } .staff-gauge-mid b { font-size: 40px; } }
@container (max-width: 419px) {
  .mcard--apps .stair-wrap { overflow-x: auto; overflow-y: hidden; padding-bottom: 8px; scrollbar-width: thin; scrollbar-color: var(--color-less-grey) var(--color-mist-2); }
  .mcard--apps .stair { min-width: 460px; gap: 6px; }
  .mcard--apps .st-name { white-space: nowrap; overflow-wrap: normal; min-height: 18px; font-size: 11.5px; }
}

/* v29 - 3. list scrollbars grey, not blue */
.jlist { scrollbar-color: var(--color-less-grey) var(--color-mist-2); }

/* v30 - 2. Jobs: the list plus a short, wide "post a job" card that takes the room left under a short list; the area
   keeps the height of five rows, so the card is the same size with 1 job or 5 */
.jobs-area { display: flex; flex-direction: column; min-height: 0; }
.mcard--jobs .mcard-body > .jobs-area { flex: 1 1 auto; }
.jobs-area.has-promo { gap: 12px; min-height: var(--jobs-fit, 285px); }
.jobs-area.has-promo .jlist { flex: none; min-height: 0; max-height: none; contain: none; overflow: visible; }
.jpromo { flex: 1 1 auto; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; align-content: center; gap: 12px 16px; padding: 16px; border-radius: var(--r-lg); background: var(--color-mist); box-shadow: inset 0 0 0 1px var(--color-line); }
.jpromo-txt { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.jpromo-btn { align-self: center; }
@container (max-width: 519px) {
  .jpromo { grid-template-columns: auto minmax(0, 1fr); }
  .jpromo-btn { grid-column: 1 / -1; justify-content: center; width: 100%; }
}

/* v30 - same card size in every state: the jobs area may shrink to the card; the promo card is tighter on a phone;
   the Applications body keeps the room the "interested teachers" card needs */
.jobs-area, .mcard--jobs .mcard-body > * { min-width: 0; }
@container (max-width: 519px) { .jpromo { padding: 12px; gap: 8px 12px; } }

/* v31 - 1. Applications pipeline (applications-v3 V1): chevrons over a message panel */
.mcard--apps .mcard-body { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; margin-top: 14px; min-height: 0; }
.v1 { display: flex; flex-direction: column; gap: 22px; }
.v1-pipe { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 3px; margin: 0; padding: 0; list-style: none; }
.v1-chev { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 84px; padding: 0 14px 0 20px; text-align: center; }
.v1-chev::before { content: ""; position: absolute; inset: 0; background: var(--fill, var(--color-mist-2)); clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%, 14px 50%); }
.v1-chev:first-child::before { clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%); border-radius: var(--r-sm) 0 0 var(--r-sm); }
.v1-chev:first-child { padding-left: 10px; }
.v1-chev.is-off::before { background: var(--color-line); }
.v1-chev.is-off::after { content: ""; position: absolute; inset: 1.5px 2px; background: var(--color-paper); clip-path: polygon(0 0, calc(100% - 13px) 0, 100% 50%, calc(100% - 13px) 100%, 0 100%, 13px 50%); }
.v1-n, .v1-name { position: relative; z-index: 1; }
.v1-n { font-size: 20px; line-height: 1.1; font-weight: 800; color: var(--on, var(--color-ink)); font-variant-numeric: tabular-nums; min-height: 22px; }
.v1-name { font-size: 12px; line-height: 1.25; font-weight: 600; color: var(--on, var(--color-ink-2)); }
.v1-chev.is-off .v1-name { color: var(--color-ink-3); font-weight: 500; }
.f-1 { --fill: var(--color-p-100); --on: var(--color-ink); }
.f-2 { --fill: var(--color-p-200); --on: var(--color-ink); }
.f-3 { --fill: var(--color-p-300); --on: var(--color-ink); }
.f-4 { --fill: var(--color-p-400); --on: var(--color-paper); }
.f-5 { --fill: var(--color-ok); --on: var(--color-paper); }
.nm-short { display: none; }
.v1-panel { display: flex; align-items: center; gap: 14px; padding: 16px; min-height: 113px; border-radius: var(--r-lg); background: var(--color-mist); box-shadow: inset 0 0 0 1px var(--color-line); }
.v1-panel.is-win { background: var(--color-ok-bg); box-shadow: inset 0 0 0 1px var(--color-ok-line); }
.v1-txt { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.v1-rate { font-size: 34px; line-height: 1; font-weight: 800; color: var(--color-ok); font-variant-numeric: tabular-nums; }
.v1-from { flex: 0 1 auto; font-size: 14px; line-height: 1.45; color: var(--color-ink-2); }
.v1-from b { color: var(--color-ink); }
.a3-ic { display: flex; align-items: center; justify-content: center; flex-shrink: 0; width: 34px; height: 34px; border-radius: var(--r-pill); background: var(--color-paper); color: var(--color-p-500); box-shadow: inset 0 0 0 1px var(--color-p-100); }
.a3-ic.is-win { color: var(--color-ok); box-shadow: inset 0 0 0 1px var(--color-ok-line); }
.a3-ic .ic { width: 17px; height: 17px; }
.a3-t { font-size: 15px; line-height: 1.35; font-weight: 700; color: var(--color-ink); }
.a3-t b { color: var(--color-p-600); font-variant-numeric: tabular-nums; }
.a3-s { font-size: 13px; line-height: 1.45; color: var(--color-ink-2); }
.a3-k { font-size: 12.5px; line-height: 1.3; font-weight: 600; color: var(--color-ink-3); }
.a3-dash { font-size: 28px; font-weight: 800; color: var(--color-ink-3); }
.a3-dash span { font-size: 13px; font-weight: 500; }
.a3-act { min-height: 40px; padding: 0 14px; font-size: 13.5px; gap: 6px; white-space: nowrap; }
.a3-act .ic { width: 15px; height: 15px; }
@container (max-width: 459px) { .nm-full { display: none; } .nm-short { display: inline; } }
@container (max-width: 519px) {
  .v1-chev { height: 72px; padding: 0 8px 0 14px; }
  .v1-chev:first-child { padding-left: 6px; }
  .v1-n { font-size: 16px; }
  .v1-name { font-size: 11px; }
  .v1-panel { flex-wrap: wrap; min-height: 215px; align-content: center; }
  .v1-panel .a3-act { flex: 1 1 100%; justify-content: center; }
}

/* v31 - 3. Jobs: the "post a job" card on top of the list, only as tall as its content; the area always keeps room for
   the card plus five rows, so the Jobs card is the same size with or without it */
.jobs-area, .jobs-area.has-promo { --promo-room: 24px; gap: 12px; min-height: calc(var(--jobs-fit, 277px) + var(--promo-room)); }
.jobs-area .jlist, .jobs-area.has-promo .jlist, .mcard--jobs .jobs-area .jlist { flex: 1 1 auto; min-height: 0; max-height: none; contain: size; overflow-y: auto; }
.jpromo { flex: none; padding: 12px 16px; align-content: normal; }
@container (max-width: 519px) { .jobs-area, .jobs-area.has-promo { --promo-room: 110px; } }

/* v32 - 3. Jobs and Applications sized to their content and to each other. Jobs: the prompt card plus three rows (the
   list scrolls past three), the same in every state. Applications: taller steps and the message panel stacked (icon,
   text, button) so its content fills the same height instead of leaving bands of white above and below */
.jobs-area, .jobs-area.has-promo { --promo-room: 79px; min-height: calc(var(--jobs-fit, 277px) - 114px + var(--promo-room)); }
/* the prompt keeps its one-row layout down to a 400px card (two-line title room there), stacks below that */
@container (max-width: 519px) {
  .jpromo { grid-template-columns: auto minmax(0, 1fr) auto; min-height: 88px; }
  .jpromo-btn { grid-column: auto; width: auto; }
  .jobs-area, .jobs-area.has-promo { --promo-room: 100px; }
}
@container (max-width: 399px) {
  .jpromo { grid-template-columns: auto minmax(0, 1fr); min-height: 160px; }
  .jpromo-btn { grid-column: 1 / -1; width: 100%; }
  .jobs-area, .jobs-area.has-promo { --promo-room: 172px; }
}
.mcard--apps .mcard-body { justify-content: flex-start; margin-top: 16px; }
.v1 { flex: 1 1 auto; gap: 14px; }
.v1-chev { height: 96px; }
.v1-panel { flex: 1 1 auto; flex-direction: column; align-items: flex-start; justify-content: center; gap: 10px; min-height: 0; padding: 16px 18px; }
.v1-panel .v1-txt { flex: none; }
@container (max-width: 519px) {
  .v1-chev { height: 72px; }
  .v1-panel { flex-direction: row; flex-wrap: wrap; align-items: center; min-height: 0; }
  .v1-panel .v1-txt { flex: 1 1 160px; }
}
@container (max-width: 399px) { .v1-panel { min-height: 205px; } }

/* v33 - 1. My Staff: the sign-up gauge with a message card beside it (stacked below a 520px card), the same parts as
   the Admissions side card */
.mcard[data-module="staff"] .mcard-body { flex: 1 1 auto; display: flex; flex-direction: column; }
.staff-split { flex: 1 1 auto; display: grid; grid-template-columns: minmax(0, 1fr) 212px; gap: 20px; align-items: center; margin-top: 16px; }
.staff-split .staff-gauge { min-height: 0; }
.staff-split .staff-gauge-graphic { width: 300px; }
.staff-split .staff-gauge-mid b { font-size: 42px; }
.staff-split .staff-gauge-line { font-size: 13.5px; line-height: 1.6; }
.staff-side { align-self: center; }
@container (max-width: 519px) {
  .staff-split { grid-template-columns: minmax(0, 1fr) 184px; gap: 14px; }
  .staff-split .staff-gauge-graphic { width: 100%; }
  .staff-split .staff-gauge-mid b { font-size: 32px; }
  .staff-split .staff-gauge-line { font-size: 12.5px; }
  .staff-side { padding: 14px; }
}
@container (max-width: 399px) {
  .staff-split { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .staff-split .staff-gauge-graphic { width: 260px; }
  .staff-side { align-self: stretch; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 12px; gap: 8px 12px; min-height: 172px; align-content: center; }
  .staff-side > .f5-txt { flex: 1 1 160px; min-width: 0; }
  .staff-side .f5-btn { flex: 1 1 100%; justify-content: center; }
}

/* v33 - the caption under the gauge keeps room for three lines on a narrow card, so a long one does not resize it;
   the "post a job" card sits right under the job rows - any room left is at the bottom of the area */
@container (max-width: 399px) { .staff-split .staff-gauge-line { min-height: 4.8em; } }
.jobs-area .jlist, .jobs-area.has-promo .jlist, .mcard--jobs .jobs-area .jlist { flex: 0 1 auto; contain: none; max-height: calc(var(--jobs-fit, 277px) - 114px); }

/* v34 - 1-3. profile cards: no pill, a descriptive title, the count as the lead line */
.pcard--setup .setup-text, .pcard--dring .setup-text { margin-top: 0; }
.pcard--setup .setup-steps, .pcard--dring .setup-steps { font-size: 17px; line-height: 1.35; font-weight: 700; color: var(--color-ink); }
.pcard--setup .setup-progress { margin-top: 14px; }
.pcard--setup .setup-segs { margin-top: 12px; height: 8px; }
.pcard--setup .setup-seg { height: 8px; }
.pcard--dring { grid-template-rows: auto auto 1fr auto; grid-template-areas: "text ring" "left ring" ". ring" "act act"; }
.pcard--dring .dr-left { margin-top: 14px; }
.pcard--setup .setup-title, .pcard--dring .setup-title { min-height: 2.6em; }
.pcard--dring .dr-ring { width: 112px; height: 112px; margin-top: 0; }
.pcard--dring .dr-pct { font-size: 24px; }
@container (max-width: 419px) {
  .pcard--setup .setup-title, .pcard--dring .setup-title { min-height: 3.9em; }
  .pcard--setup .setup-steps { min-height: 2.7em; }
}
/* the card is the container, so its own grid changes on the screen widths where the profile cards are narrow
   (one per row on a phone, two per row from 768 to 1023px) */
@media (max-width: 451px), (min-width: 768px) and (max-width: 1023px) {
  .pcard--dring { grid-template-rows: auto auto 1fr auto; grid-template-areas: "text text" "left ring" ". ." "act act"; }
}
@container (max-width: 419px) {
  .pcard--dring .dr-ring { width: 88px; height: 88px; margin-top: 10px; align-self: start; }
  .pcard--dring .dr-pct { font-size: 20px; }
  .pcard--dring .setup-steps { min-height: 4.05em; }
}

/* v34 - 4. Applications: the step names alone, centred in each step; the message panel one row (icon, text, button)
   like the Jobs card, wrapping at the same widths */
.v1 { gap: 14px; }
.v1-pipe { flex: 1 1 auto; min-height: 72px; }
.v1-chev { height: auto; min-height: 72px; justify-content: center; }
.v1-name { font-size: 13px; line-height: 1.3; }
.v1-panel { flex: none; flex-direction: row; align-items: center; justify-content: flex-start; gap: 12px 16px; padding: 12px 16px; min-height: 108px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; }
.v1-panel .v1-txt { flex: none; }
.v1-panel .a3-act { align-self: center; }

/* v34 - 5. cards that sit side by side change layout at the same card widths:
   Admissions and My Staff stack below a 520px card; Jobs' and Applications' message rows keep one row down to a 400px
   card (with two-line room) and stack below it */
@container (max-width: 519px) {
  .staff-split { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .staff-split .staff-gauge-graphic { width: 260px; }
  .staff-side { align-self: stretch; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 12px; gap: 8px 12px; min-height: 176px; align-content: center; }
  .staff-side > .f5-txt { flex: 1 1 160px; min-width: 0; }
  .staff-side .f5-btn { flex: 1 1 100%; justify-content: center; }
  .v1-chev { min-height: 64px; height: auto; }
  .v1-panel { flex-wrap: nowrap; grid-template-columns: auto minmax(0, 1fr) auto; min-height: 108px; }
  .v1-panel .a3-act { flex: none; width: auto; }
}
@container (max-width: 399px) {
  .v1-panel { grid-template-columns: auto minmax(0, 1fr); min-height: 200px; }
  .v1-chev { padding: 0 4px 0 12px; }
  .v1-chev:first-child { padding-left: 4px; }
  /* too narrow for five names in a row: the steps stack as full-width rows, full names, same fills */
  .v1-pipe { grid-template-columns: minmax(0, 1fr); gap: 3px; }
  .v1-chev, .v1-chev:first-child { min-height: 30px; height: 30px; padding: 0 12px; }
  .v1-chev::before, .v1-chev:first-child::before { clip-path: none; border-radius: var(--r-xs); }
  .v1-chev.is-off::after { clip-path: none; inset: 1.5px; border-radius: 3px; }
  .v1-name { font-size: 12.5px; }
  .v1-name .nm-full { display: inline; }
  .v1-name .nm-short { display: none; }
  .v1-panel .a3-act { grid-column: 1 / -1; width: 100%; justify-content: center; }
}

/* v35 - 3. profile cards: no reserved title room, a smaller grey count, one bar each, the button straight after */
.pcard--setup .setup-title { min-height: 0; }
.pcard--setup .setup-steps { min-height: 0; font-size: 15px; line-height: 1.4; font-weight: 600; color: var(--color-ink-3); }
.pcard--setup .setup-progress { margin-top: 10px; }
.pcard--setup .setup-segs { margin-top: 10px; }
.pcard--setup .setup-action { padding-top: 18px; }
.dr-bar { position: relative; height: 8px; margin-top: 10px; border-radius: 1px; background: var(--color-line); overflow: hidden; }
.dr-bar-fill { display: block; height: 100%; width: 0; background: var(--color-p-500); }
.pcard--details.is-done .dr-bar-fill { background: var(--color-ok); }

/* v35 - 2. Jobs sized by its content: the list shows every job up to four without a scrollbar and scrolls only past
   four; the prompt card follows the list. Applications takes the same height: its steps grow (up to 172px) and any
   space beyond that goes between the steps and the message */
.jobs-area, .jobs-area.has-promo { min-height: 0; }
.jobs-area .jlist, .jobs-area.has-promo .jlist, .mcard--jobs .jobs-area .jlist { flex: none; contain: none; min-height: 0; max-height: var(--jlist-fit, 220px); }
.mcard--apps .mcard-body { justify-content: flex-start; }
.v1 { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: space-between; gap: 14px; }
.v1-pipe { flex: 1 1 auto; min-height: 72px; max-height: 172px; }
.v1-panel, .mcard--apps .v1-panel { min-height: 0; }
@container (max-width: 519px) { .v1-pipe { min-height: 64px; } .v1-panel, .mcard--apps .v1-panel { min-height: 0; } }
@container (max-width: 399px) { .v1-pipe { flex: none; max-height: none; min-height: 0; } .v1-panel, .mcard--apps .v1-panel { min-height: 0; } }

/* v36 - 1. Applications: steps at their own height, centred in the room above the message (equal space above and below
   them) instead of stretching; the full step names always, smaller on a narrow card; below a 1200px screen the
   message reads top to bottom - icon, title, text, button */
.v1 { justify-content: flex-start; padding-top: 14px; }
.v1-pipe, .mcard--apps .v1-pipe { flex: none; height: auto; min-height: 0; max-height: none; margin-top: auto; margin-bottom: auto; }
.v1-chev { min-height: 84px; }
.v1 > .v1-panel { flex: none; }
.v1-name .nm-full { display: inline; }
.v1-name .nm-short { display: none; }
@container (max-width: 519px) { .v1-chev { min-height: 72px; } .v1-name { font-size: 11.5px; } }
@container (max-width: 459px) { .v1-name .nm-full { display: inline; } .v1-name .nm-short { display: none; } .v1-name { font-size: 10.5px; } .v1-chev { padding: 0 8px 0 16px; } .v1-chev:first-child { padding-left: 6px; } }
@container (max-width: 399px) { .v1-chev, .v1-chev:first-child { min-height: 30px; padding: 0 12px; } .v1-name { font-size: 12.5px; } }
@media (max-width: 1199px) {
  .v1-panel, .mcard--apps .v1-panel { display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
  .v1-panel .v1-txt { flex: none; width: 100%; }
  .v1-panel .a3-act, .mcard--apps .v1-panel .a3-act { flex: none; width: auto; justify-content: center; align-self: flex-start; }
}
@media (max-width: 1199px) { @container (max-width: 399px) { .v1-panel .a3-act { width: 100%; } } }

/* v36 - 2. My Staff, stacked (below a 520px card): the message card is only as tall as its content; the gauge takes
   the room left, centred, with equal space above and below */
@container (max-width: 519px) {
  .staff-split { display: flex; flex-direction: column; align-items: stretch; gap: 16px; }
  .staff-split .staff-gauge { flex: none; margin-top: auto; margin-bottom: auto; }
  .staff-split .staff-gauge-graphic { width: 300px; max-width: 100%; }
  .staff-side { flex: none; min-height: 0; }
}

/* Toast - common/Toast.tsx */
.toast-region { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 50; pointer-events: none; }
.toast { margin-bottom: 8px; background: var(--color-paper); border: 2px solid var(--toast-border); border-radius: var(--r); box-shadow: var(--toast-shadow); padding: 12px 16px; min-width: 320px; max-width: 500px; display: flex; align-items: center; gap: 12px; animation: toast-in 300ms ease-out; }
@media (max-width: 560px) { .toast { min-width: 0; width: calc(100vw - 32px); max-width: calc(100vw - 32px); } }
.toast-tick { width: 24px; height: 24px; border-radius: var(--r-pill); background: var(--toast-tick); color: var(--color-paper); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.toast-tick svg { width: 15px; height: 15px; stroke-width: 3; }
.toast-text { flex: 1; font-size: 14px; line-height: 1.625; font-weight: 500; color: var(--toast-text); }
@keyframes toast-in { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } }

/* Embedded in the console shell (index.html): the shell owns the sidebar + top navigation, so this page carries only its content and the school switcher. */
.shell { height: 100vh; }
.main { height: 100vh; }
.content { padding: 0 !important; }

:root{--ss-gx:12px}@media(min-width:768px){:root{--ss-gx:24px}}@media(min-width:1024px){:root{--ss-gx:48px}}
.page{padding:16px var(--ss-gx)!important}
</style>

const DAY_MS = 86400000;
const TODAY = '2026-10-24';
const HISTORY_DAYS = 56;
const MIN_DATE = '2023-01-01';
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONTHS_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const WEEKDAYS = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];

function pad2(n) { return (n < 10 ? '0' : '') + n; }
function dayNum(ymd) { const p = ymd.split('-'); return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / DAY_MS); }
function numDay(n) { const t = new Date(n * DAY_MS); return t.getUTCFullYear() + '-' + pad2(t.getUTCMonth() + 1) + '-' + pad2(t.getUTCDate()); }
function dateParts(ymd) { const p = ymd.split('-'); return { y: +p[0], m: +p[1] - 1, d: +p[2] }; }
function fmtDMY(ymd) { const p = ymd.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
function fmtDayMonth(ymd) { const p = dateParts(ymd); return p.d + ' ' + MONTHS[p.m]; }
function fmtFull(ymd) { return fmtDayMonth(ymd) + ' ' + ymd.slice(0, 4); }
function fmtLong(ymd) { const p = dateParts(ymd); return p.d + ' ' + MONTHS_LONG[p.m] + ' ' + p.y; }
const HISTORY_START = numDay(dayNum(TODAY) - HISTORY_DAYS + 1);
const SPAN_START = dayNum(MIN_DATE);
const SPAN_DAYS = dayNum(TODAY) - SPAN_START + 1;

function esc(v) {
  return String(v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function icon(name, extra) {
  return '<svg class="ic' + (extra ? ' ' + extra : '') + '" data-icon="' + name + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICONS[name] + '</svg>';
}
function fmt(n) { return Number(n).toLocaleString('en-IN'); }
function clone(o) { return JSON.parse(JSON.stringify(o)); }

function applyCase(src, caseKey) {
  const d = clone(src);
  if (caseKey === 'zero-enquiries') {
    d.crm.stages.forEach((s) => { s.value = 0; });
    d.crm.enquiries = 0; d.crm.visits = 0; d.crm.applications = 0; d.crm.admissions = 0; d.crm.recent = [];
    d.typeSection.grades.forEach((g) => { g.value = 0; });
  }
  if (caseKey === 'missing') {
    d.crm.visits = null; d.reviews.rating = null;
    d.reviews.categories.forEach((c) => { c.value = null; });
    d.typeSection.facts[d.typeSection.facts.length - 1].value = null;
  }
  if (caseKey === 'large') {
    d.crm.stages.forEach((s) => { s.value *= 100; });
    d.typeSection.grades.forEach((g) => { g.value *= 100; });
    d.crm.enquiries *= 100; d.crm.visits *= 100; d.crm.applications *= 100; d.crm.admissions *= 100;
    d.staff.teams.forEach((t) => { t.value *= 10; });
    d.staff.total *= 10;
    d.staff.signedUp *= 10;
    d.staff.invited *= 10;
  }
  if (caseKey === 'single') {
    d.crm.stages.forEach((s, i) => { s.value = i === 0 ? 1 : 0; });
    d.crm.enquiries = 1; d.crm.visits = 0; d.crm.applications = 0; d.crm.admissions = 0;
    d.typeSection.grades.forEach((g, i) => { g.value = i === 0 ? 1 : 0; });
    d.hr.statuses.forEach((s, i) => { s.value = i === 0 ? 1 : 0; });
    d.hr.openJobs = 1; d.hr.applications = 1; d.hr.interviews = 0; d.hr.hired = 0;
    d.hr.jobs = d.hr.jobs.filter((j) => j.status === 'Open').slice(0, 1).map((j) => Object.assign(j, { applicants: 1 }));
    d.reviews.count = 1; d.gallery.photos = 1; d.gallery.posts = 1;
    d.gallery.platforms.forEach((p, i) => { p.value = i === 0 ? 1 : 0; });
    d.staff.teams.forEach((t, i) => { t.value = i === 0 ? 1 : 0; });
    d.staff.total = 1; d.staff.invited = 1; d.staff.signedUp = 0;
  }
  const jobsIn = (s) => d.hr.jobs.filter((j) => j.status === s).length;
  d.hr.openJobs = jobsIn('Open'); d.hr.closedJobs = jobsIn('Closed'); d.hr.draftJobs = jobsIn('Draft'); d.hr.archivedJobs = jobsIn('Archived');
  d.hr.shortlisted = d.hr.statuses.find((s) => s.name === 'Shortlisted').value;
  d.crm.daily = dailySeries(d.crm.admissions, 'admissions');
  return d;
}

function buildData() {
  state.types.forEach((t) => {
    const built = state.initial ? applyCase(FIXTURES.initial[t], 'normal') : applyCase(state.school.types[t], state.caseKey);
    state.data[t] = applyRange(built, t);
  });
}

function loadData() {
  buildData();
  state.detailsBoost = {};
}

function readQuery() {
  const q = new URLSearchParams(location.search);
  let saved = null; try { saved = localStorage.getItem('ssSchool'); } catch (e) {}
  const school = FIXTURES.schools.find((s) => s.id === q.get('school')) || FIXTURES.schools.find((s) => s.id === saved) || FIXTURES.schools.find((s) => s.id === 'green-valley');
  state.school = school;
  state.caseKey = FIXTURES.cases[q.get('case')] ? q.get('case') : 'normal';
  state.role = ['owner', 'administrator', 'other'].includes(q.get('role')) ? q.get('role') : 'owner';
  state.types = FIXTURES.orderOfTypes.filter((t) => school.types[t]);
  const qt = q.get('type');
  state.defaultType = state.types.includes(qt) ? qt : state.types[0];
  state.initial = q.get('demo') === 'initial';
  loadData();
  state.pageError = state.caseKey === 'page-error';
  state.signedOut = state.caseKey === 'signed-out';
  state.sessionEnded = state.caseKey === 'session-ended';
  if (state.caseKey === 'card-error') state.cardErrors.add('jobs');
  const sq = q.get('social');
  const sqMap = { before: 'superschools', 'linked-one': 'facebook', linked: 'all', posted: 'all' };
  const sq2 = sqMap[sq] || sq;
  state.social = COPY.demo.stages.some((s) => s[0] === sq2) ? sq2 : null;
  const step = q.get('step'), st = q.get('state');
  if (step && st) state.force = { step, state: st };
}

function currentType() {
  const hs = history.state;
  if (hs && hs.type && state.types.includes(hs.type)) return hs.type;
  return state.type || state.defaultType;
}
