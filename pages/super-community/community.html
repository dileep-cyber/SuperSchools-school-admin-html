<style id="styles">
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font-sans); color: var(--color-ink); background: var(--color-background-grey); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
h1, h2, h3, p, ul, ol, figure { margin: 0; padding: 0; }
ul, ol { list-style: none; }
svg { flex-shrink: 0; }
img { display: block; }
.material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-weight: normal; font-style: normal; line-height: 1; letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap; direction: ltr; font-variation-settings: 'FILL' 0, 'wght' 400; }
.hide-scrollbar { scrollbar-width: none; -ms-overflow-style: none; }
.hide-scrollbar::-webkit-scrollbar { display: none; }

/* ---------- Shell: Shell.tsx, SideMenu.tsx, TopMenuBar.tsx, MobileNav.tsx ---------- */
.app { position: relative; display: flex; width: 100%; height: 100vh; overflow: hidden; background: var(--color-background-grey); }

.sidebar-toggle { display: none; position: absolute; top: 6px; left: 14px; z-index: 50; width: 36px; height: 36px; align-items: center; justify-content: center; padding: 0; border: 0; background: none; color: var(--white-90); transition: color 0.3s ease-in-out; }
.sidebar-toggle:hover { color: var(--color-paper); }
.sidebar-toggle:focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: var(--r); }
.sidebar-toggle .pin { display: none; font-size: 26px; transform: rotate(45deg); }
.app[data-peek="true"][data-collapsed="true"] .sidebar-toggle .pin { display: inline-block; }
.app[data-peek="true"][data-collapsed="true"] .sidebar-toggle .panel-icon { display: none; }

.edge-trigger { display: none; position: fixed; top: 0; left: 0; z-index: 30; width: 32px; height: 100%; }

.sidebar { display: none; position: absolute; top: 0; left: 0; z-index: 40; flex-direction: column; flex-shrink: 0; height: 100%; width: 0; overflow: hidden; background: var(--color-blue); transition: width 0.3s ease-in-out; }
.sidebar__inner { width: var(--sidebar-w); height: 100%; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; padding: 48px 0 var(--sp-4); }
.sidebar__nav { display: flex; flex: 1; flex-direction: column; align-items: stretch; width: 100%; min-height: 0; overflow-y: auto; }
.side-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--sp-1); width: 100%; height: 72px; min-height: 72px; flex-shrink: 0; padding: 0 var(--sp-1); border: 0; border-radius: 0; background: transparent; color: var(--white-90); font-size: var(--fs-11); line-height: 1.25; text-align: center; font-weight: 500; transition: background-color 0.15s, color 0.15s; }
.side-item:hover { background: var(--white-hover); color: var(--color-paper); }
.side-item:focus-visible { outline: none; box-shadow: inset var(--focus-ring); }
.side-item .material-symbols-outlined { font-size: 24px; }
.side-item__label { display: flex; flex-direction: column; align-items: center; }
.side-item[aria-current="page"] { position: relative; z-index: 10; background: var(--color-paper); color: var(--color-blue); font-weight: 600; }
.side-item[aria-current="page"]:hover { background: var(--color-paper); color: var(--color-blue); }

.main { display: flex; flex: 1; flex-direction: column; height: 100vh; min-height: 0; min-width: 0; overflow: hidden; }

.topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 30; display: flex; align-items: center; flex-shrink: 0; height: var(--header-h); padding: 0 var(--sp-3); border-bottom: 1px solid var(--color-blue); background: var(--color-blue); color: var(--color-paper); transition: background-color 0.3s ease-in-out, border-color 0.3s ease-in-out; }
.topbar__inner { display: flex; align-items: center; gap: var(--sp-3); width: 100%; min-width: 0; height: 100%; }
.topbar__tabs { display: flex; flex: 1; align-items: stretch; min-width: 0; height: 100%; overflow-x: auto; }
/* Community links: one line each ("Preschool Community"); the row scrolls sideways on narrow screens */
.tab { position: relative; display: inline-flex; flex-direction: row; align-items: center; justify-content: center; flex-shrink: 0; height: 100%; padding: 0 var(--sp-3); border: 0; border-radius: 0; background: transparent; font-size: var(--fs-13); line-height: 16px; font-weight: 500; text-align: left; white-space: nowrap; color: var(--white-70); }
.tab:hover { color: var(--color-paper); }
.tab[aria-current="page"] { color: var(--color-paper); font-weight: 600; }
.tab[aria-current="page"]::after { content: ''; position: absolute; left: var(--sp-2); right: var(--sp-2); bottom: 0; height: 2.5px; border-radius: 999px 999px 0 0; background: var(--color-paper); }
.tab:focus-visible { outline: none; box-shadow: inset var(--focus-ring); }
.topbar__icons { display: flex; align-items: center; gap: var(--sp-2); flex-shrink: 0; }
.icon-btn { position: relative; display: none; align-items: center; justify-content: center; width: 36px; height: 36px; padding: 0; border: 1px solid var(--white-30); border-radius: var(--r-pill); background: transparent; color: var(--color-paper); transition: background-color 0.15s, border-color 0.15s, color 0.15s; }
.icon-btn:hover { background: var(--white-hover); border-color: var(--white-60); }
.icon-btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.icon-btn .material-symbols-outlined { font-size: 20px; }
.icon-btn--always { display: inline-flex; }
.icon-btn__dot { position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: var(--r-pill); background: var(--tw-red-500); box-shadow: 0 0 0 2px var(--color-blue); }

/* School switcher: the reference page's .sw-trigger and switch panel */
.switch { position: relative; flex-shrink: 0; }
.sw-trigger { display: inline-flex; align-items: center; gap: var(--sp-2); max-width: 280px; height: 36px; padding: 0 10px 0 var(--sp-2); border: 1px solid var(--color-on-dark-line); border-radius: var(--r-pill); background: transparent; color: var(--color-paper); transition: border-color var(--t-1), background-color var(--t-1); }
.sw-trigger:hover { background: var(--color-on-dark-glow); }
.sw-trigger:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.sw-name { max-width: 84px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--fs-14); line-height: 20px; font-weight: 600; }
.sw-panel { position: fixed; top: calc(var(--header-h) + 6px); right: var(--sp-4); z-index: 60; width: min(280px, calc(100vw - 32px)); padding: var(--sp-2); border: 1px solid var(--color-line); border-radius: var(--r-lg); background: var(--color-paper); box-shadow: var(--sh-3); color: var(--color-ink); }
.sw-panel[hidden] { display: none; }
.sw-head { padding: var(--sp-2) 10px var(--sp-1); font-size: var(--fs-11); line-height: 16px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--color-ink-3); }
.sw-opt { position: relative; display: flex; flex-direction: column; justify-content: center; width: 100%; min-height: 52px; padding: var(--sp-2) 36px var(--sp-2) 10px; border: 0; border-radius: var(--r-sm); background: transparent; text-align: left; }
.sw-opt:hover, .sw-opt[data-active="true"] { background: var(--color-ghost-white); }
.sw-opt[aria-selected="true"] { background: var(--color-p-50); }
.sw-opt b { font-size: var(--fs-14); line-height: 20px; font-weight: 600; color: var(--color-ink); }
.sw-opt[aria-selected="true"] b { color: var(--color-blue); }
.sw-opt small { font-size: var(--fs-12); line-height: 16px; color: var(--color-ink-3); }
.sw-check { position: absolute; top: 50%; right: 10px; display: none; transform: translateY(-50%); color: var(--color-blue); }
.sw-opt[aria-selected="true"] .sw-check { display: inline-flex; }

.content { flex: 1; min-height: 0; overflow-y: auto; padding: var(--header-h) 0 var(--mobile-nav-h); background: var(--color-background-grey); transition: padding-left 0.3s ease-in-out; }

.mobile-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; display: flex; align-items: center; justify-content: space-between; height: var(--mobile-nav-h); padding: 0 var(--sp-1) var(--sp-1); background: var(--color-paper); border-top: 1px solid var(--color-less-grey); box-shadow: var(--sh-mobile-nav); }
.mobile-nav__item { display: flex; flex: 1; flex-direction: column; align-items: center; justify-content: center; min-width: 0; height: 48px; padding: 0 2px; border: 0; border-radius: var(--r-xl); background: transparent; color: var(--color-mid-grey); font-weight: 500; }
.mobile-nav__item[aria-current="page"] { color: var(--color-blue); font-weight: 600; }
.mobile-nav__item:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.mobile-nav__item .material-symbols-outlined { font-size: 22px; }
.mobile-nav__label { display: flex; flex-direction: column; align-items: center; width: 100%; margin-top: 2px; font-size: var(--fs-9); line-height: 1.15; text-align: center; }

/* ---------- Page frame: the reference page's .page (full width, 24px 32px) ---------- */
[data-step] { scroll-margin-top: 56px; }
.page { display: flex; flex-direction: column; gap: var(--sp-10); width: 100%; max-width: none; margin: 0; padding: var(--sp-4) var(--sp-4) var(--sp-18); }
.page-title { font-size: var(--fs-24); line-height: 32px; font-weight: 600; letter-spacing: -0.01em; color: var(--color-ink); }
.page-sub { margin-top: var(--sp-1); font-size: var(--fs-14); line-height: 20px; color: var(--color-ink-3); }
.page-sub__school { display: none; font-weight: 600; color: var(--color-ink-2); }
.section-title:focus { outline: none; }
.section-split { padding-top: var(--sp-10); border-top: 1px solid var(--color-divider); }
.section-title { font-size: var(--fs-20); line-height: 28px; font-weight: 600; letter-spacing: -0.01em; color: var(--color-ink); }

/* Buttons: ui/Button.tsx, sizes sm and md; variants primary and outline */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--sp-2); height: 36px; padding: 0 var(--sp-3); border: 1px solid transparent; border-radius: var(--r); font-size: var(--fs-14); font-weight: 500; white-space: nowrap; transition: background-color var(--t-1), color var(--t-1); }
.btn:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--color-paper), 0 0 0 4px var(--color-blue); }
.btn:disabled { opacity: 0.5; pointer-events: none; cursor: not-allowed; }
.btn--md { height: 44px; padding: 0 var(--sp-4); font-size: var(--fs-16); }
.btn--primary { background: var(--color-blue); color: var(--color-paper); }
.btn--primary:hover { background: var(--blue-90); }
.btn--outline { background: var(--color-paper); color: var(--tw-gray-700); border-color: var(--tw-gray-300); }
.btn--outline:hover { background: var(--tw-gray-50); }
.btn__spin { width: 16px; height: 16px; border-radius: var(--r-pill); border-bottom: 2px solid currentColor; animation: spin 1s linear infinite; }
.btn__row { display: flex; align-items: center; gap: var(--sp-2); }

/* Photo box: a real picture; if it cannot load, the compass tile shows instead */
.photo { position: relative; overflow: hidden; background: linear-gradient(155deg, #d7e7f9, #f6fbff); }
.photo::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 28% 22%, #ffffffb3 0 13%, transparent 14%), linear-gradient(158deg, transparent 0 60%, #80aecf35 61% 100%); pointer-events: none; }
.photo--north { background: linear-gradient(155deg, #d9e7ff, #8badc9); }
.photo--south { background: linear-gradient(155deg, #def4dd, #81bba5); }
.photo--west { background: linear-gradient(155deg, #f7e6cf, #c9a9a1); }
.photo--east { background: linear-gradient(155deg, #def1ff, #81bbc8); }
.photo__fallback { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.photo__fallback svg { width: 100%; height: 100%; min-width: 180px; }
.photo.is-loaded .photo__fallback { display: none; }
.photo-credit { display: none; position: absolute; bottom: 4px; left: 5px; z-index: 1; padding: 2px 5px; border-radius: 3px; background: #14243ac7; font-size: 9px; line-height: 12px; color: #fff; }
.photo-credit a { color: inherit; }
.photo.is-loaded .photo-credit { display: block; }

.photo img { position: relative; z-index: 1; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity var(--t-2) ease-out; }
.photo.is-loaded img { opacity: 1; }
.photo__fallback { color: var(--color-p-500); }
.photo.is-failed img { display: none; }
.photo.is-failed .photo__fallback { display: flex; }

.hero { position: relative; display: flex; flex-direction: column; gap: var(--sp-6); overflow: hidden; padding: var(--sp-6) var(--sp-5); border-radius: var(--r-dlg); background: linear-gradient(135deg, var(--color-p-50) 0%, var(--color-callout-bg) 55%, var(--color-paper) 100%); }
.hero::before { content: ''; position: absolute; top: -120px; right: -120px; width: 360px; height: 360px; border-radius: var(--r-pill); background: radial-gradient(circle, var(--blue-10) 0%, transparent 70%); pointer-events: none; }
.hero__grid { position: relative; display: grid; grid-template-columns: 1fr; gap: var(--sp-6); }
.hero__main { display: flex; flex-direction: column; gap: var(--sp-4); min-width: 0; }

.hero__eyebrow .chip { background: var(--color-paper); }
.hero__head { display: flex; align-items: flex-start; gap: var(--sp-4); }
.hero__ico { display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; flex-shrink: 0; border-radius: var(--r-xl); background: var(--color-paper); color: var(--color-blue); }
.hero__head .hero__titles { flex: 1; }

.hero__cta { flex-shrink: 0; margin-left: auto; }

.hero__titles { display: flex; flex-direction: column; gap: var(--sp-2); min-width: 0; }
.hero__cols { display: flex; flex-direction: column; gap: var(--sp-3); }

.hero__title { font-size: var(--fs-24); line-height: 32px; font-weight: 700; letter-spacing: -0.01em; color: var(--color-ink); }
.hero__tag { font-size: var(--fs-16); line-height: 24px; font-weight: 600; color: var(--color-blue); }
.hero__p { font-size: var(--fs-15); line-height: 24px; color: var(--color-ink-2); }
.hero__focus { position: relative; display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-4) var(--sp-5); border-radius: var(--r-xl); background: var(--color-paper); font-size: var(--fs-15); line-height: 24px; font-weight: 600; color: var(--color-ink); }

/* S9 Why join: full width. Icon + heading, then the reasons in a grid. No image, no borders, no hover. */
.why__head { display: flex; align-items: flex-start; gap: var(--sp-4); }
.why__head-ico { display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; flex-shrink: 0; border-radius: var(--r-xl); background: var(--color-p-50); color: var(--color-blue); }
.why { display: flex; flex-direction: column; gap: var(--sp-6); }

.why__lead { margin-top: var(--sp-1); font-size: var(--fs-16); line-height: 24px; color: var(--color-ink-2); }
/* Join steps: blue banner above the area groups */
.join { margin-bottom: var(--sp-10); padding: var(--sp-6) var(--sp-5); border-radius: var(--r-dlg); background: var(--color-blue); color: var(--color-paper); }

/* Number stepper: vertical on phones, three across with a connecting line from tablet up */
.join__steps { display: grid; grid-template-columns: 1fr; margin-top: var(--sp-4); }
.join__step { position: relative; display: flex; align-items: flex-start; gap: 14px; padding-bottom: var(--sp-5); }

.join__step::before { content: ''; position: absolute; left: 17px; top: 40px; bottom: 4px; width: 2px; border-radius: var(--r-pill); background: var(--white-30); }
.join__step:last-child::before { display: none; }
.join__step-num { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; flex-shrink: 0; border-radius: var(--r-pill); background: var(--color-paper); font-size: var(--fs-16); font-weight: 700; color: var(--color-blue); box-shadow: 0 0 0 4px var(--white-hover); }
.join__step b { display: block; padding-top: 6px; font-size: var(--fs-16); line-height: 24px; font-weight: 600; color: var(--color-paper); }
.join__step-text { display: block; margin-top: 2px; font-size: var(--fs-14); line-height: 21px; color: var(--white-70); }
.why__list { display: grid; grid-template-columns: 1fr; gap: var(--sp-4); }
.why__item { display: flex; flex-direction: column; gap: var(--sp-3); padding: var(--sp-5); border-radius: var(--r-xl); background: var(--color-paper); }
.why__item-head { display: flex; align-items: center; gap: var(--sp-3); }
.why__ico { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; flex-shrink: 0; border-radius: var(--r-lg); background: var(--color-p-50); color: var(--color-p-500); }
.why__title { font-size: var(--fs-16); line-height: 24px; font-weight: 600; color: var(--color-ink); }
.why__text { font-size: var(--fs-14); line-height: 22px; color: var(--color-ink-2); }
.why__item--free { background: var(--color-callout-bg); }
.why__item--free .why__ico { background: var(--color-paper); }

/* S4 Group cards: flat white cards (photo left, text right, action bottom right), 2 across. No border, shadow or hover. */
.groups__head { margin-bottom: var(--sp-5); }
.gcards { display: grid; grid-template-columns: 1fr; gap: var(--sp-4); }
.gcell { container-type: inline-size; }
.gcard { display: grid; grid-template-columns: 1fr; height: 100%; overflow: hidden; border-radius: var(--r-xl); background: var(--color-paper); }
.gcard__media { min-height: 176px; }
.gcard__dir { position: absolute; top: var(--sp-3); left: var(--sp-3); display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: var(--r-pill); background: var(--color-paper); font-size: var(--fs-13); line-height: 16px; font-weight: 600; color: var(--color-blue); }
.gcard__body { display: flex; flex-direction: column; gap: var(--sp-3); min-width: 0; padding: var(--sp-5); }
.gcard__title { font-size: var(--fs-17); line-height: 24px; font-weight: 700; letter-spacing: -0.01em; color: var(--color-ink); overflow-wrap: anywhere; }

.gcard__text { font-size: var(--fs-14); line-height: 22px; color: var(--color-ink-2); }
/* BPA locality coverage: shared component in all eight group layouts. */
.gcard__areas { display: flex; flex-direction: column; gap: 4px; min-width: 0; padding-top: 10px; border-top: 1px solid var(--color-line-soft); }

.groups__coverage-note { margin-top: 6px; font-size: var(--fs-12); line-height: 18px; color: var(--color-ink-3); }
.gv5 .gcard__areas { border-top-color: var(--white-30); }
.gv5 .gcard__areas-label { color: var(--color-paper); }
.gv5 .gcard__areas-text { color: var(--white-90); }

.gv7__action .btn { min-width:150px; }
.gcard__foot { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); margin-top: auto; padding-top: var(--sp-3); border-top: 1px solid var(--color-line-soft); }
.gcard__managed { display: flex; align-items: center; gap: 6px; font-size: var(--fs-13); line-height: 18px; color: var(--color-ink-3); }
.notice { display: flex; align-items: flex-start; gap: var(--sp-2); padding: var(--sp-2) 10px; border: 1px solid var(--color-warn-line); border-radius: var(--r-sm); background: var(--color-warn-bg); font-size: var(--fs-13); line-height: 1.45; color: var(--color-warn); }
.notice svg { margin-top: 1px; }
@container (min-width: 560px) {
  .gcard { grid-template-columns: 200px minmax(0, 1fr); }
  .gcard__media { min-height: 100%; }
}


/* Empty / error: common/EmptyState.tsx, common/ErrorState.tsx */
.card { overflow: hidden; border-radius: var(--r-xl); background: var(--color-paper); }
.state-box { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 40px var(--sp-4); text-align: center; }
.state-box__icon { display: flex; align-items: center; justify-content: center; width: 50px; height: 50px; color: var(--color-red); }
.state-box__title { font-size: var(--fs-20); font-weight: 600; color: var(--color-mid-grey); }
.state-box__text { font-size: var(--fs-14); color: var(--color-ink-2); }
.state-box .btn { margin-top: var(--sp-2); }

/* Skeleton */
.skel { display: block; background: var(--color-less-grey); border-radius: var(--r-sm); animation: pulse 2s ease-in-out infinite; }
.skel--media { width: 100%; height: 100%; min-height: 176px; border-radius: 0; }
.skel--chip { width: 120px; height: 28px; border-radius: var(--r-pill); }
.skel--line { width: 60%; height: 20px; }
.skel--para { width: 100%; height: 14px; }
.skel-media { position: relative; overflow: hidden; }
.skel--dir { position: absolute; top: var(--sp-3); left: var(--sp-3); width: 120px; height: 28px; border-radius: var(--r-pill); background: var(--color-paper); animation: none; opacity: 0.85; }
.skel--title-sm { width: 62%; height: 26px; }
.skel--count { width: 64px; height: 14px; }
.gv1__areas-heading { min-height: 20px; }
.skel-media .skel--media { position: absolute; inset: 0; min-height: 0; }
.skel-text { display: flex; flex-direction: column; gap: 12px; }
.skel--short { width: 70%; }
.skel--label { width: 96px; height: 14px; }
.skel--join { width: 100%; height: 46px; border-radius: var(--r); }
.skel--btn { width: 150px; height: 36px; align-self: flex-end; }
.skel--title { width: 70%; height: 32px; }
.skel--banner { width: 100%; height: 280px; border-radius: var(--r-dlg); }

/* Dialog: the product's Upload Photos dialog layout - header (title, status line, round close), dashed panel, footer with outline left / primary right */
.dlg-overlay { position: fixed; inset: 0; z-index: 70; background: var(--overlay); animation: fade-in var(--t-dialog) ease-out; }
.dlg { position: fixed; left: 50%; top: 50%; z-index: 71; display: flex; flex-direction: column; width: calc(100% - 32px); max-width: 640px; max-height: calc(100dvh - 32px); overflow: hidden; border-radius: var(--r-dlg); background: var(--color-paper); box-shadow: var(--sh-dlg); transform: translate(-50%, -50%); animation: dlg-in var(--t-dialog) ease-out; }
.dlg:focus { outline: none; }
.dlg__head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--sp-4); padding: var(--sp-5) var(--sp-6) var(--sp-4); border-bottom: 1px dashed var(--color-line); }
.dlg__title { font-size: var(--fs-20); line-height: 28px; font-weight: 700; letter-spacing: -0.01em; color: var(--color-ink); }
.dlg__desc { font-size: var(--fs-13); line-height: 18px; color: var(--color-ink-3); }
.dlg__close { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; flex-shrink: 0; padding: 0; border: 1px solid var(--color-less-grey); border-radius: var(--r-pill); background: var(--color-paper); color: var(--color-ink-2); transition: background-color var(--t-1), border-color var(--t-1); }
.dlg__close:hover { background: var(--color-ghost-white); border-color: var(--color-light-grey); }
.dlg__close:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--color-paper), 0 0 0 4px var(--color-blue); }
.dlg__body { display: flex; flex-direction: column; gap: var(--sp-4); min-height: 0; overflow-y: auto; padding: var(--sp-6); }
.dlg__panel { display: flex; flex-direction: column; align-items: center; gap: var(--sp-5); text-align: center; }
.dlg__tile { display: inline-flex; align-items: center; justify-content: center; width: 72px; height: 72px; border-radius: var(--r-xl); background: var(--color-p-50); color: var(--color-blue); }
.dlg__panel-title { font-size: var(--fs-17); line-height: 24px; font-weight: 700; color: var(--color-ink); }
.dlg__panel-sub { margin-top: 2px; font-size: var(--fs-14); line-height: 20px; color: var(--color-ink-3); }
.dlg__points { display: grid; grid-template-columns: 1fr; gap: var(--sp-3); width: 100%; text-align: left; }
.dlg__point { display: flex; gap: var(--sp-3); padding: var(--sp-3) 14px; border: 1px solid var(--color-line); border-radius: var(--r-lg); background: var(--color-paper); }
.dlg__point h3 { font-size: var(--fs-14); line-height: 20px; font-weight: 600; color: var(--color-ink); }
.dlg__point p { margin-top: 2px; font-size: var(--fs-13); line-height: 1.5; color: var(--color-ink-3); }
.tile-sm { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; flex-shrink: 0; border-radius: var(--r); background: var(--color-p-50); color: var(--color-p-500); }
.accept { display: flex; align-items: flex-start; gap: 10px; padding: var(--sp-3); border: 1px solid var(--color-line); border-radius: var(--r); background: var(--color-mist); font-size: var(--fs-14); line-height: 20px; color: var(--color-ink); cursor: pointer; }
.cb { position: relative; display: inline-flex; flex-shrink: 0; align-items: center; justify-content: center; margin-top: 2px; }
.cb__input { appearance: none; width: 16px; height: 16px; margin: 0; border: 1px solid var(--color-mid-grey); border-radius: var(--r-xs); background: var(--color-paper); cursor: pointer; transition: background-color 0.2s ease-in-out, border-color 0.2s ease-in-out; }
.cb__input:checked { background: var(--color-blue); border-color: var(--color-blue); }
.cb__input:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--color-paper), 0 0 0 4px var(--color-blue); }
.cb__tick { position: absolute; display: none; pointer-events: none; color: var(--color-paper); }
.cb__input:checked + .cb__tick { display: block; }
.dlg__foot { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); padding: var(--sp-4) var(--sp-6); border-top: 1px dashed var(--color-line); }
.dlg__foot .btn { height: 44px; min-width: 140px; padding: 0 var(--sp-5); border-radius: var(--r-lg); font-size: var(--fs-16); font-weight: 600; }
.btn--outline-blue { background: var(--color-paper); color: var(--color-blue); border-color: var(--color-blue); }
.btn--outline-blue:hover { background: var(--color-p-50); }
.btn--wa { background: var(--wa-green); color: var(--wa-ink); }
.btn--wa:hover { background: var(--wa-green-hover); }
.dlg__foot .btn--wa:disabled { opacity: 1; background: var(--wa-green-soft); color: var(--wa-ink-soft); }

/* Toast: Toast.tsx (success look from the repo; info and error variants added) */
.toast-stack { position: fixed; left: 50%; bottom: calc(var(--mobile-nav-h) + var(--sp-4)); z-index: 90; transform: translateX(-50%); pointer-events: none; display: flex; flex-direction: column; align-items: center; }
.toast { display: flex; align-items: center; gap: var(--sp-3); width: max-content; max-width: min(500px, 92vw); margin-bottom: var(--sp-2); padding: var(--sp-3) var(--sp-4); border: 2px solid var(--tw-blue-300); border-radius: var(--r-lg); background: var(--color-paper); box-shadow: var(--tw-shadow-lg); font-size: var(--fs-14); line-height: 1.625; font-weight: 500; color: var(--tw-gray-800); animation: toast-in 0.3s ease-out; }
.toast__icon { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; flex-shrink: 0; border-radius: var(--r-pill); color: var(--color-paper); background: var(--tw-green-500); }
.toast--error .toast__icon { background: var(--color-red); }
.toast--info .toast__icon { background: var(--color-blue); }

/* Demo controls: prototype-only panel. It floats over the page and never changes the layout, open or closed. */
.demo { position: fixed; right: var(--sp-4); bottom: calc(var(--mobile-nav-h) + var(--sp-4)); z-index: 55; max-width: calc(100vw - 32px); max-height: calc(100vh - var(--mobile-nav-h) - 80px); overflow-y: auto; border: 1px dashed var(--color-p-300); border-radius: var(--r-xl); background: var(--color-paper); box-shadow: var(--sh-3); font-size: var(--fs-14); }
.demo__toggle { display: flex; align-items: center; gap: var(--sp-2); width: 100%; min-height: 44px; padding: 10px 14px; border: 0; border-radius: var(--r-xl); background: transparent; font-size: var(--fs-14); font-weight: 600; color: var(--color-blue); }
.demo__toggle:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.demo__body { width: 288px; max-width: 100%; padding: 0 14px 12px; }
.demo__drop { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); width: 100%; height: 36px; padding: 0 var(--sp-3); margin-bottom: 4px; border: 1px solid var(--color-less-grey); border-radius: var(--r); background: var(--color-paper); font: inherit; font-size: var(--fs-13); font-weight: 600; color: var(--color-ink); cursor: pointer; }
.demo__drop:focus-visible { outline: none; box-shadow: var(--focus-ring); }
.demo__legend { display: flex; align-items: center; gap: var(--sp-2); margin: var(--sp-2) 0 6px; font-size: var(--fs-11); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-ink-3); }
.demo__legend::after { content: ''; flex: 1; height: 1px; background: var(--color-line-soft); }
.demo__option { position: relative; display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: var(--fs-14); color: var(--color-ink-2); cursor: pointer; }
.demo__radio { position: absolute; width: 16px; height: 16px; margin: 0; opacity: 0; }
.demo__dot { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; flex-shrink: 0; border: 1.5px solid var(--color-mid-grey); border-radius: var(--r-pill); background: var(--color-paper); }
.demo__radio:checked + .demo__dot { border-color: var(--color-blue); }
.demo__radio:checked + .demo__dot::after { content: ''; width: 8px; height: 8px; border-radius: var(--r-pill); background: var(--color-blue); }
.demo__radio:focus-visible + .demo__dot { box-shadow: var(--focus-ring); }
.demo__foot { margin-top: var(--sp-2); padding-top: var(--sp-3); border-top: 1px solid var(--color-line-soft); font-size: var(--fs-12); line-height: 1.4; color: var(--color-ink-3); }

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
@keyframes toast-in { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: none; } }
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes dlg-in { from { opacity: 0; transform: translate(-50%, -50%) scale(0.95); } to { opacity: 1; transform: translate(-50%, -50%); } }

/* Bengaluru preschools and every Boarding School state have one picture per direction; other places share one picture across their four groups */
function photoFor(type, place, zone) {
  const own = PHOTOS[type + '-' + place + '-' + zone] || (type === 'boarding' && PHOTOS[place + '-' + zone]);
  if (own) return own;
  const key = place === 'Bengaluru' && type !== 'boarding' ? 'Bengaluru-' + zone : place;
  return PHOTOS[key];
}

function openDialog(id) {
  const g = findGroup(id);
  if (!g || state.openingId) return;
  state.dialog = { id, opener: 'join-' + id };
  document.getElementById('dialog-root').innerHTML = dialogHTML(g);
  document.getElementById('app').inert = true;
  setHash('S8');
  onAccept(document.getElementById('dlg-accept').checked);
  document.getElementById('dlg').focus();
}
function closeDialog() {
  if (!state.dialog) return;
  const opener = state.dialog.opener;
  state.dialog = null;
  document.getElementById('dialog-root').innerHTML = '';
  document.getElementById('app').inert = false;
  const el = document.querySelector('[data-key="' + opener + '"]');
  if (el && !el.disabled) el.focus();
}
function onAccept(checked) {
  const connectButton = document.getElementById('dlg-connect');
  if (!connectButton || !state.dialog) return;
  const g = findGroup(state.dialog.id);
  const canJoin = g && isUsableInvite(linkFor(g));
  connectButton.disabled = !checked || !canJoin;
  connectButton.dataset.state = connectButton.disabled ? 'disabled' : 'default';
  const row = connectButton.querySelector('.btn__row');
  if (row) row.innerHTML = (connectButton.disabled ? icon('ban', 18) : whatsappIcon(18)) + esc(COPY.connect);
}
function connect() {
  if (!state.dialog) return;
  const accepted = document.getElementById('dlg-accept');
  if (!accepted || !accepted.checked) return;
  const id = state.dialog.id;
  const group = findGroup(id);
  if (!group || !isUsableInvite(linkFor(group))) return;
  // This call remains directly inside the user click handler (not a timer).
  openGroup(id);
}
function trapTab(e) {
  const dlg = document.getElementById('dlg');
  if (!dlg || e.key !== 'Tab') return;
  const items = [...dlg.querySelectorAll('button:not([disabled]), input:not([disabled]), summary, [tabindex="0"]')];
  if (!items.length) return;
  const first = items[0], last = items[items.length - 1];
  if (!dlg.contains(document.activeElement) || document.activeElement === dlg) { e.preventDefault(); (e.shiftKey ? last : first).focus(); return; }
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}

   Every section keeps its content, ids and behaviour; only composition changes.
   Option 0 is the v11 original. Chosen in Demo controls or by URL: ?about=3&why=1&steps=2&groups=4&dialog=5 */
const VARIANT_SECTIONS = [
  { key: 'about', title: 'About', names: ['Original: story with fact tiles', 'Facts first', 'Centred introduction', 'Editorial split', 'Blue intro band', 'Short intro, read more', 'Labelled story blocks', 'Plain text, no panel'] },
  { key: 'why', title: 'Why Join', names: ['Original: icon tiles grid', 'Numbered list', 'Heading left, list right', 'Compact checklist', 'Featured first reason', 'Accordion', 'Tabs', 'Blue band, centred cards'] },
  { key: 'steps', title: 'Join steps', names: ['Original: blue banner stepper', 'Light banner, title left', 'Step cards with arrows', 'Compact strip', 'Steps beside group heading', 'Progress track', 'Icon steps', 'Collapsed "How joining works"'] },
  { key: 'groups', title: 'Listing card layout (10 variations)', names: ['Original: photo-left cards', 'Photo on top', 'Compact rows with thumbnail', 'Text-only cards', 'Compass layout', 'Photo background cards', 'Area selector', 'Table', 'Expandable region cards', 'Numbered directory'] },
  { key: 'dialog', title: 'Join dialog', names: ['Original: centred panel', 'Compact list', 'Agreement beside action', 'Side sheet', 'Expandable rules', 'WhatsApp header', 'Split: info and rules', 'Plain text rules'] }
];
/* Brutal UI/UX audit scores for the ten listing-card variations, scored out of 10. */
const GROUP_VARIANT_SCORES = [7.4, 8.1, 7.8, 6.8, 6.4, 6.2, 7.0, 7.3, 7.6, 7.2];
const variants = {};
VARIANT_SECTIONS.forEach((s) => {
  const n = parseInt(params.get(s.key), 10);
  // The selected listing-card direction for v6 is Photo on top (groups = 1).
  // An explicit URL parameter still wins, so every comparison variation remains reviewable.
  const defaultVariant = s.key === 'groups' ? 1 : 0;
  variants[s.key] = n >= 0 && n < s.names.length ? n : defaultVariant;
});
const ui = { aboutMore: false, stepsOpen: false, whyTab: 0, groupZone: 'North', areaQuery: '' };
function syncVariantUrl() {
  const q = new URLSearchParams(location.search);
  VARIANT_SECTIONS.forEach((s) => { if (variants[s.key]) q.set(s.key, variants[s.key]); else q.delete(s.key); });
  const qs = q.toString();
  try { history.replaceState(null, '', location.pathname + (qs ? '?' + qs : '') + location.hash); }
  catch (e) { /* Variant remains selected in this preview. */ }
}

/* ---------- Toasts ---------- */
function pushToast(type, message) {
  const stack = document.getElementById('toast-stack');
  const el = document.createElement('div');
  el.className = 'toast toast--' + type;
  el.setAttribute('role', 'status');
  const glyph = type === 'error' ? 'x' : type === 'info' ? 'info' : 'check';
  el.innerHTML = '<span class="toast__icon">' + icon(glyph, 14, 2.5) + '</span><span></span>';
  el.lastChild.textContent = message;
  stack.appendChild(el);
  setTimeout(() => el.remove(), TOAST_MS);
}

/* ---------- Behaviour ---------- */
function setHash(step) {
  if (location.hash === '#' + step) return;
  // History updates can be restricted for a downloaded HTML preview or about:blank.
  try { history.pushState(null, '', location.pathname + location.search + '#' + step); }
  catch (e) { /* Preview still works without altering the URL. */ }
}
function scrollToStep(step) {
  if (!step) return;
  const target = document.getElementById(step) || document.querySelector('[data-step="' + step + '"]') || document.getElementById('S4');
  if (target) target.scrollIntoView({ block: 'start' });
}

function loadList() {
  clearTimeout(listTimer);
  state.listState = 'loading';
  state.problems = {};
  state.openingId = null;
  renderPage();
  listTimer = setTimeout(() => { state.listState = settledListState(); renderPage(); }, LIST_LOAD_MS);
}

function applyDemo(key, value) {
  demo[key] = value;
  if (key === 'link') { state.problems = {}; renderPage(); }
  else if (key === 'list') {
    clearTimeout(listTimer);
    state.pageState = demo.list === 'page-error' ? 'error' : 'default';
    state.listState = settledListState();
    state.problems = {};
    renderPage();
  }
  renderHeader();
}

function chooseType(type) {
  if (type === state.type) return;
  state.type = type;
  ui.areaQuery = '';
  state.focusKey = 'tab-' + type;
  setHash('S4');
  renderTopbar();
  loadList();
}

function chooseSchool(id) {
  state.switchOpen = false;
  state.switchIndex = -1;
  state.focusKey = 'sw-trigger';
  if (id !== state.schoolId) {
    const school = FIXTURES.schools.find((s) => s.id === id);
    state.schoolId = id;
    ui.areaQuery = '';
    if (!school.types.includes(state.type)) state.type = school.types[0];
    
    renderDemo();
    setHash('S4');
    renderTopbar();
    loadList();
    return;
  }
  renderTopbar();
}

function closeSwitch() {
  if (!state.switchOpen) return;
  state.switchOpen = false;
  state.switchIndex = -1;
  renderTopbar();
}
function toggleSwitch() {
  if (state.switchOpen) { closeSwitch(); return; }
  state.switchOpen = true;
  state.switchIndex = Math.max(0, FIXTURES.schools.findIndex((s) => s.id === state.schoolId));
  state.focusKey = 'sw-trigger';
  renderTopbar();
}
function onSwitchKey(e) {
  const trigger = e.target.closest('#sw-trigger');
  if (!trigger) return;
  const count = FIXTURES.schools.length;
  const isOpen = state.switchOpen;
  if (e.key === 'Escape') { if (isOpen) { e.preventDefault(); state.focusKey = 'sw-trigger'; closeSwitch(); } return; }
  if (e.key === 'Tab') { if (isOpen) { state.switchOpen = false; state.switchIndex = -1; renderTopbar(); } return; }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    if (!isOpen) { toggleSwitch(); return; }
    state.switchIndex = (state.switchIndex + (e.key === 'ArrowDown' ? 1 : -1) + count) % count;
    state.focusKey = 'sw-trigger';
    renderTopbar();
    return;
  }
  if ((e.key === 'Enter' || e.key === ' ') && isOpen) { e.preventDefault(); chooseSchool(FIXTURES.schools[state.switchIndex].id); }
}

/* Runs directly from the accepted Connect button. Never open a fabricated URL. */
function openGroup(id) {
  const group = findGroup(id);
  if (!group) return;
  const link = linkFor(group);
  if (!isUsableInvite(link)) return;
  if (isPreviewInvite(link)) {
    closeDialog();
    pushToast('info', COPY.preview);
    return;
  }
  // Opening synchronously in a click handler avoids browser popup blocking.
  let win = null;
  if (demo.popup !== 'blocked') {
    win = window.open(link, '_blank');
    if (win) win.opener = null;
  }
  closeDialog();
  state.problems = {};
  if (!win) {
    state.problems[id] = 'blocked';
    state.focusKey = 'join-' + id;
    renderPage();
    pushToast('error', COPY.blocked);
  } else {
    pushToast('info', 'WhatsApp has opened in a new tab.');
  }
}

document.addEventListener('click', (e) => {
  const nav = e.target.closest('[data-nav]');
  if (nav) {
    if (nav.dataset.nav !== shell.active) pushToast('info', FIXTURES.menu.find((m) => m.id === nav.dataset.nav).label + COPY.soon);
    return;
  }
  const actionEl = e.target.closest('[data-action]');
  if (!actionEl) { if (state.switchOpen && !e.target.closest('#switch')) closeSwitch(); return; }
  const action = actionEl.dataset.action;
  if (action === 'toggle-switch') { toggleSwitch(); return; }
  if (action === 'choose-school') { chooseSchool(actionEl.dataset.value); return; }
  if (action === 'choose-type') { chooseType(actionEl.dataset.value); return; }
  if (action === 'open-dialog') { openDialog(actionEl.dataset.id); return; }
  if (action === 'jump-groups') { scrollToStep('S4'); document.getElementById('groups-title')?.focus({preventScroll:true}); return; }
  if (action === 'focus-area-search') { scrollToStep('S4'); const field=document.getElementById('area-search'); if (field) field.focus({preventScroll:true}); else document.getElementById('groups-title')?.focus(); return; }
  if (action === 'toggle-sidebar') { if (shell.collapsed) expandSidebar(); else collapseSidebar(); return; }
  if (action === 'clear-area-search') { ui.areaQuery=''; const input=document.getElementById('area-search'); if (input) { input.value=''; input.focus(); } updateGroupSearch(); return; }
  if (action === 'close-dialog') { closeDialog(); return; }
  if (action === 'connect') { connect(); return; }
  if (action === 'about-more') { ui.aboutMore = !ui.aboutMore; state.focusKey = 'about-more'; renderPage(); return; }
  if (action === 'steps-toggle') { ui.stepsOpen = !ui.stepsOpen; state.focusKey = 'steps-toggle'; renderPage(); return; }
  if (action === 'why-tab') { ui.whyTab = parseInt(actionEl.dataset.index, 10) || 0; state.focusKey = 'why-tab-' + ui.whyTab; renderPage(); return; }
  if (action === 'group-zone') { ui.groupZone = actionEl.dataset.zone; state.focusKey = 'zone-' + ui.groupZone; renderPage(); return; }
  if (action === 'toggle-demo') { demo.open = !demo.open; renderDemo(); return; }
  if (action === 'retry-list') { demo.list = 'loaded'; renderDemo(); loadList(); return; }
  if (action === 'retry-page') { demo.list = 'loaded'; renderDemo(); startPage(); }
});
document.addEventListener('keydown', (e) => {
  if (state.dialog) {
    if (e.key === 'Escape') { e.preventDefault(); closeDialog(); return; }
    trapTab(e);
    return;
  }
  const tab = e.target.closest && e.target.closest('.wv6__tab');
  if (tab && ['ArrowRight', 'ArrowDown', 'ArrowLeft', 'ArrowUp', 'Home', 'End'].includes(e.key)) {
    e.preventDefault();
    const count = aboutContent(currentSchool(), state.type).items.length;
    const i = ui.whyTab;
    ui.whyTab = e.key === 'Home' ? 0 : e.key === 'End' ? count - 1 : (i + (e.key === 'ArrowRight' || e.key === 'ArrowDown' ? 1 : -1) + count) % count;
    state.focusKey = 'why-tab-' + ui.whyTab;
    renderPage();
    return;
  }
  onSwitchKey(e);
});
function updateGroupSearch() {
  const all = groupsFor(currentSchool(), state.type);
  const matched = matchingGroups(all);
  const result = document.getElementById('group-results');
  const count = document.getElementById('area-search-count');
  if (result && state.listState === 'default') result.innerHTML = filteredCardsHTML(matched);
  if (count) count.textContent = searchCountText(matched);
}
document.addEventListener('input', (e) => {
  if (e.target.id === 'area-search') { ui.areaQuery=e.target.value; updateGroupSearch(); }
});
document.addEventListener('change', (e) => {
  if (e.target.matches('[data-action="accept"]')) { onAccept(e.target.checked); return; }
  if (e.target.matches('[data-variant-key]')) {
    variants[e.target.dataset.variantKey] = parseInt(e.target.value, 10) || 0;
    const controlId = e.target.id;
    syncVariantUrl();
    renderPage();
    renderDemo();
    document.getElementById(controlId)?.focus({preventScroll:true});
    return;
  }
  const input = e.target.closest('[data-demo]');
  if (!input) return;
  const key = input.dataset.demo;
  demo[key] = input.value;
  renderDemo();
  const again = document.getElementById('demo-' + key + '-' + input.value);
  if (again) again.focus();
  if (key === 'types') {
    const school = FIXTURES.schools.find((s) => s.id === input.value);
    state.schoolId = school.id;
    ui.areaQuery = '';
    state.type = school.types[0];
    renderTopbar();
    if (state.pageState === 'default') loadList();
    return;
  }
  if (key === 'link') { state.problems = {}; renderPage(); }
  else if (key === 'list') {
    clearTimeout(listTimer);
    state.pageState = demo.list === 'page-error' ? 'error' : 'default';
    state.listState = settledListState();
    state.problems = {};
    renderPage();
  }
});
/* A photo that cannot load shows the compass tile instead, so no card is ever left with a broken picture */
document.addEventListener('error', (e) => {
  const img = e.target;
  if (img && img.tagName === 'IMG' && img.closest('.photo')) { img.closest('.photo').classList.add('is-failed'); img.alt = ''; }
}, true);
document.addEventListener('load', (e) => { if (e.target.tagName === 'IMG' && e.target.closest('.photo')) e.target.closest('.photo').classList.add('is-loaded'); }, true);
window.addEventListener('hashchange', () => scrollToStep(location.hash.slice(1)));
window.addEventListener('popstate', () => scrollToStep(location.hash.slice(1)));

/* ---------- URL switch: ?step=S4&state=error (also ?school=maple, ?type=boarding, ?popup=blocked, ?kind=missing) ---------- */
function applyForced() {
  if (forcedApplied) return;
  forcedApplied = true;
  const { step, state: forced, kind } = FORCE;
  if (!step) return;
  if (step === 'S1' && forced === 'error') demo.list = 'page-error';
  if (step === 'S4' && (forced === 'loading' || forced === 'error')) demo.list = forced;
  if (step === 'S6') demo.link = kind === 'missing' ? 'missing' : 'invalid';
  state.listState = settledListState();
  const list = groupsFor(currentSchool(), state.type);
  const usable = list.find((g) => { const l = linkFor(g); return l && LINK_PATTERN.test(l); });
  if (step === 'S5' && forced === 'loading' && usable) state.openingId = usable.id;
  if (step === 'S5' && forced === 'error' && usable) state.problems[usable.id] = 'blocked';
  if (step === 'S6') {
    const bad = list.find((g) => { const l = linkFor(g); return !l || !LINK_PATTERN.test(l); });
    if (bad) state.problems[bad.id] = linkFor(bad) ? 'invalid' : 'missing';
  }
}

function startPage() {
  state.pageState = 'loading';
  state.listState = settledListState();
  state.problems = {};
  state.openingId = null;
  renderPage();
  if (FORCE.step === 'S1' && FORCE.state === 'loading') return;
  setTimeout(() => {
    applyForced();
    state.pageState = demo.list === 'page-error' ? 'error' : 'default';
    renderDemo();
    renderPage();
    if (state.pageState === 'default') scrollToStep(location.hash.slice(1) || (FORCE.step && FORCE.step !== 'S1' ? FORCE.step : ''));
  }, PAGE_LOAD_MS);
}

renderShell();
applyShellState();
renderDemo();
renderTopbar();
startPage();
</script>
<script src="../../components/RouteLoader.js"></script>
