  <style>
    body { font-family: 'Inter', sans-serif; }
    /* Scrollbars used by the nav scroll areas */
    .custom-scrollbar::-webkit-scrollbar { width: 5px; height: 5px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    /* Sidebar nav: no ring on a click, and no sub-pixel gaps */
    aside nav button:focus:not(:focus-visible) { outline: none !important; box-shadow: none !important; }
    aside nav button.bg-white { background-color: #ffffff !important; }
    /* the shell's buttons show a keyboard ring in their own ink: white on the blue bar, blue on white */
    main > header button:focus-visible,
    aside nav button:focus-visible,
    body > div > button:focus-visible,
    nav[aria-label="Mobile navigation"] button:focus-visible,
    [aria-label="Account menu"] button:focus-visible { outline: 2px solid currentColor !important; outline-offset: -2px !important; box-shadow: none !important; }
    /* Toast stack (used by sidebar full-screen / nav feedback messages) */
    .cfg-toast-stack { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 80; display: flex; flex-direction: column; align-items: center; gap: 10px; max-width: 90vw; pointer-events: none; }
    .cfg-toast { pointer-events: auto; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px; background: #fff; border: 1px solid #e2e8f0; box-shadow: 0 8px 24px rgba(15,23,42,.10); animation: cfg-toast-in .3s ease-out; }
    @keyframes cfg-toast-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .cfg-toast.is-success { background: #EEFFFE; border-color: #359694; color: #359694; }
    .cfg-toast.is-error { background: #FFF3F3; border-color: #D54545; color: #D54545; }
    .cfg-toast.is-info { background: #EFF4FF; border-color: #284CA5; color: #284CA5; }
    @media (max-width: 640px) { .cfg-toast-stack { bottom: 16px; max-width: 92vw; } }
  /* Embedded in the console shell (index.html): the shell owns the sidebar + top navigation. */
html { --shell-top: 0px !important; --shell-bottom: 0px !important; --shell-sab: 0px !important; }
</style>
  <style id="shared-chat">
/* =====================================================================
   SHARED CHAT — the tokens and base of supercrm-enquiries-v5.html's shared
   chat block (unchanged from v4), trimmed to what this page reads (unused tokens removed).
   ===================================================================== */
:root {
  --blue: #284ca5; --black: #000; --white: #fff;
  --dark-grey: #3d3d3d; --mid-grey: #7a7a7a; --frame-bg: #f5f5f5; --hover-bg: rgba(218, 218, 218, .4);
  --blue-50: #f2f4fa; --green-50: #ebf5f4; --error-50: #fbeded; --green-ink: #2a7775; --error-ink: #b93a3a;
  --text-muted: #6b6b6b; --divider: rgba(218, 218, 218, .6);
  --shadow-1: 0 1px 2px rgba(0, 0, 0, .04), 0 2px 6px rgba(0, 0, 0, .04);
  --shadow-3: 0 4px 12px rgba(0, 0, 0, .08), 0 20px 48px rgba(0, 0, 0, .14);
  --r-pill: 999px;
  --t11: 11px; --t12: 12px; --t13: 13px; --lh13: 18px; --t14: 14px; --lh14: 20px; --ls14: -0.01em;
  --dur: 140ms; --ease: cubic-bezier(.2, 0, 0, 1);
}
/* ---- base (scoped to the chat so the host shell is never restyled; :where() keeps these at element specificity so the component rules below always win) ---- */
.ss-chat, .ss-chat *, .ss-chat *::before, .ss-chat *::after { box-sizing: border-box; }
.ss-chat { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-size: var(--t14); line-height: var(--lh14); letter-spacing: var(--ls14); color: var(--black); -webkit-font-smoothing: antialiased; }
:where(.ss-chat) h1, :where(.ss-chat) p { margin: 0; }
:where(.ss-chat) button { margin: 0; padding: 0; font: inherit; color: inherit; background: none; border: 0; cursor: pointer; letter-spacing: inherit; }
:where(.ss-chat) svg { display: block; }
.ss-chat :focus-visible { outline: none; box-shadow: 0 0 0 4px rgba(40, 76, 165, .12); }
.ss-chat button:disabled { opacity: .45; cursor: not-allowed; }
/* =====================================================================
   PAGE — title row + panes
   ===================================================================== */
.page { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 12px 16px 16px; gap: 12px; }   /* 16px gutters at every width */
/* icon buttons: 36px round */
.icon-btn { position: relative; display: inline-flex; align-items: center; justify-content: center; flex: none; width: 36px; height: 36px; border-radius: 50%; color: var(--dark-grey); transition: background-color var(--dur) var(--ease), color var(--dur) var(--ease), transform var(--dur) var(--ease); }
.icon-btn:hover:not(:disabled) { background: var(--hover-bg); color: var(--blue); }
.icon-btn:active:not(:disabled) { transform: scale(.94); }
/* ---- channels: every message travels on chat · whatsapp · sms · email; the icon is the only mark ---- */
.ch-ic { width: 14px; height: 14px; flex: none; color: var(--mid-grey); }
.ch-chat { color: var(--mid-grey); } .ch-whatsapp { color: #25D366; } .ch-sms { color: var(--blue); } .ch-email { color: var(--mid-grey); }
.muted { color: var(--text-muted); font-size: var(--t13); line-height: var(--lh13); letter-spacing: 0; }

@media (prefers-reduced-motion: reduce) { .ss-chat *, .ss-chat *::before, .ss-chat *::after { transition: none !important; animation: none !important; } }
@media (max-width: 899px) {
  .page { padding: 8px 16px 0; gap: 8px; }
  /* 44×44 tap targets on phones and tablets */
  .icon-btn { width: 44px; height: 44px; }
}
  </style>

    :root { --bm-amber-50: #fff5e6; }
    /* one-click fixes and links */

  <style>
    .ss-chat-host { height: 100%; }
    .ss-chat { position: relative; display: flex; flex-direction: column; height: 100%; min-height: 0; overflow: hidden; background: var(--frame-bg); }
    .ss-chat > .page { flex: 1; }
    /* the shell's own scroller stays put — the workspace scrolls internally */
    section.chat-host { overflow: hidden; }
    /* the Super CRM tab strip on phones: a horizontal scroller with snap points and edge fades; the bell + menu stay pinned on the right */
    header nav[aria-label="Section navigation"] { scroll-snap-type: x proximity; scroll-padding: 0 16px; scroll-behavior: smooth; -webkit-mask-image: linear-gradient(to right, transparent, #000 16px, #000 calc(100% - 16px), transparent); mask-image: linear-gradient(to right, transparent, #000 16px, #000 calc(100% - 16px), transparent); }
    header nav[aria-label="Section navigation"] > div { padding: 0 16px; }
    header nav[aria-label="Section navigation"] button { scroll-snap-align: start; }
    header nav[aria-label="Section navigation"] + div { position: relative; z-index: 1; }
    @media (max-width: 899px) {
      header nav[aria-label="Section navigation"] { scroll-padding: 0 32px; -webkit-mask-image: linear-gradient(to right, transparent 20px, #000 32px, #000 calc(100% - 32px), transparent calc(100% - 20px)); mask-image: linear-gradient(to right, transparent 20px, #000 32px, #000 calc(100% - 32px), transparent calc(100% - 20px)); }
      header nav[aria-label="Section navigation"] > div { padding: 0 32px; }
    }
    /* the stacked mobile flow (≤899): a thread or the panel sheet takes the whole screen */
    @media (max-width: 899px) {
      body > div.h-screen { height: 100dvh; min-height: 100dvh; }
      section.chat-host { padding-bottom: 0 !important; }
      .ss-chat-host { height: calc(100dvh - var(--shell-top, 0px) - var(--shell-bottom, 0px) - var(--shell-sab, 0px)); }
    }
    @media (max-width: 767px) { section.chat-host { padding-top: var(--shell-top, 0px) !important; } }
    /* =====================================================================
       THE CARD — v4's Enquiries card chrome: header, full screen, toast.
       ⛶ gives the card the whole area.
       ===================================================================== */
    .crm { --primary: #284ca5; --soft: #eff4ff; --ink: #0f172a; --muted: #64748b; --border: #e2e8f0; --ui-control-h: 40px;
      display: flex; flex-direction: column; gap: 16px; flex: 1; min-height: 0; min-width: 0; overflow: hidden; font-size: 14px; color: var(--ink); }
    /* the chat's own panes live inside .crm now, so every control rule below is scoped to the CRM
       chrome — the status cards, the filters sidebar / strip and the card header — never the panes */
    .crm *, .crm *::before, .crm *::after { box-sizing: border-box; }
    .content-panel { background: #fff; border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-1); }
    .content-header h1 { font-size: 19px; letter-spacing: -.02em; margin: 0; }
    .content-header p { margin: 0; }
    .content-header .icon { width: 17px; height: 17px; vertical-align: middle; flex-shrink: 0; }
    .content-header .muted { color: var(--muted); }
    .content-header .small-text { font-size: 13px; line-height: 1.55; }
    .content-header :focus-visible { outline: none; box-shadow: 0 0 0 4px rgba(40, 76, 165, .12); }
    .content-header .icon-btn { display: inline-grid; place-items: center; width: 33px; height: 33px; flex-shrink: 0; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; }
    .content-header .icon-btn:hover { background: var(--soft); color: var(--primary); }
    /* ---- the status bar — copied from the Admission Enquiries module (enquiries.html, .ss-v1-*) ---- */
    .summary { min-width: 0; }
    .ss-v1-grid{display:flex;flex-wrap:nowrap;gap:10px;overflow-x:auto;scrollbar-width:thin;-webkit-overflow-scrolling:touch;padding:8px 6px;}
    .ss-v1-card{flex:1 0 0px;min-width:150px;min-height:56px;display:flex;align-items:center;gap:12px;border:1px solid var(--ss-bd,#E6EAF2);border-radius:10px;background:#FFFFFF;color:#0F172A;padding:8px 12px;text-align:left;box-shadow:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);transition:transform .16s ease,box-shadow .16s ease,background-color .16s ease,border-color .16s ease;cursor:pointer;}
    .ss-v1-body{display:flex;flex-direction:column;gap:2px;min-width:0;}
    .ss-v1-card:hover{box-shadow:0 4px 12px -2px rgba(15,23,42,0.12);transform:translateY(-1px);}
    .ss-v1-card:focus-visible{outline:none;box-shadow: 0 0 0 4px rgba(40, 76, 165, .12);}
    .ss-v1-stage-count{font-variant-numeric:tabular-nums;font-size:20px;font-weight:700;line-height:1.05;letter-spacing:-.01em;color:#0F172A;}
    .ss-v1-stage-name{min-width:0;font-size:11px;font-weight:500;line-height:1.2;color:#64748B;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
    .ss-v1-stage-name span{display:block;}
    @media (max-width:720px){.ss-v1-card{min-height:52px;}}
    .ss-v1-card.selected{border-color:var(--ss-tx,#284CA5);background:var(--ss-tint,#EFF4FF);}
    /* ---- workspace: the Templates card ---- */
    .workspace { position: relative; display: flex; align-items: stretch; gap: 16px; flex: 1; min-height: 0; min-width: 0; overflow: hidden; }
    /* ---- the Enquiries card: header + the three panes ---- */
    .content-panel { flex: 1; overflow: hidden; min-width: 0; display: flex; flex-direction: column; height: 100%; min-height: 0; transition: border-radius 200ms var(--ease), box-shadow 200ms var(--ease); }
    .content-header { min-height: 64px; padding: 0 20px; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; column-gap: 18px; row-gap: 12px; border-bottom: 1px solid #eef2f7; flex: 0 0 auto; max-height: 160px; overflow: hidden; transition: max-height 200ms var(--ease), min-height 200ms var(--ease), opacity 160ms var(--ease), padding 200ms var(--ease), border-bottom-width 200ms var(--ease); }
    .content-title { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .content-title > div { min-width: 0; }
    .content-title-heading { display: flex; align-items: center; gap: 6px; }
    /* the title block matches the module's list header */
    .content-title h1 { font-size: 18px; font-weight: 600; line-height: 27px; letter-spacing: -.02em; color: #0F172A; }
    .content-title .small-text { font-size: 13px; line-height: 19.5px; color: #475569; margin-top: 4px; }
    .content-header .title-expand-btn { width: 32px; height: 32px; border: 1px solid #D7E4FF; background: #fff; color: #284CA5; border-radius: 8px; }
    .content-header .title-expand-btn:hover { background: #EFF4FF; color: #284CA5; }
    /* ---- full screen: the card alone, over the whole shell (the module's [data-fullscreen]) ---- */
    .crm[data-fullscreen] { position: fixed; inset: 0; z-index: 60; height: 100vh; width: 100vw; padding: 14px 16px 16px; background: var(--frame-bg, #F6F8FC); }
    .crm[data-fullscreen] .content-header .title-expand-btn { border-color: #BFD3FF; }
    /* the shell's own furniture sits at z-40/50 — nothing of it shows through */
    body.crm-fullscreen { overflow: hidden; }
    body.crm-fullscreen > div > button.z-50, body.crm-fullscreen > div > div.z-40 { display: none !important; }
    @media (max-width: 899px) {
      .crm { gap: 10px; }
      .content-header { min-height: 0; padding: 12px; grid-template-columns: minmax(0, 1fr) auto; }
      .content-title .small-text { display: none; }
      .content-title h1 { font-size: 18px; }
      .content-title { grid-row: 1; grid-column: 1; }
    }
    @media (max-width: 767px) {
      .content-header .icon-btn { min-height: 44px; }
      .content-header .icon-btn { width: 44px; height: 44px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .crm, .crm *, .content-header, main > header { transition: none !important; animation: none !important; }
    }
    /* ---- the Admission Enquiries module's dialogs (New Enquiry wizard, Import wizard, confirm dialogs, toast) ---- */
    .ss-mod { font-family: 'Inter', system-ui, sans-serif; font-size: 14px; line-height: 1.5; letter-spacing: normal; color: #0F172A; }
    .ss-mod p { margin: 0; letter-spacing: normal; }
    .ss-mod #mToast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(12px); display: inline-flex; align-items: center; gap: 11px; padding: 9px 14px 9px 16px; background: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 14px; box-shadow: 0 12px 30px rgba(15,23,42,0.12), 0 1px 3px rgba(15,23,42,0.07); opacity: 0; pointer-events: none; transition: opacity 0.22s ease, transform 0.22s ease; z-index: 99999; min-width: 280px; max-width: calc(100vw - 32px); }
    .ss-mod .toast-icon { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 999px; flex: none; }
    .ss-mod .toast-body { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1 1 auto; }
    .ss-mod .toast-title { color: #0F172A; font-size: 13px; font-weight: 600; line-height: 16px; }
    .ss-mod .toast-text { color: #64748B; font-size: 12.5px; font-weight: 500; line-height: 15px; }
    .ss-mod .toast-close { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 8px; color: #94A3B8; background: none; border: none; cursor: pointer; flex: none; transition: background .12s, color .12s; }
    .ss-mod .toast-close:hover { background: #F1F5F9; color: #475569; }
    .ss-mod .toast-undo { flex: none; height: 30px; padding: 0 10px; border: 1px solid #D7E4FF; border-radius: 8px; background: #EFF4FF; font: inherit; font-size: 13px; font-weight: 600; color: #284CA5; cursor: pointer; }
    .ss-mod .toast-undo:hover { background: #E3EBFF; }
    .ss-mod #mToast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
    @media (max-width: 767px) {
      .ss-mod button { min-height: 44px; }
      .ss-mod button { min-width: 44px; }
    }

  <style id="field-system">
    :root {
      --slate: #64748B; --slate-strong: #475569; --slate-soft: #94A3B8;
      --slate-line: #E6EAF2; --slate-hair: #EEF2F7;
      --fld-h: 44px; --fld-r: 10px; --fld-pad: 12px;
      --fld-ring: 0 0 0 4px rgba(40, 76, 165, .12);
      --fld-ring-err: 0 0 0 4px rgba(213, 69, 69, .10);
      --fld-hover: #CBD5E1; --fld-off: #F8FAFC;
      --shadow-menu: 0 10px 28px rgba(15, 23, 42, .10);
      --fld-t: 120ms cubic-bezier(.2, 0, 0, 1);
      /* WCAG: a keyboard ring that reads at a glance — solid brand blue, 2px */
      --focus-ring: 0 0 0 2px #284CA5;
      --focus-ring-in: inset 0 0 0 2px #284CA5;
      --ink-2: #475569;   /* small grey text, 7.6:1 on white */
    }
    /* ---------- the Email editor's two fields: v4's field system, final coat ---------- */
    .ne-field { display: flex; flex-direction: column; min-width: 0; }
    .ne-field label { margin-bottom: 8px; font-size: 13px; line-height: 18px; font-weight: 500; color: var(--slate-strong); }
    .ne-control, .bm-area {
      box-sizing: border-box; width: 100%;
      border: 1px solid #E6EAF2; border-radius: var(--fld-r); background: var(--white);
      font-family: inherit; font-size: 14px; line-height: 20px; color: var(--ink, #0F172A);
      outline: none; box-shadow: none;
      transition: border-color var(--fld-t), box-shadow var(--fld-t);
    }
    .ne-control { position: relative; display: flex; align-items: center; gap: 6px; height: var(--fld-h); min-height: var(--fld-h); padding: 0 var(--fld-pad); }
    .bm-area { display: block; height: auto; min-height: 120px; padding: 12px; resize: vertical; }
    .ne-control input { flex: 1; min-width: 0; height: 100%; padding: 0; border: 0; background: transparent; box-shadow: none; outline: none; font-family: inherit; font-size: 14px; line-height: 20px; color: var(--ink, #0F172A); }
    .ne-control input:focus, .ne-control input:focus-visible { outline: none; box-shadow: none; border: 0; }
    .ne-control input::placeholder, .bm-area::placeholder { color: var(--slate-soft); opacity: 1; }
    /* focus: one soft ring, on the outer box only */
    .ne-control:focus-within, .bm-area:focus { border-color: var(--blue); box-shadow: var(--fld-ring); }
    /* the placeholder chips under the message */
    .bm-ph { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .bm-ph button {
      height: 32px; min-height: 32px; padding: 0 10px; border: 1px solid #E6EAF2; border-radius: 999px;
      background: var(--white); font-size: 13px; line-height: 18px; font-weight: 500; color: var(--slate-strong); cursor: pointer;
      transition: border-color var(--fld-t), box-shadow var(--fld-t), background-color var(--fld-t), color var(--fld-t);
    }
    .bm-ph button:hover { border-color: var(--blue); background: var(--blue-50); color: var(--blue); }
    .bm-ph button:focus-visible { outline: none; box-shadow: var(--fld-ring); }
    /* ---------- 9. buttons: one ring, never an outline ---------- */
    /* the page also loads Tailwind, whose form reset puts a transparent 2px outline on :focus and
       lands after this sheet — !important is what it takes to leave the field with no outline at all */
    .ss-chat :focus,
    .ss-chat :focus-visible,
    .ss-mod :focus,
    .ss-mod :focus-visible,
    .crm :focus,
    .crm :focus-visible { outline: none !important; }
    .ss-chat button:focus-visible,
    .ss-chat [tabindex]:focus-visible,
    .ss-mod button:focus-visible,
    .crm button:focus-visible {
      box-shadow: var(--focus-ring);
    }
  </style>
  <style id="templates-v4">
    #tplWorkspace { display: flex; }
    .content-title-heading { display: flex; align-items: center; gap: 8px; }
    .crm [hidden], .tpl-modal[hidden] { display: none !important; }
    /* ---- buttons: outlined, and the one primary (+ New template, Save) ---- */
    .tpl-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border: 1px solid #E2E8F0; border-radius: 10px; background: #fff; font: inherit; font-size: 13px; line-height: 20px; font-weight: 600; letter-spacing: normal; color: #475569; white-space: nowrap; cursor: pointer; transition: background-color var(--dur) var(--ease), color var(--dur) var(--ease), border-color var(--dur) var(--ease); }
    .tpl-btn:hover { background: #EFF4FF; color: #284CA5; border-color: #D7E4FF; }

       that, a single swipeable row on phones. Nothing overflows on tablet/desktop, so tplCardNav's
       arrows and fades never show there. The base .ss-v1-* rules stay as the module has them. ---- */
    .tpl-cardwrap { container-type: inline-size; container-name: tplcards; }
    @media (min-width: 768px) {
      #tplCards { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; overflow: visible; }
      #tplCards .ss-v1-card { min-width: 0; }
      /* 1200, not 1100: below ~1180px "Visit / Revisit Scheduled" needs a third line (measured) */
      @container tplcards (min-width: 1200px) {
        #tplCards { grid-template-columns: repeat(12, minmax(0, 1fr)); }
        #tplCards .ss-v1-card { padding: 8px 10px; }
        #tplCards .ss-v1-stage-count { font-size: 18px; }
      }
    }
    /* phones keep the one swipeable row and its arrows, without a visible scrollbar */
    @media (max-width: 767px) {
      #tplCards { scrollbar-width: none; }
      #tplCards::-webkit-scrollbar { display: none; }
    }
    /* ---- read-only note, action errors, counters, phone detail tabs ---- */
    .tpl-ronote { display: flex; align-items: center; gap: 8px; margin: 0 0 12px !important; padding: 8px 12px; border: 1px solid var(--slate-line); border-radius: 10px; background: var(--fld-off); font-size: 12.5px; line-height: 18px; color: var(--ink-2); letter-spacing: 0; }
    .tpl-ronote svg { width: 14px; height: 14px; flex: none; }
    .tpl-acterr { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 8px; padding: 8px 10px; border: 1px solid #FECACA; border-radius: 10px; background: #FEF2F2; font-size: 12.5px; line-height: 18px; font-weight: 500; color: #B91C1C; letter-spacing: 0; }
    .tpl-acterr svg { width: 14px; height: 14px; flex: none; }
    .tpl-acterr span { flex: 1 1 180px; min-width: 0; }
    .tpl-retry { flex: none; height: 30px; padding: 0 12px; border: 1px solid #FCA5A5; border-radius: 8px; background: #fff; font: inherit; font-size: 12.5px; font-weight: 600; color: #B91C1C; cursor: pointer; }
    .tpl-retry:hover { background: #FEE2E2; }
    .tpl-modal .tpl-acterr { margin: 0 0 16px; }
    .tpl-lblcount { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .tpl-counter { flex: none; margin-bottom: 8px; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--ink-2); letter-spacing: 0; }
    .tpl-counter.is-near { color: #92400E; font-weight: 600; }
    .tpl-counter.is-over { color: #B91C1C; font-weight: 600; }
    .tpl-attach-row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; }
    .tpl-attach-row .tpl-count { margin: 0; }
    .tpl-btn:disabled { opacity: .5; cursor: not-allowed; }
    .bm-ph button:disabled { opacity: .45; cursor: not-allowed; }
    /* the preview popup: wider than a confirm, the message in its own card */
    .tpl-modal-card.tpl-prevcard { max-width: 560px; }
    .tpl-prevcard .tpl-prevrow { margin-top: 4px; }
    .tpl-dtabs { display: none; }
    /* a row can carry two tags (SMS pending · WhatsApp rejected): they stack */
    .tpl-pills { flex: none; align-self: center; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .tpl-modal-acts { flex-wrap: wrap; }
    .tpl-modal-acts .tpl-mbtn-wide { flex: 1 1 100%; }
    /* ---- the list column: search on top, the types below ---- */
    .tpl-listcol { display: flex; flex-direction: column; min-width: 0; min-height: 0; border-right: 1px solid var(--divider); background: var(--white); }
    .tpl-listcol .tpl-types { flex: 1; min-height: 0; border-right: 0; }
    .tpl-search { flex: none; padding: 12px 16px 4px 20px; }
    .tpl-search .ne-control { height: 40px; min-height: 40px; }
    .tpl-search svg { width: 16px; height: 16px; flex: none; color: var(--slate-soft); }
    .tpl-types .tpl-empty { padding: 20px 16px 20px 20px; }
    .tpl-empty p { font-size: var(--t13); line-height: var(--lh13); letter-spacing: 0; }
    /* ---- placeholders that don't fit: red blocks the save, amber warns ---- */

    .ph-line { display: flex; align-items: flex-start; gap: 6px; font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0; }
    .ph-line svg { width: 13px; height: 13px; flex: none; margin-top: 1.5px; }
    .ph-line.is-err { color: #B91C1C; }
    .ph-line.is-warn { color: #92400E; }
    .bm-area:has(~ .tpl-ph[data-bad="1"]:not([hidden])) { border-color: #D54545; }
    /* ---- WhatsApp sample values, one per placeholder ---- */
    .tpl-samples { display: flex; flex-direction: column; gap: 8px; }
    .ne-field label.tpl-sample { display: grid; grid-template-columns: 150px minmax(0, 1fr); align-items: center; gap: 10px; margin: 0; }
    .tpl-sample-l { font-size: 12px; font-weight: 500; color: var(--blue); overflow-wrap: anywhere; }
    .tpl-sample .ne-control { height: 38px; min-height: 38px; }
    /* ---- 1024–1279: the same two panes, a little tighter ---- */
    @media (max-width: 1279px) {
      .tpl2 { grid-template-columns: 320px minmax(0, 1fr); }
    }
    @media (max-width: 1023px) {
      .tpl2 { grid-template-columns: minmax(240px, 300px) minmax(0, 1fr); }
      .tpl-right { padding: 16px 18px 24px; }
    }
    /* ---- narrow: the list above the preview; the cards and tabs keep their own sideways rows ---- */
    @media (max-width: 899px) {

      .tpl-right { overflow: visible; padding: 16px; }

    }
    /* ---- a phone: two screens — the list, then the message sliding in over it ---- */
    @media (max-width: 767px) {

      #tplWorkspace.is-msg .tpl-tabs, #tplWorkspace.is-msg .tpl-listcol { display: none; }
      #tplWorkspace.is-msg .tpl-right { padding-top: 0; animation: tpl-slide-in .24s var(--ease) both; }
      .tpl-types { border-bottom: 0; }
      .tpl-backbar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; margin: 0 -16px 14px; padding: 0 8px; border-bottom: 1px solid var(--divider); background: var(--white); }
      /* 44px tap targets */
      .tpl-btn, .tpl-btn.sm, .tpl-chip, .bm-ph button { height: 44px; min-height: 44px; }
      .tpl-more { width: 44px; height: 44px; }
      .tpl-menu button { height: 44px; }
      .tpl-row2 { grid-template-columns: 1fr; }
      .tpl-veracts .bm-link { min-height: 44px; }
      .tpl-modal-acts button { height: 44px; }
      .tpl-modal-x { width: 44px; height: 44px; margin: -8px -8px -8px 0; }
      /* New template fills the phone screen; its header and footer stay in view */
      .tpl-modal.tpl-formdlg { padding: 0; }
      .tpl-modal-card.tpl-formcard { max-width: none; height: 100%; max-height: none; border-radius: 0; }
      .tpl-form { height: 100%; max-height: none; }
      .tpl-formdlg .tpl-modal-hd { padding: 14px 16px 12px; }
      .tpl-formbody { padding: 16px; }
      .tpl-formft { padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); }
      #tplWorkspace .content-header { grid-template-columns: minmax(0, 1fr) auto; }
      /* tabs and search are 44px tall on a phone */
      .tpl-tab { height: 44px; }
      /* the detail screen carries its own copy of the channel tabs, under "‹ Templates" */
      .tpl-dtabs .tpl-tab { gap: 5px; font-size: 13px; }
      .tpl-dtabs .tpl-tab .n { min-width: 18px; padding: 0 5px; }
      .tpl-dtabs { display: flex; justify-content: space-between; gap: 6px; margin: -14px -16px 14px; padding: 0 12px; border-bottom: 1px solid var(--divider); overflow-x: auto; scrollbar-width: none; background: var(--white); }
      .tpl-dtabs::-webkit-scrollbar { display: none; }

  <script>
    /* measure the shell around the chat: the top bar and the bottom nav, as shown right now (0 when hidden) */
    (function () {
      const root = document.documentElement;
      const h = (sel) => { const el = document.querySelector(sel); if (!el) return 0; const cs = getComputedStyle(el); return (cs.display === 'none' || cs.visibility === 'hidden') ? 0 : el.getBoundingClientRect().height; };
      function measure() { const top = h('main > header'), bottom = h('nav[aria-label="Mobile navigation"]'); root.style.setProperty('--shell-top', top + 'px'); root.style.setProperty('--shell-bottom', bottom + 'px'); root.style.setProperty('--shell-sab', bottom ? 'env(safe-area-inset-bottom, 0px)' : '0px'); }
      document.addEventListener('DOMContentLoaded', () => { measure(); new MutationObserver(measure).observe(document.body, { attributes: true, attributeFilter: ['class'] }); });
      document.addEventListener('alpine:initialized', () => { measure(); setTimeout(measure, 350); });
      window.addEventListener('resize', measure); window.addEventListener('orientationchange', measure);
    })();

            w.status = WA_WAIT; w.change = { text: o.msg, date: longDate(NOW), samples: Object.assign({}, o.samples) };
            toast = again ? 'Change resubmitted · submitted ' + w.change.date
              : ch === 'sms' ? 'Sent for DLT approval' : 'Sent to Meta for approval · this status updates when Meta replies';
          } else toast = 'Saved';
        } else {
          t.v[ch].text = o.msg;
          if (ch === 'email') t.v.email.subject = o.subj;
          if (ch === 'chat' || ch === 'email') t.v[ch].files = o.files;
        }
        tplCloseForm(false);
        tplEdit = null; tplTypeId = t.id; tplCh = ch;
        /* a status change may move it out of the list on screen: follow it */
        if (!tplVisibleTypes(tplTab, tplStage).some((x) => x.id === t.id)) tplStage = t.stages[0] || '__all';
        tplSettle();
        showToast(toast, 'success');
        const h = $('tplH2'); if (h) h.focus();
      } });
    }
    $('tplFormModal').addEventListener('click', (e) => { if (e.target === e.currentTarget) tplAskCloseForm(); });

    /* arrow keys walk a row of buttons: the tabs select as they go, the cards only move focus */
    function tplArrows(host, sel, onMove) {
      host.addEventListener('keydown', (e) => {
        if (['ArrowRight', 'ArrowLeft', 'Home', 'End'].indexOf(e.key) < 0) return;
        const all = [...host.querySelectorAll(sel)], i = all.indexOf(document.activeElement);
        if (i < 0) return;
        e.preventDefault();
        const j = e.key === 'Home' ? 0 : e.key === 'End' ? all.length - 1 : (i + (e.key === 'ArrowRight' ? 1 : -1) + all.length) % all.length;
        onMove(all[j]);
        /* a Discard changes? popup now holds focus */
        if (tplModalOpen()) return;
        const next = host.querySelectorAll(sel)[j];
        next.focus(); next.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      });
    }
    { const c = $('tplCards'); if (c) {
      c.addEventListener('click', (e) => { const b = e.target.closest('[data-tpl-card]'); if (b) tplGuard(() => tplPickStage(b.dataset.tplCard), b); });
      tplArrows(c, '[data-tpl-card]', () => {});
    } }
    { const tabs = $('tplTabs'); if (tabs) {
      tabs.addEventListener('click', (e) => { const b = e.target.closest('[data-tpl-tab]'); if (b) tplGuard(() => tplPickTab(b.dataset.tplTab), b); });
      tplArrows(tabs, '[data-tpl-tab]', (b) => tplGuard(() => tplPickTab(b.dataset.tplTab), b));
    } }
    /* the list: ↑/↓ (and Home/End) move between rows, Enter opens one; ↓ from the search box enters the list */
    { const list = $('tplTypes'), search = $('tplSearch');
      list.addEventListener('keydown', (e) => {
        if (['ArrowDown', 'ArrowUp', 'Home', 'End'].indexOf(e.key) < 0) return;
        const rows = [...list.querySelectorAll('.tpl-type')], i = rows.indexOf(document.activeElement);
        if (i < 0 || !rows.length) return;
        e.preventDefault();
        const j = e.key === 'Home' ? 0 : e.key === 'End' ? rows.length - 1 : Math.min(rows.length - 1, Math.max(0, i + (e.key === 'ArrowDown' ? 1 : -1)));
        if (j === 0 && i === 0 && e.key === 'ArrowUp') { search.focus(); return; }
        rows[j].focus(); rows[j].scrollIntoView({ block: 'nearest' });
      });
      search.addEventListener('keydown', (e) => {
        if (e.key !== 'ArrowDown') return;
        const r = list.querySelector('.tpl-type'); if (r) { e.preventDefault(); r.focus(); }
      });
    }
    { const w = $('tplWorkspace'); if (w) {
      w.addEventListener('click', (e) => {
        const tg = e.target;
        /* the phone detail's channel tabs: the same switch as the list's tabs */
        const dt = tg.closest('[data-tpl-dtab]');
        if (dt) {
          const tab = dt.dataset.tplDtab;
          if (tab !== tplTab) tplGuard(() => { tplPickTab(tab); const b = $('tplDTab-' + tab); if (b) b.focus(); }, dt);
          return;
        }
        const row = tg.closest('[data-tpl]');
        if (row) {
          const id = row.dataset.tpl;
          /* the row already open: on a phone, just show it again */
          if (id === tplTypeId) { if (tplPhone() && !tplMsgOpen()) tplOpenMsg(); return; }
          tplGuard(() => { tplPickType(id); if (tplPhone()) tplOpenMsg(); }, row);
          return;
        }
        if (tg.closest('[data-tpl-back]')) { tplCloseMsg(); return; }
        const nb = tg.closest('[data-tpl-new]');
        if (nb) { tplGuard(() => tplOpenForm(nb.dataset.stage || null, nb), nb); return; }
        if (tg.closest('[data-tpl-clear]')) { tplQuery = ''; $('tplSearch').value = ''; tplRenderTypes(); $('tplSearch').focus(); return; }
        const ed = tg.closest('[data-tpl-edit]');
        if (ed) { tplStartEdit(ed.dataset.tplEdit); return; }
        const ec = tg.closest('[data-tpl-edcancel]');
        if (ec) { tplGuard(tplCancelEdit, ec); return; }
        if (tg.closest('[data-tpl-withdraw]')) { tplDropChange(tg.closest('[data-tpl-withdraw]')); return; }
        const pv = tg.closest('[data-tpl-preview]');
        if (pv) { tplOpenPreview(pv); return; }
        const db = tg.closest('[data-tpl-del]');
        if (db) { tplOpenDelete(db); return; }
        const fc = tg.closest('[data-tpl-formcancel]');
        if (fc) { tplCancelForm(fc); return; }
        const fx = tg.closest('[data-tpl-formclose]');
        if (fx) { tplAskCloseForm(fx); return; }
        /* attachments: Add opens the picker; Remove takes one file out */
        const fa = tg.closest('[data-tpl-file-add]');
        if (fa) { $(fa.dataset.tplFileAdd + 'FilesIn').click(); return; }
        const fr = tg.closest('[data-tpl-file-rm]');
        if (fr) { tplRemoveFile(fr.dataset.files, +fr.dataset.tplFileRm); return; }
        /* the form's status chips: General stands alone; the placeholder chips follow the statuses */
        const st = tg.closest('[data-nf-stage]');
        if (st) {
          const on = st.getAttribute('aria-pressed') !== 'true', any = st.dataset.nfStage === 'any';
          document.querySelectorAll('#nfStages [data-nf-stage]').forEach((b) => { if (on && (any ? b !== st : b.dataset.nfStage === 'any')) b.setAttribute('aria-pressed', 'false'); });
          st.setAttribute('aria-pressed', String(on));
          if (document.querySelector('#nfStages [aria-pressed="true"]')) tplSetErr($('nfStages'), 'nfStages-err', '', true);
          const stages = tplFormStages();
          ['nfPh', 'nfSubjPh'].forEach((id) => { const p = $(id); if (p) p.innerHTML = tplChipBtns(stages); });
          tplFormCheck();
          return;
        }
        /* a placeholder chip goes in at the caret of the field its row belongs to */
        const ph = tg.closest('[data-ph]');
        if (ph) {
          const ta = $(ph.closest('[data-ph-default]').dataset.phDefault); if (!ta) return;
          const a = ta.selectionStart == null ? ta.value.length : ta.selectionStart, z = ta.selectionEnd == null ? a : ta.selectionEnd;
          ta.value = ta.value.slice(0, a) + ph.dataset.ph + ta.value.slice(z);
          const c = a + ph.dataset.ph.length;
          ta.focus(); ta.setSelectionRange(c, c);
          ta.dispatchEvent(new Event('input', { bubbles: true }));
        }
      });
      w.addEventListener('change', (e) => {
        /* attachments picked: allowed ones are added, others named under the field */
        if (e.target.matches('input[type="file"][data-files]')) { tplAddFiles(e.target.dataset.files, e.target.files); e.target.value = ''; return; }
      });
      /* files dropped on the Attachments field get the same check as picked ones */
      w.addEventListener('dragover', (e) => { const z = e.target.closest && e.target.closest('.tpl-attach'); if (!z) return; e.preventDefault(); z.classList.add('is-drop'); });
      w.addEventListener('dragleave', (e) => { const z = e.target.closest && e.target.closest('.tpl-attach'); if (z && !z.contains(e.relatedTarget)) z.classList.remove('is-drop'); });
      w.addEventListener('drop', (e) => { const z = e.target.closest && e.target.closest('.tpl-attach'); if (!z) return; e.preventDefault(); z.classList.remove('is-drop'); tplAddFiles(z.dataset.files, e.dataTransfer.files); });
      tplArrows($('tplRight'), '[data-tpl-dtab]', (b) => tplGuard(() => tplPickTab(b.dataset.tplDtab), b));
      w.addEventListener('submit', (e) => {
        e.preventDefault();
        if (e.target.id === 'tplEditor') tplSaveEdit();
        else if (e.target.id === 'tplForm') tplSaveForm();
      });
      w.addEventListener('input', (e) => {
        const el = e.target;
        if (el.dataset && el.dataset.allow) tplFilter(el);
        if (el.id === 'tplSearch') { tplQuery = el.value.trim(); tplRenderTypes(); return; }
        if (el.dataset && el.dataset.smsCount) { const c = $(el.dataset.smsCount); if (c) c.textContent = tplCountText(el.value); }
        if (el.dataset && el.dataset.err && el.value.trim() && !$(el.dataset.err).hidden) tplSetErr(el, el.dataset.err, '');
        /* a length limit: the counter follows the typing, and going over says so under the field */
        if (el.dataset && (el.dataset.limit || el.dataset.phMax)) { tplCount(el); const m = tplLimitMsg(el); if (m || !$(el.dataset.err).hidden) tplSetErr(el, el.dataset.err, m); }
        if (el.dataset && el.dataset.sample != null) return;
        if (el.closest('#tplEditor')) {
          tplCheckEditor();
          if (needsApproval(tplEdit)) tplSyncSamples('tplEdSamples', $('tplEdText').value);
          tplPaintPreview();
        } else if (el.closest('#tplForm')) {
          /* the message: the sample rows and the SMS count follow it */
          if (el.id === 'nfText') { tplSyncSamples('nfSamples', el.value); tplFormSync(); }
          tplFormCheck();
        }
      });
      /* remember which field of a box the chips should fill */
      w.addEventListener('focusin', (e) => {
        const sc = e.target.closest && e.target.closest('.tpl-phscope');
        if (sc && e.target.matches('input[type="text"]:not([data-sample]), textarea')) sc.dataset.last = e.target.id;
      });
    } }

    /* ---- full screen: the card itself covers the shell (the module's toggleFullscreen) ---- */
    let full = false;
    function setFull(on) {
      if (full === on) return;
      full = on;
      $('crmPage').toggleAttribute('data-fullscreen', on);
      document.body.classList.toggle('crm-fullscreen', on);
      /* the one header button carries both directions, as the module's pair of buttons does */
      const btn = document.querySelector('.title-expand-btn');
      btn.innerHTML = icon(on ? 'exit-full' : 'expand');
      btn.setAttribute('aria-label', on ? 'Exit full screen' : 'Open templates in full screen');
      btn.title = on ? 'Exit full screen' : 'Full screen';
    }
    $('crmPage').addEventListener('click', (e) => { if (e.target.closest('[data-crm-action="fullscreen"]')) setFull(!full); });
    /* Esc closes the innermost thing: a popup, full view, then the phone's message screen */
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      const top = tplModalTop();
      if (top) { e.preventDefault(); if (top.id === 'tplDiscModal') tplKeepEditing(); else if (top.id === 'tplFormModal') tplAskCloseForm(); else tplHideModal(true); return; }
      if (full) setFull(false);
      else if (tplMsgOpen() && tplPhone()) tplCloseMsg();
    });

    /* ---- the Super CRM tab strip on phones: land the active tab on a snap start ---- */
    function showActiveTabCrm() {
      const nav = document.querySelector('header nav[aria-label="Section navigation"]'); if (!nav) return;
      const a = nav.querySelector('button.font-semibold'); if (!a) return;
      const pad = parseFloat(getComputedStyle(nav).scrollPaddingLeft) || 16;
      const n0 = nav.getBoundingClientRect().left - nav.scrollLeft, x = (t) => t.getBoundingClientRect().left - n0;
      const l = x(a), r = l + a.offsetWidth, w = nav.clientWidth;
      const starts = [...nav.querySelectorAll('button')].map((t) => Math.max(0, x(t) - pad));
      const onStart = starts.some((st) => Math.abs(st - nav.scrollLeft) < 1);
      if (onStart && l - pad >= nav.scrollLeft && r + pad <= nav.scrollLeft + w) return;
      const target = starts.find((st) => st <= l - pad && r + pad <= st + w);
      nav.scrollLeft = Math.max(0, target != null ? target : r + pad - w);
    }
    setTimeout(showActiveTabCrm, 450);
    window.addEventListener('resize', showActiveTabCrm);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => setTimeout(showActiveTabCrm, 0));

    /* ---- boot: #templates/<type id> opens on that type, ?stage=<key> on that stage; the tab starts on App chat ---- */
    paintIcons(document.querySelector('.ss-chat'));
    function tplFromHash() {
      const h = tplReadHash();
      tplStage = h.stage || '__all';
      if (h.id) tplTypeId = h.id;
      /* a type opens where it is listed: its first stage, or General templates */
      if (h.id && !tplVisibleTypes(tplTab, tplStage).some((x) => x.id === h.id)) tplStage = TPL_BY_ID(h.id).stages[0] || '__all';
      if (h.edit) tplTab = h.edit;
      tplSettle();
      /* only the admin gets the editor or the form; staff stay on the read-only view */
      if (!canEdit) return;
      if (h.isNew) tplOpenForm(h.stage);
      else if (h.id && h.edit) tplStartEdit(h.edit);
    }
    /* staff have no way to start a template */
    if (!canEdit) $('tplNew').hidden = true;
    /* the shell's account area names who is signed in. v4 has no email for its assignees, so staff show none */
    { const me = $('shellMe'), mail = $('shellMeEmail');
      if (me) me.textContent = `${TPL_ME.name} · ${TPL_ME.role}`;
      if (mail) mail.hidden = !canEdit; }
    tplFromHash();
    window.addEventListener('hashchange', tplFromHash);
    /* the page's own test hook */
    window.__tpl = { TEMPLATES, setFull, pickTab: tplPickTab, pickStage: tplPickStage, pickType: tplPickType, render: tplRenderAll,
      visible: (tab, stage) => tplVisibleTypes(tab, stage).map((t) => t.id), TPL_BY_STAGE, TPL_GENERAL,
      state: () => ({ stage: tplStage, tab: tplTab, ch: tplCh, type: tplTypeId, mode: tplMode, edit: tplEdit, full, msg: tplMsgOpen(), dirty: tplDirty(), query: tplQuery, role: TPL_ROLE, fail: [...TPL_FAIL] }), fromHash: tplFromHash };
  })();
  </script>
<script src="../../components/RouteLoader.js"></script>
</body>
