/* Visits moved off a host on leave pile up in one banner until dismissed. */
function noteHostMoves(moves) {
  if (!moves || !moves.length) return 0;
  const seen = new Set((appState.avHostMoves || []).map(x => x.id));
  appState.avHostMoves = (appState.avHostMoves || []).filter(x => !moves.some(m => m.id === x.id)).concat(moves);
  return moves.filter(m => !seen.has(m.id)).length;
}
function afterPublish(conflicts) {
  const had = new Set(appState.avConflictIds || []);
  appState.avConflicts = conflicts;
  appState.avConflictIds = conflicts.map(v => v.id);
  const newConflicts = conflicts.filter(v => !had.has(v.id)).length;
  const newMoves = noteHostMoves(availabilityService.lastHostMoves);
  return { newConflicts, newMoves };
}
function publishAvailability(force) {
  clearTimeout(avSaveTimer);
  if (!availabilityService.isDirty()) { availabilityService.discard(); appState.avSaveState = 'saved'; paintAvStatus(); return; }
  if (appState.avSaving) { appState.avSaveAgain = true; return; }
  const errs = availabilityService.validateDraft(availabilityService.current());
  if (Object.keys(errs).length) { appState.avErrors = errs; appState.avSaveState = 'invalid'; paintAvStatus(); return; }
  // Harmless edits autosave. An edit that would leave existing bookings outside the schedule is held
  // until staff have seen the affected families and pressed "Apply changes" (or undone the edit).
  if (!force) {
    const had = new Set(appState.avConflictIds || []);
    const hit = availabilityService.conflicts(availabilityService.current()).filter(v => !had.has(v.id));
    if (hit.length) { appState.avReview = hit.map(v => v.id); appState.avSaveState = 'review'; paintAvStatus(); return; }
  }
  appState.avReview = null;
  appState.avSaving = true; appState.avSaveState = 'saving'; paintAvStatus();
  availabilityService.save().then(conflicts => {
    appState.avSaving = false; appState.avSaveState = 'saved'; appState.avSavedAt = clock.now(); appState.avErrors = {};
    const r = afterPublish(conflicts);
    avSync.post();

const avSync = (() => {
  // Random per window: uid() is a counter, so every window would get the same id and ignore the others.
  const tab = 'tab-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2), KEY = 'visit-availability-sync';
  let ch = null;
  try { ch = new BroadcastChannel(KEY); } catch (e) { ch = null; }
  /* Make another window's published version live here (no local edit in the way). */
  const apply = cfg => {
    availabilityService.draft = null;
    clearTimeout(avSaveTimer);
    const r = afterPublish(availabilityService.publish(cfg));
    appState.avSaveState = 'saved'; appState.avSavedAt = clock.now(); appState.avErrors = {}; appState.avIncoming = null; appState.avReview = null;
    renderKeepingFocus();
    toast.show('Availability updated from another window' + (r.newMoves ? ` · ${r.newMoves} ${plural(r.newMoves, 'visit', 'visits')} moved off a host on leave` : ''), { icon: 'sync' });
  };
  const receive = m => {
    if (!m || m.type !== 'availability' || m.tab === tab || !m.cfg) return;
    if (JSON.stringify(m.cfg) === JSON.stringify(availabilityService.saved)) return;
    if (availabilityService.isDirty()) {
      // Conflict: keep the local draft, hold the incoming version, and let staff choose (status badge).
      appState.avIncoming = m.cfg; appState.avSaveState = 'conflict';
      clearTimeout(avSaveTimer); paintAvStatus();
      toast.show('Availability was changed in another window — choose which version to keep', { icon: 'sync_problem' });
      return;
    }
    apply(m.cfg);
  };
  if (ch) ch.onmessage = e => receive(e.data);
  else window.addEventListener('storage', e => { if (e.key === KEY && e.newValue) { try { receive(JSON.parse(e.newValue)); } catch (err) { /* ignore malformed */ } } });
  return {
    receive, apply,
    post() {
      const m = { type: 'availability', tab, at: Date.now(), cfg: clone(availabilityService.saved) };
      try { if (ch) ch.postMessage(m); else localStorage.setItem(KEY, JSON.stringify(m)); } catch (e) { /* storage unavailable — this window still works */ }
    }
  };
})();

      if (f.scope === 'day') { c.blocked = c.blocked.filter(b => b.date !== f.date); c.blocked.push({ id: uid('bd'), date: f.date, reason, scope: 'day', times: [] }); }
      else {
        const ex = c.blocked.find(b => b.date === f.date && b.scope === 'slots');
        if (ex) { ex.times = Array.from(new Set(ex.times.concat(f.times))).sort(); ex.reason = reason; }
        else c.blocked.push({ id: uid('bd'), date: f.date, reason, scope: 'slots', times: f.times.slice().sort() });
      }
      toast.show(`${dateUtil.fmt(f.date)} blocked`, { icon: 'block' });
      appState.bdForm = { date: '', reason: 'School holiday', scope: 'day', times: [] };
    }, el.id);
  },
  'av-block-remove': el => avEdit(cfg => { cfg.blocked = cfg.blocked.filter(b => b.id !== el.dataset.bid); toast.show('Date unblocked', { icon: 'lock_open' }); }),
  'av-holidays': () => avEdit(cfg => {
    const T = clock.today(), y = +T.slice(0, 4), limit = dateUtil.add(T, 365);
    let n = 0;
    [y, y + 1].forEach(yr => PUBLIC_HOLIDAYS.forEach(h => {
      const d = yr + '-' + h.md;
      if (d >= T && d <= limit && !cfg.blocked.some(b => b.date === d && b.scope === 'day')) { cfg.blocked.push({ id: uid('bd'), date: d, reason: h.name, scope: 'day', times: [] }); n++; }
    }));
    toast.show(n ? `${n} national ${plural(n, 'holiday', 'holidays')} blocked` : 'National holidays are already blocked', { icon: 'flag' });
  }),
  'av-ex-add': el => {
    const f = appState.exForm, cfg = availabilityService.current(), T = clock.today();
    const cap = parseInt(f.capacity, 10);
    let err = '';
    if (!f.date) err = 'Choose a date.';
    else if (f.date < T) err = 'Choose today or a future date.';
    else if (cfg.exceptions.some(x => x.date === f.date)) err = 'This date already has an exception. Delete it first.';
    else if (cfg.blocked.some(b => b.date === f.date && b.scope === 'day')) err = 'This date is blocked. Unblock it first.';
    else if (dateUtil.toMin(f.end) <= dateUtil.toMin(f.start)) err = 'End time must be after start time.';
    else if (!(cap >= 1 && cap <= 20)) err = 'Families per slot must be between 1 and 20.';
    appState.exError = err;
    if (err) { uiService.render({ focusId: 'ex-date' }); return; }
    avEdit(c => {
      c.exceptions.push({ id: uid('ex'), date: f.date, start: f.start, end: f.end, capacity: cap, note: f.note.trim() || 'Special timings' });
      appState.exForm = { date: '', start: '09:00', end: '13:00', capacity: 4, note: '' };
      toast.show(`Exception added for ${dateUtil.fmt(f.date)}`, { icon: 'edit_calendar' });
    }, el.id);
  },
  'av-ex-remove': el => {
    const ex = availabilityService.current().exceptions.find(x => x.id === el.dataset.eid);
    dialogs.confirm({
      title: 'Delete this exception?', danger: true, confirmLabel: 'Delete exception',
      text: `${dateUtil.fmt(ex.date)} will go back to the normal ${DAY_LABEL[dateUtil.dayKey(ex.date)]} hours.`,
      onConfirm: () => avEdit(c => { c.exceptions = c.exceptions.filter(x => x.id !== ex.id); })
    });
  },
  // Retry after a failed automatic save (shown in the status badge).
  'av-save': () => publishAvailability(),
  'av-review-conflicts': () => openBookings('conflicts'),
  'av-hide-nohost': el => avEdit(cfg => { cfg.hideNoHost = !cfg.hideNoHost; toast.show(cfg.hideNoHost ? 'Slots with no host will be hidden from parents' : 'Parents can book slots with no host', { icon: 'visibility' }); }, el.id),
  'av-tell-parents': () => {
    const ids = (appState.avHostMoves || []).map(x => x.id).filter(id => db.visits[id] && db.visits[id].hostNotice);
    if (!ids.length) { toast.show('Every family has already been told', { icon: 'check_circle' }); return; }
    dialogs.bulkRemind(ids, 'host');
  },
  'av-moves-dismiss': () => { appState.avHostMoves = []; uiService.render(); }
};

/* A contextual view for bookings that fall outside newly saved hours. */
filterService.VIEWS.push({ id: 'conflicts', label: 'Outside New Hours', contextual: true, test: b => (appState.avConflictIds || []).includes(b.id) });

/* ============================ EVENT WIRING ============================ */
let searchTimer = null;
function onClick(e) {
  const el = e.target.closest('[data-action]');
  if (!el || el.closest('.menu')) return;
  if (el.getAttribute('aria-disabled') === 'true' || el.disabled) { e.preventDefault(); return; }
  const fn = ACTIONS[el.dataset.action];
  if (!fn) return;
  if (el.tagName === 'A' && !el.dataset.keepHref) e.preventDefault();
  try { fn(el, e); } catch (err) { toast.show(errorText(err), { error: true }); }
}
function onChange(e) {
  const el = e.target;
  if (el.dataset.select) {
    const id = el.dataset.select, set = new Set(appState.selected);
    if (el.checked) set.add(id); else set.delete(id);
    appState.selected = Array.from(set); uiService.renderResults();
    const again = document.getElementById(el.id); if (again) again.focus();
    return;
  }
  if (el.hasAttribute('data-select-page')) {
    const set = new Set(appState.selected);
    const list = filterService.sortBy(filterService.apply());
    filterService.paginate(list, appState.page || 1, appState.pageSize || 25).items.forEach(b => { if (el.checked) set.add(b.id); else set.delete(b.id); });   // this page only
    appState.selected = Array.from(set); uiService.renderResults();
    const again = document.getElementById('sel-page'); if (again) again.focus();
    announce(el.checked ? appState.selected.length + ' bookings selected' : 'Selection cleared');
    return;
  }
  if (el.hasAttribute('data-pagesize')) { appState.pageSize = +el.value; prefs.save(); uiService.renderResults(); const again = document.getElementById('pg-size'); if (again) again.focus(); return; }
  if (el.hasAttribute('data-sort')) {
    const [key, dir] = el.value.split(':'); appState.sort = { key, dir }; prefs.save(); uiService.renderResults();
    const again = document.getElementById('sort-cards'); if (again) again.focus(); return;
  }
  if (el.matches('select[data-staff]')) {
    const hint = document.getElementById(el.id + '-role'), h = availabilityService.host(el.value);
    if (hint) hint.textContent = h ? h.role : '';
    return;
  }
  if (el.dataset.filter) {
    appState.filters[el.dataset.filter] = el.value;
    if (el.dataset.filter === 'date' && el.value !== 'custom') appState.filters.customDate = '';
    if (modalService.top()) { uiService.render(); return; }
    uiService.render({ focusId: el.id });
    if (el.dataset.filter === 'date' && el.value === 'custom') { const c = document.getElementById('f-custom'); if (c) c.focus(); }
    return;
  }
  if (el.dataset.av) {
    const k = el.dataset.day, field = el.dataset.av;
    avEdit(cfg => {
      const d = cfg.weekly[k];
      d[field] = field === 'slotMins' ? +el.value : el.value;
      if (field !== 'defaultHostId') pruneSlotCaps(d);
    }, el.id);
    return;
  }
  if (el.dataset.bd) {
    appState.bdForm[el.dataset.bd] = el.value;
    if (el.dataset.bd === 'date') { appState.bdForm.times = []; appState.bdError = ''; uiService.render({ focusId: el.id }); }
    return;
  }
  if (el.dataset.ex) appState.exForm[el.dataset.ex] = el.value;
  if (el.dataset.leave) (appState.leaveForm[el.dataset.host] = appState.leaveForm[el.dataset.host] || { from: '', to: '', reason: '' })[el.dataset.leave] = el.value;
  if (el.dataset.hostdate) {
    const id = el.dataset.host, h = availabilityService.current().hosts.find(x => x.id === id);
    const next = Object.assign({ from: h.from, until: h.until }, { [el.dataset.hostdate]: el.value });
    appState.hostErr[id] = next.from && next.until && next.until < next.from ? '“Until” must be on or after “From”.' : '';
    if (appState.hostErr[id]) { uiService.render({ focusId: el.id }); return; }
    avEdit(c => { c.hosts.find(x => x.id === id)[el.dataset.hostdate] = el.value; }, el.id);
  }
  if (el.dataset.hostmax) {
    const id = el.dataset.host, n = Math.max(0, Math.min(20, Math.floor(+el.value || 0)));
    avEdit(c => { c.hosts.find(x => x.id === id).maxPerDay = n; }, el.id);
  }
}
function onInput(e) {
  const el = e.target;
  if (el.dataset.filter === 'q') {
    appState.filters.q = el.value;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => uiService.renderResults(), 150);
  } else if (el.dataset.bd === 'reason') appState.bdForm.reason = el.value;
  else if (el.dataset.ex) appState.exForm[el.dataset.ex] = el.value;
  else if (el.dataset.leave === 'reason') (appState.leaveForm[el.dataset.host] = appState.leaveForm[el.dataset.host] || { from: '', to: '', reason: '' }).reason = el.value;
}
function onSubmit(e) {
  const form = e.target.closest('form[data-form="note"]');
  if (!form) return;
  e.preventDefault();
  const id = form.dataset.id, ta = form.querySelector('#note-input'), errEl = form.querySelector('#note-err'), btn = form.querySelector('#note-save');
  if (!ta.value.trim()) { errEl.hidden = false; errEl.innerHTML = icon('error') + 'Write a note first.'; ta.setAttribute('aria-invalid', 'true'); ta.focus(); return; }
  const text = ta.value;
  runMutation({
    btn, visitId: id, busyLabel: 'Saving…', fn: () => bookingService.addNote(id, text),
    onSuccess: () => { ta.value = ''; uiService.refresh(); toast.show('Note added', { icon: 'sticky_note_2' }); const n = document.getElementById('note-input'); if (n) n.focus(); },
    onError: err => { errEl.hidden = false; errEl.innerHTML = icon('error') + esc(errorText(err, 'STATUS_SAVE')) + ' Your note is still here.'; }
  });
}
function onKeydown(e) {
  if (modalService.top()) { modalService.trap(e); return; }
  if (e.ctrlKey || e.metaKey || e.altKey || menuService.el) return;
  const t = e.target, typing = t.matches && t.matches('input, textarea, select, [contenteditable="true"]');
  if (typing) return;
  if (e.key === '/' && appState.section === 'bookings') { const q = document.getElementById('f-q'); if (q) { e.preventDefault(); q.focus(); } }
  else if ((e.key === 'n' || e.key === 'N') && authz.can(PERM.CREATE)) { e.preventDefault(); dialogs.newBooking({}); }
}

function init() {
  appState.filters = filterService.defaults();
  appState.bdForm = { date: '', reason: 'School holiday', scope: 'day', times: [] };
  appState.exForm = { date: '', start: '09:00', end: '13:00', capacity: 4, note: '' };
  appState.avExpanded = {};
  appState.hostOpen = {}; appState.hostMonth = {}; appState.hostErr = {}; appState.leaveForm = {}; appState.leaveErr = {};
  appState.avErrors = {};
  seedDemoData();
  prefs.load();
  document.addEventListener('click', onClick);
  document.addEventListener('change', onChange);
  document.addEventListener('input', onInput);
  document.addEventListener('submit', onSubmit);
  document.addEventListener('keydown', onKeydown);
  const onMq = () => { if (appState.section === 'bookings') uiService.renderResults(); };
  if (mqMobile.addEventListener) mqMobile.addEventListener('change', onMq); else mqMobile.addListener(onMq);
  const onCards = () => { if (appState.section === 'bookings') uiService.renderResults(); };
  if (mqCards.addEventListener) mqCards.addEventListener('change', onCards); else mqCards.addListener(onCards);
  window.addEventListener('resize', () => menuService.close(false));
  window.addEventListener('beforeunload', e => { if (availabilityService.isDirty()) { e.preventDefault(); e.returnValue = ''; } });
  uiService.render();
  if (location.hash === '#selftest') qaSuite.open().then(res => {
    const failed = res.filter(r => !r.ok);
    document.documentElement.dataset.selftest = failed.length ? 'fail' : 'pass';
    console.info('[QA] ' + (res.length - failed.length) + '/' + res.length + ' passed');
    failed.forEach(r => console.warn('[QA] FAIL ' + r.group + ' — ' + r.name + ': ' + r.detail));
  });
  else if (location.hash === '#handoff') handoff.open();
  // Developer review only (not shown in the School Admin UI): #simulate-errors, #simulate-conflict
  else if (location.hash === '#simulate-errors') appState.simulateErrors = true;
  else if (location.hash === '#simulate-conflict') appState.simulateConflict = true;
  // Keep time-based states (starting soon, running late) fresh without stealing focus.
  setInterval(() => {
    uiService.syncShell();
    const idle = !modalService.top() && !menuService.el && (document.activeElement === document.body || document.activeElement === document.getElementById('main'));
    if (idle && appState.section !== 'availability') uiService.refresh();
  }, 60000);
}
init();

/* The shell's level-2 bar (Overview / Availability / Bookings) drives the section; the demo sign-in role is in the shell header. */
(function () {
  if (!window.SSHeader) return;
  const announce = () => window.SSHeader.set([{
    id: 'role', label: 'Signed in as', icon: 'person', prefix: 'Demo', value: appState.role,
    note: 'Demo only. Switching changes what this page lets you do.',
    options: Object.keys(ROLE_LABEL).map(k => ({ value: k, label: ROLE_LABEL[k], sub: ROLE_USERS[k].name }))
  }]);
  window.SSHeader.on('role', (k) => { if (!ROLE_LABEL[k] || k === appState.role) return; appState.role = k; appState.page = 1; appState.selected = []; uiService.render(); announce(); });
  window.SSHeader.onSection((s) => { if (['overview', 'availability', 'bookings'].includes(s) && s !== appState.section) goSection(s); });
  announce();
})();
</script>
