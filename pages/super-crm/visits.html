/* ============================ 12. UI SERVICE ============================ */
const mqMobile = window.matchMedia('(max-width: 767px)');
const mqCards = window.matchMedia('(max-width: 1199px)');   // bookings show as cards below this width, a table above

const uiService = {
  /* ---------------- shared components ---------------- */
  statusBadge(status) {
    const m = STATUS_META[status];
    return `<span class="badge tone-${m.tone}">${icon(m.icon)}${m.label}</span>`;
  },
  toneBadge(label, tone, ic) { return `<span class="badge tone-${tone}">${ic ? icon(ic) : ''}${esc(label)}</span>`; },
  hostChip(b, opts) {
    const o = opts || {};
    const editable = o.editable !== false && authz.can(PERM.ASSIGN_HOST) && bookingService.canAssignHost(b.v);
    const inner = b.host
      ? `<span class="host"><span class="avatar" aria-hidden="true">${initials(b.host.name)}</span><span class="host-name">${esc(b.host.name)}</span></span>`
      : (ACTIVE_STATUSES.includes(b.v.status) ? `<span class="badge tone-amber">${icon('person_add')}Unassigned</span>` : '<span class="muted">—</span>');
    if (!editable) return inner;
    return `<button type="button" class="host" data-action="change-host" data-id="${b.id}" aria-label="${b.host ? 'Change host, currently ' + esc(b.host.name) : 'Assign a host'}">${inner}</button>`;
  },
  /* ---------------- CONTACT (Call · WhatsApp · SMS · Email) ----------------
     One control per channel, always in CONTACT_ORDER. A channel the parent can't
     be reached on stays in place, disabled, with the reason — rows never shift. */
  contactControl(b, c, o) {
    const opt = o || {}, lab = !!opt.labels;
    const waWarn = c.channel === CHANNEL.WHATSAPP && communicationService.waFailed(b);
    const cls = `btn btn-${opt.tone || 'secondary'} btn-sm${lab ? '' : ' btn-icon'} ch ch-${c.channel}${waWarn ? ' has-warn' : ''}`;
    const inner = icon(c.meta.icon) + (lab ? `<span>${esc(c.meta.label)}</span>` : '');
    if (!c.available) return `<button type="button" class="${cls}" disabled aria-label="${esc(c.meta.label + ' — ' + c.reason)}" title="${esc(c.reason)}">${inner}</button>`;
    const aria = `${c.meta.verb} ${b.p.name} on ${c.target}${waWarn ? ' (last WhatsApp message failed — try SMS or call)' : ''}`;
    const title = waWarn ? 'Last WhatsApp message failed — try SMS or call' : `${c.meta.label} · ${c.target}`;
    if (c.channel === CHANNEL.CALL) return `<a class="${cls}" href="${phone.tel(b.p.mobile)}" data-action="log-call" data-keep-href="1" data-id="${b.id}" aria-label="${esc(aria)}" title="${esc(title)}">${inner}</a>`;
    return `<button type="button" class="${cls}" data-action="message" data-channel="${c.channel}" data-id="${b.id}" aria-label="${esc(aria)}" title="${esc(title)}">${inner}</button>`;
  },
  /* All four channels with labels — drawer, cards, follow-up. */
  contactBar(b, o) {
    if (!authz.can(PERM.CONTACT)) return '';
    return `<div class="contact-bar${o && o.fill ? ' is-fill' : ''}" role="group" aria-label="Contact ${esc(b.p.name)}">${communicationService.channels(b).map(c => this.contactControl(b, c, { labels: true })).join('')}</div>`;
  },
  /* Tight spaces (today's schedule, next visit): Call stays one tap; the three message channels sit behind one Message button. */
  messageButton(b) {
    if (!authz.can(PERM.CONTACT)) return '';
    return `<button type="button" class="btn btn-secondary btn-sm btn-icon" data-action="contact-menu" data-id="${b.id}" aria-haspopup="menu" aria-expanded="false" aria-label="Message ${esc(b.p.name)} — WhatsApp, SMS or email" title="Message · WhatsApp, SMS or email">${icon('forum')}</button>`;
  },
  /* Bookings table: the number is the Call button; WhatsApp · SMS · Email follow in fixed slots. */
  contactButtons(b) {
    if (!authz.can(PERM.CONTACT)) return '<span class="muted">—</span>';
    const nm = esc(b.p.name);
    const msg = communicationService.channels(b).filter(c => c.channel !== CHANNEL.CALL);
    return `<div class="contact-btns">
      <a class="phone-link num" href="${phone.tel(b.p.mobile)}" data-action="log-call" data-keep-href="1" data-id="${b.id}" aria-label="Call ${nm} on ${esc(phone.display(b.p.mobile))}" title="Call">${icon('call')}${esc(phone.display(b.p.mobile).replace('+91 ', ''))}</a>
      <span class="contact-msg" role="group" aria-label="Message ${nm}">${msg.map(c => this.contactControl(b, c, { tone: 'ghost' })).join('')}</span>
    </div>`;
  },
  /* The one obvious next step for this visit (or a quiet Open when the role can't act). */
  primaryAction(b, opts) {
    const o = opts || {};
    const size = o.size === 'md' ? '' : ' btn-sm';
    // Opened from "Reschedule booked families" on the Hosts warning: every row's main button is Reschedule.
    if (appState.section === 'bookings' && appState.savedView === 'no_host_slots' && bookingService.canReschedule(b.v) && authz.can(PERM.RESCHEDULE)) {
      return `<button type="button" class="btn btn-primary${size}${o.grow ? ' grow' : ''}" data-action="primary" data-act="reschedule" data-id="${b.id}">${icon('update')}Reschedule</button>`;
    }
    // Opened from "Change host" on the Hosts section: every row's main button changes the host.
    if (appState.section === 'bookings' && appState.savedView === 'host_change' && ACTIVE_STATUSES.includes(b.v.status) && authz.can(PERM.ASSIGN_HOST)) {
      return `<button type="button" class="btn btn-primary${size}${o.grow ? ' grow' : ''}" data-action="change-host" data-id="${b.id}">${icon('badge')}${b.v.hostId ? 'Change host' : 'Assign host'}</button>`;
    }
    // Next action = the positive status move (Visit Requested → Scheduled → Completed → Requested).
    // The remaining allowed moves (Cancelled, Declined, Missed) sit in the ⋯ menu.
    const pm = primaryMove(b);
    if (!pm || !authz.can(statusMovePerm(pm.to))) {
      return `<button type="button" class="btn btn-secondary${size}${o.grow ? ' grow' : ''}" data-action="open" data-id="${b.id}">${icon('visibility')}Open</button>`;
    }
    return `<button type="button" class="btn btn-primary${size}${o.grow ? ' grow' : ''}" data-action="primary" data-act="move:${pm.to}" data-id="${b.id}">${icon(pm.icon)}${esc(pm.label)}</button>`;
  },
  nextHint(b) {
    const h = bookingService.nextAction(b).hint;
    return h && h.text ? `<span class="next-hint ${h.tone}">${esc(h.text)}</span>` : '';
  },
  moreButton(b, label) {
    return `<button type="button" class="btn btn-ghost btn-sm btn-icon" data-action="row-menu" data-id="${b.id}" aria-haspopup="menu" aria-expanded="false" aria-label="${esc(label || 'More actions for ' + b.p.name)}">${icon('more_horiz')}</button>`;
  },
  whenText(v) { return `${dateUtil.rel(v.date)} · ${dateUtil.time(v.time)}`; },
  empty(ic, title, text, cta) {
    return `<div class="empty">${icon(ic)}<h3>${esc(title)}</h3><p>${esc(text)}</p>${cta || ''}</div>`;
  },
  meter(booked, cap) {
    const st = capacityState(booked, cap), pct = cap ? Math.min(100, Math.round(booked / cap * 100)) : 0;
    return `<span class="meter ${st}" role="img" aria-label="${booked} of ${cap} places booked, ${CAPACITY_LABEL[st].toLowerCase()}"><i style="width:${pct}%"></i></span>`;
  },

  /* ---------------- shell ---------------- */
  syncShell() {
    const cta = document.getElementById('mobile-cta');
    cta.hidden = appState.section === 'availability' || !authz.can(PERM.CREATE);
  },
  render(opts) {
    const o = opts || {};
    const activeId = document.activeElement && document.activeElement.id;
    const main = document.getElementById('main');
    const oldSched = document.getElementById('sched-scroll');
    const schedTop = oldSched ? oldSched.scrollTop : null;
    // Scrollable lists keep their position across re-renders (every Availability edit re-renders).
    const listTops = {};
    document.querySelectorAll('#main .list-scroll[id]').forEach(el => { listTops[el.id] = el.scrollTop; });
    const html = appState.section === 'availability' ? this.renderAvailability()
      : appState.section === 'bookings' ? this.renderBookings() : this.renderOverview();
    main.innerHTML = html;
    this.positionSchedule(schedTop);
    Object.keys(listTops).forEach(id => { const el = document.getElementById(id); if (el && listTops[id]) el.scrollTop = listTops[id]; });
    this.syncShell();
    if (appState.section === 'bookings') this.renderResults();
    const focusEl = (o.focusId && document.getElementById(o.focusId)) || (activeId && document.getElementById(activeId));
    if (focusEl && !modalService.top()) focusEl.focus({ preventScroll: true });
    else if (o.focus) restoreFocus(o.focus);
    drawerService.refresh();
  },
  /* Today's Schedule scrolls inside its card. Keep the user's position across
     re-renders; on first show, start at the first visit that isn't finished. */
  positionSchedule(prevTop) {
    const wrap = document.getElementById('sched-scroll');
    if (!wrap) return;
    if (prevTop != null) { wrap.scrollTop = prevTop; return; }
    const rows = Array.from(wrap.querySelectorAll('.sched .sched-row'));
    const next = rows.find(r => !r.classList.contains('is-past'));
    const head = wrap.querySelector('.sched-head');
    if (next && rows.indexOf(next) > 0) wrap.scrollTop = next.offsetTop - (head && head.offsetParent ? head.offsetHeight : 0);
  },
  /* Re-render after a data change without resetting the Bookings filter bar. */
  refresh(focus) {
    if (appState.section === 'bookings') { this.renderResults(); this.renderViewChips(); this.syncShell(); drawerService.refresh(); if (focus) restoreFocus(focus); }
    else this.render({ focus });
  },

  /* ---------------- OVERVIEW ---------------- */
  renderOverview() {
    const m = filterService.metrics();
    const T = clock.today(), now = clock.now();
    const cap = m.capacity;
    const done = m.today.filter(b => b.v.status === STATUS.COMPLETED).length;
    const toCome = m.today.filter(b => [STATUS.PENDING, STATUS.CONFIRMED].includes(b.v.status) && !b.v.arrivedAt).length;
    const nc = m.needsConfirmation, ss = m.startingSoon;
    const scoped = !authz.can(PERM.VIEW_ALL);
    const kpi = (view, ic, tone, label, value, sub, subTone, extra) => `
      <button type="button" class="kpi" data-action="open-view" data-view="${view}" aria-label="${esc(label)}: ${esc(value)}. ${esc(sub)}. Open list">
        <span class="kpi-top"><span>${esc(label)}</span><span class="kpi-ico ${tone}">${icon(ic)}</span></span>
        <span class="kpi-val num">${esc(value)}</span>
        ${extra || ''}
        <span class="kpi-sub ${subTone || ''}">${esc(sub)}</span>
      </button>`;
    const capSub = (!cap.open ? (cap.reason || 'No visit hours today') : (cap.capacity - cap.booked) + ' ' + plural(cap.capacity - cap.booked, 'place', 'places') + ' left') + (cap.unplaced ? ' · ' + cap.unplaced + ' outside the hours' : '');
    const cards = [
      kpi('today', 'event', '', "Today's Visits", m.today.length, m.today.length ? `${done} completed · ${toCome} still to come` : 'No visits today'),
      kpi('needs_confirmation', 'hourglass_top', nc.length ? 'amber' : '', 'Needs Scheduling', nc.length, nc.length ? 'Earliest: ' + this.whenText(nc[0].v) : 'All visits scheduled', nc.length ? 'warn' : ''),
      kpi('starting_soon', 'schedule', ss.length ? 'teal' : '', 'Starting Soon', ss.length, ss.length ? 'Next at ' + dateUtil.time(ss[0].v.time) + ' · within 90 min' : 'Nothing in the next 90 min'),
      kpi('unassigned', 'person_add', m.unassigned.length ? 'amber' : '', 'Unassigned', m.unassigned.length, m.unassigned.length ? 'Upcoming visits without a host' : 'Every visit has a host', m.unassigned.length ? 'warn' : ''),
      kpi('follow_up_due', 'phone_callback', m.followUpOverdue.length ? 'red' : '', 'Follow-Up Due', m.followUpDue.length, m.followUpOverdue.length ? m.followUpOverdue.length + ' overdue' : (m.followUpDue.length ? 'Due today' : 'None due'), m.followUpOverdue.length ? 'bad' : ''),
      `<button type="button" class="kpi" data-action="open-capacity" aria-label="Capacity today: ${cap.booked} of ${cap.capacity} booked. Open today's calendar">
        <span class="kpi-top"><span>Capacity Today</span><span class="kpi-ico">${icon('groups')}</span></span>
        <span class="kpi-val num">${cap.booked}<span class="muted" style="font-size:18px;font-weight:600"> / ${cap.capacity}</span></span>
        ${cap.open ? this.meter(cap.booked, cap.capacity) : ''}
        <span class="kpi-sub">${esc(capSub)}</span>
      </button>`
    ];

    const rows = m.today.map(b => {
      const start = bookingService.startMs(b.v), diff = Math.round((start - now) / 60000);
      const past = [STATUS.COMPLETED, STATUS.NO_SHOW].includes(b.v.status);
      const onCampus = b.v.status === STATUS.CONFIRMED && !!b.v.arrivedAt;
      const soon = !onCampus && [STATUS.PENDING, STATUS.CONFIRMED].includes(b.v.status) && diff >= 0 && diff <= 90;
      const late = !onCampus && [STATUS.PENDING, STATUS.CONFIRMED].includes(b.v.status) && diff < -15;
      const rel = onCampus ? 'On campus' : past ? '' : late ? dateUtil.minutesShort(-diff) + ' late' : diff >= 0 ? 'in ' + dateUtil.minutesShort(diff) : 'now';
      return `<li><div class="sched-row${past ? ' is-past' : ''}${soon ? ' is-soon' : ''}">
        <div class="sched-time"><b>${dateUtil.time(b.v.time)}</b>${rel ? `<small class="${late ? 'late' : ''}">${esc(rel)}</small>` : ''}</div>
        <div class="sched-who"><button type="button" class="cell-link" data-action="open" data-id="${b.id}">${esc(b.p.name)}</button><span class="sub">${esc(b.c.name)} · ${esc(b.e.grade)}</span></div>
        <div class="sched-status">${this.statusBadge(b.v.status)}</div>
        <div class="sched-host">${this.hostChip(b)}</div>
        <div class="sched-act">
          ${authz.can(PERM.CONTACT) ? `<a class="btn btn-secondary btn-sm btn-icon" href="${phone.tel(b.p.mobile)}" data-action="log-call" data-keep-href="1" data-id="${b.id}" aria-label="Call ${esc(b.p.name)}" title="Call ${esc(phone.display(b.p.mobile))}">${icon('call')}</a>
          ${this.messageButton(b)}` : ''}
          <span class="sched-primary">${this.scheduleAction(b)}</span>
          <button type="button" class="btn btn-ghost btn-sm btn-icon" data-action="open" data-id="${b.id}" aria-label="Open details for ${esc(b.p.name)}">${icon('chevron_right')}</button>
        </div>
      </div></li>`;
    }).join('');
    // Column header — the same grid as the rows, so every column lines up.
    const schedHead = `<div class="sched-row sched-head" aria-hidden="true"><span>Time</span><span>Parent / Child</span><span class="h-status">Status</span><span class="h-host">Host</span><span class="h-act">Actions</span></div>`;

    const attnAll = this.attentionItems(m);
    const ATTN_LIMIT = 5;
    const attn = appState.attnExpanded ? attnAll : attnAll.slice(0, ATTN_LIMIT);
    const attnMore = attnAll.length - ATTN_LIMIT;
    const ovTab = appState.ovTab;   // metrics (m) and attnAll are computed once above and reused for the counts
    return `<div class="page">
      <header class="page-head">
        <div>
          <span class="eyebrow">${icon('today')}${esc(dateUtil.fmt(T, { weekday: 'long', day: 'numeric', month: 'long' }))}</span>
          <h1>Visits Overview</h1>
          <p>Manage today's school visits, confirmations and follow-ups.</p>
        </div>
        <div class="page-actions">
          ${authz.can(PERM.CREATE) ? `<button type="button" class="btn btn-primary hide-mobile" data-action="new-booking" title="New booking (N)">${icon('add')}New Booking</button>` : ''}
        </div>
      </header>
      ${scoped ? `<div class="banner alert-info">${icon('filter_alt')}Counsellor view — showing visits you host or follow up.</div>` : ''}
      ${this.nextUp(m)}
      <section class="kpis" aria-label="Today at a glance">${cards.join('')}</section>
      <div class="seg ov-seg" role="group" aria-label="Overview panel">
        <button type="button" id="ov-tab-schedule" data-action="ov-tab" data-tab="schedule" aria-pressed="${ovTab === 'schedule'}">Schedule<span class="count num">${m.today.length}</span></button>
        <button type="button" id="ov-tab-attention" data-action="ov-tab" data-tab="attention" aria-pressed="${ovTab === 'attention'}">Needs attention<span class="count num">${attnAll.length}</span></button>
      </div>
      <div class="ov-grid ov-tabs">
        <section class="card" aria-labelledby="sched-h" data-ov-hidden="${ovTab !== 'schedule'}">
          <div class="card-head">
            <div><h2 id="sched-h">Today's Schedule</h2><p>${m.today.length ? m.today.length + ' ' + plural(m.today.length, 'visit', 'visits') + ' in time order' : 'Nothing booked yet'}</p></div>
            <button type="button" class="btn btn-ghost btn-sm" data-action="open-view" data-view="today">View in Bookings${icon('arrow_forward')}</button>
          </div>
          ${m.today.length ? `<div class="sched-wrap" id="sched-scroll" tabindex="0" role="region" aria-label="Today's schedule, scrollable list">${schedHead}<ul class="sched">${rows}</ul></div>` : this.empty('event_busy', 'No visits today', 'No school visits are scheduled for today.', authz.can(PERM.CREATE) ? `<button type="button" class="btn btn-primary" data-action="new-booking">${icon('add')}Create Booking</button>` : '')}
        </section>
        <section class="card" aria-labelledby="attn-h" data-ov-hidden="${ovTab !== 'attention'}">
          <div class="card-head"><div><h2 id="attn-h">Needs Attention</h2><p>Your action queue, most urgent first</p></div></div>
          ${attn.length ? `<ul class="attn" id="attn-list">${attn.join('')}</ul>` : this.empty('task_alt', "You're all caught up", 'Nothing needs attention right now. No follow-ups are due.')}
          ${attnMore > 0 ? `<div class="card-foot"><button type="button" class="btn btn-ghost btn-sm" id="attn-toggle" data-action="toggle-attn" aria-expanded="${!!appState.attnExpanded}" aria-controls="attn-list">${appState.attnExpanded ? icon('expand_less') + 'Show fewer' : icon('expand_more') + 'Show ' + attnMore + ' more'}</button></div>` : ''}
        </section>
      </div>
    </div>`;
  },
  /* "Who is visiting next?" — answered in one glance for reception:
     next family, time, whether they confirmed, who hosts, and the one action. */
  nextUp(m) {
    const now = clock.now();
    const expected = m.today.filter(b => [STATUS.PENDING, STATUS.CONFIRMED].includes(b.v.status) && !b.v.arrivedAt &&
      bookingService.startMs(b.v) + bookingService.slotMins(b.v) * 60000 > now);
    const onCampus = m.onCampus.length;
    const campusNote = onCampus ? `<span class="next-up-aside">${icon('how_to_reg')}${onCampus} ${plural(onCampus, 'family', 'families')} on campus</span>` : '';
    if (!expected.length) {
      return `<section class="next-up is-empty" aria-label="Next visit">${icon('event_available')}<div class="next-up-main"><b>No more visits expected today</b><span class="sub">${m.today.length ? 'Everyone booked for today has arrived, finished or been closed out.' : 'No school visits are scheduled for today.'}</span></div>${campusNote}</section>`;
    }
    const b = expected[0];
    const sameTime = expected.filter(x => x.v.time === b.v.time).length - 1;
    const diff = Math.round((bookingService.startMs(b.v) - now) / 60000);
    const when = diff > 0 ? 'in ' + dateUtil.minutesText(diff) : diff >= -15 ? 'expected now' : dateUtil.minutesText(-diff) + ' late';
    const confirmed = b.v.status === STATUS.CONFIRMED;
    return `<section class="next-up" aria-labelledby="next-up-h">
      <div class="next-up-time"><span class="eyebrow" id="next-up-h">Next visit</span><b class="num">${dateUtil.time(b.v.time)}</b><small class="${diff < -15 ? 'late' : ''}">${esc(when)}</small></div>
      <div class="next-up-main">
        <button type="button" class="cell-link" data-action="open" data-id="${b.id}">${esc(b.p.name)}</button>
        <span class="sub">${esc(b.c.name)} · ${esc(b.e.grade)}${sameTime > 0 ? ` · <b>+${sameTime} more at ${dateUtil.time(b.v.time)}</b>` : ''}</span>
      </div>
      <div class="next-up-facts">
        ${this.statusBadge(b.v.status)}
        ${confirmed ? '' : `<span class="next-hint warn">Visit Requested — not scheduled yet</span>`}
        <span class="host-label">Host</span>${this.hostChip(b)}
      </div>
      <div class="quick">
        ${authz.can(PERM.CONTACT) ? `<a class="btn btn-secondary btn-sm btn-icon" href="${phone.tel(b.p.mobile)}" data-action="log-call" data-keep-href="1" data-id="${b.id}" aria-label="Call ${esc(b.p.name)}" title="Call ${esc(phone.display(b.p.mobile))}">${icon('call')}</a>${this.messageButton(b)}` : ''}
        ${this.scheduleAction(b)}
      </div>
      ${campusNote}
    </section>`;
  },
  /* Today's schedule: Mark Arrived is the primary quick action for expected visits. */
  scheduleAction(b) {
    const na = bookingService.nextAction(b);
    // Reception can't confirm by phone, but can still check in a pending family who walks in.
    if (b.v.status === STATUS.PENDING && bookingService.canArrive(b.v) && authz.can(PERM.ARRIVE) && !authz.can(PERM.CONFIRM)) {
      return `<button type="button" class="btn btn-primary btn-sm" data-action="primary" data-act="arrive" data-id="${b.id}">${icon('how_to_reg')}Mark Arrived</button>`;
    }
    return this.primaryAction(b);
  },
  attentionItems(m) {
    const item = (tone, ic, title, sub, view, label) => `<li>
      <span class="attn-ico tone-${tone}">${icon(ic)}</span>
      <div class="attn-text"><b>${esc(title)}</b><span class="sub">${esc(sub)}</span></div>
      <button type="button" class="btn btn-secondary btn-sm" data-action="open-view" data-view="${view}">${esc(label || 'Review')}</button></li>`;
    const out = [];
    const n = x => x.length;
    if (n(m.late)) out.push(item('red', 'running_with_errors', `${n(m.late)} ${plural(n(m.late), 'family is', 'families are')} running late`, 'Call them, or mark the visit missed once you know', 'late', 'Call'));
    if (n(m.needsConfirmation)) out.push(item('amber', 'hourglass_top', `${n(m.needsConfirmation)} ${plural(n(m.needsConfirmation), 'visit needs', 'visits need')} scheduling`, 'Earliest: ' + this.whenText(m.needsConfirmation[0].v), 'needs_confirmation', 'Schedule'));
    if (n(m.unassigned)) out.push(item('amber', 'person_add', `${n(m.unassigned)} ${plural(n(m.unassigned), 'booking has', 'bookings have')} no host`, 'Assign someone to greet the family', 'unassigned', 'Assign'));
    if (n(m.hostNotice)) out.push(item('amber', 'campaign', `${n(m.hostNotice)} ${plural(n(m.hostNotice), 'family hasn’t', 'families haven’t')} been told their host changed`, 'A host went on leave or was swapped. Message them before the visit', 'host_notice', 'Tell parents'));
    if (n(m.onCampus)) out.push(item('teal', 'how_to_reg', `${n(m.onCampus)} ${plural(n(m.onCampus), 'family is', 'families are')} on campus now`, 'Complete the visit when the tour ends', 'on_campus', 'View'));
    if (n(m.followUpOverdue)) out.push(item('red', 'phone_callback', `${n(m.followUpOverdue)} ${plural(n(m.followUpOverdue), 'follow-up is', 'follow-ups are')} overdue`, 'Oldest due ' + dateUtil.short(m.followUpOverdue.map(b => b.v.followUp.date).sort()[0]), 'follow_up_overdue', 'Follow up'));
    if (n(m.noShowNoFollowUp)) out.push(item('muted-red', 'person_off', `${n(m.noShowNoFollowUp)} ${plural(n(m.noShowNoFollowUp), 'missed visit needs', 'missed visits need')} follow-up`, 'Plan a call to schedule a revisit', 'no_show_no_followup', 'Plan'));
    if (n(m.noOutcome)) out.push(item('neutral', 'flag', `${n(m.noOutcome)} completed ${plural(n(m.noOutcome), 'visit has', 'visits have')} no outcome recorded`, 'Record what happened while it is fresh', 'no_outcome', 'Record'));
    if (n(m.notClosedOut)) out.push(item('neutral', 'event_note', `${n(m.notClosedOut)} past ${plural(n(m.notClosedOut), 'visit was', 'visits were')} never closed out`, 'Mark them missed, or reschedule visits that were never scheduled', 'unconfirmed_past', 'Review'));
    const dueToday = m.followUpDue.length - m.followUpOverdue.length;
    if (dueToday > 0) out.push(item('blue', 'call', `${dueToday} ${plural(dueToday, 'follow-up is', 'follow-ups are')} due today`, 'Calls and messages planned for today', 'follow_up_due', 'Open'));
    return out;
  },

  /* ---------------- BOOKINGS ---------------- */
  renderBookings() {
    const f = appState.filters;
    const hosts = availabilityService.hosts();
    const opt = (v, l, cur) => `<option value="${esc(v)}"${v === cur ? ' selected' : ''}>${esc(l)}</option>`;
    const sel = (id, key, label, options, cls) => `<div class="f-item ${cls || ''}"><label class="sr-only" for="${id}">${label}</label>
      <select id="${id}" class="select" data-filter="${key}">${options}</select></div>`;
    const statusOpts = opt('', 'Any status', f.status) + Object.keys(STATUS_META).map(s => opt(s, STATUS_META[s].label, f.status)).join('');
    const hostOpts = opt('', 'Any host', f.host) + opt('none', 'Unassigned', f.host) + hosts.map(h => opt(h.id, h.name, f.host)).join('');
    const gradeOpts = opt('', 'Any grade', f.grade) + GRADES.map(g => opt(g, g, f.grade)).join('');
    const dateOpts = [['any', 'Any date'], ['today', 'Today'], ['tomorrow', 'Tomorrow'], ['week', 'This week'], ['next7', 'Next 7 days'], ['past', 'Past visits'], ['custom', 'Pick a date…']].map(d => opt(d[0], d[1], f.date)).join('');
    const adv = filterService.advancedCount();
    const canExport = authz.can(PERM.EXPORT);
    return `<div class="page">
      <header class="page-head">
        <div><h1>Bookings</h1><p>Manage scheduled parent visits from confirmation through follow-up.</p></div>
        <div class="page-actions">
          <div class="seg" role="group" aria-label="Bookings view">
            <button type="button" data-action="set-mode" data-mode="list" aria-pressed="${appState.bookingsMode === 'list'}">${icon('view_list')}List</button>
            <button type="button" data-action="set-mode" data-mode="calendar" aria-pressed="${appState.bookingsMode === 'calendar'}">${icon('calendar_month')}Calendar</button>
          </div>
          ${authz.can(PERM.CREATE) ? `<button type="button" class="btn btn-primary hide-mobile" data-action="new-booking" title="New booking (N)">${icon('add')}New Booking</button>` : ''}
          ${canExport ? `<button type="button" class="btn btn-secondary" id="bookings-export" data-action="export" title="Export the bookings in this view as CSV">${icon('download')}Export</button>` : ''}
        </div>
      </header>
      ${!authz.can(PERM.VIEW_ALL) ? `<div class="banner alert-info">${icon('filter_alt')}Counsellor view — showing visits you host or follow up.</div>` : ''}
      <div class="views" id="view-chips" role="group" aria-label="Saved views"></div>
      <div class="filters" role="search" aria-label="Filter bookings">
        <div class="search">${icon('search')}<label class="sr-only" for="f-q">Search bookings</label>
          <input id="f-q" class="input" type="search" data-filter="q" value="${esc(f.q)}" placeholder="Search parent, child, mobile or ID" autocomplete="off" title="Search (/)"></div>
        ${sel('f-date', 'date', 'Visit date', dateOpts, 'wide')}
        ${f.date === 'custom' ? `<div class="f-item"><label class="sr-only" for="f-custom">Visit date</label><input id="f-custom" class="input" type="date" data-filter="customDate" value="${esc(f.customDate)}"></div>` : ''}
        ${sel('f-status', 'status', 'Status', statusOpts, 'f-desktop xwide')}
        ${sel('f-host', 'host', 'Host', hostOpts, 'f-desktop')}
        ${sel('f-grade', 'grade', 'Grade', gradeOpts, 'f-desktop')}
        <button type="button" class="btn btn-secondary f-desktop" id="more-filters-btn" data-action="toggle-more-filters" aria-expanded="${appState.moreFiltersOpen}" aria-controls="more-filters">${icon('tune')}More filters${adv ? ` <span class="badge tone-blue">${adv}</span>` : ''}</button>
        <button type="button" class="btn btn-secondary f-mobile" id="mobile-filters-btn" data-action="mobile-filters">${icon('tune')}Filters${this.sheetFilterCount() ? ` <span class="badge tone-blue">${this.sheetFilterCount()}</span>` : ''}</button>
        ${appState.bookingsMode === 'list' ? `<button type="button" class="btn btn-ghost f-desktop" id="columns-btn" data-action="columns-menu" aria-haspopup="menu" aria-expanded="false">${icon('view_column')}Columns</button>` : ''}
      </div>
      <div class="more-filters" id="more-filters" ${appState.moreFiltersOpen ? '' : 'hidden'}>${this.advancedFilterFields('mf')}</div>
      <div id="results" aria-live="polite" aria-busy="false"></div>
    </div>`;
  },
  /* Filters that live in the mobile Filters sheet (everything except search and date). */
  sheetFilterCount() {
    const f = appState.filters;
    return ['status', 'host', 'grade'].concat(filterService.ADVANCED).filter(k => f[k]).length;
  },
  advancedFilterFields(prefix) {
    const f = appState.filters;
    const opt = (v, l, cur) => `<option value="${esc(v)}"${v === cur ? ' selected' : ''}>${esc(l)}</option>`;
    const field = (key, label, options) => `<div class="field"><label class="label" for="${prefix}-${key}">${label}</label><select id="${prefix}-${key}" class="select" data-filter="${key}">${options}</select></div>`;
    return [
      field('source', 'Enquiry source', opt('', 'Any', f.source) + SOURCES.map(x => opt(x, x, f.source)).join('')),
      field('slot', 'Slot', opt('', 'Any slot', f.slot) + filterService.slotOptions().map(t => opt(t, dateUtil.time(t), f.slot)).join('')),
      field('nextAction', 'Next action', opt('', 'Any', f.nextAction) + STATUS_CHANGE_OPTIONS.filter(o => POSITIVE_MOVES.includes(o.to)).map(o => opt(o.to, o.label, f.nextAction)).join(''))
    ].join('');
  },
  renderViewChips() {
    const el = document.getElementById('view-chips');
    if (!el) return;
    const all = bookingService.all();
    el.innerHTML = filterService.VIEWS.filter(v => !v.contextual || v.id === appState.savedView).map(v => {
      const count = v.test ? all.filter(v.test).length : all.length;
      const on = appState.savedView === v.id;
      return `<button type="button" class="chip" data-action="set-view" data-view="${v.id}" aria-pressed="${on}">${esc(v.label)}<span class="count num">${count}</span>${v.contextual && on ? icon('close') : ''}</button>`;
    }).join('');
  },
  renderResults() {
    const el = document.getElementById('results');
    if (!el) return;
    this.renderViewChips();
    if (appState.bookingsMode === 'calendar') {
      // Same week/day re-rendering (e.g. after a booking changes) keeps the calendar's scroll position.
      const oldCal = el.querySelector('.cal-week, .cal-day');
      const calShown = 'cal|' + (mqMobile.matches ? 'day' : appState.calendarMode) + '|' + (appState.calendarDate || clock.today());
      const keepCal = oldCal && el.dataset.shown === calShown ? { top: oldCal.scrollTop, left: oldCal.scrollLeft } : null;
      el.innerHTML = this.renderCalendar();
      el.dataset.shown = calShown;
      const newCal = el.querySelector('.cal-week, .cal-day');
      if (keepCal && newCal) { newCal.scrollTop = keepCal.top; newCal.scrollLeft = keepCal.left; }
      return;
    }
    const list = filterService.sortBy(filterService.apply());
    // New filters, view, sort or page size → back to page 1. Ticked rows that left the result set are dropped,
    // so a bulk action can never touch a booking the admin can't currently see in this list.
    const key = JSON.stringify([appState.filters, appState.savedView, appState.sort, appState.pageSize]);
    if (key !== appState.listKey) { appState.listKey = key; appState.page = 1; }
    const inList = new Set(list.map(b => b.id));
    appState.selected = appState.selected.filter(id => inList.has(id));
    // Paged: only one page is rendered, and only in the layout in use (table or cards).
    // Bulk actions act on the ticked rows; "Select all N bookings" in the bulk bar widens the scope explicitly.
    const pg = filterService.paginate(list, appState.page || 1, appState.pageSize || 25);
    appState.page = pg.page;
    const n = filterService.activeCount();
    const view = filterService.view(appState.savedView);
    const sortOpts = Object.keys(filterService.SORT_KEYS).filter(k => ['when', 'parent', 'child', 'status', 'host'].includes(k)).map(k => ['asc', 'desc'].map(d =>
      `<option value="${k}:${d}"${appState.sort.key === k && appState.sort.dir === d ? ' selected' : ''}>${esc(filterService.SORT_KEYS[k])} ${k === 'when' ? (d === 'asc' ? '(soonest first)' : '(latest first)') : k === 'status' ? (d === 'asc' ? '(pending first)' : '(cancelled first)') : (d === 'asc' ? '(A–Z)' : '(Z–A)')}</option>`).join('')).join('');
    const bar = `<div class="results-bar"><span><b class="num">${list.length}</b> ${plural(list.length, 'booking', 'bookings')} · ${esc(view.label)}${n ? ' · ' + n + ' ' + plural(n, 'filter', 'filters') : ''}</span>
      <span class="results-tools">
        <span class="sort-cards"><label class="sr-only" for="sort-cards">Sort by</label><select id="sort-cards" class="select select-sm" data-sort>${sortOpts}</select></span>
        ${n || appState.savedView !== 'all' ? `<button type="button" class="btn btn-ghost btn-sm" data-action="clear-filters">${icon('filter_alt_off')}Clear filters</button>` : ''}</span></div>`;
    if (!list.length) {
      el.innerHTML = bar + `<div class="card">${this.empty('search_off', 'No bookings found', 'No bookings match these filters.', `<button type="button" class="btn btn-secondary" data-action="clear-filters">${icon('filter_alt_off')}Clear Filters</button>`)}</div>`;
      return;
    }
    // The table scrolls inside its own box: keep its position when the same page re-renders (e.g. ticking a row).
    const oldWrap = el.querySelector('.table-wrap');
    const shown = key + '|' + pg.page;
    const keep = oldWrap && el.dataset.shown === shown ? { top: oldWrap.scrollTop, left: oldWrap.scrollLeft } : null;
    el.innerHTML = bar + this.bulkBar(list, pg) + (mqCards.matches ? this.renderCards(pg.items) : this.renderTable(pg.items)) + this.pager(pg);
    el.dataset.shown = shown;
    const newWrap = el.querySelector('.table-wrap');
    if (keep && newWrap) { newWrap.scrollTop = keep.top; newWrap.scrollLeft = keep.left; }
    const pageBox = document.getElementById('sel-page');
    if (pageBox) { const on = pg.items.filter(b => appState.selected.includes(b.id)).length; pageBox.checked = on > 0 && on === pg.items.length; pageBox.indeterminate = on > 0 && on < pg.items.length; }
  },
  canBulk() { return [PERM.CONFIRM, PERM.CONTACT, PERM.ASSIGN_HOST, PERM.RESCHEDULE, PERM.EXPORT].some(p => authz.can(p)); },
  /* Bulk actions for ticked rows. Counts show how many of the selection each action applies to. */
  bulkBar(list, pg) {
    const sel = appState.selected;
    if (!sel.length) return '';
    const items = sel.map(id => bookingService.view(id)).filter(Boolean);
    const nHost = items.filter(b => bookingService.canAssignHost(b.v)).length;
    const nResched = items.filter(b => bookingService.canReschedule(b.v)).length;
    const pageAll = pg.items.every(b => sel.includes(b.id));
    const more = pageAll && list.length > sel.length ? ` <button type="button" class="link" data-action="select-all-matching">Select all ${list.length} bookings</button>` : '';
    const btn = (action, ic, label, n, why, perm) => authz.can(perm) ? `<button type="button" class="btn btn-secondary btn-sm" data-action="${action}"${n === 0 ? ` disabled title="${esc(why)}"` : ''}>${icon(ic)}${esc(label)}${n != null ? ` <span class="count num">${n}</span>` : ''}</button>` : '';
    return `<div class="bulk-bar" role="region" aria-label="Bulk actions">
      <span class="bulk-count"><b class="num">${sel.length}</b> selected${more}</span>
      <div class="bulk-acts">
        ${authz.can(PERM.CONFIRM) ? `<button type="button" class="btn btn-secondary btn-sm" data-action="bulk-status" aria-haspopup="menu" aria-expanded="false">Change status${icon('expand_more')}</button>` : ''}
        ${btn('bulk-remind', 'forum', 'Send reminder', null, '', PERM.CONTACT)}
        ${btn('bulk-reschedule', 'event_repeat', 'Reschedule', nResched, 'Only requested or scheduled visits that haven’t arrived can be rescheduled', PERM.RESCHEDULE)}
        ${btn('bulk-host', 'badge', 'Assign host', nHost, 'Hosts can be set only for upcoming or ongoing visits', PERM.ASSIGN_HOST)}
        ${btn('bulk-export', 'download', 'Export', null, '', PERM.EXPORT)}
        <button type="button" class="btn btn-ghost btn-sm" data-action="clear-selection">${icon('close')}Clear</button>
      </div></div>`;
  },
  selectBox(b) {
    const on = appState.selected.includes(b.id);
    return `<input type="checkbox" class="row-check" id="sel-${b.id}" data-select="${b.id}"${on ? ' checked' : ''} aria-label="Select ${esc(b.p.name)}, ${esc(this.whenText(b.v))}">`;
  },
  columnCell(col, b) {
    const v = b.v;
    switch (col) {
      case 'parent': return `<button type="button" class="cell-link" data-action="open" data-id="${b.id}">${esc(b.p.name)}</button><span class="sub">${esc(b.e.id)}</span>`;
      case 'child': return `<span class="cell-main">${esc(b.c.name)}</span><span class="sub">${esc(b.e.grade)}</span>`;
      case 'when': return `<span class="cell-main" style="font-weight:600">${esc(dateUtil.rel(v.date))}</span><span class="sub">${dateUtil.time(v.time)}${v.rescheduleCount ? ' · moved' : ''}</span>`;
      case 'status': return this.statusBadge(v.status);
      case 'host': return this.hostChip(b);
      case 'contact': return this.contactButtons(b);
      case 'next': return `<div class="next-cell">${this.primaryAction(b)}${this.nextHint(b)}</div>`;
      case 'actions': return this.moreButton(b);
      case 'select': return this.selectBox(b);
      case 'bookingId': return `<span class="num">${esc(v.id)}</span>`;
      case 'source': return esc(b.e.source);
      case 'admissionType': return esc(b.e.admissionType);
      case 'created': return `<span class="num">${esc(dateUtil.short(dateUtil.iso(new Date(v.createdAt))))}</span>`;
      case 'followUp': { const s = bookingService.followUpState(v); return v.followUp ? `${esc(dateUtil.short(v.followUp.date))}<span class="sub">${s === 'done' ? 'Done' : s === 'overdue' ? 'Overdue' : s === 'due' ? 'Due today' : 'Planned'}</span>` : '<span class="muted">—</span>'; }
      case 'application': { const m = APP_STATE_META[b.a.state]; return this.toneBadge(m.label, m.tone); }
      case 'email': return b.p.email ? `<span class="clip">${esc(b.p.email)}</span>` : '<span class="muted">—</span>';
      case 'notes': return v.notes.length ? `<span class="clip" title="${esc(v.notes[0].text)}">${esc(v.notes[0].text)}</span>` : '<span class="muted">—</span>';
      default: return '';
    }
  },
  visibleColumns() {
    const extra = OPTIONAL_COLUMNS.filter(c => appState.columns.includes(c));
    return (this.canBulk() ? ['select'] : []).concat(['parent', 'child', 'when', 'status', 'host', 'contact'], extra, ['next', 'actions']);
  },
  pager(pg) {
    if (pg.pages <= 1 && pg.total <= PAGE_SIZES[0]) return '';
    return `<div class="pager"><span class="sub">Showing <b class="num">${pg.from}–${pg.to}</b> of ${pg.total}</span>
      <label class="sr-only" for="pg-size">Bookings per page</label><select id="pg-size" class="select select-sm" data-pagesize>${PAGE_SIZES.map(x => `<option value="${x}"${x === (appState.pageSize || 25) ? ' selected' : ''}>${x} per page</option>`).join('')}</select>
      <button type="button" class="btn btn-ghost btn-sm" data-action="page-prev"${pg.page <= 1 ? ' disabled' : ''}>${icon('chevron_left')}Previous</button>
      <span class="num">Page ${pg.page} of ${pg.pages}</span>
      <button type="button" class="btn btn-ghost btn-sm" data-action="page-next"${pg.page >= pg.pages ? ' disabled' : ''}>Next${icon('chevron_right')}</button></div>`;
  },
  renderTable(list) {
    const cols = this.visibleColumns();
    const s = appState.sort;
    const th = c => {
      if (c === 'actions') return '<th scope="col" style="width:48px"><span class="sr-only">Actions</span></th>';
      if (c === 'select') return `<th scope="col" class="c-select"><input type="checkbox" class="row-check" id="sel-page" data-select-page aria-label="Select all ${list.length} bookings on this page"></th>`;
      if (!filterService.SORT_KEYS[c]) return `<th scope="col">${esc(COLUMN_LABEL[c])}</th>`;
      const on = s.key === c, dir = on ? s.dir : '';
      return `<th scope="col" aria-sort="${on ? (dir === 'asc' ? 'ascending' : 'descending') : 'none'}"><button type="button" class="th-sort${on ? ' is-on' : ''}" id="sort-${c}" data-action="sort" data-key="${c}" title="Sort by ${esc(COLUMN_LABEL[c])}">${esc(COLUMN_LABEL[c])}${icon(on ? (dir === 'asc' ? 'arrow_upward' : 'arrow_downward') : 'unfold_more', 'sort-ico')}</button></th>`;
    };
    const head = cols.map(th).join('');
    const body = list.map(b => `<tr class="${[STATUS.CANCELLED].includes(b.v.status) ? 'is-dim' : ''}${appState.selected.includes(b.id) ? ' is-selected' : ''}">${cols.map(c => `<td class="c-${c}">${this.columnCell(c, b)}</td>`).join('')}</tr>`).join('');
    return `<div class="table-wrap"><table class="bt"><caption class="sr-only">Bookings</caption><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
  },
  renderCards(list) {
    return `<div class="bcards" role="list" aria-label="Bookings">${list.map(b => `
      <article class="bcard${appState.selected.includes(b.id) ? ' is-selected' : ''}" role="listitem" aria-label="${esc(b.p.name)}, ${esc(this.whenText(b.v))}">
        <div class="bcard-top">
          ${this.canBulk() ? `<span class="bcard-check">${this.selectBox(b).replace('id="sel-', 'id="selc-')}</span>` : ''}
          <div style="min-width:0;flex:1">
            <div class="bcard-when">${esc(this.whenText(b.v))}</div>
            <button type="button" class="cell-link" data-action="open" data-id="${b.id}">${esc(b.p.name)}</button>
            <span class="sub">${esc(b.c.name)} · ${esc(b.e.grade)}</span>
          </div>
          ${this.statusBadge(b.v.status)}
        </div>
        <div class="bcard-meta">${this.hostChip(b)}${this.nextHint(b)}</div>
        ${this.contactBar(b, { fill: true })}
        <div class="bcard-actions">
          ${this.primaryAction(b, { grow: true })}
          <button type="button" class="btn btn-secondary btn-icon" data-action="row-menu" data-id="${b.id}" aria-haspopup="menu" aria-expanded="false" aria-label="More actions for ${esc(b.p.name)}">${icon('more_horiz')}</button>
        </div>
      </article>`).join('')}</div>`;
  },

  /* ---------------- CALENDAR ---------------- */
  calendarList() {
    const f = Object.assign({}, appState.filters, { date: 'any', customDate: '' });
    const dateViews = ['today', 'week'];
    return bookingService.all().filter(b => (dateViews.includes(appState.savedView) || filterService.inView(b, appState.savedView)) && filterService.matches(b, f));
  },
  calCard(b, big) {
    return `<button type="button" class="cal-card st-${b.v.status}" data-action="open" data-id="${b.id}" aria-label="${esc(dateUtil.time(b.v.time))}, ${esc(b.p.name)}, ${esc(b.e.grade)}, ${esc(STATUS_META[b.v.status].label)}, host ${esc(b.host ? b.host.name : 'unassigned')}">
      ${big ? `<span>${dateUtil.time(b.v.time)}</span>` : ''}
      <b>${esc(b.p.name)}</b>
      <span>${esc(b.e.grade)} · ${esc(STATUS_META[b.v.status].label)}</span>
      <span>${b.host ? esc(b.host.name) : '⚠ Unassigned'}</span>
    </button>`;
  },
  renderCalendar() {
    const mobile = mqMobile.matches;
    const mode = mobile ? 'day' : appState.calendarMode;
    const anchor = appState.calendarDate || clock.today();
    const T = clock.today();
    const list = this.calendarList();
    const monday = dateUtil.mondayOf(anchor);
    const title = mode === 'week'
      ? dateUtil.fmt(monday, { day: 'numeric', month: 'short' }) + ' – ' + dateUtil.fmt(dateUtil.add(monday, 6), { day: 'numeric', month: 'short', year: 'numeric' })
      : dateUtil.fmt(anchor, { weekday: 'long', day: 'numeric', month: 'long' });
    const toolbar = `<div class="cal-toolbar">
      <button type="button" class="btn btn-secondary btn-icon" data-action="cal-nav" data-dir="-1" aria-label="Previous ${mode}">${icon('chevron_left')}</button>
      <button type="button" class="btn btn-secondary" data-action="cal-today">Today</button>
      <button type="button" class="btn btn-secondary btn-icon" data-action="cal-nav" data-dir="1" aria-label="Next ${mode}">${icon('chevron_right')}</button>
      <h2 class="cal-title" aria-live="polite">${esc(title)}</h2>
      <span class="spacer"></span>
      ${mobile ? '' : `<div class="seg sm" role="group" aria-label="Calendar range">
        <button type="button" data-action="cal-mode" data-mode="day" aria-pressed="${mode === 'day'}">Day</button>
        <button type="button" data-action="cal-mode" data-mode="week" aria-pressed="${mode === 'week'}">Week</button></div>`}
    </div>`;
    if (appState.calLoading) {
      return toolbar + `<div class="card" style="padding:16px" aria-busy="true"><span class="sr-only">Loading calendar…</span>${Array.from({ length: 5 }, () => '<div class="skel" style="height:44px;margin-bottom:10px"></div>').join('')}</div>`;
    }
    const byDate = {};
    list.forEach(b => { (byDate[b.v.date] = byDate[b.v.date] || []).push(b); });
    Object.values(byDate).forEach(arr => arr.sort((a, b) => a.v.time.localeCompare(b.v.time)));

    if (mobile) {
      const strip = Array.from({ length: 7 }, (_, i) => {
        const d = dateUtil.add(monday, i), cnt = (byDate[d] || []).filter(b => b.v.status !== STATUS.CANCELLED).length;
        const closed = !availabilityService.dayPlan(d).open;
        return `<button type="button" class="${d === T ? 'is-today' : ''}${closed ? ' is-closed' : ''}" data-action="cal-date" data-date="${d}" aria-pressed="${d === anchor}" aria-label="${esc(dateUtil.long(d))}, ${cnt} ${plural(cnt, 'visit', 'visits')}">${esc(DAY_SHORT[dateUtil.dayKey(d)])}<b>${dateUtil.parse(d).getDate()}</b><i>${cnt ? cnt : '&nbsp;'}</i></button>`;
      }).join('');
      const items = byDate[anchor] || [];
      const plan = availabilityService.dayPlan(anchor);
      return toolbar + `<div class="cal-strip">${strip}</div>` + (items.length
        ? this.renderCards(items)
        : `<div class="card">${this.empty('event_busy', plan.open ? 'No visits on this day' : 'Closed for visits', plan.open ? 'No school visits are scheduled for this date.' : plan.reason, authz.can(PERM.CREATE) && plan.open && anchor >= T ? `<button type="button" class="btn btn-primary" data-action="new-booking" data-date="${anchor}">${icon('add')}Create Booking</button>` : '')}</div>`);
    }

    if (mode === 'day') {
      const r = availabilityService.slotsFor(anchor);
      const items = byDate[anchor] || [];
      const times = Array.from(new Set(r.slots.map(s => s.time).concat(items.map(b => b.v.time)))).sort();
      if (!times.length) return toolbar + `<div class="cal-day">${this.empty('event_busy', r.open ? 'No visits on this day' : 'Closed for visits', r.open ? 'No school visits are scheduled for this date.' : r.reason, '')}</div>`;
      return toolbar + `<div class="cal-day">${times.map(t => {
        const s = r.slots.find(x => x.time === t);
        const cards = items.filter(b => b.v.time === t);
        return `<div class="cal-slot">
          <div><b>${dateUtil.time(t)}</b>${s ? (s.blocked ? '<span class="sub">Blocked</span>' : `<span class="sub num">${s.booked} / ${s.capacity} · ${CAPACITY_LABEL[s.state]}</span>${this.meter(s.booked, s.capacity)}${anchor >= clock.today() && !availabilityService.hostsForSlot(anchor, t).length ? `<span class="cal-nohost">${icon('person_off')}No host${availabilityService.saved.hideNoHost ? ' · hidden online' : ''}</span>` : ''}`) : '<span class="sub">Outside visit hours</span>'}</div>
          <div class="cal-slot-cards">${cards.length ? cards.map(b => this.calCard(b, false)).join('') : '<span class="muted" style="font-size:13px;align-self:center">No visits</span>'}</div>
        </div>`;
      }).join('')}</div>`;
    }

    // week
    const days = Array.from({ length: 7 }, (_, i) => dateUtil.add(monday, i));
    const slotInfo = {};
    days.forEach(d => { slotInfo[d] = availabilityService.slotsFor(d); });
    const times = Array.from(new Set([].concat(...days.map(d => slotInfo[d].slots.map(s => s.time)), ...days.map(d => (byDate[d] || []).map(b => b.v.time))))).sort();
    const head = `<div class="cal-h"></div>` + days.map(d => `<button type="button" class="cal-h${d === T ? ' is-today' : ''}" data-action="cal-open-day" data-date="${d}" aria-label="Open ${esc(dateUtil.long(d))} in day view">${esc(DAY_SHORT[dateUtil.dayKey(d)])}<b>${dateUtil.parse(d).getDate()}</b></button>`).join('');
    const body = times.map(t => `<div class="cal-time">${dateUtil.time(t)}</div>` + days.map(d => {
      const info = slotInfo[d], s = info.slots.find(x => x.time === t);
      const cards = (byDate[d] || []).filter(b => b.v.time === t);
      const closed = !info.open || !s || s.blocked;
      const cap = !info.open ? '' : !s ? '' : s.blocked ? '<span class="cal-cap">Blocked</span>' : `<span class="cal-cap ${s.state}"><span class="num">${s.booked}/${s.capacity}</span>${s.state !== 'available' ? `<span>${CAPACITY_LABEL[s.state]}</span>` : ''}</span>`;
      const noHost = !closed && d >= T && !availabilityService.hostsForSlot(d, t).length ? `<span class="cal-nohost" title="${availabilityService.saved.hideNoHost ? 'Hidden from the parent booking form' : 'Parents can still book this slot'}">${icon('person_off')}No host</span>` : '';
      return `<div class="cal-cell${closed && !cards.length ? ' is-closed' : ''}${d === T ? ' is-today' : ''}">${cap}${noHost}${cards.map(b => this.calCard(b, false)).join('')}</div>`;
    }).join('')).join('');
    return toolbar + (times.length ? `<div class="cal-week" role="grid" aria-label="Week of ${esc(title)}">${head}${body}</div>` : `<div class="card">${this.empty('event_busy', 'No visit hours this week', 'No visit hours are configured for these dates.', authz.can(PERM.AVAILABILITY) ? `<button type="button" class="btn btn-primary" data-action="section" data-section="availability">Set Availability</button>` : '')}</div>`);
  },

  /* ---------------- AVAILABILITY ---------------- */
  renderAvailability() {
    const cfg = availabilityService.current();
    const canEdit = authz.can(PERM.AVAILABILITY);
    const dis = canEdit ? '' : ' disabled';
    const errors = appState.avErrors || {};
    const T = clock.today();
    const anyOpen = DAY_KEYS.some(k => cfg.weekly[k].open);
    const hosts = cfg.hosts;
    const timeOpts = cur => { let s = ''; for (let m = 7 * 60; m <= 20 * 60; m += 30) { const t = dateUtil.fromMin(m); s += `<option value="${t}"${t === cur ? ' selected' : ''}>${dateUtil.time(t)}</option>`; } return s; };
    const collapsed = id => !!appState.collapsed[id];
    const section = (id, ic, title, desc, body, actions) => `
      <section class="card" aria-labelledby="${id}-h">
        <div class="card-head">
          <div class="collapse-wrap">
            <span class="kpi-ico">${icon(ic)}</span>
            <div style="min-width:0"><h2 id="${id}-h"><button type="button" class="collapse-btn" data-action="av-collapse" data-panel="${id}" aria-expanded="${!collapsed(id)}" aria-controls="${id}-body">${esc(title)}${icon('expand_more', 'chev')}</button></h2><p>${esc(desc)}</p></div>
          </div>
          ${actions && !collapsed(id) ? `<div class="row">${actions}</div>` : ''}
        </div>
        <div id="${id}-body" ${collapsed(id) ? 'hidden' : ''}>${body}</div>
      </section>`;

    // next 14 days — reads the SAVED configuration (what parents can book now)
    const strip = Array.from({ length: 14 }, (_, i) => {
      const d = dateUtil.add(T, i), c = availabilityService.capacityForDate(d);
      return `<button type="button" class="cap-day${c.open ? '' : ' is-closed'}${d === T ? ' is-today' : ''}" data-action="av-go-date" data-date="${d}" aria-label="${esc(dateUtil.long(d))}: ${c.open ? c.booked + ' of ' + c.capacity + ' places booked' + (c.unplaced ? ', ' + c.unplaced + ' outside the current hours' : '') : esc(c.reason) + (c.existing ? ', ' + c.existing + ' existing bookings' : '')}. Open in calendar">
        <span>${esc(dateUtil.fmt(d, { weekday: 'short' }))}</span><b>${esc(dateUtil.fmt(d, { day: 'numeric', month: 'short' }))}</b>
        ${c.open ? `<span class="num">${c.booked}/${c.capacity} booked</span>${this.meter(c.booked, c.capacity)}${c.unplaced ? `<span class="next-hint bad">${c.unplaced} to resolve</span>` : ''}` : `<span>${esc(c.reason.replace('Blocked — ', 'Blocked: '))}</span>${c.existing ? `<span class="next-hint bad">${c.existing} booked · resolve</span>` : ''}`}
      </button>`;
    }).join('');

    // weekly
    const dayRows = DAY_KEYS.map(k => {
      const d = cfg.weekly[k];
      const slots = d.open && !errors[k] ? availabilityService.slotTimes(d) : [];
      const total = slots.reduce((n, t) => n + (d.slotCaps[t] != null ? d.slotCaps[t] : d.capacity), 0);
      const expanded = appState.avExpanded && appState.avExpanded[k];
      const nameCell = `<div class="day-name"><button type="button" class="switch" role="switch" id="av-open-${k}" aria-checked="${d.open}" aria-label="Open for visits on ${DAY_LABEL[k]}" data-action="av-day-open" data-day="${k}"${dis}></button><span>${DAY_LABEL[k]}</span></div>`;
      if (!d.open) return `<div class="day-row is-closed">${nameCell}<span class="day-closed-note">Closed — parents can’t book visits on ${DAY_LABEL[k]}s.</span></div>`;
      const customCount = Object.keys(d.slotCaps).filter(t => slots.includes(t)).length;
      return `<div class="day-row">
        ${nameCell}
        <div><label class="mini-label" for="av-start-${k}">Start</label><select class="select" id="av-start-${k}" data-av="start" data-day="${k}" aria-label="${DAY_LABEL[k]} start time"${dis}>${timeOpts(d.start)}</select></div>
        <div><label class="mini-label" for="av-end-${k}">End</label><select class="select" id="av-end-${k}" data-av="end" data-day="${k}" aria-label="${DAY_LABEL[k]} end time" ${errors[k] ? 'aria-invalid="true"' : ''}${dis}>${timeOpts(d.end)}</select></div>
        <div><label class="mini-label" for="av-mins-${k}">Slot length</label><select class="select" id="av-mins-${k}" data-av="slotMins" data-day="${k}" aria-label="${DAY_LABEL[k]} slot length"${dis}>${SLOT_MINUTES.map(n => `<option value="${n}"${n === d.slotMins ? ' selected' : ''}>${n} min</option>`).join('')}</select></div>
        <div><span class="mini-label">Families per slot</span><div class="stepper" role="group" aria-label="${DAY_LABEL[k]} families per slot">
          <button type="button" id="av-capm-${k}" data-action="av-cap" data-day="${k}" data-delta="-1" aria-label="Fewer families per slot"${d.capacity <= 1 || !canEdit ? ' disabled' : ''}>${icon('remove')}</button>
          <output class="num" aria-live="polite">${d.capacity}</output>
          <button type="button" id="av-capp-${k}" data-action="av-cap" data-day="${k}" data-delta="1" aria-label="More families per slot"${d.capacity >= 20 || !canEdit ? ' disabled' : ''}>${icon('add')}</button></div></div>
        <div><label class="mini-label" for="av-host-${k}">Default host</label><select class="select" id="av-host-${k}" data-av="defaultHostId" data-day="${k}" aria-label="${DAY_LABEL[k]} default host"${dis}>
          <option value="">No default host</option>${hosts.filter(h => h.active !== false && h.days.includes(k) && !(h.until && h.until < T)).map(h => `<option value="${h.id}"${h.id === d.defaultHostId ? ' selected' : ''}>${esc(h.name)}</option>`).join('')}</select></div>
        <div class="day-sum"><span class="num">${slots.length} ${plural(slots.length, 'slot', 'slots')} · ${total} ${plural(total, 'family', 'families')}</span>
          ${slots.length ? `<button type="button" class="link" id="av-exp-${k}" data-action="av-expand" data-day="${k}" aria-expanded="${!!expanded}">${expanded ? 'Hide' : 'Per-slot capacity'}${customCount ? ` (${customCount} custom)` : ''}</button>` : ''}</div>
        ${errors[k] ? `<p class="err day-err" role="alert">${icon('error')}${esc(errors[k])}</p>` : ''}
        ${expanded && slots.length ? `<div class="slot-caps" role="group" aria-label="${DAY_LABEL[k]} capacity per slot">${slots.map(t => {
          const c = d.slotCaps[t] != null ? d.slotCaps[t] : d.capacity, custom = d.slotCaps[t] != null;
          return `<div class="slot-cap${custom ? ' is-custom' : ''}"><span>${dateUtil.time(t)}</span><div class="stepper sm">
            <button type="button" id="av-sc-${k}-${t.replace(':', '')}-m" data-action="av-slotcap" data-day="${k}" data-time="${t}" data-delta="-1" aria-label="${dateUtil.time(t)}: fewer families"${c <= 0 || !canEdit ? ' disabled' : ''}>${icon('remove')}</button>
            <output class="num">${c}</output>
            <button type="button" id="av-sc-${k}-${t.replace(':', '')}-p" data-action="av-slotcap" data-day="${k}" data-time="${t}" data-delta="1" aria-label="${dateUtil.time(t)}: more families"${c >= 20 || !canEdit ? ' disabled' : ''}>${icon('add')}</button></div></div>`;
        }).join('')}<span class="hint" style="align-self:center">Set a slot to 0 to stop bookings in that hour only.</span></div>` : ''}
      </div>`;
    }).join('');
    const weekly = `
      <div class="day-head" aria-hidden="true"><span>Day</span><span>Start</span><span>End</span><span>Slot length</span><span>Families per slot</span><span>Default host</span><span>Summary</span></div>
      ${anyOpen ? '' : `<div class="card-body">${this.empty('event_busy', 'No availability', 'No visit hours are configured.', canEdit ? `<button type="button" class="btn btn-primary" data-action="av-open-weekdays">${icon('event_available')}Set Availability</button>` : '')}</div>`}
      ${dayRows}`;

    // hosts
    const upcoming = id => Object.values(db.visits).filter(v => v.hostId === id && ACTIVE_STATUSES.includes(v.status) && v.date >= T).length;
    const hostRows = hosts.map(h => this.hostCard(h, cfg, canEdit, upcoming(h.id))).join('');
    // Slots in the next 14 days that no host can take (follows unsaved edits too).
    const noHost = availabilityService.uncoveredSlots(T, dateUtil.add(T, 13), cfg);
    const hideSwitch = `<div class="row" style="margin:12px 16px 0;gap:10px;align-items:center"><button type="button" class="switch" role="switch" id="av-hide-nohost" aria-checked="${!!cfg.hideNoHost}" aria-labelledby="av-hide-nohost-l" data-action="av-hide-nohost"${dis}></button>
      <span id="av-hide-nohost-l" style="flex:1;min-width:0"><b style="font-weight:600">Hide slots with no host from parents</b><span class="sub" style="display:block">Parents can’t book a time nobody can host. Staff can still book it from here.</span></span></div>`;
    // Families already booked at those times — linked to Bookings so they can be rescheduled together.
    const noHostKeys = new Set(noHost.map(s => s.date + ' ' + s.time));
    const bookedNoHost = Object.values(db.visits).filter(v => ACTIVE_STATUSES.includes(v.status) && noHostKeys.has(v.date + ' ' + v.time));
    const canResched = authz.can(PERM.RESCHEDULE);
    // Families whose host can't take their visit, but another host is free then — linked to Bookings to change the host.
    const needHost = Object.values(db.visits).filter(v => ACTIVE_STATUSES.includes(v.status) && v.date >= T && bookingService.needsHostChange(v));
    const needHostDays = Array.from(new Set(needHost.map(v => v.date))).sort();
    // Both boxes share one layout (noticeHtml): icon + heading + one line of help, the main action on the right, one row per day.
    const hostChangeWarn = needHost.length && authz.can(PERM.ASSIGN_HOST) ? noticeHtml({
      tone: 'info', icon: 'badge',
      title: `${needHost.length} booked ${plural(needHost.length, 'family needs', 'families need')} another host`,
      text: 'Their host can’t take the visit (on leave, or not working that day or time), but another host is free then.',
      action: { label: `Change host for ${needHost.length}`, icon: 'badge', attrs: 'data-action="av-host-change-bookings"' },
      days: needHostDays.map(d => { const vs = needHost.filter(v => v.date === d); return { date: d, times: Array.from(new Set(vs.map(v => v.time))).sort(), link: { label: `${vs.length} to change`, attrs: `data-action="av-host-change-bookings" data-date="${d}"` } }; })
    }) : '';
    const noHostDays = Array.from(new Set(noHost.map(s => s.date))).sort();
    const hideToggle = `<label class="notice-toggle" title="Parents can’t book a time nobody can host. Staff can still book it from here."><span id="av-hide-nohost-l">Hide from parents</span><button type="button" class="switch" role="switch" id="av-hide-nohost" aria-checked="${!!cfg.hideNoHost}" aria-labelledby="av-hide-nohost-l" data-action="av-hide-nohost"${dis}></button></label>`;
    const noHostWarn = noHost.length ? noticeHtml({
      tone: 'warn', icon: 'person_off', role: 'alert', aside: hideToggle,
      title: `No host for ${noHost.length} ${plural(noHost.length, 'slot', 'slots')} in the next 14 days`,
      text: cfg.hideNoHost ? 'Hidden from the parent booking form. Staff can still book them, but nobody is set to greet the family.' : `Families can still book ${plural(noHost.length, 'it', 'them')}, but nobody is set to greet them.`,
      action: bookedNoHost.length && canResched ? { label: `Reschedule ${bookedNoHost.length} booked`, icon: 'event_repeat', attrs: 'data-action="av-nohost-bookings"' } : null,
      days: noHostDays.map(d => { const n = bookedNoHost.filter(v => v.date === d).length; return { date: d, times: noHost.filter(s => s.date === d).map(s => s.time).sort(),
        link: n && canResched ? { label: `${n} booked · Reschedule`, attrs: `data-action="av-nohost-bookings" data-date="${d}"` } : null, note: n ? `${n} booked` : 'Not booked' }; })
    }) : '';

    // blocked dates
    const bf = appState.bdForm;
    const blocked = cfg.blocked.filter(b => b.date >= T).sort((a, b) => a.date.localeCompare(b.date));
    const bdPlan = bf.date ? availabilityService.dayPlan(bf.date, cfg) : null;
    const bdSlots = bdPlan && bdPlan.open ? availabilityService.slotTimes(bdPlan) : [];
    const affected = d => Object.values(db.visits).filter(v => v.date === d.date && ACTIVE_STATUSES.includes(v.status) && (d.scope === 'day' || d.times.includes(v.time))).length;
    const blockedList = blocked.length ? `<div class="list-scroll bd-scroll" id="bd-scroll" tabindex="0" role="region" aria-label="Blocked dates, ${blocked.length} ${plural(blocked.length, 'date', 'dates')}, scrollable list"><ul class="plain-list">${blocked.map(b => {
      const n = affected(b);
      return `<li><span class="date-tile" aria-hidden="true"><small>${esc(dateUtil.fmt(b.date, { month: 'short' }))}</small><b>${dateUtil.parse(b.date).getDate()}</b></span>
        <div style="flex:1;min-width:160px"><b>${esc(b.reason)}</b><span class="sub">${esc(dateUtil.fmt(b.date, { weekday: 'long', year: 'numeric' }))} · ${b.scope === 'day' ? 'Whole day' : b.times.map(dateUtil.time).join(', ')}</span>
        ${n ? `<span class="next-hint warn">${icon('warning')} ${n} ${plural(n, 'booking is', 'bookings are')} still on this date — <button type="button" class="link" data-action="av-go-date" data-date="${b.date}">review</button></span>` : ''}</div>
        ${canEdit ? `<button type="button" class="btn btn-secondary btn-sm" data-action="av-block-remove" data-bid="${b.id}">${icon('lock_open')}Unblock</button>` : ''}</li>`;
    }).join('')}</ul></div>` : `<div class="card-body">${this.empty('event_available', 'No blocked dates', 'Every open day can be booked. Block holidays and events below.', '')}</div>`;
    const bdForm = canEdit ? `<div class="add-form" aria-label="Block a date">
      <div class="field"><label class="label" for="bd-date">Date</label><input type="date" class="input" id="bd-date" min="${T}" value="${esc(bf.date)}" data-bd="date" ${appState.bdError ? 'aria-invalid="true" aria-describedby="bd-err"' : ''}></div>
      <div class="field"><label class="label" for="bd-reason">Reason</label><input type="text" class="input" id="bd-reason" value="${esc(bf.reason)}" data-bd="reason" maxlength="60" placeholder="School holiday"></div>
      <fieldset class="field" style="border:0;padding:0;margin:0"><legend class="label" style="margin-bottom:6px">Block</legend><div class="seg sm" role="group">
        <button type="button" id="bd-scope-day" data-action="bd-scope" data-scope="day" aria-pressed="${bf.scope === 'day'}">Whole day</button>
        <button type="button" id="bd-scope-slots" data-action="bd-scope" data-scope="slots" aria-pressed="${bf.scope === 'slots'}">Selected slots</button></div></fieldset>
      <button type="button" class="btn btn-primary" id="bd-add" data-action="av-block-add">${icon('block')}Block</button>
      ${bf.scope === 'slots' ? `<div style="grid-column:1/-1"><span class="label">Slots to block</span><div class="row" style="margin-top:6px">${bdSlots.length ? bdSlots.map(t => `<button type="button" class="day-toggle" id="bd-t-${t.replace(':', '')}" data-action="bd-slot" data-time="${t}" aria-pressed="${bf.times.includes(t)}">${dateUtil.time(t)}</button>`).join('') : `<span class="hint">${bf.date ? 'No visit slots on this date.' : 'Choose a date to see its slots.'}</span>`}</div></div>` : ''}
      ${appState.bdError ? `<p class="err" id="bd-err" role="alert" style="grid-column:1/-1">${icon('error')}${esc(appState.bdError)}</p>` : ''}
    </div>` : '';
    const holidayBtn = canEdit ? `<button type="button" class="btn btn-secondary btn-sm" data-action="av-holidays">${icon('flag')}Add national holidays</button>` : '';

    // exceptions
    const ef = appState.exForm;
    const exceptions = cfg.exceptions.filter(e => e.date >= T).sort((a, b) => a.date.localeCompare(b.date));
    const exList = exceptions.length ? `<ul class="plain-list">${exceptions.map(e => `<li>
      <span class="date-tile" aria-hidden="true"><small style="color:var(--primary)">${esc(dateUtil.fmt(e.date, { month: 'short' }))}</small><b>${dateUtil.parse(e.date).getDate()}</b></span>
      <div style="flex:1;min-width:160px"><b>${esc(e.note || 'Special timings')}</b><span class="sub">${esc(dateUtil.fmt(e.date, { weekday: 'long', year: 'numeric' }))} · ${dateUtil.time(e.start)} – ${dateUtil.time(e.end)} · ${e.capacity} per slot</span></div>
      ${canEdit ? `<button type="button" class="btn btn-danger-outline btn-sm" data-action="av-ex-remove" data-eid="${e.id}">${icon('delete')}Delete</button>` : ''}</li>`).join('')}</ul>`
      : `<div class="card-body">${this.empty('event_note', 'No exceptions', 'Add a special working day or changed timings for a single date.', '')}</div>`;
    const exForm = canEdit ? `<div class="add-form ex" aria-label="Add an exception">
      <div class="field"><label class="label" for="ex-date">Date</label><input type="date" class="input" id="ex-date" min="${T}" value="${esc(ef.date)}" data-ex="date"></div>
      <div class="field"><label class="label" for="ex-start">Start</label><select class="select" id="ex-start" data-ex="start">${timeOpts(ef.start)}</select></div>
      <div class="field"><label class="label" for="ex-end">End</label><select class="select" id="ex-end" data-ex="end">${timeOpts(ef.end)}</select></div>
      <div class="field"><label class="label" for="ex-cap">Per slot</label><input type="number" class="input" id="ex-cap" min="1" max="20" value="${esc(ef.capacity)}" data-ex="capacity" inputmode="numeric"></div>
      <div class="field ex-note"><label class="label" for="ex-note">Label</label><input type="text" class="input" id="ex-note" maxlength="60" value="${esc(ef.note)}" data-ex="note" placeholder="Admission open day"></div>
      <button type="button" class="btn btn-primary" id="ex-add" data-action="av-ex-add">${icon('add')}Add</button>
      ${appState.exError ? `<p class="err" role="alert" style="grid-column:1/-1">${icon('error')}${esc(appState.exError)}</p>` : ''}
    </div>` : '';

    return `<div class="page">
      <header class="page-head">
        <div><h1>Visit Availability</h1><p>Set when parents can visit your school and who can host them. Changes go live as you make them.</p></div>
        <div class="page-actions"><span id="av-status" class="row" style="gap:8px" role="status" aria-live="polite">${avStatusHtml()}</span></div>
      </header>
      ${canEdit ? '' : `<div class="banner alert-info">${icon('lock')}Only admins can change visit availability. You can view it here.</div>`}

        ${section('av-hosts', 'badge', 'Hosts', 'Team members who greet families and give the school tour', `${noHost.length ? '' : hideSwitch}${noHostWarn}${hostChangeWarn}<div class="list-scroll host-scroll" id="host-scroll" tabindex="0" role="region" aria-label="Hosts, ${hosts.length} ${plural(hosts.length, 'person', 'people')}, scrollable list">${hostRows}</div>`, canEdit ? `<button type="button" class="btn btn-secondary btn-sm" data-action="av-host-add">${icon('person_add')}Add host</button>` : '')}
        ${section('av-blocked', 'event_busy', 'Blocked Dates', 'Holidays and events when visits can’t be booked', blockedList + bdForm, holidayBtn)}
        ${section('av-exceptions', 'edit_calendar', 'Exceptions', 'Special working days or changed timings for one date', exList + exForm)}
      </div>
