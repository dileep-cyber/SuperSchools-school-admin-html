  }),
  TEMPLATES_BY_STATUS: Object.freeze({
    pending:   ['received', 'pick_slot'],
    confirmed: ['confirm', 'reminder', 'reschedule'],
    completed: ['thanks', 'admission_docs', 'seats'],
    cancelled: ['rebook', 'reschedule'],
    declined:  ['offer_slot', 'reschedule'],
    no_show:   ['missed', 'reschedule']
  }),
  /* Placeholder values for one visit — the same fields the Enquiries module fills. */
  fields(b) {
    return { parent: firstName(b.p.name), child: firstName(b.c.name), school: SCHOOL.name, grade: b.e.grade, visit_date: dateUtil.fmt(b.v.date) + ', ' + dateUtil.time(b.v.time) };
  },
  fill(text, f) { return String(text || '').replace(/\{\{\s*([a-z_]+)\s*\}\}/g, (all, k) => f[k] || all); },
  /* The templates offered for this visit, with the text for the chosen channel
     (WhatsApp → the chat wording, SMS → the SMS version, Email → subject + body). */
  templates(b, channel, opts) {
    const ch = channel || CHANNEL.WHATSAPP, f = this.fields(b);
    const one = id => {
      const t = this.TEMPLATE_TEXT[id];
      const text = ch === CHANNEL.SMS ? t.sms : ch === CHANNEL.EMAIL ? t.email.text : t.chat;
      return { id, label: t.label, text: this.fill(text, f), subject: ch === CHANNEL.EMAIL ? this.fill(t.email.subject, f) : '' };
    };
    const list = (this.TEMPLATES_BY_STATUS[b.v.status] || []).concat('checkin').map(one);
    if ((b.v.hostNotice || (opts && opts.host && b.host)) && ACTIVE_STATUSES.includes(b.v.status)) {   // a host change waiting to be told, or just made
      const date = dateUtil.long(b.v.date), time = dateUtil.time(b.v.time), name = b.p.name, child = firstName(b.c.name);
      list.push({ id: 'host', label: 'Host update', subject: 'Your visit to ' + SCHOOL.name, text: b.host
        ? `Hello ${name}, this is ${SCHOOL.name}. A small update for your school visit on ${date} at ${time}: ${b.host.name} (${b.host.role}) will now welcome you and ${child}. Everything else stays the same.`
        : `Hello ${name}, this is ${SCHOOL.name}. The staff member who was going to show you around on ${date} is unavailable. Your visit at ${time} is still on, or reply with a day that suits you better and we will move it.` });
    }
    return list;
  },
  /* The template preselected for a visit: the first one for its status. */
  defaultTemplate(b) {
    if (b.v.hostNotice && ACTIVE_STATUSES.includes(b.v.status)) return 'host';
    return (this.TEMPLATES_BY_STATUS[b.v.status] || ['checkin'])[0];
  },
  /* Which channels this parent can be reached on, in CONTACT_ORDER.
     Unavailable channels stay visible (disabled, with the reason) so every row keeps the same layout. */
  channelInfo(b, ch) {
    if (ch === CHANNEL.CHAT) return { channel: ch, meta: CHANNEL_META[ch], available: true, reason: '', target: 'School app' };   // every family can be messaged in the app
    // Email is always offered (the mail app opens even when no address is on file yet).
    if (ch === CHANNEL.EMAIL) return { channel: ch, meta: CHANNEL_META[ch], available: true, reason: '', target: b.p.email || 'Email' };
    const ok = !!b.p.mobile;
    return { channel: ch, meta: CHANNEL_META[ch], available: ok, reason: ok ? '' : 'No mobile number on file', target: phone.display(b.p.mobile) };
  },
  channels(b) { return CONTACT_ORDER.map(ch => this.channelInfo(b, ch)); },
  /* "Each parent's channel" (as in the Enquiries module): the parent's preferred channel if set,
     else the app chat for parents already using the school app, else WhatsApp (SMS when WhatsApp failed
     for them), else Email, else a call. */
  resolve(b) {
    if (b.p.preferredChannel && this.channelInfo(b, b.p.preferredChannel).available) return b.p.preferredChannel;
    if (b.p.appChat) return CHANNEL.CHAT;
    if (b.p.mobile) return this.waFailed(b) ? CHANNEL.SMS : CHANNEL.WHATSAPP;
    if (b.p.email) return CHANNEL.EMAIL;
    return CHANNEL.CALL;
  },
  /* Last known WhatsApp failure (e.g. number not on WhatsApp) — shown as a hint so staff pick SMS instead. */
  waFailed(b) { const c = (b.v.communications || []).find(x => x.channel === CHANNEL.WHATSAPP); return !!(c && c.state === COMM_STATE.FAILED); },
  link(channel, b, text, subject) {
    if (channel === CHANNEL.SMS) return phone.sms(b.p.mobile) + '?body=' + encodeURIComponent(text);
    if (channel === CHANNEL.WHATSAPP) return 'https://wa.me/' + phone.wa(b.p.mobile) + '?text=' + encodeURIComponent(text);
    if (channel === CHANNEL.EMAIL) return 'mailto:' + encodeURIComponent(b.p.email) + '?subject=' + encodeURIComponent(subject || 'Your visit to ' + SCHOOL.name) + '&body=' + encodeURIComponent(text);
    return phone.tel(b.p.mobile);
  },
  openedLabel(channel) { return ({ whatsapp: 'Opened WhatsApp', sms: 'Opened SMS app', call: 'Opened phone dialler', email: 'Opened email app', chat: 'Sent in app chat' })[channel]; },
  /* Records only what we truly know. With no messaging API the state is
     "opened_external". PRODUCTION API REQUIRED: provider webhooks move a
     message through sent → delivered → read, or failed. */
  sentLabel(channel) { return channel === CHANNEL.CHAT ? 'Sent in app chat' : 'Sent via ' + CHANNEL_META[channel].label; },
  record(visitId, channel, templateLabel, opts) {
    authz.require(PERM.CONTACT);
    const v = db.visits[visitId];
    // The app chat is our own channel, so it is truly sent; external apps opened by staff are only
    // ever "opened". A bulk "Send to N" goes through the messaging provider (PRODUCTION API REQUIRED:
    // POST /v1/visits/bulk/communications) and is logged as sent.
    const sent = channel === CHANNEL.CHAT || !!(opts && opts.sent);
    const entry = { id: uid('c'), channel, state: sent ? COMM_STATE.SENT : COMM_STATE.OPENED_EXTERNAL, template: templateLabel || '', at: clock.now(), by: authz.actor() };
    v.communications.unshift(entry);
    // The "parent not told about the host change" warning clears only when a Host update was actually
    // SENT (app chat / bulk send). Opening a dialler or a messaging app proves nothing — staff confirm
    // it themselves with "Mark as told" (bookingService.markHostTold).
    const told = !!v.hostNotice && sent && templateLabel === 'Host update';
    activityService.log(visitId, EVENT.COMMUNICATION, { to: sent ? this.sentLabel(channel) : this.openedLabel(channel), note: [templateLabel ? 'Template: ' + templateLabel : '', told ? 'Host update shared with the parent.' : ''].filter(Boolean).join(' ') });
    if (told) v.hostNotice = null;
    return entry;
  }
};

/* =========================== 10. FILTER SERVICE ========================== */
const filterService = {
  defaults() {
    return { q: '', date: 'any', customDate: '', status: '', host: '', grade: '', source: '', slot: '', nextAction: '' };
  },
  /* "More filters": enquiry source, visit slot (time) and the row's Next action. */
  ADVANCED: ['source', 'slot', 'nextAction'],
  /* Slot times offered by the filter: the school's general visit hours (weekly plan, earliest
     start to latest end, e.g. 9:00 AM to 4:00 PM hourly), plus any booked time outside them. */
  slotOptions() {
    const days = Object.values(availabilityService.saved.weekly).filter(d => d.open);
    const set = new Set(Object.values(db.visits).map(v => v.time).filter(Boolean));
    if (days.length) {
      const start = Math.min(...days.map(d => dateUtil.toMin(d.start))), end = Math.max(...days.map(d => dateUtil.toMin(d.end)));
      const step = Math.min(...days.map(d => d.slotMins || 60));
      for (let m = start; m <= end; m += step) set.add(dateUtil.fromMin(m));
    }
    return [...set].sort();
  },
  /* Built-in saved views. "contextual" views are opened from Overview cards
     and only appear as a chip while they are active. */
  VIEWS: [
    { id: 'all', label: 'All' },
    { id: 'today', label: 'Today', test: b => b.v.date === clock.today() },
    { id: 'week', label: 'This Week', test: b => { const m = dateUtil.mondayOf(clock.today()); return b.v.date >= m && b.v.date <= dateUtil.add(m, 6); } },
    { id: 'needs_confirmation', label: 'Needs Scheduling', test: b => b.v.status === STATUS.PENDING && b.v.date >= clock.today() },
    { id: 'no_shows', label: 'Missed Visits', test: b => b.v.status === STATUS.NO_SHOW },
    { id: 'follow_up_due', label: 'Follow-Up Due', test: b => ['due', 'overdue'].includes(bookingService.followUpState(b.v)) },
    { id: 'unassigned', label: 'Unassigned', test: b => !b.v.hostId && ACTIVE_STATUSES.includes(b.v.status) && b.v.date >= clock.today() },
    { id: 'host_notice', label: 'Host Changed — Tell Parent', contextual: true, test: b => !!b.v.hostNotice && ACTIVE_STATUSES.includes(b.v.status) && b.v.date >= clock.today() },
    // Families booked in the next 14 days at a time nobody can host — the same window as the Hosts warning.
    { id: 'no_host_slots', label: 'Booked With No Host — Reschedule', contextual: true, test: b => ACTIVE_STATUSES.includes(b.v.status) && b.v.date >= clock.today() && b.v.date <= dateUtil.add(clock.today(), 13) && !availabilityService.hostsForSlot(b.v.date, b.v.time).length },
    // Booked families whose host can't take the visit (or who have none) while another host is free at that time. Always shown as a chip.
    { id: 'host_change', label: 'Needs Another Host — Change Host', test: b => ACTIVE_STATUSES.includes(b.v.status) && b.v.date >= clock.today() && bookingService.needsHostChange(b.v) },
    { id: 'starting_soon', label: 'Starting Soon', contextual: true, test: b => {
        if (![STATUS.PENDING, STATUS.CONFIRMED].includes(b.v.status) || b.v.arrivedAt || b.v.date !== clock.today()) return false;
        const d = bookingService.startMs(b.v) - clock.now(); return d >= 0 && d <= 90 * 60000; } },
    { id: 'late', label: 'Running Late', contextual: true, test: b => [STATUS.PENDING, STATUS.CONFIRMED].includes(b.v.status) && !b.v.arrivedAt && b.v.date === clock.today() && clock.now() - bookingService.startMs(b.v) > 15 * 60000 },
    { id: 'on_campus', label: 'On Campus', contextual: true, test: b => b.v.status === STATUS.CONFIRMED && !!b.v.arrivedAt },
    { id: 'no_outcome', label: 'No Outcome Recorded', contextual: true, test: b => b.v.status === STATUS.COMPLETED && !b.v.outcome },
    { id: 'no_show_no_followup', label: 'Missed Visits Without Follow-up', contextual: true, test: b => b.v.status === STATUS.NO_SHOW && !b.v.followUp },
    { id: 'follow_up_overdue', label: 'Follow-Up Overdue', contextual: true, test: b => bookingService.followUpState(b.v) === 'overdue' },
    { id: 'unconfirmed_past', label: 'Not Closed Out', contextual: true, test: b => [STATUS.PENDING, STATUS.CONFIRMED].includes(b.v.status) && !b.v.arrivedAt && b.v.date < clock.today() }
  ],
  view(id) { return this.VIEWS.find(x => x.id === id) || this.VIEWS[0]; },
  inView(b, id) { const v = this.view(id); return !v.test || v.test(b); },
  matchesDate(b, f) {
    const t = clock.today(), d = b.v.date;
    switch (f.date) {
      case 'today': return d === t;
      case 'tomorrow': return d === dateUtil.add(t, 1);
      case 'week': { const m = dateUtil.mondayOf(t); return d >= m && d <= dateUtil.add(m, 6); }
      case 'next7': return d >= t && d <= dateUtil.add(t, 6);
      case 'past': return d < t;
      case 'custom': return !f.customDate || d === f.customDate;
      default: return true;
    }
  },
  matches(b, f) {
    if (f.q) {
      const q = f.q.trim().toLowerCase(), digits = q.replace(/\D/g, '');
      const hay = [b.p.name, b.c.name, b.e.id, b.v.id, b.p.email].join(' ').toLowerCase();
      if (!hay.includes(q) && !(digits.length >= 4 && b.p.mobile.includes(digits))) return false;
    }
    if (!this.matchesDate(b, f)) return false;
    if (f.status && b.v.status !== f.status) return false;
    if (f.host === 'none' ? !!b.v.hostId : (f.host && b.v.hostId !== f.host)) return false;
    if (f.grade && b.e.grade !== f.grade) return false;
    if (f.source && b.e.source !== f.source) return false;
    if (f.slot && b.v.time !== f.slot) return false;
    if (f.nextAction) { const pm = primaryMove(b); if (!pm || pm.to !== f.nextAction) return false; }
    return true;
  },
  apply() {
    const f = appState.filters;
    return this.sort(bookingService.all().filter(b => this.inView(b, appState.savedView) && this.matches(b, f)));
  },
  /* Upcoming first (soonest at the top), then past visits (most recent first). */
  sort(list) {
    const t = clock.today();
    return list.sort((a, b) => {
      const ap = a.v.date < t, bp = b.v.date < t;
      if (ap !== bp) return ap ? 1 : -1;
      const ka = a.v.date + a.v.time, kb = b.v.date + b.v.time;
      return ap ? kb.localeCompare(ka) : ka.localeCompare(kb);
    });
  },
  /* Columns the list can be sorted by (header buttons on desktop, "Sort by" on cards). */
  SORT_KEYS: Object.freeze({ when: 'Visit date & time', parent: 'Parent', child: 'Child', status: 'Status', host: 'Host', bookingId: 'Booking ID', created: 'Created', followUp: 'Follow-up date' }),
  sortBy(list, o) {
    const s = o || appState.sort;
    if (s.key === 'when' && s.dir === 'asc') return this.sort(list.slice());
    const dir = s.dir === 'desc' ? -1 : 1, order = Object.values(STATUS);
    const val = b => ({
      when: b.v.date + b.v.time, parent: b.p.name.toLowerCase(), child: (b.c.name + ' ' + b.e.grade).toLowerCase(),
      status: order.indexOf(b.v.status), host: b.host ? b.host.name.toLowerCase() : null,
      bookingId: b.v.id, created: b.v.createdAt, followUp: b.v.followUp ? b.v.followUp.date : null
    })[s.key];
    return list.slice().sort((a, b) => {
      const x = val(a), y = val(b);
      if (x === null || y === null) { if (x !== y) return x === null ? 1 : -1; }   // blanks (no host, no follow-up) always last
      const c = x === y ? 0 : (x < y ? -1 : 1) * dir;
      return c || (a.v.date + a.v.time).localeCompare(b.v.date + b.v.time);
    });
  },
  /* PRODUCTION API REQUIRED: GET /v1/visits?sort=&dir=&page=&pageSize= — the server pages; the client never loads every visit. */
  paginate(list, page, size) {
    const total = list.length, pages = Math.max(1, Math.ceil(total / size)), p = Math.min(Math.max(1, page), pages);
    const start = (p - 1) * size, items = list.slice(start, start + size);
    return { items, total, page: p, pages, from: total ? start + 1 : 0, to: start + items.length };
  },
  activeCount() {
    const f = appState.filters, d = this.defaults();
    return Object.keys(d).filter(k => k !== 'customDate' && f[k] !== d[k]).length;
  },
  advancedCount() { return this.ADVANCED.filter(k => appState.filters[k]).length; },
  reset() { appState.filters = this.defaults(); },
  metrics() {
    const all = bookingService.all(), T = clock.today();
    const by = id => all.filter(b => this.inView(b, id));
    const today = all.filter(b => b.v.date === T && b.v.status !== STATUS.CANCELLED).sort((a, b) => a.v.time.localeCompare(b.v.time));
    return {
      all, today,
      cancelledToday: all.filter(b => b.v.date === T && b.v.status === STATUS.CANCELLED).length,
      needsConfirmation: this.sort(by('needs_confirmation')),
      startingSoon: by('starting_soon').sort((a, b) => a.v.time.localeCompare(b.v.time)),
      unassigned: this.sort(by('unassigned')),
      hostNotice: this.sort(by('host_notice')),
      followUpDue: by('follow_up_due'),
      followUpOverdue: by('follow_up_overdue'),
      late: by('late'),
      onCampus: by('on_campus'),
      noOutcome: by('no_outcome'),
      noShowNoFollowUp: by('no_show_no_followup'),
      notClosedOut: by('unconfirmed_past'),
      capacity: availabilityService.capacityForDate(T)
    };
  }
};

/* ============================== 11. PREFS ============================== */
/* localStorage holds UI PREFERENCES ONLY (view, columns, saved view, collapsed panels).
   Never bookings, capacity, OTP, permissions, ownership or audit history. */
const prefs = {
  KEY: 'superschools.visits.ui.v2',
  load() {
    let p = {};
    try { p = JSON.parse(localStorage.getItem(this.KEY) || '{}') || {}; } catch (e) { p = {}; }
    if (['overview', 'availability', 'bookings'].includes(p.section)) appState.section = p.section;
    if (['list', 'calendar'].includes(p.bookingsMode)) appState.bookingsMode = p.bookingsMode;
    if (['day', 'week'].includes(p.calendarMode)) appState.calendarMode = p.calendarMode;
    if (filterService.VIEWS.some(v => v.id === p.savedView && !v.contextual)) appState.savedView = p.savedView;
    if (Array.isArray(p.columns)) appState.columns = p.columns.filter(c => OPTIONAL_COLUMNS.includes(c));
    if (p.collapsed && typeof p.collapsed === 'object') appState.collapsed = p.collapsed;
    appState.moreFiltersOpen = !!p.moreFiltersOpen;
    if (p.sort && filterService.SORT_KEYS[p.sort.key] && ['asc', 'desc'].includes(p.sort.dir)) appState.sort = { key: p.sort.key, dir: p.sort.dir };
    if (PAGE_SIZES.includes(p.pageSize)) appState.pageSize = p.pageSize;
  },
  save() {
    const view = filterService.view(appState.savedView);
    try {
      localStorage.setItem(this.KEY, JSON.stringify({
        section: appState.section, bookingsMode: appState.bookingsMode, calendarMode: appState.calendarMode,
        savedView: view.contextual ? 'today' : appState.savedView, columns: appState.columns,
        collapsed: appState.collapsed, moreFiltersOpen: appState.moreFiltersOpen, sort: appState.sort, pageSize: appState.pageSize
      }));
    } catch (e) { /* storage unavailable (private mode) — preferences simply aren't remembered */ }
  }
};

/* SAMPLE DATA ONLY — fictional families. Every visit state is represented:
   requested, scheduled (incl. one arrived on campus), completed (with and without outcome), missed,
   cancelled, follow-up due / overdue / done, unassigned, upcoming, a full slot
   (today 11:00) and a nearly-full slot (today 12:00). */
const seedHelpers = {
  addFamily(f) {
    const pid = uid('P'), cid = uid('C'), aid = uid('A');
    const eid = f.enquiryId || ('E-' + (++enquirySeq));
    db.parents[pid] = { id: pid, name: f.parentName, mobile: f.mobile, email: f.email || '', contactVerified: !!f.verified, appChat: !!f.app, preferredChannel: f.preferredChannel || '' };
    db.children[cid] = { id: cid, parentId: pid, name: f.childName };
    db.applications[aid] = { id: aid, enquiryId: eid, state: f.appState || APP_STATE.NOT_STARTED, updatedAt: f.createdAt };
    db.enquiries[eid] = { id: eid, parentId: pid, childId: cid, grade: f.grade, admissionType: f.admissionType || ADMISSION_TYPES[0], source: f.source || 'Website', createdAt: f.createdAt || clock.now(), applicationId: aid };
    return db.enquiries[eid];
  },
  newVisit(o) {
    const id = 'VB-' + (++visitSeq);
    db.visits[id] = {
      id, enquiryId: o.enquiryId, date: o.date, time: o.time, hostId: o.hostId || null, status: o.status,
      notes: [], communications: [], arrivedAt: null, arrivedBy: null, completedAt: null, completedBy: null,
      outcome: null, followUp: null, counsellorId: null, cancelReason: null, rescheduleCount: 0, hostNotice: null,
      replacesVisitId: o.replacesVisitId || null, createdAt: o.createdAt, createdBy: o.createdBy, version: 1, updatedAt: o.createdAt
    };
    return db.visits[id];
  }
};

function seedDemoData() {
