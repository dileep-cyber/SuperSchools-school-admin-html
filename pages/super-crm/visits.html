  },

  /* ---------------- HOST CARD (Availability → Hosts) ----------------
     Every host answers: which days (weekly), which times, from when until when,
     and when they are on leave — in one sentence, then editable details and a
     month calendar. */
  hostCard(h, cfg, canEdit, upcomingCount) {
    const T = clock.today(), open = !!appState.hostOpen[h.id], dis = canEdit ? '' : ' disabled';
    const err = appState.hostErr[h.id] || '';
    const misfits = Object.values(db.visits).filter(v => v.hostId === h.id && ACTIVE_STATUSES.includes(v.status) && v.date >= T && !availabilityService.hostCanHost(h.id, v.date, cfg, v.time).ok);
    const over = availabilityService.overLimitDays(h, T, dateUtil.add(T, 60));
    const state = availabilityService.hostDayState(h, T, cfg);
    const todayBadge = { hosting: ['Hosting today', 'green'], off: ['Not hosting today', 'neutral'], leave: ['On leave today', 'amber'], closed: ['School closed today', 'neutral'], outside: ['Not hosting now', 'neutral'] }[state.state];
    const head = `<div class="host-card-head">
        <span class="avatar lg" aria-hidden="true">${initials(h.name)}</span>
        <div class="host-card-name"><b id="hc-${h.id}">${esc(h.name)}</b><span class="sub">${esc(h.role)} · ${upcomingCount} upcoming ${plural(upcomingCount, 'visit', 'visits')}</span></div>
        ${this.toneBadge(todayBadge[0], todayBadge[1])}
        <button type="button" class="btn btn-secondary btn-sm" id="av-ho-${h.id}" data-action="av-host-open" data-host="${h.id}" aria-expanded="${open}" aria-controls="hcd-${h.id}">${icon(open ? 'expand_less' : 'edit_calendar')}${open ? 'Close' : (canEdit ? 'Edit schedule' : 'View schedule')}</button>
        ${canEdit ? `<button type="button" class="btn btn-ghost btn-sm btn-icon" data-action="av-host-remove" data-host="${h.id}" aria-label="Remove ${esc(h.name)} from visit hosts">${icon('delete')}</button>` : ''}
      </div>
      <p class="host-sentence" aria-live="polite">${icon('info')}<span>${esc(availabilityService.hostSentence(h, cfg))}</span></p>
      ${misfits.length ? `<p class="next-hint warn host-warn">${icon('warning')} ${misfits.length} upcoming ${plural(misfits.length, 'visit falls', 'visits fall')} outside ${esc(firstName(h.name))}'s hosting days or times — <button type="button" class="link" data-action="av-host-visits" data-host="${h.id}">change the host</button></p>` : ''}
      ${over.length ? `<p class="next-hint warn host-warn">${icon('warning')} Over the daily limit of ${h.maxPerDay} on ${over.length} ${plural(over.length, 'day', 'days')} (${esc(over.slice(0, 3).map(d => dateUtil.short(d)).join(', '))}${over.length > 3 ? '…' : ''}) — <button type="button" class="link" data-action="av-host-visits" data-host="${h.id}">move some visits</button></p>` : ''}`;
    if (!open) return `<article class="host-card" aria-labelledby="hc-${h.id}">${head}</article>`;

    // weekly days
    const days = `<div class="hc-block"><span class="label" id="hcl-days-${h.id}">Hosts every week on</span>
      <div class="day-toggles" role="group" aria-labelledby="hcl-days-${h.id}">${DAY_KEYS.map(k => `<button type="button" class="day-toggle" id="av-hd-${h.id}-${k}" data-action="av-host-day" data-host="${h.id}" data-day="${k}" aria-pressed="${h.days.includes(k)}" aria-label="${DAY_LABEL[k]}"${dis}>${DAY_SHORT[k]}</button>`).join('')}</div>
      <span class="hint">These repeat every week. Tap a day to switch it on or off.</span></div>`;
    // hosting times per selected day
    const hourRows = DAY_KEYS.filter(k => h.days.includes(k)).map(k => {
      const plan = cfg.weekly[k];
      if (!plan.open) return `<div class="hc-hours-row"><b>${DAY_LABEL[k]}</b><span class="hint">Visits are closed on ${DAY_LABEL[k]}s — open the day in Weekly Availability first.</span></div>`;
      const all = availabilityService.slotTimes(plan), lim = h.slots[k];
      return `<div class="hc-hours-row"><b>${DAY_LABEL[k]}</b><div class="row" role="group" aria-label="${DAY_LABEL[k]} hosting times">${all.map(t => `<button type="button" class="day-toggle" id="av-hs-${h.id}-${k}-${t.replace(':', '')}" data-action="av-host-slot" data-host="${h.id}" data-day="${k}" data-time="${t}" aria-pressed="${!lim || lim.includes(t)}"${dis}>${dateUtil.time(t)}</button>`).join('')}</div>
        <span class="hint">${lim ? 'Only ' + esc(availabilityService.timesText(lim, plan.slotMins)) : 'All visit hours'}</span></div>`;
    }).join('');
    const hours = `<div class="hc-block"><span class="label">Hosting times</span>${hourRows || '<span class="hint">Choose at least one day above.</span>'}</div>`;
    // dates
    const dates = `<div class="hc-block"><span class="label">Hosting dates</span><div class="grid-2">
      <div class="field"><label class="label" for="av-hf-${h.id}">From</label><input type="date" class="input" id="av-hf-${h.id}" data-hostdate="from" data-host="${h.id}" value="${esc(h.from)}"${dis}><span class="hint">Leave empty to start now.</span></div>
      <div class="field"><label class="label" for="av-hu-${h.id}">Until</label><input type="date" class="input" id="av-hu-${h.id}" data-hostdate="until" data-host="${h.id}" value="${esc(h.until)}" min="${esc(h.from || T)}"${dis}><span class="hint">Leave empty for no end date.</span></div></div>
      ${err ? `<p class="err" role="alert">${icon('error')}${esc(err)}</p>` : ''}</div>`;
    // leave
    const lf = appState.leaveForm[h.id] || { from: '', to: '', reason: '' };
    const leaves = (h.leave || []).filter(l => l.to >= T).sort((a, b) => a.from.localeCompare(b.from));
    const leave = `<div class="hc-block"><span class="label">Leave</span>
      ${leaves.length ? `<ul class="stack-sm">${leaves.map(l => `<li class="hc-leave"><span class="badge tone-amber">${icon('beach_access')}${esc(dateUtil.fmt(l.from, { day: 'numeric', month: 'short' }))} – ${esc(dateUtil.fmt(l.to, { day: 'numeric', month: 'short', year: 'numeric' }))}</span><span class="grow">${esc(l.reason || 'Leave')}</span>${canEdit ? `<button type="button" class="btn btn-ghost btn-sm" data-action="av-leave-remove" data-host="${h.id}" data-lid="${l.id}">${icon('close')}Remove</button>` : ''}</li>`).join('')}</ul>` : '<span class="hint">No leave planned.</span>'}
      ${canEdit ? `<div class="hc-leave-form">
        <div class="field"><label class="label" for="av-lf-${h.id}">First day</label><input type="date" class="input" id="av-lf-${h.id}" data-leave="from" data-host="${h.id}" min="${T}" value="${esc(lf.from)}"></div>
        <div class="field"><label class="label" for="av-lt-${h.id}">Last day</label><input type="date" class="input" id="av-lt-${h.id}" data-leave="to" data-host="${h.id}" min="${T}" value="${esc(lf.to)}"></div>
        <div class="field"><label class="label" for="av-lr-${h.id}">Reason <span class="opt">(optional)</span></label><input type="text" class="input" id="av-lr-${h.id}" data-leave="reason" data-host="${h.id}" maxlength="60" placeholder="e.g. Diwali leave" value="${esc(lf.reason)}"></div>
        <button type="button" class="btn btn-secondary" id="av-la-${h.id}" data-action="av-leave-add" data-host="${h.id}">${icon('add')}Add leave</button></div>
        ${appState.leaveErr[h.id] ? `<p class="err" role="alert">${icon('error')}${esc(appState.leaveErr[h.id])}</p>` : ''}` : ''}</div>`;
    return `<article class="host-card is-open" aria-labelledby="hc-${h.id}">${head}
      <div class="host-card-body" id="hcd-${h.id}"><div class="hc-edit">${days}${hours}${dates}${leave}</div>${this.hostMonth(h, cfg)}</div></article>`;
  },
  /* Month calendar for one host: colour + text per day, visit count per day. */
  hostMonth(h, cfg) {
    const T = clock.today();
    const first = appState.hostMonth[h.id] || T.slice(0, 8) + '01';
    const d0 = dateUtil.parse(first), y = d0.getFullYear(), mo = d0.getMonth();
    const daysIn = new Date(y, mo + 1, 0).getDate(), lead = (d0.getDay() + 6) % 7;
    const title = d0.toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
    const cells = [];
    for (let i = 0; i < lead; i++) cells.push('<div class="hcal-day is-pad" aria-hidden="true"></div>');
    for (let n = 1; n <= daysIn; n++) {
      const iso = y + '-' + pad2(mo + 1) + '-' + pad2(n);
      const st = availabilityService.hostDayState(h, iso, cfg);
      const cnt = Object.values(db.visits).filter(v => v.hostId === h.id && v.date === iso && v.status !== STATUS.CANCELLED).length;
      cells.push(`<div class="hcal-day st-${st.state}${iso === T ? ' is-today' : ''}${iso < T ? ' is-past' : ''}" role="gridcell" title="${esc(st.label)}" aria-label="${esc(dateUtil.long(iso))}: ${esc(st.label)}${cnt ? ', ' + cnt + ' ' + plural(cnt, 'visit', 'visits') : ''}"><b>${n}</b>${cnt ? `<i class="num">${cnt}</i>` : ''}</div>`);
    }
    const legend = [['hosting', 'Hosting'], ['off', 'Not working'], ['leave', 'On leave'], ['closed', 'School closed'], ['outside', 'Outside hosting dates']]
      .map(x => `<span class="hcal-key"><i class="st-${x[0]}"></i>${x[1]}</span>`).join('');
    return `<div class="hcal">
      <div class="hcal-head"><button type="button" class="btn btn-secondary btn-sm btn-icon" id="av-hm-${h.id}-p" data-action="av-host-month" data-host="${h.id}" data-dir="-1" aria-label="Previous month">${icon('chevron_left')}</button>
        <b aria-live="polite">${esc(title)}</b>
        <button type="button" class="btn btn-secondary btn-sm btn-icon" id="av-hm-${h.id}-n" data-action="av-host-month" data-host="${h.id}" data-dir="1" aria-label="Next month">${icon('chevron_right')}</button></div>
      <div class="hcal-grid" role="grid" aria-label="${esc(h.name)} — ${esc(title)}">${DAY_KEYS.map(k => `<span class="hcal-dow" role="columnheader">${DAY_SHORT[k].slice(0, 2)}</span>`).join('')}${cells.join('')}</div>
      <div class="hcal-legend">${legend}</div>
      <p class="hint">Numbers show how many visits ${esc(firstName(h.name))} is hosting that day.</p>
    </div>`;
  },
  /* ---------------- DETAIL DRAWER ---------------- */
  renderDrawer(b, titleId) {
    const v = b.v, na = bookingService.nextAction(b), T = clock.today();
    const fu = bookingService.followUpState(v);
    const acts = activityService.forVisit(v.id);
    const can = p => authz.can(p);
    const dl = rows => `<dl class="dl">${rows.filter(Boolean).map(r => `<div class="${r[2] || ''}"><dt>${esc(r[0])}</dt><dd>${r[1]}</dd></div>`).join('')}</dl>`;
    const sectionHead = (ic, title, action) => `<div class="d-section-head"><h3>${icon(ic)}${esc(title)}</h3>${action || ''}</div>`;
    const nextCopy = {
      confirm: 'Agree the time with the parent — call or WhatsApp — then mark the visit scheduled.',
      remind: 'The visit is scheduled. Send a friendly reminder the day before.',
      arrive: v.status === STATUS.PENDING ? 'This visit is still only requested. If the family is at reception, mark them arrived — it is logged as “scheduled on arrival”.' : 'Mark the family as arrived when they reach reception.',
      no_show: 'The visit date has passed without an arrival. Mark it as Visit Missed and plan a follow-up.',
      complete: 'The family is on campus. Complete the visit and record the outcome after the tour.',
      outcome: 'Record what happened in this visit so the admissions team knows what to do next.',
      followup: fu === 'none' ? 'Plan a follow-up call to rebook this visit.' : 'Follow up with the family as planned, then mark the follow-up done.',
      reschedule: v.status === STATUS.PENDING ? 'This visit was never scheduled and the date has passed. Agree a new time with the family, or cancel it.' : 'Follow-up is done. Schedule a revisit if the family is still interested.',
      rebook: 'This visit was cancelled. Create a replacement booking if the family wants to visit.',
      details: 'This visit is closed. The outcome and history are below.'
    }[na.id];
    const pm = primaryMove(b), others = secondaryMoves(b);

    const nextStep = pm ? `Move it to ${pm.label}.` + (others.length ? ` Other options in the ⋯ menu: ${listText(others.map(m => m.label))}.` : '') : nextCopy;

    const comms = v.communications.length ? `<ul class="comm-list">${v.communications.map(c => {
      const st = COMM_STATE_META[c.state];

      return `<li><span class="attn-ico tone-neutral">${icon(CHANNEL_META[c.channel].icon)}</span><div style="flex:1;min-width:0"><b style="font-weight:600">${esc(text)}</b><span class="sub">${esc(c.template && c.state === COMM_STATE.OPENED_EXTERNAL ? c.template + ' · ' : '')}${esc(c.by)} · ${esc(dateUtil.stamp(c.at))}</span></div>${this.toneBadge(st.label, st.tone)}</li>`;
    }).join('')}</ul>` : '<p class="muted">No messages or calls logged yet.</p>';
    const notes = v.notes.length ? `<ul class="note-list">${v.notes.map(n => `<li><span class="avatar" aria-hidden="true">${initials(n.by)}</span><div style="flex:1;min-width:0"><p>${esc(n.text)}</p><span class="sub">${esc(n.by)} · ${esc(dateUtil.stamp(n.at))}</span></div></li>`).join('')}</ul>` : '<p class="muted">No notes yet.</p>';
    const fuBlock = v.followUp ? dl([
      ['Date', esc(dateUtil.fmt(v.followUp.date)) + (fu === 'overdue' ? ' ' + this.toneBadge('Overdue', 'red') : fu === 'due' ? ' ' + this.toneBadge('Due today', 'amber') : '')],
      ['Owner', esc(hostName(v.followUp.ownerId, true) || '—')],
      ['Reason', esc(v.followUp.reason)],
      ['Status', v.followUp.status === FOLLOWUP_STATUS.DONE ? this.toneBadge('Done', 'green', 'check') : this.toneBadge('Open', 'blue')],
      v.followUp.notes ? ['Notes', esc(v.followUp.notes), 'full'] : null
    ]) : `<p class="muted">${[STATUS.COMPLETED, STATUS.NO_SHOW].includes(v.status) ? 'No follow-up planned.' : 'Follow-ups can be planned after the visit is completed or missed.'}</p>`;
    const fuActions = [STATUS.COMPLETED, STATUS.NO_SHOW].includes(v.status) && can(PERM.FOLLOW_UP)
      ? (v.followUp && v.followUp.status === FOLLOWUP_STATUS.OPEN
        ? `<div class="row"><button type="button" class="btn btn-secondary btn-sm" data-action="followup" data-id="${b.id}">${icon('edit')}Edit</button><button type="button" class="btn btn-secondary btn-sm" data-action="followup-done" data-id="${b.id}">${icon('done_all')}Mark done</button></div>`
        : `<button type="button" class="btn btn-secondary btn-sm" data-action="followup" data-id="${b.id}">${icon('add')}${v.followUp ? 'New follow-up' : 'Plan follow-up'}</button>`)
      : '';
    const appSeg = can(PERM.APPLICATION)
      ? `<div class="seg sm" role="group" aria-label="Application status">${Object.keys(APP_STATE_META).map(k => `<button type="button" id="app-${k}" data-action="set-application" data-state="${k}" data-id="${b.id}" aria-pressed="${b.a.state === k}">${APP_STATE_META[k].label}</button>`).join('')}</div>`
      : this.toneBadge(APP_STATE_META[b.a.state].label, APP_STATE_META[b.a.state].tone);

    // sticky footer: one primary action, one common secondary, the rest in More
    const primary = pm && can(statusMovePerm(pm.to))
      ? `<button type="button" class="btn btn-primary" data-action="primary" data-act="move:${pm.to}" data-id="${b.id}">${icon(pm.icon)}${esc(pm.label)}</button>` : '';
    const secondary = bookingService.canReschedule(v) && can(PERM.RESCHEDULE)
      ? `<button type="button" class="btn btn-secondary" data-action="reschedule" data-id="${b.id}">${icon('update')}Reschedule</button>` : '';

    return `
      <header class="d-head">
        <div style="flex:1;min-width:0">
          <span class="eyebrow">${esc(v.id)} · Enquiry ${esc(b.e.id)}</span>
          <h2 id="${titleId}">${esc(b.p.name)}</h2>
          <span class="sub">${esc(b.c.name)} · ${esc(b.e.grade)}</span>
          <div class="d-meta">${this.statusBadge(v.status)}<span>${icon('event')} ${esc(dateUtil.fmt(v.date))} · ${dateUtil.time(v.time)}</span></div>
        </div>
        <button type="button" class="btn btn-ghost btn-icon btn-sm" data-modal-dismiss aria-label="Close details">${icon('close')}</button>
      </header>
      <div class="d-body">
        <div class="d-next alert ${na.hint && na.hint.tone === 'bad' ? 'alert-warn' : 'alert-info'}">${icon('lightbulb')}<span><b>Next step:</b> ${esc(nextStep)}${na.hint && na.hint.text ? ` <span class="muted">(${esc(na.hint.text)})</span>` : ''}</span></div>
        <section class="d-section" aria-label="Parent">${sectionHead('person', 'Parent')}${dl([

          ['Email', b.p.email ? `<a class="link" href="mailto:${esc(b.p.email)}">${esc(b.p.email)}</a>` : '<span class="muted">Not provided</span>', 'full']
        ])}</section>
        <section class="d-section" aria-label="Child">${sectionHead('child_care', 'Child')}${dl([
          ['Name', esc(b.c.name)], ['Grade', esc(b.e.grade)], ['Admission type', esc(b.e.admissionType)], ['Enquiry source', esc(b.e.source)]

          ['Date', esc(dateUtil.fmt(v.date, { weekday: 'long', day: 'numeric', month: 'long' }))],
          ['Time', esc(dateUtil.time(v.time))],
          ['Host', b.host ? esc(b.host.name) + `<span class="sub">${esc(b.host.role)}</span>` : (ACTIVE_STATUSES.includes(v.status) ? this.toneBadge('Unassigned', 'amber', 'person_add') : '<span class="muted">—</span>')],
          ['Status', this.statusBadge(v.status)],
          ['Arrival', v.arrivedAt ? esc(dateUtil.stamp(v.arrivedAt)) + `<span class="sub">by ${esc(v.arrivedBy)}</span>` : '<span class="muted">—</span>'],
          ['Outcome', v.outcome ? esc(OUTCOME_LABEL[v.outcome.value]) + (v.outcome.notes ? `<span class="sub">${esc(v.outcome.notes)}</span>` : '') : (v.status === STATUS.COMPLETED ? this.toneBadge('Not recorded', 'amber') : '<span class="muted">—</span>')],
          v.counsellorId ? ['Counsellor', esc(hostName(v.counsellorId, true))] : null,
          v.status === STATUS.CANCELLED ? ['Cancelled', esc(v.cancelReason || '') + `<span class="sub">${esc(v.cancelledBy || '')}${v.cancelledAt ? ' · ' + esc(dateUtil.stamp(v.cancelledAt)) : ''}</span>`] : null,
          v.rescheduleCount ? ['Rescheduled', v.rescheduleCount + ' ' + plural(v.rescheduleCount, 'time', 'times')] : null
        ])}</section>

          ${can(PERM.CONTACT) && v.hostNotice && ACTIVE_STATUSES.includes(v.status) ? `<p class="next-hint warn comm-warn">${icon('campaign')} ${b.host ? 'The host changed to ' + esc(b.host.name) : 'The host is on leave and nobody else is free'} — the parent hasn’t been told yet. <button type="button" class="link" data-action="message" data-channel="${CHANNEL.WHATSAPP}" data-id="${b.id}">Send host update</button> · <button type="button" class="link" data-action="host-told" data-id="${b.id}">Mark as told</button></p>` : ''}

/* ===================== LAYERS: modal, drawer, menu, toast ===================== */
const FOCUSABLE = 'a[href],button:not([disabled]),input:not([disabled]):not([type="hidden"]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';

function focusDescriptor(el) {
  if (!el || !el.dataset) return null;
  return { id: el.id || '', action: el.dataset.action || '', vid: el.dataset.id || '' };
}
function restoreFocus(desc) {
  if (!desc) return;
  const scope = modalService.top() ? modalService.top().modal : document;
  let el = desc.id ? document.getElementById(desc.id) : null;
  if (!el && desc.action && desc.vid) el = scope.querySelector(`[data-action="${desc.action}"][data-id="${desc.vid}"]`);
  if (!el && desc.vid) el = scope.querySelector(`[data-action="primary"][data-id="${desc.vid}"], [data-action="open"][data-id="${desc.vid}"]`);
  if (el) el.focus({ preventScroll: true });
  else if (!modalService.top()) document.getElementById('main').focus({ preventScroll: true });
}
function announce(msg) {
  const el = document.getElementById('announcer');
  el.textContent = '';
  setTimeout(() => { el.textContent = msg; }, 30);
}

const modalService = {
  stack: [],
  top() { return this.stack[this.stack.length - 1] || null; },
  /* One modal system for dialogs, bottom sheets (mobile) and the detail drawer:
     aria-modal, labelled title, focus trap, Escape to close, focus returns to trigger. */
  open(o) {
    menuService.close(false);
    const id = uid('dlg');
    const labelId = o.labelId || id + '-t';
    /* o.replace: an open entry to take over in place. Its layer and backdrop are kept, only the
       panel is swapped, so a form that leads straight to another dialog reads as one flow. */
    const reuse = o.replace && this.stack.includes(o.replace) ? o.replace : null;
    const trigger = reuse ? reuse.trigger : (focusDescriptor(document.activeElement) || {});
    if (!reuse) trigger.el = document.activeElement;
    const layer = reuse ? reuse.layer : document.createElement('div');
    if (!reuse) layer.className = 'modal-layer is-' + (o.variant || 'dialog');
    const inner = o.variant === 'drawer' ? o.body : `
      <header class="modal-head"><div><h2 id="${labelId}">${esc(o.title)}</h2>${o.subtitle ? `<p id="${id}-d">${esc(o.subtitle)}</p>` : ''}</div>
        <button type="button" class="btn btn-ghost btn-icon btn-sm" data-modal-dismiss aria-label="Close">${icon('close')}</button></header>
      <div class="modal-body">${o.body}</div>
      ${o.footer ? `<footer class="modal-foot">${o.footer}</footer>` : ''}`;
    const section = `<section class="modal ${o.variant || ''} ${o.size || ''}${reuse ? ' is-swap' : ''}" role="dialog" aria-modal="true" aria-labelledby="${labelId}"${o.subtitle ? ` aria-describedby="${id}-d"` : ''} tabindex="-1">${inner}</section>`;
    if (reuse) {
      this.stack.splice(this.stack.indexOf(reuse), 1);
      if (reuse.onClose) reuse.onClose();
      reuse.modal.outerHTML = section;
    } else {
      layer.innerHTML = `<div class="modal-backdrop" data-modal-dismiss></div>` + section;
      this.stack.forEach(s => { s.layer.inert = true; });
      document.getElementById('app').inert = true;
      document.getElementById('mobile-cta').inert = true;
      document.body.classList.add('has-modal');
      document.getElementById('layers').appendChild(layer);
    }
    const entry = { layer, modal: layer.querySelector('.modal'), trigger, onClose: o.onClose, dismissible: o.dismissible !== false };
    entry.setBody = html => { entry.modal.querySelector('.modal-body').innerHTML = html; };
    entry.setFooter = html => { entry.modal.querySelector('.modal-foot').innerHTML = html; };
    layer.addEventListener('click', e => {
      if (e.target.closest('[data-modal-dismiss]') && !entry.busy) this.close(entry);
    });
    this.stack.push(entry);
    if (o.onMount) o.onMount(entry.modal, entry);
    const f = entry.modal.querySelector('[autofocus]') || entry.modal.querySelector('.modal-body ' + FOCUSABLE) || entry.modal;
    f.focus({ preventScroll: true });
    return entry;
  },
  close(entry) {
    const e = entry || this.top();
    const i = this.stack.indexOf(e);
    if (i < 0) return;
    menuService.close(false);
    this.stack.splice(i, 1);
    e.layer.remove();
    const top = this.top();
    if (top) top.layer.inert = false;
    else {
      document.getElementById('app').inert = false;
      document.getElementById('mobile-cta').inert = false;
      document.body.classList.remove('has-modal');
    }
    if (e.onClose) e.onClose();
    if (e.trigger.el && e.trigger.el.isConnected && !e.trigger.el.closest('[inert]')) e.trigger.el.focus({ preventScroll: true });
    else restoreFocus(e.trigger);
  },
  trap(ev) {
    const top = this.top();
    if (!top || menuService.el) return;
    if (ev.key === 'Escape') { ev.preventDefault(); if (!top.busy && top.dismissible) this.close(top); return; }
    if (ev.key !== 'Tab') return;
    const items = Array.from(top.modal.querySelectorAll(FOCUSABLE)).filter(x => x.offsetParent !== null || x === document.activeElement);
    if (!items.length) { ev.preventDefault(); top.modal.focus(); return; }
    const first = items[0], last = items[items.length - 1];
    if (!top.modal.contains(document.activeElement)) { ev.preventDefault(); first.focus(); return; }
    if (ev.shiftKey && (document.activeElement === first || document.activeElement === top.modal)) { ev.preventDefault(); last.focus(); }
    else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
  }
};

const drawerService = {

const menuService = {
  el: null, anchor: null, items: null,
  open(anchor, items, label) {
    if (this.el && this.anchor === anchor) { this.close(true); return; }
    this.close(false);
    const clean = items.filter((it, i, arr) => it !== '-' || (i > 0 && arr[i - 1] !== '-' && i < arr.length - 1));
    const m = document.createElement('div');
    m.className = 'menu';
    m.setAttribute('role', 'menu');
    m.setAttribute('aria-label', label || 'Actions');
    m.innerHTML = clean.map((it, i) => {
      if (it === '-') return '<hr role="separator">';
      if (it.heading) return `<div class="menu-label" role="presentation">${esc(it.heading)}</div>`;
      const role = it.role || 'menuitem';
      return `<button type="button" role="${role}" tabindex="-1" data-i="${i}" class="${it.danger ? 'danger' : ''}"${role !== 'menuitem' ? ` aria-checked="${!!it.checked}"` : ''}${it.disabled ? ' aria-disabled="true"' : ''}>${icon(role !== 'menuitem' ? (it.checked ? (role === 'menuitemradio' ? 'radio_button_checked' : 'check_box') : (role === 'menuitemradio' ? 'radio_button_unchecked' : 'check_box_outline_blank')) : (it.icon || 'circle'))}<span>${esc(it.label)}</span>${it.hint ? `<small>${esc(it.hint)}</small>` : ''}</button>`;
    }).join('');
    document.getElementById('layers').appendChild(m);
    const r = anchor.getBoundingClientRect();
    const mw = m.offsetWidth, mh = m.offsetHeight;
    let left = Math.max(8, Math.min(r.right - mw, window.innerWidth - mw - 8));
    let top = r.bottom + 4;
    if (top + mh > window.innerHeight - 8) top = Math.max(8, r.top - mh - 4);
    m.style.left = left + 'px'; m.style.top = top + 'px';
    anchor.setAttribute('aria-expanded', 'true');
    this.el = m; this.anchor = anchor; this.items = clean;
    m.addEventListener('click', e => {
      const btn = e.target.closest('[data-i]');
      if (!btn || btn.getAttribute('aria-disabled') === 'true') return;
      const it = clean[+btn.dataset.i];
      if (it.keepOpen) { it.run(); it.checked = !it.checked; btn.setAttribute('aria-checked', String(it.checked)); btn.querySelector('.ms').textContent = it.checked ? 'check_box' : 'check_box_outline_blank'; return; }

    });
    m.addEventListener('keydown', e => {
      const btns = Array.from(m.querySelectorAll('[data-i]'));
      const i = btns.indexOf(document.activeElement);
      if (e.key === 'ArrowDown') { e.preventDefault(); btns[(i + 1) % btns.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); btns[(i - 1 + btns.length) % btns.length].focus(); }
      else if (e.key === 'Home') { e.preventDefault(); btns[0].focus(); }
      else if (e.key === 'End') { e.preventDefault(); btns[btns.length - 1].focus(); }

  },
  close(refocus) {

  }

const toast = {
  show(msg, o) {

/* ============================ FORM HELPERS ============================ */
function setBusy(btn, busy, label) {
  if (!btn) return;
  if (busy) {
    btn.dataset.idle = btn.innerHTML;
    btn.textContent = label;
    btn.classList.add('is-busy');
    btn.setAttribute('aria-disabled', 'true');
  } else if (btn.dataset.idle != null) {
    btn.innerHTML = btn.dataset.idle;
    delete btn.dataset.idle;
    btn.classList.remove('is-busy');
    btn.removeAttribute('aria-disabled');
  }
}
/* Every write goes through here: busy label → simulated API → success or recoverable error. */
/* o.visitId + o.version: the record version the user acted on (captured when the
   dialog opened). Defaults to the current version for one-click row actions. */
function runMutation(o) {
  if (o.btn && o.btn.classList.contains('is-busy')) return Promise.resolve();
  const entry = modalService.top();
  if (o.modal && entry) entry.busy = true;
  setBusy(o.btn, true, o.busyLabel || 'Saving…');
  const expect = o.visitId && db.visits[o.visitId] ? { visitId: o.visitId, version: o.version != null ? o.version : db.visits[o.visitId].version } : null;
  return api.request(o.fn, { failCode: o.failCode || 'STATUS_SAVE', expect }).then(res => {
    if (o.modal && entry) entry.busy = false;
    setBusy(o.btn, false);
    toast.clearErrors(); // a successful save makes earlier failure notices stale
    if (o.onSuccess) o.onSuccess(res);
  }).catch(err => {
    if (o.modal && entry) entry.busy = false;
    setBusy(o.btn, false);
    if (err && err.code === 'CONFLICT') {
      // Stale write: show the latest record, keep the user's dialog open so nothing typed is lost.
      if (o.onConflict) o.onConflict(); else uiService.refresh();
      drawerService.refresh();
      announce(ERROR_COPY.CONFLICT);
    }
    if (o.onError) o.onError(err);
    else toast.show(errorText(err, o.failCode || 'STATUS_SAVE'), { error: true, action: o.retry ? { label: 'Try again', run: o.retry } : null });
  });
}
/* Bulk writes: one request per visit, each carrying the version it was acted on, so a
   stale or invalid item fails alone and the rest still save (partial success).
   PRODUCTION API REQUIRED: POST /v1/visits/bulk returns per-item results in one call. */
function bulkMutate(o) {
  if (o.btn && o.btn.classList.contains('is-busy')) return Promise.resolve();
  setBusy(o.btn, true, o.busyLabel || 'Saving…');
  announce(o.busyLabel || 'Saving…');
  const ok = [], failed = [];
  return o.ids.reduce((p, id) => p.then(() => api.request(() => o.fn(id), { delay: 120, failCode: o.failCode || 'STATUS_SAVE', expect: db.visits[id] ? { visitId: id, version: db.visits[id].version } : null })
    .then(() => { ok.push(id); }, err => { failed.push({ id, err }); })), Promise.resolve())
    .then(() => {
      setBusy(o.btn, false);
      if (ok.length) toast.clearErrors();
      appState.selected = failed.map(x => x.id);   // what still needs attention stays ticked
      uiService.refresh();
      o.done(ok, failed);
    });
}
/* Every status change ends on the reminder screen for the visits that changed, with the

function remindAfterStatus(ids, tplId, fromEntry) {
  const list = (Array.isArray(ids) ? ids : [ids]).filter(id => db.visits[id]);
  if (!list.length || !authz.can(PERM.CONTACT)) { if (fromEntry) modalService.close(fromEntry); return; }
  if (fromEntry) dialogs.bulkRemind(list, tplId || null, { afterStatus: true, replace: fromEntry });   // same popup, swapped in place
  else setTimeout(() => dialogs.bulkRemind(list, tplId || null, { afterStatus: true }), 0);

function bulkSummary(ok, failed, successText, verb, retry) {
  if (!failed.length) { toast.show(successText, { icon: 'done_all' }); announce(successText); return; }
  const why = Array.from(new Set(failed.map(x => errorText(x.err, 'STATUS_SAVE')))).slice(0, 2).join(' ');
  const text = `${ok.length} of ${ok.length + failed.length} ${verb}. ${failed.length} couldn't be updated and ${plural(failed.length, 'is', 'are')} still selected. ${why}`;
  toast.show(text, { error: true, action: retry ? { label: 'Try again', run: retry } : null });

/* Slot picker shared by New Booking and Reschedule. Capacity shown as places left. */
function slotPickerHtml(iso, selected, excludeVisitId) {

    const b = e.target.closest('[data-slot]');
    if (!b || b.disabled) return;
    root.querySelectorAll('[data-slot]').forEach(x => x.setAttribute('aria-checked', String(x === b)));
    onPick(b.dataset.slot);
  });
}
function summaryBox(b) {
  return `<div class="summary-box"><span class="avatar lg" aria-hidden="true">${initials(b.p.name)}</span><div style="min-width:0;flex:1"><b>${esc(b.p.name)}</b><span class="sub">${esc(b.c.name)} · ${esc(b.e.grade)} · ${esc(dateUtil.fmt(b.v.date))}, ${dateUtil.time(b.v.time)}</span></div>${uiService.statusBadge(b.v.status)}</div>`;
}

    const renderForm = () => {

      const defHost = availabilityService.defaultHostFor(st.date);

          <div class="field"><label class="label" for="nb-mobile">Mobile number <span class="req" aria-hidden="true">*</span></label><input class="input" id="nb-mobile" data-field="mobile" type="tel" inputmode="tel" autocomplete="off" placeholder="98450 12345" required aria-describedby="nb-mobile-h err-mobile" value="${esc(q.mobile || '')}">

          <div class="grid-2" style="margin-top:12px">
            ${enq ? '' : `<div class="field"><label class="label" for="nb-email">Email</label><input class="input" id="nb-email" type="email" data-field="email" autocomplete="off" aria-describedby="err-email">${errSlot('email')}</div>

            <div class="field" style="grid-column:1/-1"><label class="label" for="nb-notes">Notes</label><textarea class="input" id="nb-notes" rows="2" maxlength="600" placeholder="Anything the host should know"></textarea></div>

      const f = m.querySelector('#nb-form');
      const f0 = f.querySelector('[autofocus]') || f.querySelector('#nb-date');
      if (f0) f0.focus();
      const noHostNote = () => { m.querySelector('#nb-nohost').hidden = !(st.date && st.time) || availabilityService.hostsForSlot(st.date, st.time).length > 0; };
      noHostNote();
      bindSlotPicker(m.querySelector('#nb-slots'), t => { st.time = t; showErrors(f, {}); noHostNote(); });
      f.querySelector('#nb-date').addEventListener('change', e => {
        st.date = e.target.value; st.time = ''; noHostNote();
        m.querySelector('#nb-slots').innerHTML = slotPickerHtml(st.date, '');
        const hs = m.querySelector('#nb-host'); const cur = hs.value;
        hs.innerHTML = hostOptions(st.date, cur && st.date && availabilityService.hostCanHost(cur, st.date).ok && availabilityService.hostHasRoom(cur, st.date).ok ? cur : availabilityService.defaultHostFor(st.date));

      const f = m.querySelector('#nb-form');

      formAlert(f, '');

      runMutation({
        btn: m.querySelector('#nb-submit'), busyLabel: 'Booking…', failCode: 'SLOT_TAKEN', modal: true,

            st.time = '';

          else formAlert(f, esc(errorText(err, 'BOOKING')) + ` <button type="button" class="link" data-nb-retry>Try again</button>`);
          announce(errorText(err, 'BOOKING'));

      const sel = e.target.closest('[data-nb-select]');

      if (e.target.closest('#nb-quick') || e.target.closest('[data-nb-quick-from-search]')) { goQuick(); return; }

      const op = e.target.closest('[data-nb-open]');
      if (op) { const id = op.dataset.nbOpen; modalService.close(entry); drawerService.open(id); return; }
      if (e.target.closest('[data-nb-retry]')) submit();
    });
    if (st.step === 'find') renderFind(); else renderForm();
    const first = m.querySelector('[autofocus]') || m.querySelector('#nb-date');

          else if (err2.errors) showErrors(f, err2.errors);

  /* ---------- Complete Visit / Record Outcome ---------- */
  complete(id, mode) {
    const b = bookingService.view(id);
    const guard = versionGuard(id);
    const isComplete = mode !== 'outcome';
    const defaultCounsellor = b.v.counsellorId || b.v.hostId || authz.user().hostId;
    const entry = modalService.open({
      title: isComplete ? 'Complete visit' : 'Record visit outcome', subtitle: `${b.p.name} · ${b.c.name}, ${b.e.grade}`,
      body: `<form class="stack" id="cv-form" novalidate>
        <div class="alert" data-form-alert hidden></div>
        <fieldset class="field" style="border:0;padding:0;margin:0" data-field="outcome" tabindex="-1" aria-describedby="err-outcome"><legend class="label" style="margin-bottom:8px">Visit outcome <span class="req" aria-hidden="true">*</span></legend>
          <div class="radio-cards">${Object.keys(OUTCOME_LABEL).map((k, i) => `<label class="radio-card"><input type="radio" name="outcome" value="${k}"${i === 0 ? ' autofocus' : ''}>${esc(OUTCOME_LABEL[k])}</label>`).join('')}</div>${errSlot('outcome')}</fieldset>
        <div class="field"><label class="label" for="cv-notes">Notes <span class="opt">(optional)</span></label><textarea class="input" id="cv-notes" rows="3" maxlength="600" placeholder="What did the family like? Any concerns?"></textarea></div>
        <div class="grid-2">
          <div class="field"><label class="label" for="cv-fu">Follow-up date <span class="opt">(optional)</span></label><input class="input" type="date" id="cv-fu" min="${clock.today()}"><span class="hint">Leave blank if no follow-up is needed.</span></div>
          <div class="field"><label class="label" for="cv-owner">Assigned counsellor</label><select class="select" id="cv-owner" data-staff aria-describedby="cv-owner-role">${staffOptions(defaultCounsellor)}</select>${staffRoleHint('cv-owner', defaultCounsellor)}</div>
        </div>
      </form>`,
      footer: `<button type="button" class="btn btn-secondary" data-modal-dismiss>Cancel</button><button type="submit" form="cv-form" class="btn btn-primary" id="cv-submit">${icon('task_alt')}${isComplete ? 'Complete Visit' : 'Save outcome'}</button>`
    });
    const m = entry.modal, f = m.querySelector('#cv-form'), fu = m.querySelector('#cv-fu');
    let autoFilled = false;
    f.addEventListener('change', e => {
      if (e.target.name !== 'outcome') return;
      const suggest = OUTCOME_SUGGESTS_FOLLOWUP.includes(e.target.value);

      if (!checked) { showErrors(f, { outcome: 'Choose a visit outcome.' }); f.querySelector('input[name="outcome"]').focus(); return; }

        btn: m.querySelector('#cv-submit'), busyLabel: 'Saving…', modal: true, ...guard,
        fn: () => isComplete ? bookingService.complete(id, data) : bookingService.recordOutcome(id, data),
        onSuccess: () => {
          if (!isComplete) modalService.close(entry);
          uiService.refresh();
          toast.show(isComplete ? `Visit completed · ${OUTCOME_LABEL[data.outcome]}` : `Outcome saved · ${OUTCOME_LABEL[data.outcome]}`, { icon: 'task_alt' });
          if (isComplete) remindAfterStatus(id, null, entry);
        },
        onError: err => err.errors ? showErrors(f, err.errors) : formAlert(f, esc(errorText(err, 'STATUS_SAVE')) + ' <button type="submit" class="link" form="cv-form">Try again</button>')
      });
    });

      body: `<form class="stack" id="ns-form" novalidate>

        <label class="check"><input type="checkbox" id="ns-fu" checked autofocus> <span>Plan a follow-up call to rebook</span></label>

    });

  /* ---------- Follow-up ---------- */
  followUp(id) {
    const b = bookingService.view(id);
    const guard = versionGuard(id);
    const f0 = b.v.followUp && b.v.followUp.status === FOLLOWUP_STATUS.OPEN ? b.v.followUp : null;
    const owner = (f0 && f0.ownerId) || b.v.counsellorId || b.v.hostId || authz.user().hostId;
    const reason = (f0 && f0.reason) || (b.v.status === STATUS.NO_SHOW ? 'Rebook missed visit' : 'Answer questions');
    const entry = modalService.open({
      title: f0 ? 'Follow up' : 'Plan follow-up', subtitle: `${b.p.name} · ${STATUS_META[b.v.status].label}${b.v.outcome ? ' · ' + OUTCOME_LABEL[b.v.outcome.value] : ''}`,
      body: `<form class="stack" id="fu-form" novalidate>
        <div class="alert" data-form-alert hidden></div>
        ${authz.can(PERM.CONTACT) ? `<div class="field"><span class="label">Contact now</span>${uiService.contactBar(b, { fill: true })}</div>` : ''}
        <div class="grid-2">
          <div class="field"><label class="label" for="fu-date">Follow-up date <span class="req" aria-hidden="true">*</span></label><input class="input" type="date" id="fu-date" data-field="date" value="${esc(f0 ? f0.date : dateUtil.add(clock.today(), 1))}" aria-describedby="err-date" autofocus>${errSlot('date')}</div>
          <div class="field"><label class="label" for="fu-owner">Assigned to <span class="req" aria-hidden="true">*</span></label><select class="select" id="fu-owner" data-field="owner" data-staff aria-describedby="fu-owner-role err-owner">${staffOptions(owner)}</select>${staffRoleHint('fu-owner', owner)}${errSlot('owner')}</div>
        </div>
        <div class="field"><label class="label" for="fu-reason">Reason</label><select class="select" id="fu-reason">${FOLLOWUP_REASONS.map(r => `<option${r === reason ? ' selected' : ''}>${r}</option>`).join('')}</select></div>
        <div class="field"><label class="label" for="fu-notes">Notes <span class="opt">(optional)</span></label><textarea class="input" id="fu-notes" rows="2" maxlength="400">${esc(f0 ? f0.notes : '')}</textarea></div>
        ${f0 ? `<fieldset class="field" style="border:0;padding:0;margin:0"><legend class="label" style="margin-bottom:8px">Status</legend><div class="radio-cards">
          <label class="radio-card"><input type="radio" name="fu-status" value="open" checked>Open</label>
          <label class="radio-card"><input type="radio" name="fu-status" value="done">Done</label></div></fieldset>` : ''}
      </form>`,
      footer: `<button type="button" class="btn btn-secondary" data-modal-dismiss>Cancel</button><button type="submit" form="fu-form" class="btn btn-primary" id="fu-submit">${icon('check')}Save follow-up</button>`
    });
    const m = entry.modal, f = m.querySelector('#fu-form');
    f.addEventListener('submit', e => {
      e.preventDefault();
      const statusEl = f.querySelector('input[name="fu-status"]:checked');
      const data = { date: m.querySelector('#fu-date').value, ownerId: m.querySelector('#fu-owner').value, reason: m.querySelector('#fu-reason').value, notes: m.querySelector('#fu-notes').value, status: statusEl ? statusEl.value : FOLLOWUP_STATUS.OPEN };
      const errors = {};
      if (!data.date) errors.date = 'Choose a follow-up date.';
      if (!data.ownerId) errors.owner = 'Choose who will follow up.';
      if (Object.keys(errors).length) return showErrors(f, errors);
      runMutation({
        btn: m.querySelector('#fu-submit'), busyLabel: 'Saving…', modal: true, ...guard,
        fn: () => bookingService.setFollowUp(id, data),
        onSuccess: () => { modalService.close(entry); uiService.refresh(); toast.show(data.status === FOLLOWUP_STATUS.DONE ? 'Follow-up marked done' : `Follow-up planned for ${dateUtil.rel(data.date)} · ${hostName(data.ownerId)}`, { icon: 'phone_callback' }); },
        onError: err => err.errors ? showErrors(f, err.errors) : formAlert(f, esc(errorText(err, 'STATUS_SAVE')) + ' <button type="submit" class="link" form="fu-form">Try again</button>')
      });
    });
  },

  /* ---------- WhatsApp / SMS / Email with templates — logged truthfully as "opened" ---------- */
  message(id, channel, templateId) {
    const b = bookingService.view(id);
    const tpls = communicationService.templates(b, channel);
    let tpl = tpls.find(t => t.id === (templateId || communicationService.defaultTemplate(b))) || tpls[0];
    let edited = false;
    const COPY = {
      whatsapp: { title: 'Message on WhatsApp', app: 'WhatsApp', open: 'Open WhatsApp', to: phone.display(b.p.mobile) },
      sms:      { title: 'Send an SMS',         app: 'your SMS app', open: 'Open SMS app', to: phone.display(b.p.mobile) },
      email:    { title: 'Send an email',       app: 'your email app', open: 'Open email', to: b.p.email }
    }[channel];
    const isSms = channel === CHANNEL.SMS;
    const appName = COPY.app;
    const entry = modalService.open({
      title: COPY.title,
      subtitle: `To ${b.p.name} · ${COPY.to}`,
      size: 'lg',
      body: `<div class="stack">
        <div class="alert" data-form-alert hidden></div>
        <fieldset class="field" style="border:0;padding:0;margin:0"><legend class="label" style="margin-bottom:8px">Template</legend>
          <div class="radio-cards">${tpls.map(t => `<label class="radio-card"><input type="radio" name="tpl" value="${t.id}"${t.id === tpl.id ? ' checked autofocus' : ''}>${esc(t.label)}</label>`).join('')}</div></fieldset>
        <div class="field"><label class="label" for="msg-text">Message</label><textarea class="input" id="msg-text" rows="5" maxlength="1000"${isSms ? ' aria-describedby="msg-count"' : ''}>${esc(tpl.text)}</textarea>${isSms ? '<span class="hint" id="msg-count" aria-live="polite"></span>' : ''}</div>
      </div>`,
      footer: `<button type="button" class="btn btn-secondary" data-modal-dismiss>Cancel</button><a class="btn btn-primary" id="msg-open" target="_blank" rel="noopener noreferrer" href="#">${icon(CHANNEL_META[channel].icon)}${esc(COPY.open)}</a>`
    });
    const m = entry.modal, ta = m.querySelector('#msg-text'), openBtn = m.querySelector('#msg-open');
    const count = m.querySelector('#msg-count');
    const sync = () => {
      openBtn.href = communicationService.link(channel, b, ta.value, tpl.subject);
      if (count) { const n = ta.value.length, parts = Math.max(1, Math.ceil(n / SMS_SEGMENT)); count.textContent = `${n} characters · ${parts} SMS${parts > 1 ? ' (sent as ' + parts + ' parts)' : ''}`; }
    };
    sync();
    m.addEventListener('change', e => { if (e.target.name === 'tpl') { tpl = tpls.find(t => t.id === e.target.value); ta.value = tpl.text; edited = false; sync(); } });
    ta.addEventListener('input', () => { edited = true; sync(); });
    openBtn.addEventListener('click', e => {
      if (!ta.value.trim()) { e.preventDefault(); formAlert(m.querySelector('.modal-body'), 'Write a message first.'); ta.focus(); return; }
      if (appState.simulateErrors) {
        // Communication link failed — recoverable: copy the text instead.
        e.preventDefault();
        formAlert(m.querySelector('.modal-body'), `Couldn't open ${esc(appName)}. Copy the message and send it from your phone. <button type="button" class="link" data-copy-msg>Copy message</button>`);
        return;
      }
      communicationService.record(id, channel, edited ? 'Custom message' : tpl.label);
      modalService.close(entry);
      uiService.refresh();
      toast.show('Logged: ' + communicationService.openedLabel(channel), { icon: CHANNEL_META[channel].icon });
    });
    m.addEventListener('click', e => {
      if (!e.target.closest('[data-copy-msg]')) return;
      const done = () => toast.show('Message copied', { icon: 'content_copy' });
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(ta.value).then(done, () => { ta.select(); });
      else { ta.select(); }
    });
  },

  /* ---------- Change host ---------- */
  changeHost(id) {
    const b = bookingService.view(id);
    const guard = versionGuard(id);
    const hosts = availabilityService.hosts();
    const current = b.v.hostId || '';
    const inSlot = hid => Object.values(db.visits).filter(v => v.id !== id && v.hostId === hid && v.date === b.v.date && v.time === b.v.time && ACTIVE_STATUSES.includes(v.status)).length;
    const opts = hosts.map(h => {
      const can = availabilityService.hostCanHost(h.id, b.v.date, null, b.v.time);
      const room = can.ok ? availabilityService.hostHasRoom(h.id, b.v.date, id, null, b.v.time) : { ok: true };
      const ok = { ok: can.ok && room.ok, reason: can.ok ? room.reason : can.reason };
      const n = inSlot(h.id);
      const load = room.max ? ' · ' + room.n + ' of ' + room.max + ' visits that day' : '';
      return `<label class="radio-card"${ok.ok ? '' : ' style="opacity:.55"'}><input type="radio" name="host" value="${h.id}"${h.id === current ? ' checked' : ''}${ok.ok ? '' : ' disabled'}>
        <span class="avatar" aria-hidden="true">${initials(h.name)}</span><span style="min-width:0"><b style="font-weight:600">${esc(h.name)}</b><small>${esc(ok.ok ? h.role + (n ? ' · ' + n + ' other ' + plural(n, 'family', 'families') + ' at this time' : '') + load : ok.reason)}</small></span></label>`;
    }).join('');
    const entry = modalService.open({
      title: b.v.hostId ? 'Change host' : 'Assign a host', subtitle: `${b.p.name} · ${dateUtil.fmt(b.v.date)}, ${dateUtil.time(b.v.time)}`,
      body: `<form class="stack" id="ch-form" novalidate>
        <div class="alert" data-form-alert hidden></div>
        <fieldset style="border:0;padding:0;margin:0"><legend class="sr-only">Host</legend><div class="stack-sm">${opts}
          <label class="radio-card"><input type="radio" name="host" value=""${current ? '' : ' checked'}>${icon('person_off')}<span>Leave unassigned</span></label></div></fieldset>
        <div class="alert alert-warn" id="ch-warn" hidden>${icon('warning')}<span>No one will be ready to greet this family. Assign someone before the visit.</span></div>
      </form>`,
      footer: `<button type="button" class="btn btn-secondary" data-modal-dismiss>Cancel</button><button type="submit" form="ch-form" class="btn btn-primary" id="ch-submit">${icon('check')}Save host</button>`
    });
    const m = entry.modal, f = m.querySelector('#ch-form'), btn = m.querySelector('#ch-submit');
    const firstRadio = f.querySelector('input[name="host"]:checked') || f.querySelector('input[name="host"]:not([disabled])');
    if (firstRadio) firstRadio.focus();
    const sync = () => {
      const val = (f.querySelector('input[name="host"]:checked') || {}).value || '';
      const removing = !!current && !val;
      m.querySelector('#ch-warn').hidden = !removing;
      btn.className = 'btn ' + (removing ? 'btn-danger' : 'btn-primary');
      btn.innerHTML = removing ? icon('person_remove') + 'Remove host' : icon('check') + 'Save host';
    };
    f.addEventListener('change', sync);
    f.addEventListener('submit', e => {
      e.preventDefault();
      const val = (f.querySelector('input[name="host"]:checked') || {}).value || '';
      if (val === current) { modalService.close(entry); return; }
      runMutation({
        btn, busyLabel: 'Saving…', modal: true, ...guard,
        fn: () => bookingService.setHost(id, val),
        onSuccess: () => {
          if (!val) modalService.close(entry);
          uiService.refresh();
          toast.show(val ? `${hostName(val)} will host ${b.p.name}` : 'Host removed', { icon: 'badge' });
          if (val) remindAfterStatus(id, 'host', entry);   // a host assigned or changed → tell the parent, in the same popup
        },
        onError: err => formAlert(f, esc(errorText(err, 'STATUS_SAVE')) + ' <button type="submit" class="link" form="ch-form">Try again</button>')
      });
    });
  },

  /* ---------- Bulk: assign one host to many visits ---------- */
  bulkHost(ids) {
    const items = ids.map(id => bookingService.view(id)).filter(b => b && bookingService.canAssignHost(b.v));
    if (!items.length) return;
    const hosts = availabilityService.hosts().filter(h => h.active);
    // "Best free host for each" — every family gets whoever is free at their own time (day's default host first).
    const AUTO = '__auto';
    const nAuto = items.filter(b => availabilityService.pickHost(b.v, null, b.v.hostId)).length;
    const auto = `<label class="radio-card"${nAuto ? '' : ' style="opacity:.55"'}><input type="radio" name="bh" value="${AUTO}"${nAuto ? ' checked' : ' disabled'}>
        <span class="avatar" aria-hidden="true">${icon('auto_awesome')}</span><span style="min-width:0"><b style="font-weight:600">Best free host for each family</b><small>Picks someone free at each family’s own time · works for ${nAuto} of ${items.length}</small></span></label>`;
    const opts = auto + hosts.map((h, i) => {
      const ok = items.filter(b => availabilityService.hostCanHost(h.id, b.v.date, null, b.v.time).ok && availabilityService.hostHasRoom(h.id, b.v.date, b.id, null, b.v.time).ok).length;
      return `<label class="radio-card"${ok ? '' : ' style="opacity:.55"'}><input type="radio" name="bh" value="${h.id}"${ok ? '' : ' disabled'}${i === 0 && ok && !nAuto ? ' checked' : ''}>
        <span class="avatar" aria-hidden="true">${initials(h.name)}</span><span style="min-width:0"><b style="font-weight:600">${esc(h.name)}</b><small>${esc(h.role)} · available for ${ok} of ${items.length}</small></span></label>`;
    }).join('');
    const entry = modalService.open({
      title: 'Assign a host', subtitle: `${items.length} selected ${plural(items.length, 'visit', 'visits')}`,
      body: `<form class="stack" id="bh-form" novalidate>
        <div class="alert" data-form-alert hidden></div>
        <fieldset style="border:0;padding:0;margin:0"><legend class="sr-only">Host</legend><div class="stack-sm">${opts}</div></fieldset>
        <p class="hint">${icon('info')} Visits the host can’t cover (day off, leave, outside their hours, daily limit reached) are left unchanged and stay selected so you can pick someone else.</p>
      </form>`,
      footer: `<button type="button" class="btn btn-secondary" data-modal-dismiss>Cancel</button><button type="submit" form="bh-form" class="btn btn-primary" id="bh-submit">${icon('check')}Assign host</button>`
    });
    const m = entry.modal, f = m.querySelector('#bh-form');
    const first = f.querySelector('input[name="bh"]:checked'); if (first) first.focus();
    f.addEventListener('submit', e => {
      e.preventDefault();
      const hid = (f.querySelector('input[name="bh"]:checked') || {}).value;
      if (!hid) return formAlert(f, 'Choose a host.');
      modalService.close(entry);
      const fn = hid !== AUTO ? id => bookingService.setHost(id, hid) : id => {
        const v = db.visits[id], pick = availabilityService.pickHost(v, null, v.hostId);
        if (!pick) throw { code: 'HOST_UNAVAILABLE', message: 'No other host is free at that time.' };
        return bookingService.setHost(id, pick);
      };
      bulkMutate({ ids: items.map(b => b.id), busyLabel: 'Assigning…', fn,
        done: (ok, failed) => {
          const text = hid === AUTO ? `${ok.length} ${plural(ok.length, 'family', 'families')} got a free host` : `${hostName(hid)} will host ${ok.length} ${plural(ok.length, 'visit', 'visits')}`;
          if (failed.length) return bulkSummary(ok, failed, text, 'assigned', () => dialogs.bulkHost(failed.map(x => x.id)));
          toast.show(text, { icon: 'badge' });
          announce(text);
          if (ok.length) remindAfterStatus(ok, 'host');   // hosts assigned or changed → tell the parents
        } });
    });
  },
  /* ---------- Bulk: reschedule many visits to one new date ----------
     Each family keeps their time if it is free on the new date, otherwise gets
     the nearest free time; by default only times someone can host. The preview
     shows every move before anything changes. */
  bulkReschedule(ids) {
    authz.require(PERM.RESCHEDULE);
    const items = ids.map(id => bookingService.view(id)).filter(b => b && bookingService.canReschedule(b.v))
      .sort((a, b) => (a.v.date + a.v.time).localeCompare(b.v.date + b.v.time));
    if (!items.length) return;
    const st = { date: availabilityService.nextHostedDate(clock.today()), needHost: true, plan: [] };
    const entry = modalService.open({
      title: 'Reschedule visits', subtitle: `${items.length} selected ${plural(items.length, 'family', 'families')}`, size: 'lg',
      body: `<form class="stack" id="brs-form" novalidate>
        <div class="alert" data-form-alert hidden></div>
        <div class="grid-2">
          <div class="field"><label class="label" for="brs-date">Move to <span class="req" aria-hidden="true">*</span></label><input class="input" type="date" id="brs-date" data-field="date" min="${clock.today()}" value="${st.date}">${errSlot('date')}</div>
          <div class="field"><label class="label" for="brs-reason">Reason <span class="opt">(optional)</span></label><input class="input" id="brs-reason" maxlength="120" placeholder="e.g. Host on leave"></div>
        </div>
        <label class="check"><input type="checkbox" id="brs-host" checked> <span>Only times someone can host <span class="sub">Each family goes to a time with a free host, and that host is assigned.</span></span></label>
        <label class="check"><input type="checkbox" id="brs-reconfirm" checked> <span>Ask parents to reconfirm the new time <span class="sub">Visits go back to “Visit Requested”. Untick if the parents already agreed.</span></span></label>
        <div class="field"><span class="label" id="brs-sum"></span><ul class="br-list" id="brs-list" aria-labelledby="brs-sum"></ul></div>
      </form>`,
      footer: `<button type="button" class="btn btn-secondary" data-modal-dismiss>Cancel</button><button type="submit" form="brs-form" class="btn btn-primary" id="brs-submit">${icon('update')}Reschedule</button>`
    });
    const m = entry.modal, f = m.querySelector('#brs-form'), submitBtn = m.querySelector('#brs-submit');
    const draw = () => {
      st.plan = st.date ? availabilityService.planMoves(items.map(b => b.v), st.date, st.needHost) : [];
      const byId = {}; st.plan.forEach(p => { byId[p.id] = p; });
      const ready = st.plan.filter(p => p.time).length;
      m.querySelector('#brs-list').innerHTML = items.map(b => {
        const p = byId[b.id] || { time: '', reason: 'Choose a date' };
        const to = p.time ? `<span class="badge tone-green">${icon('arrow_forward')}${esc(dateUtil.short(st.date))}, ${dateUtil.time(p.time)}</span>` : `<span class="badge tone-amber">${icon('block')}${esc(p.reason)}</span>`;
        return `<li><div style="min-width:0;flex:1"><b style="font-weight:600">${esc(b.p.name)}</b><span class="sub">${esc(b.c.name)} · now ${esc(dateUtil.short(b.v.date))}, ${dateUtil.time(b.v.time)} · ${esc(b.host ? b.host.name : 'No host')}</span></div>${to}</li>`;
      }).join('');
      m.querySelector('#brs-sum').textContent = !st.date ? 'Choose a date' : `${ready} of ${items.length} can move to ${dateUtil.fmt(st.date)}` + (ready < items.length ? ' · the rest stay selected so you can pick another date' : '');
      submitBtn.disabled = !ready;
      submitBtn.innerHTML = icon('update') + (ready ? `Reschedule ${ready}` : 'Reschedule');
    };
    m.querySelector('#brs-date').addEventListener('change', e => { st.date = e.target.value; showErrors(f, {}); draw(); });
    m.querySelector('#brs-host').addEventListener('change', e => { st.needHost = e.target.checked; draw(); });
    draw();
    m.querySelector('#brs-date').focus();
    f.addEventListener('submit', e => {
      e.preventDefault();
      if (!st.date) return showErrors(f, { date: 'Choose a date.' });
      const moves = st.plan.filter(p => p.time), stay = st.plan.filter(p => !p.time).map(p => p.id);
      if (!moves.length) return;
      const reconfirm = m.querySelector('#brs-reconfirm').checked, reason = m.querySelector('#brs-reason').value.trim(), needHost = st.needHost;
      const timeFor = {}; moves.forEach(p => { timeFor[p.id] = p.time; });
      modalService.close(entry);
      bulkMutate({
        ids: moves.map(p => p.id), busyLabel: 'Rescheduling…', failCode: 'SLOT_TAKEN',
        fn: id => {
          const v = bookingService.reschedule(id, { date: st.date, time: timeFor[id], reconfirm, reason });
          if (needHost && !v.hostId && authz.can(PERM.ASSIGN_HOST)) { const h = availabilityService.pickHost(v); if (h) bookingService.setHost(id, h); }
          return v;
        },
        done: (ok, failed) => {
          appState.selected = failed.map(x => x.id).concat(stay);   // anything not moved stays ticked
          uiService.refresh();
          const text = `${ok.length} ${plural(ok.length, 'visit', 'visits')} moved to ${dateUtil.fmt(st.date)}` + (stay.length ? ` · ${stay.length} had no free time and ${plural(stay.length, 'is', 'are')} still selected` : '');
          if (failed.length) return bulkSummary(ok, failed, text, 'rescheduled', () => dialogs.bulkReschedule(failed.map(x => x.id)));
          toast.show(text, Object.assign({ icon: 'event_repeat' }, ok.length && authz.can(PERM.CONTACT) ? { action: { label: 'Tell parents', run: () => dialogs.bulkRemind(ok, reconfirm ? 'confirm' : 'reminder') } } : {}));
          announce(text);
        }
      });
    });
  },
  /* ---------- Bulk: personalised reminders, one family at a time ----------
     Without a messaging provider the browser can open only one message at a time,
     so each family gets its own Open button and is logged as "opened", never "sent".
     PRODUCTION API REQUIRED: POST /v1/visits/bulk/communications sends them in one go. */
  bulkRemind(ids, tplId, opts) {
    const o = opts || {};
    const items = ids.map(id => bookingService.view(id)).filter(Boolean);
    if (!items.length) return;
    const tplOpts = { host: tplId === 'host' };
    const tplLabels = communicationService.templates(items[0], null, tplOpts).map(t => ({ id: t.id, label: t.label }));
    const wanted = tplId || communicationService.defaultTemplate(items[0]);
    // Send by: each parent's own channel first, then App chat · WhatsApp · SMS · Email, and Call.
    const SEND_BY = [{ id: 'auto', label: 'Each parent’s channel', icon: 'account_circle' }].concat([CHANNEL.CHAT, CHANNEL.WHATSAPP, CHANNEL.SMS, CHANNEL.EMAIL, CHANNEL.CALL].map(c => ({ id: c, label: CHANNEL_META[c].label, icon: CHANNEL_META[c].icon })));
    const st = { channel: 'auto', tpl: tplLabels.some(t => t.id === wanted) ? wanted : tplLabels[0].id, opened: {} };
    const entry = modalService.open({
      replace: o.replace,
      title: tplId === 'host' ? `Tell the ${plural(items.length, 'parent', 'parents')} about the host` : o.afterStatus ? `Tell the ${plural(items.length, 'parent', 'parents')} · ${STATUS_META[items[0].v.status].label}` : 'Send reminder', subtitle: `${items.length} selected ${plural(items.length, 'family', 'families')}`, size: 'lg',
      body: `<div class="stack">
        <fieldset class="field" style="border:0;padding:0;margin:0"><legend class="label" style="margin-bottom:8px">Send by</legend>
          <div class="seg" role="group" aria-label="Send by" id="br-ch">${SEND_BY.map(c => `<button type="button" data-ch="${c.id}" aria-pressed="${c.id === st.channel}">${icon(c.icon)}${esc(c.label)}</button>`).join('')}</div></fieldset>
        <fieldset class="field" id="br-tpl-wrap" style="border:0;padding:0;margin:0"><legend class="label" style="margin-bottom:8px">Template</legend>
          <div class="radio-cards">${tplLabels.map(t => `<label class="radio-card"><input type="radio" name="br-tpl" value="${t.id}"${t.id === st.tpl ? ' checked' : ''}>${esc(t.label)}</label>`).join('')}</div></fieldset>
        <div class="field" id="br-preview-wrap"><span class="label">Preview · personalised for each family</span><p class="br-preview" id="br-preview"></p></div>
        <div class="field"><span class="label" id="br-progress"></span><ul class="br-list" id="br-list" aria-labelledby="br-progress"></ul></div>
      </div>`,
      footer: `<button type="button" class="btn btn-secondary" data-modal-dismiss>${o.afterStatus ? 'Skip' : 'Cancel'}</button><button type="button" class="btn btn-primary" id="br-send">${icon('send')}Send to ${items.length}</button>`
    });
    const m = entry.modal;
    const effective = b => st.channel === 'auto' ? communicationService.resolve(b) : st.channel;
    const draw = () => {
      m.querySelectorAll('#br-ch [data-ch]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.ch === st.channel)));
      // Call: no template or preview — each row opens the phone dialler and is logged as a call.
      const isCall = st.channel === CHANNEL.CALL;
      m.querySelector('#br-tpl-wrap').hidden = isCall; m.querySelector('#br-preview-wrap').hidden = isCall;
      // A family whose status doesn't offer the chosen template gets the General check-in instead of an empty message.
      const pick = (b, ch) => { const list = communicationService.templates(b, ch, tplOpts); return list.find(t => t.id === st.tpl) || list.find(t => t.id === 'checkin') || {}; };
      const text = (b, ch) => pick(b, ch).text || '';
      const previewCh = effective(items[0]) === CHANNEL.CALL ? CHANNEL.WHATSAPP : effective(items[0]);
      m.querySelector('#br-preview').textContent = text(items[0], previewCh);
      const rows = items.map(b => {
        const ch = effective(b), meta = CHANNEL_META[ch], c = communicationService.channelInfo(b, ch);
        const k = b.id + ':' + ch, done = st.opened[k];
        const doneLabel = ch === CHANNEL.CALL ? 'Called' : ch === CHANNEL.CHAT ? 'Sent' : 'Opened';
        const action = !c.available ? `<span class="muted">${esc(c.reason)}</span>`
          : done ? `<span class="badge tone-green">${icon('check')}${doneLabel}</span>`
          : ch === CHANNEL.CALL ? `<a class="btn btn-secondary btn-sm" href="${esc(phone.tel(b.p.mobile))}" data-br-open="${b.id}" data-br-ch="${ch}">${icon('call')}Call</a>`
          : ch === CHANNEL.CHAT ? `<button type="button" class="btn btn-secondary btn-sm" data-br-open="${b.id}" data-br-ch="${ch}">${icon('chat')}Send</button>`
          : `<a class="btn btn-secondary btn-sm" target="_blank" rel="noopener noreferrer" href="${esc(communicationService.link(ch, b, text(b, ch), pick(b, ch).subject))}" data-br-open="${b.id}" data-br-ch="${ch}">${icon(meta.icon)}Open</a>`;
        // With "Each parent's channel" every row says which channel it resolved to.
        const via = st.channel === 'auto' ? `<span class="badge tone-neutral">${icon(meta.icon)}${esc(meta.label)}</span>` : '';
        return `<li><div style="min-width:0;flex:1"><b style="font-weight:600">${esc(b.p.name)}</b><span class="sub">${c.target ? esc(c.target) + " · " : ""}${esc(this_when(b))}</span></div>${via}${action}</li>`;
      }).join('');
      m.querySelector('#br-list').innerHTML = rows;
      const reach = items.filter(b => communicationService.channelInfo(b, effective(b)).available).length;
      const doneN = items.filter(b => st.opened[b.id + ':' + effective(b)]).length;
      const word = isCall ? 'called' : st.channel === CHANNEL.CHAT ? 'sent' : st.channel === 'auto' ? 'done' : 'opened';
      const missing = items.length - reach;
      m.querySelector('#br-progress').textContent = `${doneN} of ${reach} ${word}${missing ? ` · ${missing} can’t be reached${st.channel === 'auto' ? '' : ' by ' + CHANNEL_META[st.channel].label}` : ''}`;
      // "Send to N": every reachable family not yet done, in one go (calls are made one at a time).
      const sendBtn = m.querySelector('#br-send'), pending = items.filter(b => communicationService.channelInfo(b, effective(b)).available && !st.opened[b.id + ':' + effective(b)]);
      sendBtn.innerHTML = `${icon('send')}Send to ${pending.length}`;
      sendBtn.disabled = isCall || !pending.length;
      sendBtn.title = isCall ? 'Calls are made one family at a time — use the Call buttons' : '';
    };
    const this_when = b => uiService.whenText(b.v);
    m.addEventListener('click', e => {
      const ch = e.target.closest('[data-ch]');
      if (ch) { st.channel = ch.dataset.ch; draw(); return; }
      if (e.target.closest('#br-send')) {
        const pending = items.filter(b => communicationService.channelInfo(b, effective(b)).available && !st.opened[b.id + ':' + effective(b)]);
        if (!pending.length) return;
        if (appState.simulateErrors) { toast.show('Couldn’t send. Try again.', { error: true }); return; }
        const label = (tplLabels.find(t => t.id === st.tpl) || {}).label;
        let sent = 0;
        pending.forEach(b => { const c = effective(b); try { communicationService.record(b.id, c, label, { sent: true }); st.opened[b.id + ':' + c] = true; sent++; } catch (err) { /* no permission — left as is */ } });
        modalService.close(entry);
        uiService.refresh();
        const t = `Sent to ${sent} ${plural(sent, 'family', 'families')}${st.channel === 'auto' ? '' : ' via ' + CHANNEL_META[st.channel].label}`;
        toast.show(t, { icon: 'send' }); announce(t);
        return;
      }
      const open = e.target.closest('[data-br-open]');
      if (open) {
        const ch = open.dataset.brCh;
        if (appState.simulateErrors) { e.preventDefault(); toast.show(`Couldn't ${ch === CHANNEL.CHAT ? 'send in the app' : 'open ' + CHANNEL_META[ch].label}. Try again.`, { error: true }); return; }
        const id = open.dataset.brOpen;
        try { communicationService.record(id, ch, ch === CHANNEL.CALL ? '' : (tplLabels.find(t => t.id === st.tpl) || {}).label); } catch (err) { return; }
        st.opened[id + ':' + ch] = true;
        setTimeout(draw, 0);
      }
    });
    m.addEventListener('change', e => { if (e.target.name === 'br-tpl') { st.tpl = e.target.value; draw(); } });
    draw();
    entry.onClose = () => uiService.refresh();
  },

function downloadCsv(list) {
  const header = ['Booking ID', 'Enquiry ID', 'Parent', 'Mobile', 'Email', 'Child', 'Grade', 'Visit date', 'Visit time', 'Status', 'Host', 'Outcome', 'Follow-up date', 'Application'];
  const rows = list.map(b => [b.v.id, b.e.id, b.p.name, phone.display(b.p.mobile), b.p.email, b.c.name, b.e.grade, b.v.date, dateUtil.time(b.v.time),
    STATUS_META[b.v.status].label, b.host ? b.host.name : 'Unassigned', b.v.outcome ? OUTCOME_LABEL[b.v.outcome.value] : '', b.v.followUp ? b.v.followUp.date : '', APP_STATE_META[b.a.state].label]);
  // Neutralise spreadsheet formula injection (cells starting with = + - @).
  const cell = c => { let s = String(c == null ? '' : c); if (/^[=+\-@]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
  const csv = [header].concat(rows).map(r => r.map(cell).join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = 'booked-visits-' + clock.today() + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

   write returns 409 CONFLICT (demonstrated by api.request). */

  ['GET',   '/v1/visits/{id}',                   null,             'Visit detail with parent, child, enquiry, application and activity.', '404'],
  ['GET',   '/v1/enquiries/search?q=',           PERM.CREATE,      'Find parent / enquiry by mobile, name or enquiry ID (New Booking step 1).', ''],
  ['POST',  '/v1/visits',                        PERM.CREATE,      'Create a visit: quick booking (creates parent, child, enquiry) or for an existing enquiry. No OTP.', '409 SLOT_TAKEN · 409 DUPLICATE · 422 INVALID'],
  ['POST',  '/v1/visits/{id}/confirm',           PERM.CONFIRM,     'Visit Requested → Visit / Revisit Scheduled.', '409 CONFLICT · 422 INVALID_TRANSITION'],
  ['POST',  '/v1/visits/{id}/arrive',            PERM.ARRIVE,      'Records arrival (arrivedAt/By) on a Visit / Revisit Scheduled visit; the status does not change. Visit Requested on the visit day → Visit / Revisit Scheduled first (two audit events).', '409 CONFLICT · 422 TOO_EARLY'],

  ['POST',  '/v1/visits/bulk',                   PERM.CONFIRM,     'Bulk confirm or assign host for up to 100 visits. Each item carries its version; the response lists success or error per item (partial success allowed).', '207 MULTI_STATUS · 409 per item'],

  ['GET',   '/v1/visit-slots?date=',             null,             'Slots with booked / capacity for the picker and calendar. UX guidance only.', ''],

/* Same channels, same order, as the on-screen contact controls. Unavailable ones stay listed, disabled, with the reason. */
function contactMenuItems(b, withCall) {

/* Next action = the status moves allowed from the visit's current status.
   Visit Requested → Scheduled / Cancelled / Declined · Scheduled → Completed / Cancelled / Declined / Missed ·
   Completed, Missed, Declined, Cancelled → Visit Requested. Nothing else is ever offered. */
function statusMoves(b) { return STATUS_CHANGE_OPTIONS.filter(o => bookingService.canChangeStatus(b.v, o.to)); }
/* The forward, positive move is the Next Action button; everything else goes to the ⋯ menu. */
const POSITIVE_MOVES = Object.freeze(['confirmed', 'completed', 'pending']);
function primaryMove(b) { return statusMoves(b).find(o => POSITIVE_MOVES.includes(o.to)) || null; }
function secondaryMoves(b) { const pm = primaryMove(b); return statusMoves(b).filter(o => o !== pm); }
function statusMovePerm(to) {
  return ({ confirmed: PERM.CONFIRM, completed: PERM.COMPLETE, cancelled: PERM.CANCEL, no_show: PERM.NO_SHOW, declined: PERM.CONFIRM, pending: PERM.CONFIRM })[to];
}
function rowMenuItems(b, inDrawer) {
  const v = b.v, can = p => authz.can(p), items = [];
  if (!inDrawer) items.push({ label: 'Open details', icon: 'open_in_new', run: () => drawerService.open(b.id) });
  if (can(PERM.CONTACT)) {
    items.push('-');
    contactMenuItems(b, true).forEach(it => items.push(it));
  }
  items.push('-');
  if (bookingService.canArrive(v) && can(PERM.ARRIVE)) items.push({ label: 'Mark arrived', icon: 'how_to_reg', run: () => actionsRun('arrive', b.id) });
  if (v.status === STATUS.COMPLETED && can(PERM.COMPLETE)) items.push({ label: v.outcome ? 'Update outcome' : 'Record outcome', icon: 'flag', run: () => dialogs.complete(b.id, 'outcome') });
  if (bookingService.canReschedule(v) && can(PERM.RESCHEDULE)) items.push({ label: 'Reschedule', icon: 'update', run: () => dialogs.reschedule(b.id) });
  if (bookingService.canAssignHost(v) && can(PERM.ASSIGN_HOST)) items.push({ label: b.host ? 'Change host' : 'Assign host', icon: 'badge', run: () => dialogs.changeHost(b.id) });
  if ([STATUS.COMPLETED, STATUS.NO_SHOW].includes(v.status) && can(PERM.FOLLOW_UP)) items.push({ label: v.followUp && v.followUp.status === FOLLOWUP_STATUS.OPEN ? 'Update follow-up' : 'Plan follow-up', icon: 'phone_callback', run: () => dialogs.followUp(b.id) });
  if (v.hostNotice && ACTIVE_STATUSES.includes(v.status) && can(PERM.CONTACT)) items.push({ label: 'Host update: mark as told', icon: 'campaign', run: () => actionsRun('host-told', b.id) });
  if (can(PERM.NOTE)) items.push({ label: 'Add note', icon: 'sticky_note_2', run: () => { drawerService.open(b.id); drawerService.focusNote(); } });
  if (v.status === STATUS.CANCELLED && can(PERM.CREATE)) items.push({ label: 'Create replacement booking', icon: 'event_repeat', run: () => dialogs.newBooking({ enquiryId: b.e.id, replacesVisitId: b.id }) });
  // Remaining allowed status moves (the positive one is the row's Next Action button).
  const others = secondaryMoves(b).filter(o => can(statusMovePerm(o.to)));
  if (others.length) { items.push('-'); items.push({ heading: 'Change status to' }); others.forEach(o => items.push({ label: o.label, icon: o.icon, danger: o.to === STATUS.CANCELLED, run: () => actionsRun('move:' + o.to, b.id) })); }
  while (items.length && items[items.length - 1] === '-') items.pop();
  return items;
}

/* One named handler per workflow step. */
function actionsRun(act, id, el) {
  const b = bookingService.view(id);
  if (!b) return;
  const focus = focusDescriptor(el) || { action: 'primary', vid: id };
  const name = b.p.name;
  if (act.startsWith('move:')) {
    const to = act.slice(5);
    if (!bookingService.canChangeStatus(b.v, to)) { toast.show(`A ${STATUS_META[b.v.status].label} visit can’t be changed to ${STATUS_META[to].label}.`, { error: true }); return; }
    switch (to) {
      case STATUS.CONFIRMED: return actionsRun('confirm', id, el);           // logs the schedule/confirm event
      case STATUS.COMPLETED: return dialogs.complete(id);                    // outcome is required
      case STATUS.CANCELLED: return dialogs.cancel(id);                      // reason is required
      case STATUS.NO_SHOW: if (bookingService.canNoShow(b.v)) return dialogs.noShow(id); break;
    }
    return runMutation({ btn: el, visitId: id, busyLabel: 'Updating…', fn: () => bookingService.changeStatus(id, to),
      onSuccess: () => { uiService.refresh(focus); toast.show(`${name} · ${STATUS_META[to].label}`, { icon: STATUS_META[to].icon }); announce('Status changed to ' + STATUS_META[to].label); remindAfterStatus(id); },
      retry: () => actionsRun(act, id) });
  }
  switch (act) {
    case 'confirm':
      return runMutation({ btn: el, visitId: id, busyLabel: 'Updating…', fn: () => bookingService.confirm(id),
        onSuccess: () => { uiService.refresh(focus); toast.show(`${name}'s visit is scheduled`, { icon: 'event_available' }); announce('Visit scheduled'); remindAfterStatus(id); },
        retry: () => actionsRun('confirm', id) });
    case 'host-told':
      return runMutation({ btn: el, visitId: id, busyLabel: 'Saving…', fn: () => bookingService.markHostTold(id),
        onSuccess: () => { uiService.refresh(focus); toast.show(`${name} told about the host`, { icon: 'campaign' }); announce('Host update marked as told'); },
        retry: () => actionsRun('host-told', id) });
    case 'arrive':
      return runMutation({ btn: el, visitId: id, busyLabel: 'Updating…', fn: () => bookingService.arrive(id),
        onSuccess: v => { uiService.refresh(focus); toast.show(`${name} arrived at ${dateUtil.clockTime(v.arrivedAt)}`, { icon: 'how_to_reg', action: authz.can(PERM.NOTE) ? { label: 'Add note', run: () => { drawerService.open(id); drawerService.focusNote(); } } : null }); announce('Marked arrived'); },
        retry: () => actionsRun('arrive', id) });
    case 'remind': return dialogs.message(id, CHANNEL.WHATSAPP, 'reminder');
    case 'complete': return dialogs.complete(id);
    case 'outcome': return dialogs.complete(id, 'outcome');
    case 'followup': return dialogs.followUp(id);
    case 'no_show': return dialogs.noShow(id);
    case 'reschedule': return dialogs.reschedule(id);
    case 'rebook': return dialogs.newBooking({ enquiryId: b.e.id, replacesVisitId: id });
    default: return drawerService.open(id);
  }
}

/* ---- Realtime availability ----
   There is no Save button: every valid edit to weekly hours, hosts, blocked
   dates or exceptions goes live after a short pause (a burst of clicks is one
   save), and every other open window of this admin gets it straight away.
   PRODUCTION API REQUIRED: PUT /visit-availability, then a server push
   (WebSocket / SSE) to every signed-in admin instead of BroadcastChannel. */
const AV_AUTOSAVE_MS = 400;
let avSaveTimer = null;
function scheduleAvSave() {
  clearTimeout(avSaveTimer);
  appState.avSaveState = 'pending';
  paintAvStatus();
  avSaveTimer = setTimeout(publishAvailability, AV_AUTOSAVE_MS);
}
function avStatusHtml() {
  const s = appState.avSaveState || 'saved';
  if (s === 'pending' || s === 'saving') return `<span class="badge tone-blue">${icon('sync')}Saving…</span>`;
  if (s === 'invalid') return `<span class="badge tone-amber">${icon('error')}Not saved — fix the highlighted days</span>`;
  if (s === 'error') return `<span class="badge tone-red">${icon('cloud_off')}Couldn’t save</span> <button type="button" class="btn btn-secondary btn-sm" data-action="av-save">${icon('refresh')}Try again</button>`;
  if (s === 'review') { const k = (appState.avReview || []).length; return `<span class="badge tone-amber">${icon('warning')}Not saved — ${k} ${plural(k, 'booking', 'bookings')} affected</span> <button type="button" class="btn btn-primary btn-sm" data-action="av-review">Review &amp; apply</button> <button type="button" class="btn btn-secondary btn-sm" data-action="av-undo">Undo</button>`; }
  if (s === 'conflict') return `<span class="badge tone-amber">${icon('sync_problem')}Changed in another window</span> <button type="button" class="btn btn-primary btn-sm" data-action="av-reload">Load their version</button> <button type="button" class="btn btn-secondary btn-sm" data-action="av-keep">Keep my edit</button>`;
  return `<span class="badge tone-green">${icon('cloud_done')}Live${appState.avSavedAt ? ' · saved ' + esc(dateUtil.clockTime(appState.avSavedAt)) : ''}</span>`;
}
/* Update only the status badge, so typing and focus are never disturbed. */
function paintAvStatus() {
  const el = document.getElementById('av-status');

  if (dot) dot.hidden = !availabilityService.isDirty();

/* Re-render but keep the caret where it was in a text box. */
function renderKeepingFocus() {
  const a = document.activeElement, id = a && a.id;
  const sel = a && typeof a.selectionStart === 'number' ? [a.selectionStart, a.selectionEnd] : null;
  uiService.render(id ? { focusId: id } : {});
  const b = id && document.getElementById(id);
  if (b && sel && typeof b.setSelectionRange === 'function') { try { b.setSelectionRange(sel[0], sel[1]); } catch (e) { /* input type without a caret */ } }
