<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Super CRM &middot; SuperSchools Console</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="../../styles/tailwind-config.js"></script>
  <link rel="stylesheet" href="../../styles/dashboard.css" />
</head>
<body class="bg-slate-200 text-slate-900 min-h-screen" x-data="schoolConsole({ module: 'admissions', sub: 'admissions' })">
  <div id="routeLoader" class="route-loader" role="status" aria-live="polite" aria-label="Loading">
    <div class="route-loader__box"><div class="route-loader__spinner"></div><div class="route-loader__text">Loading&hellip;</div></div>
  </div>
  <div class="ss-app min-h-screen h-screen w-full flex bg-mobile-background md:bg-background relative">
    <div data-shell="sidebar"></div>
    <main class="flex-1 flex flex-col overflow-hidden bg-mobile-background md:bg-background">
      <div data-shell="header"></div>
      <section class="flex-1 custom-scrollbar overflow-y-auto" :class="isFullScreenPage ? 'pb-0' : 'pb-20 md:pb-0'">
        <div class="w-full" :class="isFullScreenPage ? 'min-h-full px-5 py-4 md:px-10 md:py-5 lg:px-[56px]' : 'px-5 py-5 md:px-10 md:py-6 lg:px-[56px] lg:py-8'">
          <div x-show="!isFullScreenPage" class="lg:hidden mb-4 relative">
            <input class="w-full pl-10 pr-4 py-3 bg-white border border-slate-200 rounded-2xl text-sm focus:ring-primary focus:border-primary text-slate-700 shadow-sm" placeholder="Search" type="text" x-model="search" />
            <span class="material-icons-outlined absolute left-3 text-slate-400 text-lg top-1/2 -translate-y-1/2">search</span>
          </div>
          <template x-if="activePage === 'admissions'">
            <div class="dashboard-root space-y-5">
              <div class="dashboard-action-row flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                <div class="min-w-0">
                  <div class="flex items-center gap-2 text-xs sm:text-sm font-medium text-slate-500 mb-3">
                    <button type="button" @click="setPage('school')" class="hover:text-primary transition-colors cursor-pointer">Home</button>
                    <span class="material-symbols-outlined text-[16px] text-slate-400">chevron_right</span>
                    <span class="text-slate-700">Admissions</span>
                  </div>
                  <h2 class="text-[22px] md:text-[26px] leading-tight font-semibold tracking-[-0.035em] text-slate-900">Admissions Dashboard</h2>
                </div>
                <button type="button" @click="window.location.href='enquiries.html'" class="rounded-full bg-primary hover:bg-primary-hover text-white px-5 py-2 text-sm font-medium shadow-[0_10px_22px_rgba(40,76,165,.18)] inline-flex items-center gap-2 transition-all hover:-translate-y-0.5">View All Admissions <span class="material-symbols-outlined text-[18px]">arrow_forward</span></button>
              </div>

              <div class="dashboard-top-grid grid grid-cols-1 lg:grid-cols-[minmax(235px,0.9fr)_minmax(0,1.35fr)_minmax(230px,0.8fr)] gap-4 items-stretch">
                <section class="dashboard-today-section grid grid-rows-2 gap-3 h-full">
                  <article class="rounded-[22px] bg-primary h-full text-white border border-primary shadow-[0_12px_26px_rgba(40,76,165,.18)] min-h-[128px] today-card flex flex-col md:flex-row md:items-center md:justify-between gap-3 dash-card-hover hover:bg-primary-hover cursor-pointer">
                    <div class="order-2 md:order-1 flex flex-col items-center md:items-start text-center md:text-left gap-2 min-w-0">
                      <div class="flex items-center justify-center md:justify-start gap-3 min-w-0"><div class="w-11 h-11 rounded-[14px] bg-white border border-[#dce7ff] text-primary flex items-center justify-center flex-shrink-0"><span class="material-symbols-outlined text-[22px]">groups</span></div><p class="text-sm font-medium text-white">Today's Enquiries</p></div>
                      <p class="text-xs leading-relaxed text-[#dfe8ff]">New parent enquiries.</p>
                    </div>
                    <div class="order-1 md:order-2 w-full md:w-auto text-center md:text-right md:ml-auto"><p class="text-[36px] leading-none font-semibold tracking-[-0.045em] tabular-nums">14</p></div>
                  </article>
                  <article class="rounded-[22px] bg-[#F8C777] h-full text-slate-950 border border-[#F0B45F] shadow-[0_12px_26px_rgba(247,178,75,.18)] min-h-[128px] today-card flex flex-col md:flex-row md:items-center md:justify-between gap-3 dash-card-hover hover:bg-[#F5BB61] cursor-pointer">
                    <div class="order-2 md:order-1 flex flex-col items-center md:items-start text-center md:text-left gap-2 min-w-0">
                      <div class="flex items-center justify-center md:justify-start gap-3 min-w-0"><div class="w-11 h-11 rounded-[14px] bg-white border border-orange-100 text-orange-600 flex items-center justify-center flex-shrink-0"><span class="material-symbols-outlined text-[22px]">event_available</span></div><p class="text-sm font-semibold text-slate-950">Today's Tours Scheduled</p></div>
                      <p class="text-xs leading-relaxed text-slate-800">Families visiting today.</p>
                    </div>
                    <div class="order-1 md:order-2 w-full md:w-auto text-center md:text-right md:ml-auto"><p class="text-[36px] leading-none font-semibold tracking-[-0.045em] tabular-nums text-slate-950">6</p></div>
                  </article>
                </section>
                <section class="dashboard-pending-section section-card p-5 bg-gradient-to-br from-white to-orange-50/40 h-full flex flex-col">
                  <div class="dashboard-pending-heading flex items-center justify-between gap-4 border-b border-slate-100 pb-3"><div><h3 class="text-base font-semibold text-slate-900">Pending follow-ups</h3><p class="mt-1 text-xs text-slate-500">These parent records require admin action.</p></div><div class="dashboard-pending-total flex items-center justify-end gap-2 text-right whitespace-nowrap"><p class="text-xs font-semibold uppercase tracking-[.08em] text-slate-500">Total Pending</p><p class="text-xl md:text-2xl font-semibold tracking-[-0.035em] text-primary tabular-nums" x-text="admissionPendingTotal"></p></div></div>
                  <div class="mt-3 grid grid-cols-2 gap-2 flex-1"><template x-for="status in admissionPendingStatuses" :key="status.name"><div class="pending-status-card rounded-2xl bg-slate-50 p-3 border border-slate-100 flex flex-col justify-center"><p class="text-xs text-slate-500" x-text="status.name"></p><p class="text-xl font-semibold tabular-nums text-slate-950" x-text="status.count"></p></div></template></div>
                </section>
                <section class="dashboard-conversion-section section-card p-5 flex flex-col items-center justify-between text-center h-full">
                  <div class="w-full flex items-start justify-between gap-3 text-left">
                    <div><p class="text-sm font-semibold text-slate-900">Conversion Rate</p><p class="mt-1 text-xs text-slate-500">Lead to admission efficiency</p></div>
                    <span class="material-symbols-outlined rounded-2xl bg-primary/10 p-2 text-primary">trending_up</span>
                  </div>
                  <div class="mt-4 flex justify-center">
                    <div class="conversion-circle rounded-full bg-primary/10 border border-primary/15 flex flex-col items-center justify-center shadow-soft">
                      <p class="text-[34px] leading-none font-semibold tracking-[-0.06em] text-primary" x-text="admissionConversion.rate + '%'"></p>
                      <p class="mt-1 text-[11px] font-semibold uppercase tracking-[0.08em] text-primary/70">conversion</p>
                    </div>
                  </div>
                  <p class="mt-4 text-sm font-medium leading-snug text-slate-600" x-text="admissionConversion.admitted + ' admitted out of ' + admissionConversion.total + ' applications'"></p>
                </section>
              </div>

              <div class="analytics-row grid grid-cols-1 xl:grid-cols-[minmax(360px,0.9fr)_minmax(540px,1.1fr)] gap-4 items-stretch">
                <section class="dashboard-source-section section-card p-5 source-card h-full">
                  <div class="flex items-center justify-between mb-4"><div><h3 class="text-base font-semibold text-slate-900">Source performance</h3><p class="mt-1 text-xs text-slate-500">Applications to admissions by channel.</p></div><button class="text-xs font-semibold text-primary" type="button">View details</button></div>
                  <div class="source-list space-y-2"><template x-for="source in admissionSources" :key="source.name"><div class="source-row grid items-center gap-3 rounded-xl border border-slate-100 bg-slate-50/70 px-3 py-2"><p class="text-sm font-semibold text-slate-800 truncate" x-text="source.name"></p><div class="flex items-center gap-2 min-w-0"><div class="h-2 w-full rounded-full bg-white overflow-hidden"><div class="h-full rounded-full bg-primary" :style="`width: ${Math.min(source.rate * 12, 100)}%`"></div></div><span class="hidden sm:inline text-[11px] text-slate-500 whitespace-nowrap" x-text="source.converted + '/' + source.total"></span></div><span class="rounded-full bg-primary/10 text-primary px-2.5 py-1 text-xs font-semibold whitespace-nowrap" x-text="source.rate + '%'"></span></div></template></div>
                </section>
                <section class="dashboard-funnel-section section-card p-3 funnel-card h-full">
                  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-2"><div><h3 class="text-base font-semibold text-slate-900">Admission funnel progression</h3><p class="mt-1 text-xs text-slate-500">Hover a stage to highlight movement.</p></div><span class="rounded-full bg-primary/10 text-primary px-3 py-1 text-xs font-semibold">2,101 total applications</span></div>
                  <div class="funnel-chart-shell soft-grid"><svg id="admissionsFunnel" class="mui-funnel-svg" viewBox="0 0 900 350" role="img" aria-label="Admissions interactive funnel"></svg><div class="funnel-brand-footer"><img class="simplex-logo" alt="Simplex by Gosuper Edtech" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAS0AAABlCAYAAAAYn7VbAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAClRSURBVHhe7d15XBNn/gfwzyQhFwmEhEtFQRRERBCKeLSoFRXvaj2qVXtoq1ZttV1dq12rdq1bbdW2WI/1qKW7WuxhXbVovapdqYiiIgLeiMp9SUJCzuf3j2RlQsggyNHf8369vv/MM/MkmUy+eeaZZ+ZhCCEEFEVRrQSPvYCiKKolo0mLoqhWhSYtiqJaFZq0KIpqVWjSoiiqVaFJi6KoVoUmLYqiWhWGjtPixmiywGiygBACPo+B0IkPHo9hr0ZR1FNGk5YDVXozCkoqceV6KbLulKFSZ4SnUoqIYA/4+7hApRDT5EVRTYgmrTpUaAw4fT4X3x64hozbZTCZLNYyiViAIX3bY+rIQHT1V4LPp4mLopoCTVp2VOnNSPz9LrbsTUdOnoZdDABwEvAQFeqF914JQ3AnJbuYoqingHbE23Ezpxz7T9y2m7DwqJ/rYkYR/nMyG5pKI7uYoqingLa0amE2W/D9kZtY981laLSOk1F4Vw8snh6OsCB3dhHVglRWVuLw4cMoKChgF9XQrl079OnTB56enuwiqgWgSasW6koD/vn9VWz/MZNdVCsfLxnefSUUw/v5sYuoFiQ/Px+vv/46Ll68yC6qoU+fPlixYgXCwsLYRVQL0KqS1sOHD3H+/HlcuXIFd+7cQWFhISoqKmA0GsHn8+Hs7AyVSoX27dsjKCgI4eHh8Pf3B8PUr5O8rEKPzQnp+PY/19hFtfJ2l2L+1FCMifFnF1EtSG5uLl588UUkJyezi2ro378/PvvsM0RGRrKLqBagVSSttLQ0xMfH49ixYygtLUVlZSWqqqpgNBphMplACAHDMODxeHBycoJIJIJUKoWrqyu6d++OyZMnY/DgwZDJZOyqa1WlN2HHT5nYuPsKu6hW/j4ueO/VHojp7cMuoloQmrT+HFp0R3xBQQHee+89xMbGYuPGjbh8+TLu3buH0tJSaLVaGI1GVOdcQgjMZjOqqqrw8OFD5OXlISsrC/v27cOMGTMwceJEnDp1ChbL/4Yt2CMSCeDv4wJvdym7qFY+3jJ09nVlL6Yo6ilosUkrKSkJI0eOxBdffIH8/Hzo9Xr2KpyYTCaUlZUhMTERkyZNwqZNm1BZWclerQYGQGQ3T/QO9YKjE0uVqwjPhXvDt42cXURR1FPQ4pKWyWRCYmIi5syZg/Pnz3NqGXGVn5+PJUuWYOPGjSgrK2MX1+ChlGDKyED0DfeG0Ilnk7wYBnBzEWHUgI4YN7gzq5SiqKelRSUti8WC8+fPY82aNbh8+TK7uFFoNBqsXr0aP/30E3Q6Hbu4hpAAFT6YGYnxQzqhUwdXeColcFeI0cZdiu4BKrwzNRTzp4VBKhGwN6Uo6ilpUR3xhYWF+Pjjj7F582YYjY7HRzVE165d8e233yI8PBw8Xt2522IhyMlT42ZOBbR6IzwUEgR3VsJVJmSvSrVgtCP+z6HuX2sTIoQgNTUVhw8f5pywnJ2d4efnh4CAALRt2xZCIfckkpmZiYSEBFRVVbGLbPB4DPzauWBQHx+MHtARfXp404RFUc2kxbS0NBoN4uLisGzZMpjNZnZxDU5OTujWrR
